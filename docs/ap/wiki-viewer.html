ể hồ sơ học sinh](../entities/student-profile.md)\n- [Thực thể hồ sơ lưu trữ học sinh](../entities/student-archive-record.md)\n- [Thực thể Phiếu chi nội bộ](../entities/expense-voucher.md)\n- [Thực thể Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Luồng chuyển lớp và chuyển năm học](../flows/fl-chuyen-lop-va-chuyen-nam-hoc.md)\n- [Luồng kho lưu trữ học sinh](../flows/fl-kho-luu-tru-hoc-sinh.md)\n- [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md)\n- [Màn hình kho lưu trữ](../screens/m5-sm14-luu-tru.md)\n- [Màn hình khoản chi](../screens/m4-sm5-khoan-chi.md)\n"}, {"path": "pages/concepts/vietqr-dynamic-reconciliation.md", "title": "Kiến Trúc Thanh Toán VietQR Động & Đối Soát Tự Động", "type": "concept", "group": "concepts", "fm": {"title": "Kiến Trúc Thanh Toán VietQR Động & Đối Soát Tự Động", "type": "concept", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "pages/sources/src-open-questions-resolutions.md", "repo:docs/guides/development/E-009-finance-invoices/epic.md", "repo:docs/guides/development/E-013-finance-reconciliation/epic.md"], "spec_ids": ["TC-01", "TC-06"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Kiến Trúc Thanh Toán VietQR Động & Đối Soát Tự Động\n\n## Định nghĩa\nKiến trúc tích hợp thanh toán không tiền mặt theo tiêu chuẩn VietQR chuẩn quốc gia (NAPAS 247), tự động sinh mã QR động kèm số tiền chính xác và cú pháp chuyển khoản định danh hóa đơn, kết hợp webhook đồng bộ biến động số dư để khớp lệnh tức thì và kiểm soát toàn diện các giao dịch bất thường thừa, thiếu hoặc tra soát.\n\n## Quy tắc\n1. **Sinh VietQR động:**\n   - Mỗi hóa đơn học phí có một chuỗi nội dung chuyển khoản duy nhất (Payload): `ECO <Mã trường> <Mã hóa đơn>`.\n   - Mã QR nhúng sẵn số tài khoản ngân hàng của trường, số tiền phải thanh toán sau khi trừ miễn giảm và hoàn tiền ăn.\n2. **Khớp lệnh thời gian thực (Real-time Webhook):**\n   - Cổng ngân hàng hoặc dịch vụ đối soát (Sepay/NAPAS) bắn webhook khi nhận tiền.\n   - Hệ thống quét cú pháp, kiểm tra số tiền: nếu số tiền khớp 100%, tự động chuyển hóa đơn sang `PAID` và gửi thông báo cho phụ huynh.\n3. **Chốt chặn Race Condition khi Hủy/Chỉnh sửa hóa đơn (OQ-09):**\n   - *Khóa bi quan bắt buộc:* Cả webhook xử lý thanh toán và API hủy/chỉnh sửa hóa đơn của kế toán đều phải thực thi bên trong transaction với `SELECT ... FROM tuition_invoices WHERE id = ... FOR UPDATE`.\n   - *Vô hiệu hóa QR tức thì:* Khi kế toán bắt đầu chỉnh sửa hoặc hủy hóa đơn, mã QR payload lập tức bị vô hiệu hóa trong Redis cache (`qr_active = false`).\n   - *Bảo vệ giao dịch treo (`UNMATCHED_SUSPENSE_POOL`):* Nếu phụ huynh quét mã chuyển khoản đúng thời điểm kế toán vừa bấm hủy hóa đơn thành công (webhook đến khi hóa đơn đã `cancelled`), hệ thống gom tiền vào Quỹ treo chờ xử lý (`UNMATCHED_SUSPENSE_POOL`) với nút xử lý 1-chạm kết chuyển sang Credit Balance hoặc hoàn tiền.\n4. **Đối soát định kỳ:**\n   - Hằng ngày hoặc hằng tuần, kế toán tải sổ phụ ngân hàng (file Excel) để chạy công cụ đối soát lô (Batch Reconciliation) nhằm phát hiện các giao dịch bị sai cú pháp hoặc lỗi mạng.\n5. **Xử lý giao dịch VietQR bất thường — Thừa, Thiếu & Tra soát ngân hàng (OQ-18):**\n   - *Chuyển tiền thừa / Chuyển 2 lần:* Khi số tiền nhận lớn hơn số tiền hóa đơn ($\\text{Amount}_{\\text{transfer}} > \\text{Amount}_{\\text{due}}$), hệ thống tự động gạch nợ `PAID` hóa đơn, toàn bộ phần tiền thừa được tự động kết chuyển thành `credit_balance` của học sinh. Tại màn hình Đối soát (`m4-sm2-doi-soat`) hiển thị cờ `OVERPAID` kèm nút \"Tạo phiếu chi hoàn tiền thừa\" để chuyển khoản trả lại phụ huynh nếu có yêu cầu.\n   - *Chuyển tiền thiếu (Underpayment):* Khi số tiền nhận nhỏ hơn số tiền hóa đơn, hệ thống chuyển hóa đơn sang trạng thái `PARTIAL_PAID`, ghi nhận `paid_amount`, tính số nợ còn thiếu `remaining_amount`, và **tự động sinh lại mã VietQR động mới** với payload số tiền đúng bằng `remaining_amount` để phụ huynh quét mã trả nốt.\n   - *Cơ chế đóng băng chờ tra soát & Ngăn xuất hóa đơn VAT (Chargeback Dispute & Frozen State):* Khi có yêu cầu tra soát (Chargeback) hoặc cảnh báo nghi vấn gian lận từ ngân hàng, giao dịch và hóa đơn lập tức chuyển sang trạng thái `FROZEN_UNDER_REVIEW`. Khóa cứng toàn diện: **Cấm tuyệt đối xuất Hóa đơn điện tử VAT**, cấm kết chuyển doanh thu và cấm rút `credit_balance` cho đến khi ngân hàng có kết luận phân xử chính thức.\n\n## Áp dụng ở đâu\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Phiên đối soát giao dịch](../entities/reconciliation-session.md)\n- [Phiếu chi nội bộ](../entities/expense-voucher.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình đối soát](../screens/m4-sm2-doi-soat.md)\n- [Màn hình lịch sử thanh toán](../screens/m6-sm7-lich-su-thanh-toan.md)\n- [Luồng lập và phát hành hóa đơn](../flows/fl-lap-phat-hanh-hoa-don.md)\n- [Luồng đối soát giao dịch](../flows/fl-doi-soat-giao-dich.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-01 | Lập hóa đơn học phí tháng cho học sinh tích hợp mã VietQR động chuyển khoản chính xác | Component hiển thị mã VietQR động trên modal chi tiết hóa đơn | MISSING | repo:app/src/types/invoice.ts:1 |\n| TC-06 | Đối soát giao dịch thanh toán tự động và thủ công với sổ phụ ngân hàng | Redux slice quản lý phiên đối soát và khớp lệnh | MISSING | repo:app/src/store/slices/reconciliationSlice.ts:1 |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thực thể Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Thực thể Phiên đối soát giao dịch](../entities/reconciliation-session.md)\n- [Thực thể Phiếu chi nội bộ](../entities/expense-voucher.md)\n- [Luồng lập và phát hành hóa đơn](../flows/fl-lap-phat-hanh-hoa-don.md)\n- [Luồng đối soát giao dịch](../flows/fl-doi-soat-giao-dich.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình đối soát](../screens/m4-sm2-doi-soat.md)\n- [Màn hình lịch sử thanh toán](../screens/m6-sm7-lich-su-thanh-toan.md)\n"}, {"path": "pages/entities/academic-year.md", "title": "Thực Thể Niên Khóa & Học Kỳ", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Niên Khóa & Học Kỳ", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-029-school-academic-year/epic.md"], "spec_ids": ["NT-14"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Niên Khóa & Học Kỳ\n\n## Định nghĩa\nĐại diện cho khung thời gian năm học và các học kỳ (Học kỳ 1, Học kỳ 2, Hè) của nhà trường, đóng vai trò mỏ neo thời gian tối cao cho toàn bộ dữ liệu học sinh, lớp học, thời khóa biểu và sổ điểm đánh giá.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Mỗi trường học chỉ có duy nhất **một niên khóa hiện hành** (`is_current = true`). Kích hoạt niên khóa mới sẽ tự động chuyển niên khóa cũ về trạng thái lưu trữ.\n- Niên khóa gồm ngày bắt đầu (`start_date`) và ngày kết thúc (`end_date`), không được trùng chéo khoảng thời gian với niên khóa khác trong cùng trường.\n- Mỗi niên khóa chứa danh sách các học kỳ với ngày bắt đầu/kết thúc tương ứng để phục vụ tính điểm học lực và học phí định kỳ.\n\n## Quan hệ\n- Một trường học (`school_id`) sở hữu nhiều Niên khóa (`academic_years`).\n- Một Niên khóa chứa nhiều [Lớp học](classroom.md) và [Thời khóa biểu tuần](timetable-weekly.md).\n- Kết quả học tập trong [Sổ điểm đánh giá](gradebook-record.md) gắn liền với Niên khóa và Học kỳ cụ thể.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-14 | Quản lý niên khóa học, các kỳ học và kích hoạt niên khóa hiện hành | Type định nghĩa `AcademicYear`, mock data và trang quản trị season | MISSING | repo:app/src/types/academicYear.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình niên khóa](../screens/m5-sm13-nam-hoc.md)\n- [Luồng chuyển lớp và chuyển năm học](../flows/fl-chuyen-lop-va-chuyen-nam-hoc.md)\n"}, {"path": "pages/entities/attendance-daily.md", "title": "Điểm Danh Hằng Ngày (Daily Attendance)", "type": "entity", "group": "entities", "fm": {"title": "Điểm Danh Hằng Ngày (Daily Attendance)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-01", "VH-02", "VH-03", "VH-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 4}}, "open": 0, "body": "# Điểm Danh Hằng Ngày (Daily Attendance)\n\n## Định nghĩa\nThực thể Điểm danh hằng ngày ghi nhận sự có mặt, vắng mặt, giờ đón/trả, chỉ số thân nhiệt, tình trạng sức khỏe, người đưa đón của từng học sinh trong mỗi ngày học, hỗ trợ điểm danh lớp ngoại khóa theo buổi và chốt chặn an toàn giám hộ trẻ em.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| VH-01 | Ghi nhận thời gian Đón (Check-in buổi sáng) và Trả (Check-out buổi chiều) bằng thao tác 1-chạm | Cập nhật thông báo tức thì tới ứng dụng phụ huynh |\n| VH-01 | Điểm danh lớp ngoại khóa (OQ-14): Ghi nhận tham gia theo từng buổi học, làm căn cứ tự động tính học phí theo buổi (`PER_SESSION`) | Xem [Điều phối ngoại khóa](../concepts/extracurricular-billing-scheduling.md) |\n| VH-02 | Ghi nhận thân nhiệt (đơn vị °C) và chọn dấu hiệu sức khỏe bất thường (Cảm sốt, Phát ban, Tay chân miệng...) | Cảnh báo tự động nếu nhiệt độ $\\ge 38.0^\\circ\\text{C}$ |\n| VH-02 | Đón về nửa ngày do y tế: Nếu sốt cao $\\ge 38.5^\\circ\\text{C}$ đón về trước 10:30 sáng, ghi nhận trạng thái `half_day_leave` | Tự động kích hoạt hoàn 50% tiền ăn bán trú ngày đó |\n| VH-03 | Xác thực người đón hộ: Chọn người đón từ danh sách người đưa đón hợp lệ đã đăng ký (Bố, Mẹ, Ông, Bà, Tài xế đưa đón) | Chụp ảnh hoặc kiểm tra ảnh đại diện người đón |\n| VH-03 | Xử lý ngoài giờ sau 17:00/17:30 người đón lạ không liên lạc được phụ huynh: Cấm giao trẻ, bật cờ `unclaimed_child_flag` | Chuyển sang quy trình lưu giữ trẻ 4 cấp bảo vệ pháp lý |\n| VH-03 | Chốt chặn an toàn tranh chấp quyền giám hộ (OQ-16): Học sinh gắn Huy hiệu Khiên Đỏ; nếu người đón nằm trong `restricted_guardians`, kích hoạt Cảnh báo đỏ toàn màn hình (Red Modal Alert) kèm chuông báo động, cấm trả trẻ và báo BGH | Xem [Đường ống AI & An toàn giám hộ](../concepts/ai-face-recognition.md) |\n| VH-02 | Sổ dặn thuốc y tế & Xác nhận uống thuốc trưa (OQ-19): Phụ huynh gửi đơn dặn thuốc điện tử qua app (tên thuốc, liều lượng, giờ uống, ảnh đơn thuốc). Màn hình điểm danh hiển thị Huy hiệu Viên thuốc; giáo viên bấm xác nhận \"Đã cho uống thuốc lúc HH:mm\" và hệ thống bắn thông báo an tâm tức thời tới phụ huynh | Lưu vết bất biến vào `student_medical_logs` |\n| VH-01 | Đến muộn & Đón sớm giữa buổi (OQ-20): Ghi nhận Đến muộn (Late Arrival, kèm toggle báo bổ sung suất ăn với bếp nếu đến trước 09:00) và Đón sớm giữa buổi (Early Departure, ghi nhận giờ đón, người đón, lý do). Phụ huynh chủ động đón sớm KHÔNG hoàn tiền ăn | Xem [Cơ chế hoàn tiền ăn](../concepts/meal-refund-engine.md) |\n| VH-04 | Báo vắng học sinh: Phân loại Vắng có phép (`excused`) hoặc Vắng không phép (`unexcused`) | Ngày vắng có phép kích hoạt cơ chế hoàn tiền ăn tự động |\n| VH-01 | Chốt điểm danh tự động cuối tháng (OQ-21): Loại bỏ nút nộp thủ công. Vào 23:59:59 ngày cuối tháng trước khi hệ thống tính phí cho tháng tiếp theo, hệ thống TỰ ĐỘNG KHÓA (Freeze / Read-Only), không cho cập nhật bất kỳ thông tin điểm danh nào trong tháng đó nữa | Mở khóa ngoại lệ cần BGH duyệt và lưu Audit Trail |\n\n## Quan hệ\n- Thuộc về một [Hồ sơ học sinh 360](student-profile.md) tại một [Lớp học](classroom.md).\n- Được thực hiện và xác nhận bởi [Giáo viên & Nhân viên](teacher-staff.md).\n- Là căn cứ tính toán cho [Khấu trừ hoàn tiền ăn](meal-refund-credit.md) trong [Hóa đơn học phí](tuition-invoice.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-01 | Điểm danh đón và trả học sinh 1-chạm theo lớp học hằng ngày | Giao diện prototype điểm danh chưa kết nối cơ sở dữ liệu thật | MISSING | repo:app/src/features/attendance/ |\n| VH-02 | Ghi nhận thân nhiệt và cảnh báo các dấu hiệu sức khỏe y tế bất thường của học sinh | Modal y tế và thân nhiệt chưa lưu trữ lịch sử sức khỏe | MISSING | repo:app/src/features/attendance/ |\n| VH-03 | Xác thực người đón hộ học sinh từ danh sách người đưa đón hợp lệ đã đăng ký | Chưa có API đối chiếu danh bạ người đón hợp lệ | MISSING | repo:app/src/features/attendance/ |\n| VH-04 | Báo vắng học sinh hàng loạt và phân loại vắng có phép hoặc không phép | Chưa đồng bộ dữ liệu ngày vắng sang phân hệ hóa đơn | MISSING | repo:app/src/features/attendance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-02, OQ-10, OQ-14, OQ-16, OQ-19, OQ-20, OQ-21).\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md)\n- [Luồng điểm danh đón trả](../flows/fl-diem-danh-don-tra.md)\n"}, {"path": "pages/entities/auth-session.md", "title": "Phiên Đăng Nhập & Phân Quyền (Auth Session & RBAC)", "type": "entity", "group": "entities", "fm": {"title": "Phiên Đăng Nhập & Phân Quyền (Auth Session & RBAC)", "type": "entity", "sources": ["pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["DN-01", "DN-02"], "updated": "2026-11-05"}, "gap": {"gap": {"OK": 2}}, "open": 0, "body": "# Phiên Đăng Nhập & Phân Quyền (Auth Session & RBAC)\n\n## Định nghĩa\nThực thể Phiên đăng nhập & Phân quyền quản lý danh tính xác thực của người dùng, cặp khóa JWT (Access Token & Refresh Token) và ma trận phân quyền truy cập Role-Based Access Control (RBAC) theo ngữ cảnh trường học `{schoolCode}`.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| DN-01 | Đăng nhập hợp lệ theo mã trường `{schoolCode}`, tên đăng nhập/email và mật khẩu mã hóa Argon2id/Bcrypt | Cấp Access Token ngắn hạn và Refresh Token trong HttpOnly Cookie |\n| DN-02 | Mô hình phân quyền RBAC 3 cấp độ: Module $\\rightarrow$ Resource:Action (ví dụ: `finance:invoice:approve`) $\\rightarrow$ Data Scope (Toàn trường, Khối, Lớp hoặc Cá nhân) | Chặn truy cập trái phép ở cả Gateway và Backend Controller |\n| DN-01 | Phân vùng session đa tab (OQ-13): Quản lý token theo namespace `eco_token_{schoolCode}` độc lập trên từng tab trình duyệt | Ngăn ngừa xung đột token khi giáo viên mở cùng lúc 2 trường |\n| DN-01 | Dọn dẹp Redux Store (OQ-13): Kích hoạt `RESET_TENANT_STATE` xóa sạch dữ liệu cũ khi người dùng chuyển context trường | Chống rò rỉ dữ liệu \"bóng ma\" giữa các trường |\n| DN-01 | Thu hồi phiên đăng nhập tức thì (Token Revocation List) khi tài khoản bị khóa hoặc người dùng đăng xuất | Lưu blacklist vào Redis với TTL khớp hạn token |\n\n## Quan hệ\n- Gắn với tài khoản người dùng của [Giáo viên & Nhân viên](teacher-staff.md) hoặc Quản trị viên.\n- Ràng buộc theo [Cơ chế cô lập đa trường học](../concepts/multi-tenancy-isolation.md).\n- Thao tác tại [Màn hình đăng nhập](../screens/m7-sm2-dang-nhap.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| DN-01 | Đăng nhập hệ thống theo tiền tố mã trường `{schoolCode}` và cấp cặp JWT Access/Refresh Token | Cơ chế phân vùng session đa tab theo namespace `eco_session_{schoolCode}` và `eco_token_{schoolCode}` | OK | repo:app/src/utils/authSession.ts:16 |\n| DN-02 | Phân quyền kiểm soát truy cập theo mô hình Role-Based Access Control (RBAC) 3 cấp | Mô hình RBAC 3 cấp (Module -> Resource:Action -> Data Scope) và bộ lọc checkAccessScope | OK | repo:app/src/utils/rbac.ts:1 |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-01).\n\n## Liên quan\n- [Phân hệ Đăng nhập](../overview/module-auth.md)\n- [Cơ chế cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n- [Màn hình đăng nhập](../screens/m7-sm2-dang-nhap.md)\n- [Luồng đăng nhập đa trường](../flows/fl-dang-nhap-da-truong.md)\n"}, {"path": "pages/entities/calendar-event.md", "title": "Thực Thể Lịch Sự Kiện & Ngày Nghỉ Lễ", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Lịch Sự Kiện & Ngày Nghỉ Lễ", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-020-school-calendar/epic.md"], "spec_ids": ["NT-13"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Lịch Sự Kiện & Ngày Nghỉ Lễ\n\n## Định nghĩa\nĐại diện cho các mốc thời gian sự kiện, kỳ nghỉ lễ quốc gia, lễ hội trường học, lịch thi học kỳ, ngày họp phụ huynh và hoạt động dã ngoại ngoại khóa trong năm học.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Phân loại: Ngày nghỉ lễ toàn trường (`HOLIDAY`), Sự kiện học tập (`ACADEMIC_EVENT`), Hoạt động ngoại khóa (`EXTRACURRICULAR`), Hoạt động nội bộ cán bộ giáo viên (`STAFF_ONLY`).\n- Thuộc tính ngày: Bắt đầu (`start_date`), Kết thúc (`end_date`), Cả ngày (`all_day`), Địa điểm tổ chức.\n- Quy tắc vận hành: Vào những ngày được đánh dấu là `HOLIDAY`, hệ thống tự động tắt cảnh báo điểm danh chưa hoàn thành và loại trừ ngày này khỏi việc tính vắng học sinh hoặc phạt tiền muộn.\n\n## Quan hệ\n- Thuộc về [Niên khóa & Học kỳ](academic-year.md) cụ thể.\n- Tác động tới việc sinh lịch tại [Thời khóa biểu tuần](timetable-weekly.md) và bảng kiểm tra tại [Điểm danh hằng ngày](attendance-daily.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-13 | Lịch sự kiện và hoạt động trải nghiệm ngoại khóa toàn trường | Type `CalendarEvent`, form tạo sự kiện và validation ngày | MISSING | repo:app/src/types/calendar.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình lịch sự kiện](../screens/m5-sm12-lich-su-kien.md)\n- [Thực thể Niên khóa & Học kỳ](academic-year.md)\n"}, {"path": "pages/entities/class-activity.md", "title": "Bảng Tin Hoạt Động Lớp (Class Activity)", "type": "entity", "group": "entities", "fm": {"title": "Bảng Tin Hoạt Động Lớp (Class Activity)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-05"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Bảng Tin Hoạt Động Lớp (Class Activity)\n\n## Định nghĩa\nThực thể Bảng tin hoạt động lớp lưu trữ nhật ký hằng ngày của lớp học, các hình ảnh sinh hoạt, bài học trải nghiệm và tương tác phụ huynh (bình luận, thả tim).\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| VH-05 | Đăng bài viết kèm album hình ảnh/video, hỗ trợ gắn thẻ hashtag chủ đề (`#`) và nhắc tên học sinh (`@`) | Phụ huynh nhận được thông báo khi con được nhắc tên |\n| VH-05 | Cơ chế kiểm duyệt 2 cấp: Bài đăng của giáo viên chính được đăng ngay; bài đăng của giáo viên hỗ trợ chuyển sang trạng thái Chờ duyệt (`pending_review`) | Chi tiết tại [Quyết định OQ-06](../sources/src-open-questions-resolutions.md) |\n\n## Quan hệ\n- Thuộc về một [Lớp học](classroom.md).\n- Được đăng bởi [Giáo viên & Nhân viên](teacher-staff.md).\n- Nhắc đến các [Hồ sơ học sinh 360](student-profile.md).\n- Hiển thị trên [Màn hình hoạt động](../screens/m2-sm2-hoat-dong.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-05 | Đăng bài hoạt động lớp hỗ trợ gắn hashtag `#` chủ đề và nhắc tên học sinh `@` | Giao diện đăng bài chưa hỗ trợ autocomplete hashtag và mention học sinh | MISSING | repo:app/src/features/activity/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-06).\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Màn hình hoạt động](../screens/m2-sm2-hoat-dong.md)\n- [Luồng đăng bài kiểm duyệt](../flows/fl-dang-bai-kiem-duyet.md)\n"}, {"path": "pages/entities/classroom.md", "title": "Lớp Học (Classroom)", "type": "entity", "group": "entities", "fm": {"title": "Lớp Học (Classroom)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["NT-04", "NT-02"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Lớp Học (Classroom)\n\n## Định nghĩa\nThực thể Lớp học đại diện cho đơn vị tổ chức học tập và sinh hoạt của học sinh trong một niên khóa. Hệ thống phân chia rạch ròi giữa Lớp chính khóa và Lớp ngoại khóa (câu lạc bộ năng khiếu, kỹ năng, thể thao).\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| NT-04 | Phân loại lớp: Lớp chính khóa (bật toàn diện điểm danh, học vụ, học phí) và Lớp ngoại khóa (chỉ bật điểm danh và bài tập riêng) | Thuộc tính `class_type`: `standard` hoặc `extracurricular` |\n| NT-04 | Chốt chặn an toàn khi xóa lớp: Cấm xóa khi có học sinh hoặc đã phát sinh giao dịch tài chính; chỉ cho phép xóa lớp rỗng | Xem chi tiết tại [Chốt chặn an toàn khi xóa lớp](../concepts/class-deletion-guard.md) |\n| NT-04 | Chốt chặn bảo toàn công nợ (OQ-12): Cấm xóa vĩnh viễn nếu còn học sinh nợ học phí (`balance_due > 0`); chuyển sang `Archived` khi kết thúc năm học | Công nợ chuyển sang năm học mới theo học sinh |\n| NT-04 | Lớp ngoại khóa & Biểu phí linh hoạt (OQ-14): Kiểm tra xung đột lịch 4 chiều; hỗ trợ tính phí `TERM_FIXED` (cố định tháng/kỳ) hoặc `PER_SESSION` (theo buổi điểm danh thực tế) | Chi tiết tại [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md) |\n| NT-02 | Mỗi lớp thuộc về một Khối lớp và một Niên khóa cụ thể; có giáo viên chủ nhiệm và phòng học cố định | Hỗ trợ chuyển giao niên khóa |\n\n## Quan hệ\n- Chứa danh sách các [Hồ sơ học sinh 360](student-profile.md).\n- Được phân công phụ trách bởi [Giáo viên & Nhân viên](teacher-staff.md).\n- Có cấu hình [Biểu phí theo lớp](fee-catalog-item.md).\n- Gắn liền với các bản ghi [Điểm danh hằng ngày](attendance-daily.md) và [Thời khóa biểu tuần](timetable-weekly.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-04 | Phân loại lớp chính khóa và ngoại khóa kèm chốt chặn an toàn khi xóa lớp | Logic chốt chặn xóa lớp chưa có API backend kiểm tra ràng buộc | MISSING | repo:app/src/features/classes/ |\n| NT-02 | Chuyển lớp học sinh và chuyển năm học hàng loạt với bảo toàn kết quả học tập | Chưa có chức năng backend chuyển đổi lớp học hàng loạt | MISSING | repo:app/src/features/classes/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-05 và OQ-14).\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Chốt chặn an toàn khi xóa lớp](../concepts/class-deletion-guard.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Màn hình lớp học](../screens/m5-sm3-lop-hoc.md)\n"}, {"path": "pages/entities/conversation-thread.md", "title": "Tin Nhắn Trao Đổi Phụ Huynh (Conversation Thread)", "type": "entity", "group": "entities", "fm": {"title": "Tin Nhắn Trao Đổi Phụ Huynh (Conversation Thread)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["VH-07"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Tin Nhắn Trao Đổi Phụ Huynh (Conversation Thread)\n\n## Định nghĩa\nThực thể Tin nhắn trao đổi phụ huynh đại diện cho các luồng hội thoại trực tiếp giữa giáo viên nhà trường và phụ huynh học sinh (kênh 1:1, kênh nhóm hoặc thông báo toàn lớp).\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| VH-07 | Hỗ trợ kênh trò chuyện 1:1 bảo mật giữa giáo viên chủ nhiệm và phụ huynh của từng học sinh | Tin nhắn tức thời qua WebSocket |\n| VH-07 | Hỗ trợ gửi tập tin đính kèm (hình ảnh đơn xin nghỉ học, đơn thuốc, tài liệu học tập) | Giới hạn dung lượng an toàn |\n| VH-07 | Lưu trữ lịch sử tin nhắn vĩnh viễn phục vụ tra cứu thông tin khi cần thiết | Thu hồi quyền nhắn tin khi học sinh chuyển lớp/trường |\n\n## Quan hệ\n- Giữa [Giáo viên & Nhân viên](teacher-staff.md) và phụ huynh của [Hồ sơ học sinh 360](student-profile.md).\n- Gắn với ngữ cảnh của [Lớp học](classroom.md).\n- Hiển thị trên [Màn hình trao đổi](../screens/m2-sm4-trao-doi.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-07 | Kênh trò chuyện tin nhắn đa chiều 1:1 trực tiếp giữa giáo viên và phụ huynh | Giao diện chat mới hiển thị mockup tĩnh, chưa có WebSocket gateway | MISSING | repo:app/src/features/conversations/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Màn hình trao đổi](../screens/m2-sm4-trao-doi.md)\n- [Hồ sơ học sinh 360](student-profile.md)\n"}, {"path": "pages/entities/discount-policy.md", "title": "Chính Sách Miễn Giảm (Discount Policy)", "type": "entity", "group": "entities", "fm": {"title": "Chính Sách Miễn Giảm (Discount Policy)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-09", "TC-10"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Chính Sách Miễn Giảm (Discount Policy)\n\n## Định nghĩa\nThực thể Chính sách miễn giảm quy định các chương trình ưu đãi, học bổng hoặc giảm trừ học phí áp dụng cho danh sách lớp hoặc học sinh cụ thể trong một khoảng thời gian xác định.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| TC-09 | Khi tạo chính sách mới: Cảnh báo học sinh đã có chính sách trùng lặp cho cùng khoản phí; yêu cầu tích checkbox xác nhận thay thế trước khi lưu | Chi tiết tại [Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md) |\n| TC-09 | Khi xuất hóa đơn: Tự động chọn áp dụng mức giảm cao nhất cho học sinh nếu có nhiều chính sách cùng hiệu lực | Bảo đảm quyền lợi tối đa cho người học |\n| TC-10 | Hỗ trợ giảm theo tỷ lệ `%` hoặc số tiền mặt cố định `đ`. Cho phép chuyển đổi đơn vị linh hoạt trên từng dòng thu | Định dạng có dấu chấm phân cách hàng nghìn |\n| TC-09 | Chính sách ưu đãi anh/chị/em ruột Sibling Discount (OQ-23): Tự động nhận diện quan hệ ruột thịt qua số điện thoại chính của phụ huynh (`primary_phone`); tự động áp dụng mức giảm cho con thứ 2/thứ 3 khi anh/chị đang học `ACTIVE`; tự động điều chỉnh hạ bậc hoặc ngừng áp dụng khi con lớn chuyển trường/tốt nghiệp ở kỳ hóa đơn tiếp theo (M+1) không hồi tố | Chi tiết tại [Màn hình miễn giảm](../screens/m4-sm8-mien-giam.md) |\n\n## Quan hệ\n- Áp dụng cho [Hồ sơ học sinh 360](student-profile.md) hoặc toàn bộ học sinh trong [Lớp học](classroom.md).\n- Gắn với một hoặc nhiều [Danh mục khoản phí](fee-catalog-item.md).\n- Giảm trừ trực tiếp số tiền phải nộp trong [Hóa đơn học phí](tuition-invoice.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-09 | Cảnh báo và yêu cầu xác nhận khi tạo chính sách miễn giảm trùng lặp đối tượng | Modal tạo chính sách chưa có logic kiểm tra trùng lặp học sinh | MISSING | repo:app/src/features/finance/ |\n| TC-10 | Hỗ trợ giảm trừ linh hoạt theo `%` hoặc tiền mặt `đ` kèm dấu chấm phân cách hàng nghìn | Chưa có toggle chuyển đổi đơn vị % và tiền mặt trên dòng khoản thu | MISSING | repo:app/src/features/finance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-03, OQ-07, OQ-23).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md)\n- [Màn hình miễn giảm](../screens/m4-sm8-mien-giam.md)\n- [Luồng thiết lập miễn giảm](../flows/fl-thiet-lap-mien-giam.md)\n"}, {"path": "pages/entities/expense-voucher.md", "title": "Phiếu Chi Nội Bộ (Expense Voucher)", "type": "entity", "group": "entities", "fm": {"title": "Phiếu Chi Nội Bộ (Expense Voucher)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-05"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Phiếu Chi Nội Bộ (Expense Voucher)\n\n## Định nghĩa\nThực thể Phiếu chi nội bộ quản lý các khoản chi tiêu vận hành của nhà trường (mua sắm văn phòng phẩm, bảo trì cơ sở vật chất, thanh toán thực phẩm bán trú, chi phí hoạt động sự kiện), đồng thời quản lý các phiếu chi hoàn tiền thanh lý rút hồ sơ và hoàn tiền thừa chuyển khoản VietQR.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| TC-05 | Lập phiếu chi kèm số tiền, danh mục khoản chi, người nhận tiền, chứng từ hóa đơn gốc đính kèm | Số tiền có dấu chấm phân cách hàng nghìn |\n| TC-05 | Quy trình phê duyệt 3 bước: `draft` (Nháp) $\\rightarrow$ `pending_approval` (Chờ duyệt) $\\rightarrow$ `approved` (Đã duyệt chi) hoặc `rejected` (Từ chối) | Hiệu trưởng hoặc Kế toán trưởng duyệt |\n| TC-05 | Quy trình hủy phiếu chi đã duyệt: Bắt buộc nhập lý do hủy chi tiết và ghi log kiểm toán không thể xóa | Bảo toàn chứng từ tài chính kế toán |\n| TC-05 | Phiếu chi hoàn tiền rút hồ sơ giữa kỳ (`STUDENT_WITHDRAWAL_REFUND` - OQ-17): Tự động sinh từ Biên bản quyết toán Pro-rata, duyệt chi 2 cấp trước khi hoàn trả phụ huynh | Xem [Vòng đời chuyển tiếp học sinh](../concepts/student-lifecycle-transitions.md) |\n| TC-05 | Phiếu chi hoàn tiền thừa VietQR (`VIETQR_EXCESS_REFUND` - OQ-18): Sinh từ màn hình đối soát khi phụ huynh chuyển thừa/chuyển 2 lần có yêu cầu rút lại tiền | Xem [Kiến trúc thanh toán VietQR động](../concepts/vietqr-dynamic-reconciliation.md) |\n\n## Quan hệ\n- Được tạo bởi Kế toán và phê duyệt bởi Ban Giám Hiệu.\n- Ảnh hưởng đến số dư quỹ tiền mặt/ngân hàng trong [Phân hệ Tài chính](../overview/module-finance.md).\n- Liên kết với [Hóa đơn học phí](tuition-invoice.md) và [Hồ sơ lưu trữ học sinh](student-archive-record.md).\n- Hiển thị trên [Màn hình khoản chi](../screens/m4-sm5-khoan-chi.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-05 | Lập, trình duyệt và theo dõi vòng đời phiếu chi nội bộ kèm chứng từ đính kèm | Màn hình phiếu chi mới có danh sách mockup, chưa có luồng phê duyệt API | MISSING | repo:app/src/features/finance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-17, OQ-18).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Khái niệm vòng đời học sinh](../concepts/student-lifecycle-transitions.md)\n- [Kiến trúc thanh toán VietQR động](../concepts/vietqr-dynamic-reconciliation.md)\n- [Màn hình khoản chi](../screens/m4-sm5-khoan-chi.md)\n- [Hóa đơn học phí](tuition-invoice.md)\n- [Hồ sơ lưu trữ học sinh](student-archive-record.md)\n"}, {"path": "pages/entities/face-biometric-registration.md", "title": "Thực Thể Hồ Sơ Nhận Diện Khuôn Mặt (Face Biometric Registration)", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Hồ Sơ Nhận Diện Khuôn Mặt (Face Biometric Registration)", "type": "entity", "sources": ["repo:docs/guides/development/E-033-settings-face-recognition/epic.md", "repo:docs/guides/decisions.md", "pages/sources/src-open-questions-resolutions.md"], "updated": "2026-11-05", "spec_ids": ["CH-12", "CH-04"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Thực Thể Hồ Sơ Nhận Diện Khuôn Mặt (Face Biometric Registration)\n\n## Định nghĩa\nHồ sơ nhận diện khuôn mặt sinh trắc học là thực thể lưu trữ dữ liệu ảnh chân dung chuẩn hóa, vector đặc trưng khuôn mặt (face embedding vector) và nhật ký nhận diện của từng học sinh trong nhà trường, bảo đảm tuân thủ quyền riêng tư dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP.\n\n## Thuộc tính / quy tắc nghiệp vụ\n- **Mã định danh:** `id` (UUIDv4).\n- **Học sinh:** `studentId` (liên kết duy nhất 1:1 với `student-profile`).\n- **Trạng thái đăng ký sinh trắc:** `registrationStatus`:\n  - `not_registered` (Chưa đăng ký): Học sinh chưa có ảnh mẫu chuẩn trong hệ thống.\n  - `registered` (Đã đăng ký): Đã nạp thành công từ 1 đến 5 ảnh chân dung góc chuẩn và sinh vector AI.\n  - `failed` (Đăng ký thất bại): Ảnh quá mờ, góc nghiêng > 30 độ hoặc độ phân giải không đạt chuẩn (< 300x300 px).\n  - `opted_out` (Từ chối nhận diện sinh trắc): Phụ huynh kích hoạt quyền riêng tư `opt_out_face_ai = true`.\n- **Danh sách ảnh mẫu:** `samplePhotos`: Mảng các đường dẫn ảnh an toàn trên Cloud Storage (tối đa 5 ảnh).\n- **Vector đặc trưng AI:** `featureVector`: Mảng số thực 512 chiều được sinh bởi mô hình trích xuất đặc trưng khuôn mặt, mã hóa an toàn.\n- **Ngày đăng ký & Người thao tác:** `registeredAt`, `registeredBy`.\n- **Quy tắc bảo vệ nhân khẩu học (CH-12):** Tại màn hình đăng ký ảnh sinh trắc học (`/setting/face-recognition`), tuyệt đối không cho phép chỉnh sửa thông tin cá nhân (họ tên, ngày sinh, mã học sinh) nhằm tránh sai lệch hồ sơ pháp lý của học sinh. Mọi thay đổi nhân khẩu học bắt buộc phải thực hiện tại phân hệ Hồ sơ học sinh.\n- **Quy tắc bất đồng bộ (CH-04):** Quá trình phân tích và trích xuất vector khuôn mặt phải được đẩy sang tác vụ nền Cloud Run worker, không chặn luồng giao diện của giáo viên.\n- **Quyền riêng tư sinh trắc học & Opt-Out (OQ-16):** Tuân thủ Nghị định 13/2023/NĐ-CP, khi học sinh kích hoạt `opt_out_face_ai = true`, hệ thống chuyển trạng thái sang `opted_out`, xóa bỏ/vô hiệu hóa `featureVector`, không quét ảnh và tự động áp dụng cơ chế làm mờ mặt hoặc loại trừ khỏi album công bố bên ngoài.\n\n## Quan hệ\n- Thuộc về một [Học sinh](student-profile.md) duy nhất (`studentId`).\n- Cung cấp mô hình nhận diện cho [Album truyền thông](media-album.md) để tự động tag tên học sinh.\n- Hỗ trợ dữ liệu đối chiếu cho [Điểm danh hàng ngày](attendance-daily.md).\n- Quản trị tại [Màn hình cấu hình nhận diện](../screens/m6-sm4-nhan-dien.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-12 | Bất biến thông tin nhân khẩu học tại màn hình quét ảnh | Form nhận diện chỉ cập nhật ảnh và trạng thái | MISSING | repo:app/src/features/settings/ |\n| CH-04 | Đăng ký khuôn mặt AI và trích xuất vector đặc trưng | Đã có mock giao diện chụp ảnh webcam và tải file | MISSING | repo:app/src/features/settings/ |\n\n## Liên quan\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Khái niệm nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Luồng đăng ký sinh trắc khuôn mặt](../flows/fl-dang-ky-sinh-trac-khuon-mat.md)\n- [Màn hình cấu hình nhận diện](../screens/m6-sm4-nhan-dien.md)\n"}, {"path": "pages/entities/fee-catalog-item.md", "title": "Danh Mục Khoản Phí (Fee Catalog Item)", "type": "entity", "group": "entities", "fm": {"title": "Danh Mục Khoản Phí (Fee Catalog Item)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-03", "TC-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Danh Mục Khoản Phí (Fee Catalog Item)\n\n## Định nghĩa\nThực thể Danh mục khoản phí định nghĩa toàn bộ các loại phí, đơn giá chuẩn, chu kỳ thu và tính chất (bắt buộc hay tự chọn) được áp dụng trong toàn trường và theo từng khối/lớp học, bao gồm các cấu hình biểu phí linh hoạt và phân rã hóa đơn cho lớp ngoại khóa.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| TC-03 | Danh mục toàn trường quản lý chuẩn 24 khoản thu (3 khoản hệ thống cốt lõi: Học phí chính khóa, Tiền ăn bán trú, Phí cơ sở vật chất + 21 khoản tùy chỉnh) | Thuộc tính phân loại: Bắt buộc hoặc Tự chọn |\n| TC-03 | Đơn vị tính đa dạng: theo tháng, theo kỳ, theo năm, theo ngày (ví dụ: Tiền ăn tính theo ngày để phục vụ hoàn tiền) | Định dạng tiền tệ có dấu chấm phân cách hàng nghìn |\n| TC-04 | Cấu hình biểu phí theo lớp: Cho phép gán tập hợp con các khoản thu và đơn giá riêng biệt cho từng lớp học | Khi lập hóa đơn, chỉ nạp danh mục phí thuộc lớp đó |\n| TC-04 | Biểu phí ngoại khóa & Phân rã Sub-Invoice (OQ-14): Hỗ trợ tính phí trọn gói theo kỳ (`TERM_FIXED`) hoặc tính theo số buổi thực tế (`PER_SESSION`); các khoản phí ngoại khóa gắn cờ `is_separable = true` để hỗ trợ tách hóa đơn độc lập | Chi tiết tại [Điều phối ngoại khóa](../concepts/extracurricular-billing-scheduling.md) |\n\n## Quan hệ\n- Được gán vào các [Lớp học](classroom.md).\n- Làm mẫu nạp cho các dòng thu trong [Hóa đơn học phí](tuition-invoice.md).\n- Là đối tượng áp dụng của [Chính sách miễn giảm](discount-policy.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-03 | Quản lý danh mục 24 khoản thu toàn trường gồm 3 khoản hệ thống và 21 khoản tùy chỉnh | Danh mục khoản thu mới lưu ở dạng dữ liệu mẫu trong state frontend | MISSING | repo:app/src/features/finance/ |\n| TC-04 | Cấu hình gói biểu phí và đơn giá áp dụng riêng biệt cho từng lớp học hoặc khối lớp | Chưa có API lưu trữ cấu hình biểu phí gán theo từng lớp | MISSING | repo:app/src/features/finance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-14).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Màn hình khoản phí](../screens/m4-sm3-khoan-phi.md)\n- [Hóa đơn học phí](tuition-invoice.md)\n"}, {"path": "pages/entities/grade-level.md", "title": "Thực Thể Khối Lớp Học", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Khối Lớp Học", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-023-school-grade-management/epic.md"], "spec_ids": ["NT-06"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Khối Lớp Học\n\n## Định nghĩa\nĐại diện cho cấp bậc phân loại học sinh theo độ tuổi hoặc trình độ học vấn trong mô hình trường liên cấp (Khối Mầm non: Mầm/Chồi/Lá; Khối Tiểu học: Khối 1..5; Khối THCS: Khối 6..9; Khối THPT: Khối 10..12).\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Thuộc tính: Mã khối (`grade_code`), Tên khối (`grade_name`), Bậc học (`level`: Mầm non, Tiểu học, THCS, THPT), Thứ tự hiển thị.\n- Định mức học phí: Là đơn vị cơ sở để gán biểu phí chuẩn trong phân hệ Tài chính (áp dụng biểu phí theo khối trước khi ghi đè theo từng lớp cụ thể).\n- Ràng buộc: Không được xóa khối lớp khi đang có các lớp học trực thuộc đang hoạt động.\n\n## Quan hệ\n- Một Khối lớp chứa nhiều [Lớp học](classroom.md).\n- Gắn với [Danh mục khoản phí](fee-catalog-item.md) và [Chính sách miễn giảm](discount-policy.md) theo chính sách từng khối.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-06 | Quản lý danh mục khối lớp học và định tuyến chương trình liên cấp | Type `Grade`, Redux slice và danh sách khối lớp | MISSING | repo:app/src/types/grade.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình khối lớp](../screens/m5-sm5-khoi-lop.md)\n- [Thực thể Lớp học](classroom.md)\n"}, {"path": "pages/entities/gradebook-record.md", "title": "Sổ Điểm Đánh Giá (Gradebook Record)", "type": "entity", "group": "entities", "fm": {"title": "Sổ Điểm Đánh Giá (Gradebook Record)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["HT-03"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Sổ Điểm Đánh Giá (Gradebook Record)\n\n## Định nghĩa\nThực thể Sổ điểm đánh giá quản lý điểm số thường xuyên, điểm định kỳ (giữa kỳ, cuối kỳ) và nhận xét học lực, hạnh kiểm của học sinh theo đúng chuẩn quy định của Bộ Giáo dục & Đào tạo.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| HT-03 | Quản lý các cột điểm: Điểm miệng, 15 phút, 1 tiết, Giữa kỳ, Cuối kỳ và Điểm trung bình môn học | Công thức tính trung bình theo trọng số hệ số 1, 2, 3 |\n| HT-03 | Trạng thái sổ điểm: `draft` (Đang nhập), `submitted` (Chờ duyệt), `locked` (Đã khóa) | Khóa vĩnh viễn sau khi BGH phê duyệt |\n| HT-03 | Sửa sổ điểm đã khóa: Phải có Phiếu đề nghị đính kèm ảnh bài thi và phê duyệt từ BGH | Mở khóa cục bộ phạm vi 1 ô điểm trong tối đa 60 phút |\n| HT-03 | Lưu vết Audit Trail bất biến (`GradeAuditTrail`): Lưu vết người yêu cầu, người duyệt, điểm cũ/mới, lý do, ảnh bằng chứng | Chống sửa/xóa cả ở DB, tự động gửi thông báo phụ huynh |\n| HT-03 | Bảo toàn điểm khi chuyển trường: Kết xuất bảng điểm điện tử có ký số, map môn tương đương tại trường mới | Kế thừa điểm TX, GK vào công thức TBHK MoET |\n\n## Quan hệ\n- Thuộc về một [Hồ sơ học sinh 360](student-profile.md).\n- Gắn với [Lớp học](classroom.md) và môn học tương ứng.\n- Nhập bởi [Giáo viên & Nhân viên](teacher-staff.md).\n- Hiển thị trên [Màn hình sổ điểm](../screens/m3-sm3-diem-danh-gia.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-03 | Nhập sổ điểm và đánh giá định kỳ theo quy chuẩn chuẩn hóa của Bộ GD&ĐT | Giao diện sổ điểm mới chỉ có bảng mockup, chưa có công thức tính điểm TB | MISSING | repo:app/src/features/academics/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Màn hình sổ điểm](../screens/m3-sm3-diem-danh-gia.md)\n- [Luồng nhập sổ điểm](../flows/fl-nhap-so-diem.md)\n"}, {"path": "pages/entities/homework-assignment.md", "title": "Bài Tập Về Nhà (Homework Assignment)", "type": "entity", "group": "entities", "fm": {"title": "Bài Tập Về Nhà (Homework Assignment)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["HT-02"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Bài Tập Về Nhà (Homework Assignment)\n\n## Định nghĩa\nThực thể Bài tập về nhà lưu trữ các yêu cầu tự học, tài liệu bài tập, hạn nộp bài và kết quả nộp bài của học sinh do giáo viên bộ môn hoặc giáo viên chủ nhiệm giao.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| HT-02 | Tạo bài tập kèm tiêu đề, hướng dẫn nội dung, file đính kèm (PDF, hình ảnh) và thời hạn nộp bài cụ thể | Thông báo tự động gửi đến phụ huynh |\n| HT-02 | Quản lý danh sách nộp bài: Phân loại Đã nộp (`submitted`), Nộp muộn (`late`), và Chưa nộp (`missing`) | Giáo viên chấm điểm và để lại nhận xét |\n\n## Quan hệ\n- Được tạo bởi [Giáo viên & Nhân viên](teacher-staff.md).\n- Giao cho [Lớp học](classroom.md) hoặc từng [Hồ sơ học sinh 360](student-profile.md).\n- Hiển thị trên [Màn hình bài tập](../screens/m3-sm2-bai-tap.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-02 | Tạo bài tập về nhà kèm hạn nộp và theo dõi trạng thái nộp bài của học sinh | Giao diện bài tập mới hiển thị danh sách tĩnh, chưa có API upload bài nộp | MISSING | repo:app/src/features/academics/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Màn hình bài tập](../screens/m3-sm2-bai-tap.md)\n- [Thời khóa biểu tuần](timetable-weekly.md)\n"}, {"path": "pages/entities/meal-refund-credit.md", "title": "Khấu Trừ Hoàn Tiền Ăn (Meal Refund Credit)", "type": "entity", "group": "entities", "fm": {"title": "Khấu Trừ Hoàn Tiền Ăn (Meal Refund Credit)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-02", "TC-08"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Khấu Trừ Hoàn Tiền Ăn (Meal Refund Credit)\n\n## Định nghĩa\nThực thể lưu vết số tiền ăn bán trú được hoàn trả cho học sinh do có những ngày nghỉ học có phép hợp lệ trong tháng trước (tháng M), được dùng để cấn trừ trực tiếp vào hóa đơn học phí của tháng tiếp theo (tháng M+1).\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| TC-02 | Tự động sinh ra khi lập hóa đơn tháng M+1 bằng cách quét ngày vắng có phép tháng M từ bảng điểm danh | Không yêu cầu kế toán tính thủ công |\n| TC-08 | Giá trị hoàn tiền = Số ngày vắng có phép $\\times$ Đơn giá suất ăn/ngày $\\times$ Tỷ lệ hoàn tiền cấu hình | Tỷ lệ hoàn tiền cấu hình tại Cấu hình học phí |\n| TC-08 | Khi học sinh chuyển lớp giữa tháng: Lưu `rate_snapshot` và `origin_class_id` theo từng khoảng thời gian theo học | Tính đúng theo đơn giá từng lớp cũ |\n| TC-02 | Đón về nửa ngày do y tế trước 10:30 sáng (`half_day_leave`): Được tính 0.5 ngày hoàn (50% tiền ăn ngày) | Bảo vệ quyền lợi học sinh khi ốm sốt đột xuất |\n| TC-02 | Nếu số tiền hoàn vượt học phí hóa đơn M+1: Sinh bản ghi `credit_balance` cấn trừ tháng M+2 hoặc chi hoàn | Tuyệt đối không làm mất tiền thừa của phụ huynh |\n| TC-02 | Được gán vào dòng tiền ăn của hóa đơn và hiển thị huy hiệu xanh: `\"Hoàn tiền: -X đ\"` | Minh bạch cho phụ huynh đối soát |\n| TC-02 | Quy tắc không hoàn tiền khi đón sớm chủ động (OQ-20): Phụ huynh chủ động đón sớm sau khi học sinh đã đến trường KHÔNG hoàn tiền ăn (hoàn 0%). Suất ăn chỉ hoàn khi ngày lễ, trường cho nghỉ, có đơn nghỉ cả ngày hợp lệ hoặc y tế đón về trước 10:30 | Loại bỏ tranh chấp chi phí vận hành bếp ăn |\n| TC-02 | Căn cứ chốt điểm danh tự động cuối tháng (OQ-21): Dữ liệu ngày nghỉ hoàn tiền ăn được khóa đóng băng tự động vào 23:59:59 ngày cuối tháng trước kỳ tính phí, bảo đảm không bị sửa đổi sai lệch | Kiểm soát toàn vẹn dữ liệu kế toán |\n\n## Quan hệ\n- Sinh ra từ các bản ghi [Điểm danh hằng ngày](attendance-daily.md).\n- Thuộc về [Hồ sơ học sinh 360](student-profile.md).\n- Được nhúng vào [Hóa đơn học phí](tuition-invoice.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-02 | Tự động rà soát ngày nghỉ có phép tháng M và khấu trừ tiền ăn vào hóa đơn tháng M+1 | Chưa có database entity và backend calculator hoàn tiền ăn | MISSING | repo:app/src/features/finance/ |\n| TC-08 | Tính toán số tiền hoàn tiền ăn theo tỷ lệ cấu hình tham số tại Cấu hình học phí | Chưa có bảng cấu hình tỷ lệ hoàn tiền ăn trong CSDL | MISSING | repo:app/src/features/finance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-02, OQ-09, OQ-10, OQ-20, OQ-21).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Hóa đơn học phí](tuition-invoice.md)\n- [Luồng báo vắng và hoàn tiền](../flows/fl-bao-vang-hoan-tien.md)\n"}, {"path": "pages/entities/media-album.md", "title": "Thư Viện Media (Media Album)", "type": "entity", "group": "entities", "fm": {"title": "Thư Viện Media (Media Album)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-06"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thư Viện Media (Media Album)\n\n## Định nghĩa\nThực thể Thư viện media lưu trữ và quản lý toàn bộ các tập tin ảnh, video sự kiện và hình ảnh lớp học, đồng thời tích hợp các thẻ nhận diện khuôn mặt tự động bằng AI.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| VH-06 | Hỗ trợ tải lên hàng loạt ảnh (tối đa 100 ảnh/lần) với dung lượng tối ưu | Lưu trữ an toàn trên Object Storage |\n| VH-06 | Tự động nhận diện khuôn mặt và gắn thẻ học sinh trong ảnh qua hàng đợi BullMQ ngầm | Chi tiết tại [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md) |\n| VH-06 | Tự động gom nhóm album ảnh theo từng học sinh, giúp phụ huynh lọc ảnh con nhanh chóng | Portfolio ảnh cá nhân hóa |\n| VH-06 | Quyền riêng tư AI & Làm mờ ảnh (OQ-16): Tôn trọng cờ `opt_out_face_ai`, không gắn thẻ tên, tự động kích hoạt làm mờ mặt `AUTO_BLUR_FACE` hoặc loại khỏi album công khai theo Nghị định 13/2023/NĐ-CP | Biểu tượng lá chắn bảo vệ quyền riêng tư |\n\n## Quan hệ\n- Thuộc về [Lớp học](classroom.md) hoặc Sự kiện toàn trường.\n- Gắn thẻ nhiều [Hồ sơ học sinh 360](student-profile.md).\n- Hiển thị trên [Màn hình thư viện](../screens/m2-sm3-thu-vien.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-06 | Thư viện media tự động gắn thẻ khuôn mặt học sinh trong ảnh lớp bằng AI | Prototype frontend chưa tích hợp upload S3/GCS và AI tagging | MISSING | repo:app/src/features/media/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-04, OQ-16).\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Màn hình thư viện](../screens/m2-sm3-thu-vien.md)\n- [Luồng nhận diện album ảnh](../flows/fl-nhan-dien-album-anh.md)\n"}, {"path": "pages/entities/parent-feedback.md", "title": "Thực Thể Góp Ý & Khiếu Nại Phụ Huynh", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Góp Ý & Khiếu Nại Phụ Huynh", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-028-school-parent-feedback/epic.md"], "spec_ids": ["NT-12"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Góp Ý & Khiếu Nại Phụ Huynh\n\n## Định nghĩa\nĐại diện cho các ý kiến đóng góp, phản hồi chất lượng đào tạo, khiếu nại dịch vụ bán trú hoặc yêu cầu hỗ trợ từ phụ huynh học sinh gửi tới Ban Giám Hiệu nhà trường.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Phân loại: Dinh dưỡng bán trú, Cơ sở vật chất, Giảng dạy đào tạo, Xe buýt đưa đón, Tài chính học phí, Khác.\n- Mức độ ưu tiên: Khẩn cấp (`URGENT`), Cao (`HIGH`), Bình thường (`NORMAL`), Thấp (`LOW`).\n- Trạng thái xử lý: `PENDING` (chờ tiếp nhận), `PROCESSING` (đang xử lý), `RESOLVED` (đã giải quyết), `CLOSED` (đóng phản ánh).\n- Phân công xử lý: Gán nhân sự chịu trách nhiệm giải quyết (`assignee_id`) kèm hạn hoàn thành (`deadline`).\n\n## Quan hệ\n- Gửi bởi phụ huynh gắn liền với [Hồ sơ học sinh 360](student-profile.md).\n- Tiếp nhận và xử lý bởi [Giáo viên & Nhân viên](teacher-staff.md) có thẩm quyền quản trị.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-12 | Hòm thư tiếp nhận và xử lý góp ý, phản hồi khiếu nại của phụ huynh học sinh | Type `Feedback`, danh sách inbox và modal phản hồi | MISSING | repo:app/src/types/feedback.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình hòm thư góp ý](../screens/m5-sm11-gop-y.md)\n- [Luồng tiếp nhận và xử lý góp ý](../flows/fl-tiep-nhan-xu-ly-gop-y.md)\n"}, {"path": "pages/entities/parent-handbook.md", "title": "Thực Thể Sổ Tay Phụ Huynh", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Sổ Tay Phụ Huynh", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-027-school-parent-handbook/epic.md"], "spec_ids": ["NT-11"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Sổ Tay Phụ Huynh\n\n## Định nghĩa\nĐại diện cho tập hợp các bài viết hướng dẫn, quy định nội quy nhà trường, cẩm nang chăm sóc trẻ, quy trình đưa đón, chính sách học phí và các câu hỏi thường gặp (FAQ) được công bố cho phụ huynh tra cứu trực tiếp.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Phân nhóm chuyên mục: Nội quy học đường, Quy định đưa đón & an toàn, Dinh dưỡng & y tế, Chính sách tài chính, Hướng dẫn sử dụng phần mềm.\n- Trạng thái bài viết: `DRAFT`, `PUBLISHED`, `PINNED` (ghim lên đầu danh mục).\n- Nội dung giàu đa phương tiện (Rich Text): Hỗ trợ hình ảnh minh họa, định dạng văn bản và tệp đính kèm hướng dẫn.\n\n## Quan hệ\n- Thuộc quyền quản lý của Ban Giám Hiệu tại [Phân hệ Nhà trường](../overview/module-school-admin.md).\n- Hiển thị trực tiếp cho phụ huynh đại diện của [Hồ sơ học sinh 360](student-profile.md) trên ứng dụng phụ huynh.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-11 | Sổ tay phụ huynh điện tử công bố quy định và hướng dẫn của nhà trường | Type `ParentHandbook`, bài viết và form soạn thảo | MISSING | repo:app/src/types/parentHandbook.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình sổ tay phụ huynh](../screens/m5-sm10-so-tay-ph.md)\n"}, {"path": "pages/entities/reconciliation-session.md", "title": "Thực Thể Phiên Đối Soát Giao Dịch", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Phiên Đối Soát Giao Dịch", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "pages/sources/src-open-questions-resolutions.md", "repo:docs/guides/development/E-013-finance-reconciliation/epic.md"], "spec_ids": ["TC-06"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Phiên Đối Soát Giao Dịch\n\n## Định nghĩa\nĐại diện cho đợt kiểm tra, so sánh và khớp lệnh giữa dữ liệu dòng tiền thanh toán thực tế ghi nhận qua cổng thanh toán / tài khoản ngân hàng (VietQR / chuyển khoản) với các hóa đơn học phí tương ứng trong hệ thống, bao gồm xử lý các giao dịch bất thường chuyển thừa, chuyển thiếu và tra soát ngân hàng.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- **Thông tin phiên:** Mã phiên đối soát (`session_id`), Khoảng thời gian đối soát (`from_date` đến `to_date`), Tổng số tiền ngân hàng ghi nhận, Tổng số tiền hóa đơn khớp lệnh, Chênh lệch.\n- **Trạng thái dòng giao dịch:** Khớp hoàn toàn (`MATCHED`), Chưa tìm thấy hóa đơn (`UNMATCHED`), Thừa tiền (`OVERPAID`), Thiếu tiền (`PARTIAL_PAID`), Đóng băng chờ tra soát (`FROZEN_UNDER_REVIEW`), Giao dịch nghi vấn / lỗi (`DISCREPANCY`).\n- **Giao dịch bất thường & Đóng băng tra soát (OQ-18):**\n  - Giao dịch `OVERPAID`: Cung cấp nút kết chuyển sang Credit Balance của học sinh hoặc \"Tạo phiếu chi hoàn tiền thừa\".\n  - Giao dịch `PARTIAL_PAID`: Tự động sinh lại mã VietQR động mới cho số tiền còn thiếu `remaining_amount`.\n  - Giao dịch `FROZEN_UNDER_REVIEW`: Khóa cứng không xuất hóa đơn điện tử VAT, chặn kết chuyển doanh thu cho đến khi có phán quyết phân xử từ ngân hàng.\n- **Cơ chế khóa sổ:** Khi phiên đối soát được kế toán trưởng phê duyệt và xác nhận \"Hoàn thành\", toàn bộ các giao dịch trong phiên sẽ bị khóa không thể điều chỉnh.\n\n## Quan hệ\n- Liên kết với nhiều [Hóa đơn học phí](tuition-invoice.md).\n- Liên kết với [Phiếu chi nội bộ](expense-voucher.md) khi lập phiếu hoàn tiền thừa.\n- Tác động tới số dư thu học phí thực tế tại [Phân hệ Tài chính](../overview/module-finance.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-06 | Đối soát giao dịch thanh toán tự động và thủ công với sổ phụ ngân hàng | Type `ReconciliationSession`, chi tiết phiên và Redux slice | MISSING | repo:app/src/types/reconciliation.ts:1 |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-09, OQ-18).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Màn hình đối soát](../screens/m4-sm2-doi-soat.md)\n- [Khái niệm Kiến trúc VietQR và đối soát](../concepts/vietqr-dynamic-reconciliation.md)\n- [Thực thể Phiếu chi nội bộ](expense-voucher.md)\n- [Luồng đối soát giao dịch](../flows/fl-doi-soat-giao-dich.md)\n"}, {"path": "pages/entities/revenue-category.md", "title": "Thực Thể Danh Mục Thu CSDL Sở", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Danh Mục Thu CSDL Sở", "type": "entity", "sources": ["pages/sources/src-development-epics-manifest.md", "pages/sources/src-open-questions-resolutions.md", "repo:docs/guides/development/E-010-finance-fee-catalog/epic.md"], "spec_ids": ["TC-19", "TC-20"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Thực Thể Danh Mục Thu CSDL Sở\n\n## Định nghĩa\nĐại diện cho danh mục các nguồn thu, khoản thu chuẩn hóa theo quy định của Sở Giáo Dục & Đào Tạo và hệ thống Managing Portal, làm cơ sở pháp lý để trường học thiết lập các khoản phí thu từ phụ huynh và đối soát dữ liệu với CSDL ngành.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- **Thuộc tính chính:** Mã danh mục (`code`), Tên khoản thu chuẩn (`name`), Đơn vị tính (`unit`), Căn cứ pháp lý (`legal_reference`), Ngày bắt đầu áp dụng (`effective_from`), Ngày kết thúc (`effective_to`).\n- **Trạng thái:** `PUBLISHED` (Đang áp dụng), `DRAFT` (Bản nháp), `ARCHIVED` (Ngừng áp dụng).\n- **Cơ chế đồng bộ:** Tích hợp nút đồng bộ trực tiếp (`Sync from CSDL Sở`) để kéo danh mục mới nhất từ máy chủ của cơ quan quản lý giáo dục.\n- Không thể chỉnh sửa trực tiếp tên hoặc mã của các khoản thu bắt buộc do Sở ban hành; trường học chỉ được phép bật/tắt cờ `usable` (áp dụng tại trường mình hay không).\n- **Hòa giải sai lệch dữ liệu & Xử lý lỗi ngắt quãng từng học sinh (OQ-15):**\n  - Khi đồng bộ phát hiện Data Drift giữa CSDL Portal và CSDL ngành, hệ thống hiển thị cảnh báo đối chiếu 2 cột và hỗ trợ cập nhật theo Sở hoặc lập biên bản giải trình.\n  - Đồng bộ lô áp dụng sub-transaction cho từng học sinh; lỗi ngắt quãng được đưa vào Retry Queue (3 lần Exponential Backoff) và Dead Letter Queue (DLQ), không làm gián đoạn toàn bộ đợt đồng bộ.\n\n## Quan hệ\n- Là căn cứ phân loại cha cho [Danh mục khoản phí](fee-catalog-item.md).\n- Kết nối logic với [Màn hình danh mục thu](../screens/m4-sm7-danh-muc-thu.md) và cấu trúc kế toán học phí.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-19 | Quản lý danh mục thu chuẩn hóa kết nối cơ sở dữ liệu Bộ/Sở GD&ĐT (CSDL Sở) | Type `RevenueCategory`, Redux slice và mock data | MISSING | repo:app/src/types/revenueCategory.ts:1 |\n| TC-20 | Ánh xạ mã tiểu mục tài chính và đồng bộ trạng thái danh mục thu với hệ thống Managing Portal | Action `syncStart`, `syncSuccess` trên Redux | MISSING | repo:app/src/store/slices/revenueCategorySlice.ts:1 |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Màn hình danh mục thu](../screens/m4-sm7-danh-muc-thu.md)\n- [Thực thể Danh mục khoản phí](fee-catalog-item.md)\n- [Khái niệm Tích hợp CSDL Sở](../concepts/csdl-so-integration.md)\n- [Luồng đồng bộ danh mục thu](../flows/fl-dong-bo-danh-muc-thu.md)\n"}, {"path": "pages/entities/school-announcement.md", "title": "Thực Thể Bảng Thông Tin Nhà Trường", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Bảng Thông Tin Nhà Trường", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-024-school-announcements/epic.md"], "spec_ids": ["NT-07"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Bảng Thông Tin Nhà Trường\n\n## Định nghĩa\nĐại diện cho các bài thông báo, tin tức truyền thông nội bộ hoặc thông báo khẩn cấp do Ban Giám Hiệu hoặc giáo viên gửi tới toàn trường, từng khối hoặc từng lớp học cụ thể.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Hỗ trợ phân loại: Thông báo chung, Thông báo học tập, Thông báo học phí, Thông báo khẩn cấp.\n- Trạng thái phát hành: `DRAFT` (bản nháp), `PUBLISHED` (đã phát hành), `ARCHIVED` (lưu trữ).\n- Hỗ trợ đính kèm tệp tin tài liệu (PDF, Word) và ảnh minh họa.\n- Tích hợp cờ gửi thông báo đẩy (Push Notification) đến ứng dụng di động của phụ huynh khi kích hoạt trạng thái khẩn cấp.\n\n## Quan hệ\n- Thuộc về một Trường học (`school_id`) và do một [Giáo viên & Nhân viên](teacher-staff.md) soạn thảo.\n- Có thể định tuyến gửi tới toàn trường hoặc nhắm mục tiêu vào các [Lớp học](classroom.md) nhất định.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-07 | Bảng thông tin điện tử truyền thông sự kiện và gửi thông báo khẩn cấp | Type `Announcement`, Redux slice và giao diện CRUD | MISSING | repo:app/src/types/announcement.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình bảng thông tin](../screens/m5-sm6-bang-thong-tin.md)\n- [Khái niệm Cơ chế kiểm duyệt 2 cấp](../concepts/rbac-two-tier-moderation.md)\n"}, {"path": "pages/entities/school-poll.md", "title": "Thực Thể Khảo Sát & Bình Chọn", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Khảo Sát & Bình Chọn", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-025-school-polls/epic.md"], "spec_ids": ["NT-08"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Khảo Sát & Bình Chọn\n\n## Định nghĩa\nĐại diện cho chiến dịch thu thập ý kiến phụ huynh hoặc giáo viên về các hoạt động ngoại khóa, đồng phục, thực đơn ăn bán trú hoặc các chính sách vận hành của nhà trường.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Loại câu hỏi: Chọn một đáp án (Single choice), chọn nhiều đáp án (Multiple choice), câu hỏi đóng/mở.\n- Thời gian hiệu lực: `start_time` đến `end_time`. Khi hết hạn, form bình chọn tự động khóa và tính toán tỷ lệ % kết quả.\n- Tùy chọn ẩn danh (Anonymous) hoặc công khai danh tính người bình chọn.\n- Mỗi phụ huynh đại diện cho một học sinh chỉ được bỏ phiếu một lần duy nhất cho mỗi câu hỏi.\n\n## Quan hệ\n- Khởi tạo bởi Ban Giám Hiệu hoặc [Giáo viên & Nhân viên](teacher-staff.md).\n- Gắn với đối tượng học sinh thông qua [Hồ sơ học sinh 360](student-profile.md) để kiểm tra tính hợp lệ của người bỏ phiếu.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-08 | Khởi tạo bình chọn và khảo sát ý kiến trực tuyến của phụ huynh và giáo viên | Type `Poll`, Redux slice và validation form | MISSING | repo:app/src/types/poll.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình bình chọn](../screens/m5-sm7-binh-chon.md)\n- [Luồng khảo sát bình chọn](../flows/fl-khao-sat-binh-chon.md)\n"}, {"path": "pages/entities/school-profile.md", "title": "Thực Thể Hồ Sơ Trường Học", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Hồ Sơ Trường Học", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-031-settings-school-profile/epic.md"], "spec_ids": ["CH-01"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Hồ Sơ Trường Học\n\n## Định nghĩa\nĐại diện cho thông tin pháp lý, định danh tổ chức giáo dục, nhận diện thương hiệu, thông tin liên hệ và các tham số thiết lập chế độ hoạt động mặc định của nhà trường trên cổng vận hành.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Định danh tenant: Mã trường (`school_code`), Tên chính thức (`school_name`), Mã số thuế / Quyết định thành lập.\n- Nhận diện thương hiệu: Logo trường, Favicon, Banner trang chủ, Màu sắc chủ đạo (Theme).\n- Thông tin liên hệ: Địa chỉ trụ sở, Số điện thoại văn phòng, Email tiếp nhận thông tin, Website chính thức, Tên hiệu trưởng / người đại diện pháp luật.\n- Thiết lập thời gian hoạt động: Ngày làm việc trong tuần (Thứ 2 đến Thứ 6/Thứ 7), Giờ bắt đầu đón trẻ, Giờ kết thúc trả trẻ, Hạn chốt báo vắng buổi sáng (mặc định 08:00).\n\n## Quan hệ\n- Là thực thể gốc (Root Tenant) bao bọc toàn bộ dữ liệu của [Hồ sơ học sinh 360](student-profile.md), [Giáo viên & Nhân viên](teacher-staff.md), [Lớp học](classroom.md) và các phân hệ.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-01 | Cấu hình thông tin pháp lý nhà trường, biểu tượng thương hiệu và niên khóa mặc định | Type `SchoolProfile`, Redux slice và giao diện cài đặt | MISSING | repo:app/src/types/schoolProfile.ts:1 |\n\n## Liên quan\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Màn hình cấu hình trường học](../screens/m6-sm1-truong.md)\n- [Khái niệm Cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n"}, {"path": "pages/entities/school-subject.md", "title": "Thực Thể Môn Học", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Môn Học", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-022-school-subject-management/epic.md"], "spec_ids": ["NT-05"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Môn Học\n\n## Định nghĩa\nĐại diện cho danh mục các môn học chính khóa (Toán, Văn, Tiếng Anh, Khoa học...), môn năng khiếu và hoạt động giáo dục được giảng dạy tại trường học theo chương trình của Bộ GD&ĐT hoặc chương trình quốc tế.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Thuộc tính chính: Mã môn (`code`), Tên môn (`name`), Số tiết tiêu chuẩn/tuần, Phân loại cấp học (`TH`, `THCS`, `THPT`, `MAM_NON`), Hệ số tính điểm (`weight`).\n- Phân công giáo viên: Mỗi môn học có danh sách giáo viên bộ môn được phân quyền nhập điểm và giao bài tập.\n- Tính toàn vẹn: Không cho phép xóa môn học đã có dữ liệu sổ điểm hoặc đã xuất hiện trong thời khóa biểu của niên khóa hiện hành.\n\n## Quan hệ\n- Liên kết với [Khối lớp](grade-level.md) và [Lớp học](classroom.md).\n- Xuất hiện trực tiếp trên các tiết học của [Thời khóa biểu tuần](timetable-weekly.md), các nhiệm vụ trong [Bài tập về nhà](homework-assignment.md) và các cột điểm trong [Sổ điểm đánh giá](gradebook-record.md).\n- Gắn với [Giáo viên & Nhân viên](teacher-staff.md) qua quan hệ phân công chuyên môn.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-05 | Quản lý danh mục môn học và phân công giáo viên giảng dạy | Type `Subject`, Redux slice và validation môn học | MISSING | repo:app/src/types/subject.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Màn hình môn học](../screens/m5-sm4-mon-hoc.md)\n- [Thực thể Sổ điểm đánh giá](gradebook-record.md)\n- [Thực thể Thời khóa biểu tuần](timetable-weekly.md)\n"}, {"path": "pages/entities/staff-attendance.md", "title": "Thực Thể Điểm Danh Nhân Sự", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Điểm Danh Nhân Sự", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-026-school-staff-attendance/epic.md"], "spec_ids": ["NT-10"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Điểm Danh Nhân Sự\n\n## Định nghĩa\nĐại diện cho nhật ký chấm công, ghi nhận giờ vào ca (Check-in), giờ ra ca (Check-out), thời gian đi muộn/về sớm và đơn xin nghỉ phép của giáo viên, nhân viên văn phòng, bảo mẫu và nhân viên phục vụ trong trường học.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Trạng thái ca: Có mặt đúng giờ (`ON_TIME`), Đi muộn (`LATE`), Về sớm (`EARLY_LEAVE`), Nghỉ có phép (`EXCUSED_ABSENCE`), Nghỉ không phép (`UNEXCUSED_ABSENCE`).\n- Dữ liệu xác thực: Giờ vào/ra thực tế, định vị GPS hoặc dữ liệu từ máy chấm công vân tay / camera AI nhận diện khuôn mặt.\n- Tổng hợp chấm công: Tự động tổng hợp số công chuẩn, số giờ làm thêm (OT) và số lần đi muộn trong tháng để làm căn cứ tính lương.\n\n## Quan hệ\n- Gắn liền với từng cán bộ trong [Giáo viên & Nhân viên](teacher-staff.md).\n- Gắn với [Niên khóa & Học kỳ](academic-year.md) và lịch làm việc của trường.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-10 | Điểm danh ca làm việc và tổng hợp bảng chấm công nhân viên nhà trường | Type `StaffAttendance`, Redux slice và bảng điểm danh | MISSING | repo:app/src/types/staffAttendance.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình điểm danh nhân viên](../screens/m5-sm9-diem-danh-nv.md)\n- [Luồng điểm danh chấm công nhân viên](../flows/fl-diem-danh-cham-cong-nv.md)\n"}, {"path": "pages/entities/student-absence-request.md", "title": "Thực Thể Đơn Xin Nghỉ Học / Báo Vắng (Student Absence Request)", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Đơn Xin Nghỉ Học / Báo Vắng (Student Absence Request)", "type": "entity", "sources": ["repo:docs/guides/development/E-004-operations-conversations/epic.md", "repo:docs/guides/legacy/operating-portal/M2-van-hanh/trao-doi.md", "repo:docs/guides/decisions.md"], "updated": "2026-11-05", "spec_ids": ["VH-09", "TC-11"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Thực Thể Đơn Xin Nghỉ Học / Báo Vắng (Student Absence Request)\n\n## Định nghĩa\nĐơn xin nghỉ học (Báo vắng) là thực thể nghiệp vụ phản ánh yêu cầu nghỉ học chính thức do phụ huynh học sinh khởi tạo thông qua ứng dụng di động Eco School Parent, gửi tới giáo viên chủ nhiệm và ban giám hiệu nhà trường. Thực thể này là chứng từ căn cứ pháp lý để xác định trạng thái \"Vắng có phép\" (CP) trong sổ điểm danh và kích hoạt luồng khấu trừ hoàn tiền ăn tự động ($M+1$).\n\n## Thuộc tính / quy tắc nghiệp vụ\n- **Mã định danh:** `id` (UUIDv4).\n- **Học sinh:** `studentId` (liên kết tới `student-profile`).\n- **Lớp học:** `classId` (liên kết tới `classroom`).\n- **Thời gian xin nghỉ:** `startDate` và `endDate` (ngày bắt đầu và kết thúc kỳ nghỉ, định dạng `YYYY-MM-DD`).\n- **Loại ngày nghỉ:** `session`: Cả ngày (`full_day`), Buổi sáng (`morning`), Buổi chiều (`afternoon`).\n- **Lý do nghỉ học:** `reason`: Nghỉ ốm / điều trị y tế (`medical`), Việc gia đình (`family`), Lý do khác (`other`), kèm văn bản giải trình chi tiết.\n- **Trạng thái xử lý:** `status`:\n  - `pending` (Chờ duyệt): Phụ huynh vừa gửi, giáo viên nhận được thông báo đẩy.\n  - `approved` (Đã duyệt): Giáo viên chủ nhiệm xác nhận, tự động đồng bộ sang bảng điểm danh thành trạng thái \"Vắng có phép\" (CP).\n  - `rejected` (Từ chối): Giáo viên từ chối đơn kèm lý do phản hồi cho phụ huynh.\n- **Quy tắc thời gian báo vắng (VH-09):** Đơn xin nghỉ nộp trước mốc thời gian quy định của nhà trường (cấu hình tại Cấu hình học phí, mặc định 08:30 sáng cùng ngày) mới được công nhận là hợp lệ để xét hoàn tiền suất ăn bán trú 100%.\n- **Đón về sớm khẩn cấp do y tế (OQ-10):** Đối với trường hợp học sinh đã check-in buổi sáng nhưng phát sinh sốt cao $\\ge 38.5^\\circ\\text{C}$ hoặc bệnh đột xuất và được phụ huynh đón về trước 10:30 sáng (có xác nhận của Y tế trường), hệ thống tự động sinh đơn nghỉ nửa ngày do y tế (`emergency_medical_half_day`) và áp dụng mức hoàn 50% tiền ăn ngày đó.\n- **Liên kết hoàn tiền ăn (TC-11):** Mỗi ngày nghỉ có phép hợp lệ sẽ tạo ra một bản ghi tín chỉ hoàn tiền ăn (`meal-refund-credit`) để khấu trừ vào kỳ hóa đơn tháng tiếp theo. Nếu hoàn tiền vượt học phí, tự động kết chuyển thành số dư tín dụng `credit_balance`.\n\n## Quan hệ\n- Thuộc về một [Học sinh](student-profile.md) (`studentId`).\n- Gắn với một [Lớp học](classroom.md) (`classId`).\n- Liên thông với sổ [Điểm danh hàng ngày](attendance-daily.md) để đánh dấu vắng có phép.\n- Kích hoạt việc sinh ra [Tín chỉ hoàn tiền ăn](meal-refund-credit.md) cho hóa đơn học phí tiếp theo.\n- Được trao đổi qua kênh [Hội thoại phụ huynh](conversation-thread.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-09 | Duyệt đơn báo vắng tự động đồng bộ sang điểm danh và hoàn tiền ăn | Prototype xử lý logic điểm danh và trao đổi | MISSING | — |\n| TC-11 | Tính toán khấu trừ suất ăn theo đơn báo vắng hợp lệ | Logic tính toán quy định trong Redux store | MISSING | — |\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Luồng nộp đơn xin nghỉ học](../flows/fl-don-xin-nghi-hoc.md)\n- [Luồng báo vắng hoàn tiền](../flows/fl-bao-vang-hoan-tien.md)\n- [Màn hình trao đổi](../screens/m2-sm4-trao-doi.md)\n- [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md)\n"}, {"path": "pages/entities/student-archive-record.md", "title": "Thực Thể Hồ Sơ Lưu Trữ Học Sinh (Student Archive Record)", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Hồ Sơ Lưu Trữ Học Sinh (Student Archive Record)", "type": "entity", "sources": ["repo:docs/guides/development/E-030-school-archive/epic.md", "repo:docs/guides/decisions.md", "pages/sources/src-open-questions-resolutions.md"], "updated": "2026-11-05", "spec_ids": ["NT-17", "NT-10"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Thực Thể Hồ Sơ Lưu Trữ Học Sinh (Student Archive Record)\n\n## Định nghĩa\nHồ sơ lưu trữ học sinh là thực thể đại diện cho trạng thái lưu trữ kho lạnh (cold storage) của học sinh đã thôi học, chuyển trường hoặc tốt nghiệp ra trường. Khi học sinh được đưa vào kho lưu trữ, toàn bộ thông tin cá nhân và lịch sử học tập được đóng băng và cô lập hoàn toàn khỏi danh sách vận hành hàng ngày và danh sách tính phí học phí, nhưng vẫn được lưu giữ vĩnh viễn để phục vụ tra cứu học bạ, quyết toán tài chính và phục hồi khi cần thiết.\n\n## Thuộc tính / quy tắc nghiệp vụ\n- **Mã định danh:** `id` (UUIDv4).\n- **Học sinh liên kết:** `studentId` (trỏ tới `student-profile`).\n- **Lý do lưu trữ:** `archiveReason`: Thôi học (`withdrawn`), Chuyển trường (`transferred`), Tốt nghiệp ra trường (`graduated`), Khác (`other`).\n- **Ngày chuyển lưu trữ:** `archivedAt` (ngày thực hiện đóng băng).\n- **Người thực hiện:** `archivedBy` (mã nhân viên hoặc admin thao tác).\n- **Lớp học cuối cùng:** `formerClassId` (mã lớp trước khi đưa vào kho lưu trữ).\n- **Niên khóa lưu trữ:** `academicYearId` (niên khóa phát sinh việc chuyển kho).\n- **Trạng thái lưu trữ:** `status`:\n  - `archived`: Đang nằm trong kho lưu trữ, không xuất hiện ở danh sách điểm danh, hoạt động hay thu phí.\n  - `restored`: Đã được phục hồi trở lại danh sách học sinh hoạt động.\n  - `purged`: Đã bị xóa vĩnh viễn sau quy trình xác nhận 2 bước có cảnh báo màu đỏ (LT-02).\n- **Quy tắc cách ly hoàn toàn (NT-17):** Học sinh trong kho lưu trữ bị loại trừ 100% khỏi các bộ đếm sĩ số lớp, bộ đếm KPI trường, danh sách sinh hóa đơn tự động và danh sách điểm danh đón trả.\n- **Quy tắc phục hồi bắt buộc chọn lớp đích (NT-17, OQ-12):** Khi phục hồi học sinh (`LT-01`), hệ thống kiểm tra xem lớp học cũ (`formerClassId`) có còn đang hoạt động trong niên khóa hiện tại không. Nếu lớp còn hoạt động, cho phép phục hồi về lớp cũ (kiểm tra sĩ số). Nếu lớp cũ đã kết thúc, giải tán hoặc đã bị xóa, hệ thống CHẶN không cho phục hồi mồ côi mà BẮT BUỘC Admin phải chọn một **Lớp học đích đang hoạt động (`target_class_id`)** thuộc niên khóa hiện hành, đồng thời kiểm tra sĩ số an toàn trước khi kích hoạt phục hồi.\n- **Chốt chặn công nợ khi xóa vĩnh viễn (LT-02, OQ-12):** Tuyệt đối cấm xóa vĩnh viễn (`purged`) học sinh trong kho lưu trữ nếu vẫn còn bất kỳ hóa đơn công nợ nào chưa thanh toán (`balance_due > 0`). Chỉ cho phép xóa khi đã tất toán 100% công nợ và hoàn thành xác thực 2 bước nền đỏ.\n- **Hồ sơ thanh lý rút học phí giữa kỳ (OQ-17):** Đối với học sinh thôi học giữa kỳ (`withdrawn`), hồ sơ lưu trữ liên kết với Biên bản thanh lý học phí Pro-rata (`settlementStatementId`) và Phiếu chi hoàn tiền (`refundVoucherId`). Toàn bộ hóa đơn tương lai bị hủy vĩnh viễn, tài khoản Mobile App chuyển sang chế độ `READ_ONLY_ARCHIVE` chỉ đọc lịch sử.\n\n## Quan hệ\n- Đóng băng dữ liệu của một [Học sinh](student-profile.md).\n- Ghi nhận thông tin lớp học cũ với [Lớp học](classroom.md).\n- Gắn với một [Niên khóa](academic-year.md).\n- Liên kết với [Phiếu chi nội bộ](expense-voucher.md) khi hoàn tiền thanh lý rút hồ sơ.\n- Quản lý tại [Màn hình kho lưu trữ](../screens/m5-sm14-luu-tru.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-17 | Cách ly kho lạnh, kiểm tra lớp khi phục hồi và bảo vệ 2 bước khi xóa | Đã có màn hình `/school/archive` với modal xác nhận | MISSING | repo:app/src/pages/[schoolCode]/school/archive/index.tsx:1 |\n| NT-10 | Quản lý kho lưu trữ học sinh chuyển trường, thôi học | Mockup danh sách và bộ lọc tháng lưu trữ hoàn tất | MISSING | repo:app/src/features/students/ |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Khái niệm vòng đời học sinh](../concepts/student-lifecycle-transitions.md)\n- [Thực thể Phiếu chi nội bộ](expense-voucher.md)\n- [Luồng kho lưu trữ học sinh](../flows/fl-kho-luu-tru-hoc-sinh.md)\n- [Màn hình kho lưu trữ](../screens/m5-sm14-luu-tru.md)\n- [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md)\n"}, {"path": "pages/entities/student-profile.md", "title": "Hồ Sơ Học Sinh 360 (Student Profile 360)", "type": "entity", "group": "entities", "fm": {"title": "Hồ Sơ Học Sinh 360 (Student Profile 360)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["NT-01", "NT-02"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Hồ Sơ Học Sinh 360 (Student Profile 360)\n\n## Định nghĩa\nThực thể Hồ sơ học sinh 360 lưu trữ toàn bộ dữ liệu gốc, thông tin nhân thân, hành trình học tập, sức khỏe, tài chính, trạng thái đồng bộ kỳ thi và quyền riêng tư sinh trắc của học sinh qua các năm học trong hệ thống trường học.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| NT-01 | Quản lý mã học sinh duy nhất trong trường, ngày sinh, giới tính, CCCD/Định danh, địa chỉ và thông tin đa phụ huynh (Bố, Mẹ, Người giám hộ) | 5 tab ngữ cảnh: Hồ sơ, Hoạt động, Thư viện, Điểm danh, Học phí |\n| NT-01 | Theo dõi chỉ số thể chất BMI (chiều cao, cân nặng theo tháng) và lịch sử tiêm chủng y tế | Tự động tính chỉ số BMI và xếp loại thể lực |\n| NT-02 | Chuyển lớp và chuyển niên khóa bảo toàn toàn bộ kết quả học tập và lịch sử đóng phí | Tự động chuyển giao biểu phí theo lớp mới |\n| NT-01 | **Số dư tín dụng học sinh (`credit_balance` - OQ-09):** Lưu số tiền hoàn thừa khi tiền hoàn ăn > học phí; tự động cấn trừ vào hóa đơn kỳ sau hoặc lập phiếu chi hoàn tiền khi thôi học | Tab Học phí hiển thị số dư tín dụng khả dụng |\n| NT-01 | **Bảo toàn công nợ (`carried_over_debt` - OQ-12):** Công nợ học phí gắn chặt với mã học sinh, độc lập với việc lưu trữ/giải thể lớp cũ; tự động mang sang niên khóa mới | Tab Học phí hiển thị nợ kỳ trước cần thu |\n| NT-02 | **Bảo toàn điểm khi chuyển trường (OQ-11):** Chuyển trường trạng thái `transferred_out` trích xuất bảng điểm ký số; trường tiếp nhận trạng thái `enrolled` kế thừa 100% điểm TX, GK | Tab Hồ sơ & Học
