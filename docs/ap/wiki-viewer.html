n| 1 | Bếp trưởng / Nhân viên dinh dưỡng | Web Admin | Vào màn hình Thực đơn, chọn Khối lớp và Tuần áp dụng (tối đa trước 8 tuần) | Mở lưới phân bổ món ăn theo ngày |\n| 2 | Nhân viên dinh dưỡng | Web Admin | Nhập món ăn từng bữa (Sáng, Trưa, Xế chiều) hoặc tải lên file mẫu Excel | Lưới thực đơn hiển thị chi tiết |\n| 3 | Nhân viên dinh dưỡng | Web Admin | Nhấn \"Trình duyệt thực đơn\" | Trạng thái chuyển thành `PENDING_APPROVAL` |\n| 4 | Ban Giám Hiệu / Y tế trường | Web Admin | Kiểm tra hàm lượng dinh dưỡng và nguy cơ dị ứng thực phẩm, nhấn \"Phê duyệt\" | Chuyển trạng thái `APPROVED` |\n| 5 | Ban Giám Hiệu | Web Admin | Nhấn \"Công bố tới phụ huynh\" | Đẩy thực đơn lên app di động của phụ huynh có con học khối tương ứng |\n\n## Quy tắc chặn / validation\n- Không được phép lập hoặc chỉnh sửa thực đơn của các tuần đã trôi qua trong quá khứ.\n- Giới hạn lập trước tối đa không vượt quá 8 tuần so với ngày hiện tại (`max_future_weeks = 8`).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-09 | Lập và công bố thực đơn dinh dưỡng theo tuần bảo đảm an toàn vệ sinh thực phẩm | Giao diện tạo thực đơn theo tuần, tải file Excel và Redux slice | MISSING | repo:app/src/pages/[schoolCode]/school/menu/create.tsx:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Thực thể Thực đơn dinh dưỡng tuần](../entities/weekly-menu.md)\n- [Màn hình thực đơn](../screens/m5-sm8-thuc-don.md)\n"}, {"path": "pages/flows/fl-nhan-dien-album-anh.md", "title": "Luồng Tải Ảnh & Nhận Diện Khuôn Mặt AI", "type": "flow", "group": "flows", "fm": {"title": "Luồng Tải Ảnh & Nhận Diện Khuôn Mặt AI", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-06", "CH-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Tải Ảnh & Nhận Diện Khuôn Mặt AI\n\n## Mục tiêu\nTự động hóa hoàn toàn việc phân loại hình ảnh lớp học, nhận diện khuôn mặt từng học sinh trong các album ảnh hoạt động và đưa vào portfolio cá nhân của học sinh mà không làm đơ giao diện hay nghẽn mạng, đồng thời bảo vệ nghiêm ngặt quyền riêng tư sinh trắc học theo Nghị định 13/2023/NĐ-CP.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Giáo viên | [Màn hình thư viện](../screens/m2-sm3-thu-vien.md) | Chọn và tải lên album ảnh hoạt động lớp (lên đến 100 ảnh) | Ảnh được lưu lên Object Storage, hiển thị huy hiệu \"Đang nhận diện...\" | VH-06 |\n| 2 | Hệ thống | BullMQ Worker | Worker trích xuất khuôn mặt, so khớp vector nhận diện; tự động kiểm tra cờ quyền riêng tư sinh trắc học `opt_out_face_ai` | Bỏ qua học sinh từ chối AI, tự động gán thẻ (`face_tag`) cho học sinh hợp lệ | CH-04 |\n| 3 | Hệ thống | Privacy Filter | Nếu ảnh công bố ngoài lớp chứa học sinh có cờ `opt_out_face_ai`: áp dụng làm mờ mặt `AUTO_BLUR_FACE` | Bảo vệ hình ảnh cá nhân trẻ em theo luật định | CH-04 |\n| 4 | Phụ huynh / GV | [Màn hình thư viện](../screens/m2-sm3-thu-vien.md) | Bấm lọc theo tên học sinh | Hiển thị toàn bộ ảnh có mặt học sinh đó trong các hoạt động | VH-06 |\n\n## Quy tắc chặn / validation\n- Chỉ những nhận diện có độ tin cậy vượt ngưỡng $\\ge 0.85$ mới được tự động gán thẻ; các nhận diện dưới ngưỡng được đưa vào hàng đợi xác nhận thủ công (CH-04).\n- Quá trình xử lý AI bắt buộc chạy bất đồng bộ ngoài luồng HTTP chính để tránh lỗi quá thời gian kết nối (VH-06).\n- **Quyền riêng tư sinh trắc học & Opt-Out (OQ-16):** Tuyệt đối không trích xuất vector hay gắn thẻ tên cho bất kỳ học sinh nào có cờ `opt_out_face_ai = true`. Tự động làm mờ khuôn mặt học sinh đó khi ảnh được xuất bản công khai ra ngoài phạm vi lớp học.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-06 | Thư viện media tự động gắn thẻ khuôn mặt học sinh trong ảnh lớp bằng AI | Prototype thư viện ảnh chưa kết nối worker xử lý AI | MISSING | repo:app/src/features/media/ |\n| CH-04 | Cấu hình mô hình AI nhận diện khuôn mặt và ngưỡng nhạy độ tin cậy nhận diện | Màn hình cấu hình AI mới là giao diện mockup tĩnh | MISSING | repo:app/src/features/settings/ |\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Thư viện media](../entities/media-album.md)\n- [Hồ sơ sinh trắc khuôn mặt](../entities/face-biometric-registration.md)\n- [Màn hình thư viện](../screens/m2-sm3-thu-vien.md)\n"}, {"path": "pages/flows/fl-nhap-so-diem.md", "title": "Luồng Nhập & Phê Duyệt Sổ Điểm Học Tập", "type": "flow", "group": "flows", "fm": {"title": "Luồng Nhập & Phê Duyệt Sổ Điểm Học Tập", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["HT-03"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Nhập & Phê Duyệt Sổ Điểm Học Tập\n\n## Mục tiêu\nCho phép giáo viên bộ môn nhập các cột điểm kiểm tra thường xuyên và định kỳ, tự động tính điểm trung bình môn theo trọng số, và thực hiện quy trình khóa sổ điểm sau khi ban giám hiệu phê duyệt.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | GV bộ môn | [Màn hình sổ điểm](../screens/m3-sm3-diem-danh-gia.md) | Chọn lớp, môn học, học kỳ và nhập điểm số theo từng cột điểm kiểm tra | Điểm số được lưu tạm và tự động tính điểm trung bình | HT-03 |\n| 2 | GV bộ môn | [Màn hình sổ điểm](../screens/m3-sm3-diem-danh-gia.md) | Kiểm tra điểm tổng kết, bấm \"Gửi phê duyệt sổ điểm\" | Sổ điểm chuyển trạng thái Chờ duyệt | HT-03 |\n| 3 | BGH / Trưởng BM | [Màn hình sổ điểm](../screens/m3-sm3-diem-danh-gia.md) | Rà soát bảng điểm toàn lớp và bấm \"Khóa sổ điểm\" | Sổ điểm được khóa vĩnh viễn, công bố kết quả cho phụ huynh | HT-03 |\n| 4 | GV & BGH | [Màn hình sổ điểm](../screens/m3-sm3-diem-danh-gia.md) | Sổ đã khóa phát hiện nhập nhầm: GV tạo Phiếu đề nghị đính kèm ảnh bài thi; BGH duyệt | Mở khóa cục bộ 1 ô điểm (TTL 60 phút), lưu Audit Trail bất biến và tính lại TBHK | HT-03 |\n\n## Quy tắc chặn / validation\n- Điểm số nhập vào phải nằm trong thang điểm từ 0.0 đến 10.0; chấp nhận tối đa 1 chữ số thập phân (HT-03).\n- **Cơ chế mở khóa sổ điểm đặc biệt (OQ-11):** Sau khi sổ điểm đã bị khóa (`locked`), cấm mọi hành vi sửa điểm trực tiếp; bắt buộc phải có Phiếu đề nghị kèm ảnh bằng chứng và phê duyệt của Ban Giám Hiệu.\n- **Giới hạn thời gian mở khóa (TTL 60 phút):** Ô điểm được mở khóa tạm thời sẽ tự động đóng băng trở lại ngay khi giáo viên bấm Lưu hoặc sau 60 phút kể từ lúc duyệt (HT-03).\n- **Audit Trail bất biến (OQ-11):** Mọi thao tác sửa điểm sau khi khóa bắt buộc ghi nhận vào `GradeAuditTrail` (chống xóa/sửa) và gửi thông báo giải trình minh bạch tới phụ huynh (HT-03).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-03 | Nhập sổ điểm và đánh giá định kỳ theo quy chuẩn chuẩn hóa của Bộ GD&ĐT | Giao diện sổ điểm mới chỉ có bảng mockup, chưa có công thức tính điểm TB | MISSING | repo:app/src/features/academics/ |\n\n## Liên quan\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Sổ điểm đánh giá](../entities/gradebook-record.md)\n- [Màn hình sổ điểm](../screens/m3-sm3-diem-danh-gia.md)\n"}, {"path": "pages/flows/fl-phan-cong-giao-vien-kiem-duyet.md", "title": "Luồng Phân Công Giáo Viên & Quyền Kiểm Duyệt", "type": "flow", "group": "flows", "fm": {"title": "Luồng Phân Công Giáo Viên & Quyền Kiểm Duyệt", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["NT-03"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Phân Công Giáo Viên & Quyền Kiểm Duyệt\n\n## Mục tiêu\nThiết lập danh sách nhân sự giáo viên, phân công lớp chủ nhiệm và môn học giảng dạy, đồng thời cấu hình quyền kiểm duyệt đăng bài hoạt động nhằm kiểm soát chất lượng nội dung truyền thông.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Quản trị viên | [Màn hình giáo viên](../screens/m5-sm2-giao-vien.md) | Thêm giáo viên mới hoặc chọn giáo viên từ danh sách nhân sự | Mở form thông tin giáo viên và phân quyền | NT-03 |\n| 2 | Quản trị viên | [Màn hình giáo viên](../screens/m5-sm2-giao-vien.md) | Phân công lớp chủ nhiệm, các môn học giảng dạy và chọn vai trò kiểm duyệt | Lưu thiết lập phân công giảng dạy | NT-03 |\n| 3 | Quản trị viên | [Màn hình giáo viên](../screens/m5-sm2-giao-vien.md) | Cấu hình quyền kiểm duyệt: Chọn \"Đăng trực tiếp\" cho GV chính hoặc \"Cần duyệt\" cho GV hỗ trợ | Áp dụng chính sách kiểm duyệt 2 cấp | NT-03 |\n\n## Quy tắc chặn / validation\n- Một lớp học chính khóa chỉ có tối đa một Giáo viên chủ nhiệm chính trong cùng một niên khóa (NT-03).\n- Giáo viên hỗ trợ khi được phân quyền \"Cần duyệt\" không được tự duyệt bài của mình (NT-03).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-03 | Quản lý danh bạ giáo viên và cơ chế kiểm duyệt nội dung bài đăng 2 cấp | Chưa có trường dữ liệu và logic phân quyền duyệt bài 2 cấp trong backend | MISSING | repo:app/src/features/teachers/ |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Giáo viên & Nhân viên](../entities/teacher-staff.md)\n- [Bảng tin hoạt động lớp](../entities/class-activity.md)\n- [Màn hình giáo viên](../screens/m5-sm2-giao-vien.md)\n"}, {"path": "pages/flows/fl-quan-ly-ho-so-hoc-sinh-360.md", "title": "Luồng Quản Lý Hồ Sơ Học Sinh 360", "type": "flow", "group": "flows", "fm": {"title": "Luồng Quản Lý Hồ Sơ Học Sinh 360", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["NT-01"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Quản Lý Hồ Sơ Học Sinh 360\n\n## Mục tiêu\nQuản lý toàn diện hồ sơ học sinh qua 5 tab ngữ cảnh chuyên sâu, cập nhật thông tin nhân thân, phụ huynh liên hệ, lịch sử phát triển thể lực, theo dõi tổng thể quá trình học tập, đồng thời thực thi chốt chặn Khóa đồng bộ kỳ thi (`is_sync_locked`), quyền riêng tư sinh trắc AI (`opt_out_face_ai`), và danh sách hạn chế tiếp cận tranh chấp giám hộ (`restricted_guardians`).\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Quản trị viên | [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md) | Thêm mới học sinh hoặc mở hồ sơ học sinh từ danh sách | Mở màn hình chi tiết hồ sơ học sinh 360 độ | NT-01 |\n| 2 | Quản trị viên | [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md) | Nhập thông tin nhân thân, ngày bắt đầu học `enrollment_date` (phục vụ hóa đơn lẻ ngày Prorated OQ-22), CCCD/Định danh, và danh bạ liên hệ phụ huynh (số điện thoại chính `primary_phone` tự động nhóm gia đình hưởng Sibling Discount OQ-23) | Cập nhật dữ liệu gốc của học sinh và liên kết anh/chị/em ruột | NT-01 |\n| 2b | Quản trị viên | [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md) | Cấu hình bảo vệ: bật/tắt cờ `opt_out_face_ai`, cập nhật danh sách `restricted_guardians` kèm phán quyết Tòa án (OQ-16) | Áp dụng chế độ bảo vệ quyền riêng tư và an toàn giám hộ | NT-01 |\n| 3 | Quản trị viên / GV | [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md) | Chuyển qua các tab Hoạt động, Thư viện, Điểm danh (theo dõi Sổ dặn thuốc y tế và lịch sử uống thuốc `student_medical_logs` - OQ-19), Học phí (xem số dư Credit Balance, hóa đơn riêng lẻ) | Dữ liệu ngữ cảnh được tải đầy đủ theo từng phân hệ | NT-01 |\n\n## Quy tắc chặn / validation\n- Mã định danh học sinh (Mã học sinh hoặc CCCD) không được trùng lặp trong cùng một cơ sở trường học (NT-01).\n- Mỗi học sinh bắt buộc phải có ít nhất một số điện thoại phụ huynh hợp lệ để nhận thông báo (NT-01).\n- **Chốt chặn Khóa dữ liệu kỳ thi (`is_sync_locked = true` - OQ-15):** Khi Sở GD&ĐT chốt kỳ thi, các trường định danh (`full_name`, `dob`, `gender`, `national_id_number`, `moet_student_code`) bị khóa cứng chỉ đọc; cấm chỉnh sửa nếu không có phiếu phê duyệt của BGH.\n- **Quyền riêng tư sinh trắc & Tranh chấp giám hộ (OQ-16):** Bật `opt_out_face_ai = true` kích hoạt làm mờ ảnh và xóa vector nhận diện; khai báo `restricted_guardians` kích hoạt Huy hiệu Khiên Đỏ và Cảnh báo đỏ tại màn hình điểm danh.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-01 | Quản lý danh bạ và hồ sơ học sinh 360° với 5 tab ngữ cảnh chuyên sâu | Frontend prototype hiển thị tab nhưng chưa đồng bộ dữ liệu thời gian thực | MISSING | repo:app/src/features/students/ |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Kiến trúc tích hợp CSDL Sở](../concepts/csdl-so-integration.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Vòng đời chuyển tiếp học sinh](../concepts/student-lifecycle-transitions.md)\n- [Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md)\n"}, {"path": "pages/flows/fl-quan-tri-tai-khoan-phan-quyen.md", "title": "Luồng Quản Trị Tài Khoản & Phân Quyền Đa Vai Trò (Account Governance & RBAC Flow)", "type": "flow", "group": "flows", "fm": {"title": "Luồng Quản Trị Tài Khoản & Phân Quyền Đa Vai Trò (Account Governance & RBAC Flow)", "type": "flow", "sources": ["repo:docs/guides/planning/flows.md", "repo:docs/guides/decisions.md"], "updated": "2026-11-05", "spec_ids": ["CH-11", "CH-02"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Quản Trị Tài Khoản & Phân Quyền Đa Vai Trò (Account Governance & RBAC Flow)\n\n## Mục tiêu\nĐặc tả luồng quản trị tài khoản người dùng, khởi tạo nhân sự, phân bổ vai trò (Quản trị viên, Giáo viên, Kế toán), cơ chế khóa bảo vệ tài khoản Super-Admin (`CH-11`), chốt chặn an toàn khi đồng bộ CSDL Sở và đổi mật khẩu phân quyền.\n\n## Các bước\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Admin as Quản Trị Viên (Admin)\n    participant Client as Next.js Web Portal\n    participant API as Backend API\n    participant DB as School Database\n\n    Admin->>Client: Mở Cấu hình > Tài khoản (/[schoolCode]/setting/users)\n    Client->>API: GET /{schoolCode}/api/1.0/users (Tab Nhân viên hoặc Học sinh)\n    API-->>Client: Trả danh sách tài khoản kèm vai trò và cờ isSuperAdmin, isSyncedCSDL\n    Client-->>Admin: Hiển thị bảng tài khoản\n\n    alt Xem tài khoản Super-Admin (CH-11)\n        Client-->>Admin: Ẩn nút Xóa/Khóa, hiển thị badge \"Quản trị tối cao\"\n    else Thao tác với tài khoản thông thường\n        Admin->>Client: Bấm tạo mới tài khoản hoặc sửa vai trò\n        Client->>Admin: Modal phân quyền: Chọn vai trò (Admin / GV / Kế toán)\n        Admin->>Client: Xác nhận lưu thông tin\n        Client->>API: PUT /{schoolCode}/api/1.0/users/{id}\n        API->>DB: Cập nhật quyền hạn và phạm vi lớp phụ trách\n        API-->>Client: Thông báo cập nhật quyền thành công\n    end\n\n    alt Tài khoản đồng bộ từ CSDL Sở (TK-03, CH-11)\n        Admin->>Client: Thử bấm chuyển trạng thái Kích hoạt / Vô hiệu hóa\n        Client-->>Admin: Khóa toggle, hiển thị tooltip: \"Dữ liệu đồng bộ từ CSDL Sở, không thể sửa trực tiếp\"\n    end\n```\n\n1. **Điều hướng danh sách tài khoản:**\n   - Quản trị viên truy cập `/setting/users`, hệ thống cung cấp 2 tab rõ ràng: \"Tài khoản nhân viên\" và \"Tài khoản học sinh/phụ huynh\".\n   - Bộ lọc hỗ trợ lọc theo Vai trò (Quản trị viên, Giáo viên chính, Giáo viên hỗ trợ, Kế toán), Trạng thái (Hoạt động, Đã khóa), và Nguồn dữ liệu (Nội bộ, CSDL Sở).\n2. **Khóa bảo vệ Super-Admin (CH-11):**\n   - Đối với tài khoản có cờ `isSuperAdmin: true`, toàn bộ các hành động xóa tài khoản, hạ quyền hoặc vô hiệu hóa trạng thái bị ẩn hoặc vô hiệu hóa hoàn toàn trên giao diện và backend, ngăn chặn việc vô tình tự khóa quyền truy cập hệ thống.\n3. **Bảo vệ tài khoản đồng bộ CSDL Sở:**\n   - Tài khoản được đánh dấu `isSyncedCSDL: true` có các trường thông tin pháp lý (Họ tên, CCCD, Email, Mã định danh ngành) ở chế độ chỉ đọc.\n   - Nút gạt trạng thái kích hoạt bị vô hiệu hóa để bảo đảm tính nhất quán với dữ liệu của Sở GD&ĐT.\n4. **Phân quyền chức năng & Lớp phụ trách:**\n   - Khi chỉnh sửa tài khoản giáo viên, Admin chọn phân công các lớp phụ trách và chỉ định quyền hạn: \"Giáo viên chính\" (được đăng tin trực tiếp) hoặc \"Giáo viên hỗ trợ\" (bài đăng chuyển vào hàng đợi kiểm duyệt).\n\n## Quy tắc chặn / validation\n- **Quy tắc bảo vệ Super-Admin (CH-11):** Hệ thống luôn bảo đảm có ít nhất một tài khoản Super-Admin hoạt động. Cấm mọi thao tác xóa tài khoản Super-Admin từ giao diện quản trị web.\n- **Quy tắc mật khẩu:** Mật khẩu cấp mới hoặc đặt lại phải có độ dài tối thiểu 8 ký tự, bao gồm chữ hoa, chữ thường và chữ số.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-11 | Khóa bảo vệ Super-Admin và chốt chặn an toàn CSDL Sở | Đã có màn hình `/setting/users` với logic khóa admin | MISSING | — |\n| CH-02 | Quản lý tài khoản người dùng, phân quyền RBAC đa cấp | Đã có danh sách tài khoản và modal phân quyền | MISSING | — |\n\n## Liên quan\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Khái niệm kiểm duyệt 2 cấp](../concepts/rbac-two-tier-moderation.md)\n- [Màn hình quản trị tài khoản](../screens/m6-sm2-tai-khoan.md)\n"}, {"path": "pages/flows/fl-thiet-lap-mien-giam.md", "title": "Luồng Thiết Lập Chính Sách Miễn Giảm Học Phí", "type": "flow", "group": "flows", "fm": {"title": "Luồng Thiết Lập Chính Sách Miễn Giảm Học Phí", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-09", "TC-10"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Thiết Lập Chính Sách Miễn Giảm Học Phí\n\n## Mục tiêu\nCho phép ban giám hiệu hoặc kế toán viên thiết lập các chính sách ưu đãi học phí cho từng đối tượng học sinh hoặc theo lớp học, kiểm soát trùng lặp chính sách và bảo đảm quyền lợi tối đa cho học sinh.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Kế toán / BGH | [Màn hình miễn giảm](../screens/m4-sm8-mien-giam.md) | Mở modal tạo mới chính sách thông thường (theo lớp/học sinh) hoặc cấu hình chính sách hệ thống Sibling Discount ưu đãi anh chị em ruột (`SIBLING_DISCOUNT` - OQ-23) | Hệ thống xác định danh sách học sinh thụ hưởng hoặc kích hoạt quy tắc phân bậc gia đình | TC-09 |\n| 2 | Kế toán / BGH | [Màn hình miễn giảm](../screens/m4-sm8-mien-giam.md) | Chọn khoản phí áp dụng (tính theo tập giao các khoản phí của các nhóm đã chọn) và nhập mức giảm (`%` hoặc tiền mặt `đ`) | Hệ thống kiểm tra trùng lặp với các chính sách hiện hành | TC-10 |\n| 3 | Kế toán / BGH | [Màn hình miễn giảm](../screens/m4-sm8-mien-giam.md) | Nếu phát hiện trùng lặp, tích xác nhận checkbox thay thế và bấm \"Lưu chính sách\" | Chính sách được kích hoạt, loại trừ học sinh khỏi chính sách cũ | TC-09 |\n\n## Quy tắc chặn / validation\n- Nút \"Lưu chính sách\" bị chặn và vô hiệu hóa nếu phát hiện học sinh bị trùng lặp chính sách cho cùng một khoản phí mà người dùng chưa tích vào checkbox xác nhận thay thế (TC-09).\n- Mức giảm theo phần trăm không được vượt quá 100%; mức giảm theo tiền mặt không được là số âm (TC-10).\n- **Chính sách ưu đãi anh/chị/em ruột Sibling Discount (OQ-23):**\n  - Tự động nhóm học sinh theo số điện thoại chính của phụ huynh (`primary_phone`) kết hợp CCCD phụ huynh trong Hồ sơ học sinh 360, sắp xếp thứ tự theo ngày sinh `dob` (con 1 sinh trước, con 2, con 3).\n  - Cấu hình bậc giảm: Bậc 1 (con thứ 1: 0%), Bậc 2 (con thứ 2: giảm $X\\%$), Bậc 3+ (con thứ 3 trở đi: giảm $Y\\%$).\n  - Điều kiện áp dụng: Con thứ 2/thứ 3 chỉ được giảm khi người anh/chị lớn hơn đang có trạng thái học tập `ACTIVE`.\n  - Vòng đời cập nhật động: Khi người con lớn tốt nghiệp hoặc thôi học/chuyển trường (`GRADUATED`, `TRANSFERRED_OUT`, `WITHDRAWN`, `ARCHIVED`), hệ thống tự động đánh giá lại số con `ACTIVE` và hạ bậc ưu đãi ở kỳ lập hóa đơn tiếp theo (M+1), ghi log kiểm toán `DiscountAuditTrail`.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-09 | Cảnh báo và yêu cầu xác nhận khi tạo chính sách miễn giảm trùng lặp đối tượng | Modal tạo mới chính sách chưa có kiểm tra tập giao và cảnh báo trùng lặp | MISSING | repo:app/src/features/finance/ |\n| TC-10 | Hỗ trợ giảm trừ linh hoạt theo `%` hoặc tiền mặt `đ` kèm dấu chấm phân cách hàng nghìn | Chưa có toggle chuyển đổi đơn vị và định dạng số phân cách hàng nghìn | MISSING | repo:app/src/features/finance/ |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Chính sách miễn giảm](../entities/discount-policy.md)\n- [Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md)\n- [Màn hình miễn giảm](../screens/m4-sm8-mien-giam.md)\n"}, {"path": "pages/flows/fl-tiep-nhan-xu-ly-gop-y.md", "title": "Luồng Tiếp Nhận, Phân Luồng & Xử Lý Góp Ý Khiếu Nại", "type": "flow", "group": "flows", "fm": {"title": "Luồng Tiếp Nhận, Phân Luồng & Xử Lý Góp Ý Khiếu Nại", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-028-school-parent-feedback/epic.md"], "spec_ids": ["NT-12"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Tiếp Nhận, Phân Luồng & Xử Lý Góp Ý Khiếu Nại\n\n## Mục tiêu\nThiết lập kênh giao tiếp chính quy, bảo mật và văn minh giữa phụ huynh với Ban Giám Hiệu, đảm bảo mọi thắc mắc, phản ánh dịch vụ hoặc sự cố học đường đều được xử lý đúng người, đúng thời hạn.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\n| 1 | Phụ huynh | App Mobile | Soạn ý kiến phản hồi, chọn phân loại (Ăn uống, Giáo viên, Xe buýt...), đính kèm ảnh bằng chứng | Gửi góp ý vào hòm thư điện tử |\n| 2 | Cán bộ tiếp nhận (BGH) | Web Admin | Mở hòm thư Góp ý, đọc nội dung và đánh giá mức độ ưu tiên (Khẩn cấp / Cao / Thường) | Phân loại khiếu nại |\n| 3 | Cán bộ tiếp nhận | Web Admin | Phân công nhân sự phụ trách (`assignee`) kèm thời hạn chót giải quyết | Nhân sự phụ trách nhận được việc |\n| 4 | Nhân sự xử lý | Web Admin / Trực tiếp | Kiểm tra xác minh sự việc, liên hệ phụ huynh giải quyết và nhập nội dung giải trình | Cập nhật tiến độ xử lý |\n| 5 | Ban Giám Hiệu | Web Admin | Đóng góp ý và gửi thông báo phản hồi kết quả giải quyết chính thức tới phụ huynh | Đóng hồ sơ góp ý thành công |\n\n## Quy tắc chặn / validation\n- Các khiếu nại được đánh dấu `URGENT` (Khẩn cấp liên quan đến sức khỏe y tế hoặc an toàn bạo lực học đường) phải được phản hồi bước đầu trong vòng tối đa 2 giờ làm việc.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-12 | Hòm thư tiếp nhận và xử lý góp ý, phản hồi khiếu nại của phụ huynh học sinh | Hòm thư phản hồi phụ huynh, phân loại độ ưu tiên và modal phản hồi | MISSING | repo:app/src/pages/[schoolCode]/school/feedback/index.tsx:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Thực thể Góp ý & Khiếu nại Phụ huynh](../entities/parent-feedback.md)\n- [Màn hình hòm thư góp ý](../screens/m5-sm11-gop-y.md)\n"}, {"path": "pages/overview/module-academics.md", "title": "Phân Hệ Học Tập & Học Vụ", "type": "overview", "group": "overview", "fm": {"title": "Phân Hệ Học Tập & Học Vụ", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Phân Hệ Học Tập & Học Vụ\n\n## Tóm tắt\nPhân hệ Học tập hỗ trợ giáo viên và cán bộ học vụ quản trị chương trình giảng dạy, lịch trình thời khóa biểu tuần, giao và chấm bài tập về nhà, cùng sổ điểm đánh giá định kỳ theo quy chuẩn của Bộ GD&ĐT.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Thực thể | [Thời khóa biểu tuần](../entities/timetable-weekly.md), [Bài tập về nhà](../entities/homework-assignment.md), [Sổ điểm đánh giá](../entities/gradebook-record.md), [Môn học](../entities/school-subject.md) |\n| Khái niệm | [Chuẩn đánh giá học sinh Bộ GD&ĐT](../concepts/curriculum-assessment-standard.md), [Điều phối lịch học ngoại khóa](../concepts/extracurricular-billing-scheduling.md) |\n| Luồng | [Lập thời khóa biểu](../flows/fl-lap-thoi-khoa-bieu.md), [Nhập sổ điểm](../flows/fl-nhap-so-diem.md), [Giao bài tập về nhà](../flows/fl-giao-bai-tap-ve-nha.md) |\n| Màn hình | [Thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md), [Bài tập](../screens/m3-sm2-bai-tap.md), [Sổ điểm](../screens/m3-sm3-diem-danh-gia.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Nhà trường](module-school-admin.md)\n- [Phân hệ Vận hành](module-operations.md)\n"}, {"path": "pages/overview/module-auth.md", "title": "Phân Hệ Đăng Nhập & Xác Thực", "type": "overview", "group": "overview", "fm": {"title": "Phân Hệ Đăng Nhập & Xác Thực", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-open-questions-resolutions.md", "pages/sources/src-prd-dang-nhap-xac-thuc.md", "pages/sources/src-legacy-operating-portal-guide.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Phân Hệ Đăng Nhập & Xác Thực\n\n## Tóm tắt\nPhân hệ Đăng nhập & Xác thực đảm nhiệm định danh người dùng theo ngữ cảnh trường học đa trường `{schoolCode}`, hỗ trợ đăng nhập mật khẩu truyền thống và đăng nhập một lần (SSO) từ Managing Portal, chống dò mật khẩu Brute-force, cấp phát và thu hồi phiên JWT an toàn, quản trị tác vụ tài khoản cá nhân, cùng ma trận phân quyền Role-Based Access Control (RBAC) 3 cấp độ bảo vệ toàn bộ tài nguyên API và giao diện.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Thực thể | [Phiên đăng nhập & RBAC](../entities/auth-session.md) |\n| Khái niệm | [Cơ chế cô lập đa trường học](../concepts/multi-tenancy-isolation.md) |\n| Luồng | [Đăng nhập đa trường](../flows/fl-dang-nhap-da-truong.md) |\n| Màn hình | [Đăng nhập](../screens/m7-sm2-dang-nhap.md), [Tài khoản cá nhân & Thông báo](../screens/m7-sm1-khac.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Cơ chế cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n- [Phân hệ Cấu hình](module-settings.md)\n"}, {"path": "pages/overview/module-finance.md", "title": "Phân Hệ Tài Chính & Học Phí", "type": "overview", "group": "overview", "fm": {"title": "Phân Hệ Tài Chính & Học Phí", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md", "pages/sources/src-prd-co-che-hoan-tien.md", "pages/sources/src-prd-mien-giam-hoc-phi.md", "pages/sources/src-development-epics-manifest.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Phân Hệ Tài Chính & Học Phí\n\n## Tóm tắt\nPhân hệ Tài chính là trụ cột kế toán trường học, tự động hóa quy trình phát hành hóa đơn học phí với mã VietQR động, đối soát khấu trừ tiền ăn bán trú theo điểm danh tháng trước, quản lý danh mục 24 khoản thu, cấu hình biểu phí từng lớp, theo dõi phiếu chi nội bộ, chính sách miễn giảm học phí linh hoạt và chuẩn hóa Danh mục thu liên thông với CSDL Sở Giáo Dục & Đào Tạo.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Thực thể | [Hóa đơn học phí](../entities/tuition-invoice.md), [Danh mục khoản phí](../entities/fee-catalog-item.md), [Chính sách miễn giảm](../entities/discount-policy.md), [Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md), [Phiếu chi nội bộ](../entities/expense-voucher.md), [Danh mục thu CSDL Sở](../entities/revenue-category.md), [Phiên đối soát giao dịch](../entities/reconciliation-session.md) |\n| Khái niệm | [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md), [Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md), [Kiến trúc VietQR và đối soát](../concepts/vietqr-dynamic-reconciliation.md), [Tích hợp CSDL Sở](../concepts/csdl-so-integration.md), [Điều phối ngoại khóa & Phân rã](../concepts/extracurricular-billing-scheduling.md) |\n| Luồng | [Lập và phát hành hóa đơn](../flows/fl-lap-phat-hanh-hoa-don.md), [Báo vắng hoàn tiền](../flows/fl-bao-vang-hoan-tien.md), [Thiết lập miễn giảm](../flows/fl-thiet-lap-mien-giam.md), [Đối soát giao dịch](../flows/fl-doi-soat-giao-dich.md), [Lập duyệt phiếu chi](../flows/fl-lap-duyet-phieu-chi.md), [Đồng bộ danh mục thu](../flows/fl-dong-bo-danh-muc-thu.md) |\n| Màn hình | [Hóa đơn học phí](../screens/m4-sm1-hoc-phi.md), [Đối soát](../screens/m4-sm2-doi-soat.md), [Khoản phí](../screens/m4-sm3-khoan-phi.md), [Quản lý học phí](../screens/m4-sm4-quan-ly-hoc-phi.md), [Khoản chi](../screens/m4-sm5-khoan-chi.md), [Báo cáo học phí](../screens/m4-sm6-bao-cao-hoc-phi.md), [Danh mục thu](../screens/m4-sm7-danh-muc-thu.md), [Miễn giảm](../screens/m4-sm8-mien-giam.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Vận hành](module-operations.md)\n- [Phân hệ Cấu hình](module-settings.md)\n"}, {"path": "pages/overview/module-operations.md", "title": "Phân Hệ Vận Hành Trường Học", "type": "overview", "group": "overview", "fm": {"title": "Phân Hệ Vận Hành Trường Học", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Phân Hệ Vận Hành Trường Học\n\n## Tóm tắt\nPhân hệ Vận hành số hóa các hoạt động thường nhật của lớp học và trường học: Điểm danh đón/trả học sinh 1-chạm, kiểm soát thân nhiệt dấu hiệu sức khỏe, xác thực người đón hộ, báo vắng và kích hoạt hoàn tiền ăn, bảng tin hoạt động lớp, thư viện ảnh AI và kênh trò chuyện trực tiếp với phụ huynh.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Thực thể | [Điểm danh hằng ngày](../entities/attendance-daily.md), [Bảng tin hoạt động lớp](../entities/class-activity.md), [Thư viện media](../entities/media-album.md), [Tin nhắn trao đổi](../entities/conversation-thread.md), [Đơn xin nghỉ học](../entities/student-absence-request.md) |\n| Khái niệm | [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md), [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md) |\n| Luồng | [Điểm danh đón trả](../flows/fl-diem-danh-don-tra.md), [Báo vắng hoàn tiền](../flows/fl-bao-vang-hoan-tien.md), [Đăng bài kiểm duyệt](../flows/fl-dang-bai-kiem-duyet.md), [Nhận diện album ảnh](../flows/fl-nhan-dien-album-anh.md), [Nộp đơn xin nghỉ học](../flows/fl-don-xin-nghi-hoc.md) |\n| Màn hình | [Điểm danh](../screens/m2-sm1-diem-danh.md), [Hoạt động](../screens/m2-sm2-hoat-dong.md), [Thư viện](../screens/m2-sm3-thu-vien.md), [Trao đổi](../screens/m2-sm4-trao-doi.md), [Báo cáo điểm danh](../screens/m2-sm5-bao-cao-diem-danh.md), [Báo cáo mở rộng](../screens/m2-sm6-bao-cao-mo-rong.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Nhà trường](module-school-admin.md)\n- [Phân hệ Tài chính](module-finance.md)\n"}, {"path": "pages/overview/module-overview.md", "title": "Phân Hệ Tổng Quan Điều Hành", "type": "overview", "group": "overview", "fm": {"title": "Phân Hệ Tổng Quan Điều Hành", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Phân Hệ Tổng Quan Điều Hành\n\n## Tóm tắt\nPhân hệ Tổng quan cung cấp bức tranh toàn cảnh về hoạt động vận hành, học tập và tài chính của nhà trường theo thời gian thực. Đối tượng sử dụng chính là Ban Giám Hiệu, Hiệu trưởng và Quản trị viên cấp cao.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Màn hình | [Màn hình tổng quan](../screens/m1-sm1-tong-quan.md) |\n| Thực thể liên quan | [Hồ sơ học sinh 360](../entities/student-profile.md), [Điểm danh](../entities/attendance-daily.md), [Hóa đơn](../entities/tuition-invoice.md) |\n| Nguồn | [PRD Tổng thể](../sources/src-prd-school-operating-portal.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Vận hành](module-operations.md)\n- [Phân hệ Tài chính](module-finance.md)\n"}, {"path": "pages/overview/module-school-admin.md", "title": "Phân Hệ Quản Trị Nhà Trường", "type": "overview", "group": "overview", "fm": {"title": "Phân Hệ Quản Trị Nhà Trường", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Phân Hệ Quản Trị Nhà Trường\n\n## Tóm tắt\nPhân hệ Nhà trường quản trị toàn bộ dữ liệu gốc của cơ sở giáo dục: Danh bạ học sinh 360°, giáo viên & nhân viên, phân công kiểm duyệt bài viết, quản trị lớp học (chính khóa/ngoại khóa) kèm chốt chặn an toàn khi xóa lớp, môn học, khối lớp, truyền thông bảng tin, khảo sát bình chọn, thực đơn dinh dưỡng, chấm công nhân viên, sổ tay phụ huynh, hòm thư góp ý, lịch sự kiện, niên khóa và kho lưu trữ.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Thực thể | [Hồ sơ học sinh 360](../entities/student-profile.md), [Giáo viên & Nhân viên](../entities/teacher-staff.md), [Lớp học](../entities/classroom.md), [Niên khóa & Học kỳ](../entities/academic-year.md), [Bảng thông tin](../entities/school-announcement.md), [Khảo sát & Bình chọn](../entities/school-poll.md), [Thực đơn dinh dưỡng tuần](../entities/weekly-menu.md), [Lịch sự kiện](../entities/calendar-event.md), [Môn học](../entities/school-subject.md), [Khối lớp](../entities/grade-level.md), [Sổ tay phụ huynh](../entities/parent-handbook.md), [Góp ý & Khiếu nại](../entities/parent-feedback.md), [Điểm danh nhân sự](../entities/staff-attendance.md), [Hồ sơ lưu trữ học sinh](../entities/student-archive-record.md) |\n| Khái niệm | [Chốt chặn an toàn khi xóa lớp](../concepts/class-deletion-guard.md), [Cơ chế kiểm duyệt 2 cấp](../concepts/rbac-two-tier-moderation.md), [Vòng đời chuyển tiếp học sinh](../concepts/student-lifecycle-transitions.md), [Điều phối ngoại khóa](../concepts/extracurricular-billing-scheduling.md) |\n| Luồng | [Quản lý hồ sơ học sinh 360](../flows/fl-quan-ly-ho-so-hoc-sinh-360.md), [Chuyển lớp và chuyển năm học](../flows/fl-chuyen-lop-va-chuyen-nam-hoc.md), [Phân công giáo viên](../flows/fl-phan-cong-giao-vien-kiem-duyet.md), [Khảo sát bình chọn](../flows/fl-khao-sat-binh-chon.md), [Lập thực đơn dinh dưỡng](../flows/fl-lap-thuc-don-dinh-duong.md), [Tiếp nhận và xử lý góp ý](../flows/fl-tiep-nhan-xu-ly-gop-y.md), [Điểm danh chấm công nhân viên](../flows/fl-diem-danh-cham-cong-nv.md), [Kho lưu trữ học sinh](../flows/fl-kho-luu-tru-hoc-sinh.md) |\n| Màn hình | [Học sinh](../screens/m5-sm1-hoc-sinh.md), [Giáo viên](../screens/m5-sm2-giao-vien.md), [Lớp học](../screens/m5-sm3-lop-hoc.md), [Môn học](../screens/m5-sm4-mon-hoc.md), [Khối lớp](../screens/m5-sm5-khoi-lop.md), [Bảng thông tin](../screens/m5-sm6-bang-thong-tin.md), [Bình chọn](../screens/m5-sm7-binh-chon.md), [Thực đơn](../screens/m5-sm8-thuc-don.md), [Điểm danh NV](../screens/m5-sm9-diem-danh-nv.md), [Sổ tay PH](../screens/m5-sm10-so-tay-ph.md), [Góp ý](../screens/m5-sm11-gop-y.md), [Lịch sự kiện](../screens/m5-sm12-lich-su-kien.md), [Năm học](../screens/m5-sm13-nam-hoc.md), [Lưu trữ](../screens/m5-sm14-luu-tru.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Vận hành](module-operations.md)\n- [Phân hệ Học tập](module-academics.md)\n"}, {"path": "pages/overview/module-settings.md", "title": "Phân Hệ Cấu Hình Hệ Thống", "type": "overview", "group": "overview", "fm": {"title": "Phân Hệ Cấu Hình Hệ Thống", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "pages/sources/src-legacy-operating-portal-guide.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Phân Hệ Cấu Hình Hệ Thống\n\n## Tóm tắt\nPhân hệ Cấu hình trao quyền cho Quản trị viên cấp cao thiết lập các thông số vận hành nền tảng: Thông tin pháp lý & thương hiệu nhà trường, quản trị tài khoản người dùng, hồ sơ cá nhân và đổi mật khẩu, tham số tính toán học phí & hoàn tiền ăn, mô hình AI nhận diện khuôn mặt, bật/tắt tính năng theo gói bản quyền và ma trận quy tắc gửi thông báo đa kênh.\n\n## Bản đồ\n| Nhóm | Trang |\n|---|---|\n| Thực thể | [Hồ sơ trường học](../entities/school-profile.md), [Giáo viên & Nhân viên](../entities/teacher-staff.md), [Phiên đăng nhập](../entities/auth-session.md), [Hồ sơ nhận diện khuôn mặt](../entities/face-biometric-registration.md) |\n| Khái niệm | [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md), [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md), [Kiến trúc giao diện & Hệ thống Token](../concepts/design-system-tokens-principles.md) |\n| Luồng | [Đăng ký sinh trắc khuôn mặt](../flows/fl-dang-ky-sinh-trac-khuon-mat.md), [Quản trị tài khoản đa vai trò](../flows/fl-quan-tri-tai-khoan-phan-quyen.md) |\n| Màn hình | [Trường học](../screens/m6-sm1-truong.md), [Tài khoản](../screens/m6-sm2-tai-khoan.md), [Tham số học phí](../screens/m6-sm3-hoc-phi.md), [Nhận diện AI](../screens/m6-sm4-nhan-dien.md), [Tính năng](../screens/m6-sm5-tinh-nang.md), [Thông báo](../screens/m6-sm6-thong-bao.md), [Lịch sử giao dịch Sepay](../screens/m6-sm7-lich-su-thanh-toan.md), [Tài khoản cá nhân & Thông báo](../screens/m7-sm1-khac.md) |\n\n## Liên quan\n- [Tổng quan dự án](project-overview.md)\n- [Phân hệ Tài chính](module-finance.md)\n- [Phân hệ Đăng nhập](module-auth.md)\n"}, {"path": "pages/overview/project-overview.md", "title": "Tổng Quan Hệ Thống School Operating Portal", "type": "overview", "group": "overview", "fm": {"title": "Tổng Quan Hệ Thống School Operating Portal", "type": "overview", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-open-questions-resolutions.md", "pages/sources/src-prd-dang-nhap-xac-thuc.md", "pages/sources/src-prd-co-che-hoan-tien.md", "pages/sources/src-prd-mien-giam-hoc-phi.md", "pages/sources/src-development-epics-manifest.md", "pages/sources/src-legacy-operating-portal-guide.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Tổng Quan Hệ Thống School Operating Portal\n\n## Tóm tắt\nSchool Operating Portal là nền tảng quản trị và vận hành giáo dục đa trường (Multi-tenant) chuẩn doanh nghiệp, phục vụ các cơ sở Mầm non và Phổ thông liên cấp (K-12). Hệ thống hợp nhất 4 trụ cột nghiệp vụ cốt lõi: Vận hành trường học hằng ngày (điểm danh, y tế, ảnh AI, trò chuyện), Học tập & Học vụ (thời khóa biểu, bài tập, sổ điểm), Tài chính kế toán (hóa đơn VietQR, khấu trừ hoàn tiền ăn tự động, miễn giảm, đối soát ngân hàng, danh mục thu CSDL Sở) và Quản trị nhà trường (hồ sơ học sinh 360°, giáo viên, lớp học, niên khóa, bình chọn, thực đơn, hòm thư góp ý, chấm công nhân viên).\n\n## Bản đồ\n| Tiền tố | Phân hệ nghiệp vụ | Trang đầu mối (Hub) |\n|---|---|---|\n| `TQ` | Tổng quan điều hành | [Phân hệ Tổng quan](module-overview.md) |\n| `VH` | Vận hành trường học | [Phân hệ Vận hành](module-operations.md) |\n| `HT` | Học tập & Học vụ | [Phân hệ Học tập](module-academics.md) |\n| `TC` | Tài chính & Học phí | [Phân hệ Tài chính](module-finance.md) |\n| `NT` | Quản trị nhà trường | [Phân hệ Nhà trường](module-school-admin.md) |\n| `CH` | Cấu hình hệ thống | [Phân hệ Cấu hình](module-settings.md) |\n| `DN` | Đăng nhập & Phân quyền | [Phân hệ Đăng nhập & Xác thực](module-auth.md) |\n\n### Tài liệu nguồn cốt lõi\n- [PRD Cổng Vận Hành Trường Học](../sources/src-prd-school-operating-portal.md)\n- [Khung Kiến Trúc Kỹ Thuật Nền Tảng](../sources/src-tech-architecture-blueprint.md)\n- [Bảng Câu Hỏi Mở & Quyết Định](../sources/src-open-questions-resolutions.md)\n- [Đặc Tả Đăng Nhập & Xác Thực](../sources/src-prd-dang-nhap-xac-thuc.md)\n- [Đặc Tả Cơ Chế Hoàn Tiền Khi Nghỉ Học](../sources/src-prd-co-che-hoan-tien.md)\n- [Đặc Tả Cơ Chế Miễn Giảm Học Phí](../sources/src-prd-mien-giam-hoc-phi.md)\n- [Đặc Tả Bộ Hồ Sơ Kỹ Thuật 35 Epics & Prototype](../sources/src-development-epics-manifest.md)\n- [Đặc Tả Khảo Sát Hệ Thống Cũ (Legacy Portal QLTH)](../sources/src-legacy-operating-portal-guide.md)\n- [Đặc Tả 33 Quyết Định Kiến Trúc (ADR)](../sources/src-adr-architectural-decisions.md)\n- [Đặc Tả Kho Tri Thức Kỹ Thuật & Danh Mục Anti-Pattern](../sources/src-knowledge-base-standards.md)\n- [Đặc Tả Bảng Đối Soát Mâu Thuẫn Nghiệp Vụ (K001–K057)](../sources/src-planning-contradictions-matrix.md)\n- [Đặc Tả Bộ Hồ Sơ Thiết Kế Kế Hoạch (Screens, Flows, Diagrams)](../sources/src-planning-blueprints-flows-screens.md)\n- [Đặc Tả Hệ Thống Thiết Kế Giao Diện (ECO Design System)](../sources/src-portal-design-system.md)\n- [Đặc Tả Bộ Hồ Sơ Kế Hoạch SEPO (VOI, AP, ISP)](../sources/src-sepo-architecture-implementation-plan.md)\n\n### Khái niệm kiến trúc then chốt\n- [Cơ chế cô lập đa trường học (Multi-Tenancy)](../concepts/multi-tenancy-isolation.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Chốt chặn an toàn khi xóa lớp](../concepts/class-deletion-guard.md)\n- [Cơ chế kiểm duyệt bài viết 2 cấp & Phân quyền RBAC](../concepts/rbac-two-tier-moderation.md)\n- [Kiến trúc thanh toán VietQR động & Đối soát tự động](../concepts/vietqr-dynamic-reconciliation.md)\n- [Kiến trúc tích hợp Cơ sở dữ liệu Bộ/Sở GD&ĐT (CSDL Sở)](../concepts/csdl-so-integration.md)\n- [Chuẩn đánh giá & Xếp loại học sinh Bộ GD&ĐT](../concepts/curriculum-assessment-standard.md)\n- [Vòng đời chuyển tiếp học sinh](../concepts/student-lifecycle-transitions.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Kiến trúc giao diện & Hệ thống Token](../concepts/design-system-tokens-principles.md)\n\n## Liên quan\n- [Mục lục toàn bộ tài liệu](../../index.md)\n- [Hợp đồng tài liệu SCHEMA](../../SCHEMA.md)\n- [Nhật ký thay đổi](../../log.md)\n"}, {"path": "pages/screens/m1-sm1-tong-quan.md", "title": "Màn Hình Tổng Quan Điều Hành", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Tổng Quan Điều Hành", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["TQ-01", "TQ-02", "TQ-03"], "apps": ["web"], "route_ids": ["/{schoolCode}/"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Màn Hình Tổng Quan Điều Hành\n\n## Mục đích\nCung cấp bảng điều khiển trung tâm (Dashboard) cho Ban Giám Hiệu và Quản trị viên, hiển thị tổng hợp chỉ số học sinh, giáo viên, tỷ lệ điểm danh hôm nay và biểu đồ thu nộp học phí toàn trường.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/` | repo:app/src/pages/[schoolCode]/index.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| TQ-01 | Dashboard hiển thị tổng quan số liệu sĩ số học sinh, giáo viên, lớp học theo thời gian thực | MISSING |\n| TQ-02 | Thống kê tỷ lệ điểm danh học sinh trong ngày (có mặt, vắng có phép, vắng không phép) | MISSING |\n| TQ-03 | Biểu đồ thu nộp học phí và tiến độ nộp theo tháng/học kỳ toàn trường | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TQ-01 | Dashboard hiển thị tổng quan số liệu sĩ số học sinh, giáo viên, lớp học theo thời gian thực | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/index.tsx |\n| TQ-02 | Thống kê tỷ lệ điểm danh học sinh trong ngày (có mặt, vắng có phép, vắng không phép) | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/index.tsx |\n| TQ-03 | Biểu đồ thu nộp học phí và tiến độ nộp theo tháng/học kỳ toàn trường | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/index.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-overview.md)\n- [Thực thể liên quan](../entities/student-profile.md)\n- [Thực thể liên quan](../entities/attendance-daily.md)\n- [Thực thể liên quan](../entities/tuition-invoice.md)\n"}, {"path": "pages/screens/m2-sm1-diem-danh.md", "title": "Màn Hình Điểm Danh Học Sinh", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Điểm Danh Học Sinh", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-01", "VH-02", "VH-03", "VH-04", "VH-10"], "apps": ["web"], "route_ids": ["/{schoolCode}/operations/attendance"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 5}}, "open": 0, "body": "# Màn Hình Điểm Danh Học Sinh\n\n## Mục đích\nCho phép giáo viên điểm danh Đón/Trả 1-chạm theo lớp (chính khóa và ngoại khóa), đo thân nhiệt, quản lý Sổ dặn thuốc y tế và xác nhận uống thuốc trưa (OQ-19), ghi nhận Đến muộn (kèm toggle báo suất ăn với bếp) và Đón sớm giữa buổi (không hoàn tiền ăn - OQ-20), xác thực người đón hộ, báo vắng phân loại có phép/không phép, xử lý đón về nửa ngày do y tế (`half_day_leave` hoàn 50% tiền ăn), kích hoạt chốt chặn giữ trẻ tạm thời bảo vệ pháp lý (`unclaimed_child_flag`) ngoài giờ sau 17:30, hiển thị Cảnh báo đỏ toàn màn hình (Red Modal Alert & Audio) tranh chấp giám hộ (`restricted_guardians` - OQ-16), và tự động khóa sổ đóng băng chỉ đọc vào ngày cuối tháng trước kỳ tính phí (Monthly Auto-Freeze - OQ-21).\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/operations/attendance` | repo:app/src/pages/[schoolCode]/operations/attendance.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| VH-01 | Điểm danh đón và trả học sinh 1-chạm (lớp ngoại khóa OQ-14, đến muộn/đón sớm không hoàn tiền OQ-20, tự động đóng băng sổ cuối tháng OQ-21) | MISSING |\n| VH-02 | Ghi nhận thân nhiệt, cảnh báo dấu hiệu sức khỏe y tế bất thường và quản lý Sổ dặn thuốc y tế, xác nhận uống thuốc trưa (OQ-19) | MISSING |\n| VH-03 | Xác thực người đón hộ, chốt chặn ngoài giờ và chốt chặn an toàn tranh chấp giám hộ Red Alert (OQ-16) | MISSING |\n| VH-04 | Báo vắng học sinh hàng loạt và phân loại vắng có phép hoặc không phép | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-01 | Điểm danh đón/trả 1-chạm, ghi nhận đến muộn/đón sớm và tự động khóa sổ cuối tháng | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/operations/attendance.tsx |\n| VH-02 | Ghi nhận thân nhiệt và quản lý sổ dặn thuốc y tế, xác nhận đã cho uống thuốc lúc HH:mm | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/operations/attendance.tsx |\n| VH-03 | Xác thực người đón hộ học sinh từ danh sách người đưa đón hợp lệ đã đăng ký | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/operations/attendance.tsx |\n| VH-04 | Báo vắng học sinh hàng loạt và phân loại vắng có phép hoặc không phép | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/operations/attendance.tsx |\n| VH-10 | Cơ chế cập nhật lạc quan (optimistic update) khi điểm danh và tự động hoàn tác thông báo lỗi khi mất mạng | Xử lý state cục bộ, chưa có cơ chế retry queue và hoàn tác lỗi mạng | MISSING | repo:app/src/pages/[schoolCode]/operations/attendance.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-02, OQ-10, OQ-14, OQ-16, OQ-19, OQ-20, OQ-21).\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Thực thể Điểm danh hằng ngày](../entities/attendance-daily.md)\n- [Thực thể Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Luồng điểm danh đón trả](../flows/fl-diem-danh-don-tra.md)\n- [Luồng báo vắng và hoàn tiền](../flows/fl-bao-vang-hoan-tien.md)\n"}, {"path": "pages/screens/m2-sm2-hoat-dong.md", "title": "Màn Hình Nhật Ký Hoạt Động Lớp", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Nhật Ký Hoạt Động Lớp", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["VH-05"], "apps": ["web"], "route_ids": ["/{schoolCode}/operations/activity"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Nhật Ký Hoạt Động Lớp\n\n## Mục đích\nGhi nhận và xuất bản nhật ký hoạt động hằng ngày của lớp học kèm hình ảnh, gắn hashtag chủ đề và nhắc tên học sinh với cơ chế duyệt 2 cấp.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/operations/activity` | repo:app/src/pages/[schoolCode]/operations/activity.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| VH-05 | Đăng bài hoạt động lớp hỗ trợ gắn hashtag `#` chủ đề và nhắc tên học sinh `@` | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-05 | Đăng bài hoạt động lớp hỗ trợ gắn hashtag `#` chủ đề và nhắc tên học sinh `@` | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/operations/activity.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-operations.md)\n- [Thực thể liên quan](../entities/class-activity.md)\n- [Thực thể liên quan](../entities/teacher-staff.md)\n- [Luồng liên quan](../flows/fl-dang-bai-kiem-duyet.md)\n"}, {"path": "pages/screens/m2-sm3-thu-vien.md", "title": "Màn Hình Thư Viện Media & AI", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Thư Viện Media & AI", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-06"], "apps": ["web"], "route_ids": ["/{schoolCode}/operations/media"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Thư Viện Media & AI\n\n## Mục đích\nQuản lý album hình ảnh và video sự kiện của lớp và toàn trường, ứng dụng AI nhận diện khuôn mặt tự động gắn thẻ học sinh, đồng thời hỗ trợ chế độ bảo vệ quyền riêng tư sinh trắc học `opt_out_face_ai` (tự động làm mờ mặt và gắn biểu tượng lá chắn bảo vệ theo Nghị định 13/2023/NĐ-CP - OQ-16).\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/operations/media` | repo:app/src/pages/[schoolCode]/operations/media.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| VH-06 | Thư viện media tự động gắn thẻ khuôn mặt học sinh bằng AI và tôn trọng cờ opt-out quyền riêng tư (OQ-16) | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-06 | Thư viện media tự động gắn thẻ khuôn mặt học sinh trong ảnh lớp bằng AI | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/operations/media.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-04, OQ-16).\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Thực thể Thư viện media](../entities/media-album.md)\n- [Thực thể Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Luồng nhận diện album ảnh](../flows/fl-nhan-dien-album-anh.md i | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-03 | Nhập sổ điểm và đánh giá định kỳ theo quy chuẩn chuẩn hóa của Bộ GD&ĐT | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/academics/gradebook.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-academics.md)\n- [Chuẩn đánh giá học sinh MoET](../concepts/curriculum-assessment-standard.md)\n- [Thực thể liên quan](../entities/gradebook-record.md)\n- [Luồng liên quan](../flows/fl-nhap-so-diem.md)\n"}, {"path": "pages/screens/m4-sm1-hoc-phi.md", "title": "Màn Hình Hóa Đơn Học Phí", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Hóa Đơn Học Phí", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-prd-co-che-hoan-tien.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-01", "TC-02", "TC-11", "TC-12", "TC-13", "TC-14", "TC-22"], "apps": ["web"], "route_ids": ["/{schoolCode}/school/fee"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 7}}, "open": 0, "body": "# Màn Hình Hóa Đơn Học Phí\n\n## Mục đích\nQuản lý vòng đời hóa đơn học phí, tích hợp VietQR động, áp dụng chính sách miễn giảm, hiển thị công nợ kỳ trước (Carried-over Debt), tự động cấn trừ số dư tín dụng (Credit Balance), khấu trừ hoàn tiền ăn nghỉ học có phép, hỗ trợ phân rã Sub-invoice lớp ngoại khóa (OQ-14), hủy hóa đơn tương lai khi học sinh rút hồ sơ (OQ-17), xử lý giao dịch chuyển thiếu (sinh lại mã VietQR nợ) hoặc đóng băng chờ tra soát `FROZEN_UNDER_REVIEW` ngăn xuất VAT (OQ-18), lập hóa đơn học phí lẻ ngày Prorated cho học sinh nhập học giữa tháng (OQ-22), tạo hóa đơn riêng lẻ độc lập cho từng học sinh với mã VietQR riêng biệt (không gộp gia đình - OQ-22), và liên thông dữ liệu an toàn với cơ chế tự động đóng băng sổ điểm danh cuối tháng (OQ-21).\ ập bảng tổng hợp công nợ tiền ăn và phê duyệt | Redux slice quản lý state hóa đơn | MISSING | repo:app/src/store/slices/invoiceSlice.ts:1 |\n| TC-14 | Tự động kết chuyển suất hoàn tiền ăn thành dòng giảm trừ âm trên hóa đơn học phí tháng M+1 | Validation dữ liệu hóa đơn | MISSING | repo:app/src/utils/invoiceValidation.ts:1 |\n| TC-22 | Chốt chặn bảo toàn lịch sử thanh toán hóa đơn: cấm ghi đè lịch sử cũ khi có giao dịch thanh toán mới | State Redux chưa khóa lịch sử thanh toán bất biến | MISSING | repo:app/src/store/slices/invoiceSlice.ts:1 |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-02, OQ-09, OQ-14, OQ-17, OQ-18, OQ-21, OQ-22).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thực thể Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Thực thể Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Khái niệm Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Khái niệm Kiến trúc VietQR và đối soát](../concepts/vietqr-dynamic-reconciliation.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Khái niệm vòng đời học sinh](../concepts/student-lifecycle-transitions.md)\n- [Luồng lập và phát hành hóa đơn](../flows/fl-lap-phat-hanh-hoa-don.md)\n- [Luồng báo vắng và hoàn tiền](../flows/fl-bao-vang-hoan-tien.md)\n"}, {"path": "pages/screens/m4-sm2-doi-soat.md", "title": "Màn Hình Đối Soát Thanh Toán", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Đối Soát Thanh Toán", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-06"], "apps": ["web"], "route_ids": ["/{schoolCode}/finance/reconciliation"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Đối Soát Thanh Toán\n\n## Mục đích\nĐối soát unt/index.tsx:1 |\n| TC-10 | Hỗ trợ giảm trừ linh hoạt theo `%` hoặc tiền mặt `đ` kèm dấu chấm phân cách hàng nghìn | Input tiền tệ tự động format dấu chấm | MISSING | repo:app/src/pages/[schoolCode]/school/discount/index.tsx:1 |\n| TC-15 | Phân loại và cấu hình chính sách miễn giảm theo từng nhóm đối tượng học sinh | Type định nghĩa các đối tượng miễn giảm | MISSING | repo:app/src/types/discount.ts:1 |\n| TC-16 | Quy tắc giải quyết xung đột chính sách miễn giảm theo phương án hưởng ưu đãi cao nhất | Validation logic kiểm tra xung đột chính sách | MISSING | repo:app/src/utils/discountValidation.ts:1 |\n| TC-17 | Hỗ trợ phương thức giảm trừ linh hoạt theo tỷ lệ phần trăm hoặc tiền mặt cố định | Redux slice quản lý danh sách chính sách ưu đãi | MISSING | repo:app/src/store/slices/discountSlice.ts:1 |\n| TC-18 | Quy trình thẩm định, phê duyệt hồ sơ miễn giảm học phí có lưu vết kiểm toán | Mock service trả về lịch sử phê duyệt | MISSING | repo:app/src/services/mockDiscountData.ts:1 |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-03, OQ-07, OQ-23).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thực thể Chính sách miễn giảm](../entities/discount-policy.md)\n- [Khái niệm Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md)\n- [Luồng thiết lập miễn giảm](../flows/fl-thiet-lap-mien-giam.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n"}, {"path": "pages/screens/m5-sm1-hoc-sinh.md", "title": "Màn Hình Quản Lý Học Sinh", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Quản Lý Học Sinh", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["NT-01"], "apps": ["web"], "route_ids": ["/{schoolCode}/school/students"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0
