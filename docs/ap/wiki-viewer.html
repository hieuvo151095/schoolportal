<script>
const LIVE=false;let DATA={"meta": {"name": "School Operating Portal", "mode": "new", "pages": 131, "notes": 135, "links": 1109, "gaps": {"gap": {"MISSING": 176, "OK": 4}}, "open": 0, "generated": "2026-11-06 13:30", "bodies": true}, "nodes": [{"path": "OBSIDIAN.md", "title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "group": "root", "fm": {"title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "sources": ["SCHEMA.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Mở wiki bằng Obsidian để xem graph\n\nThư mục `llm-wiki/` là một **Obsidian vault** đã cấu hình sẵn trong `.obsidian/`. Trong mẫu LLM Wiki, vai trò được chia như sau: Obsidian là IDE, LLM là lập trình viên, còn wiki là codebase.\n\n## Tóm tắt\n\n1. Cài Obsidian: `brew install --cask obsidian` (macOS), hoặc tải từ obsidian.md.\n2. Mở vault: Obsidian → **Open folder as vault** → chọn `eco-school-portal/wiki`.\n3. Xem graph: `Cmd+G`. Mở một trang rồi chạy **Open local graph** để xem các trang quanh nó.\n\n## Bản đồ\n\n| Màu node | Nhóm | Thư mục |\n|---|---|---|\n| Đỏ cam | Tổng quan | `pages/overview/` |\n| Cam | Luồng nghiệp vụ | `pages/flows/` |\n| Xanh dương | Màn hình | `pages/screens/` |\n| Xanh lá | Thực thể | `pages/entities/` |\n| Tím | Khái niệm | `pages/concepts/` |\n| Xám | Nguồn đã ingest | `pages/sources/` |\n| Xám nhạt | Nguồn thô | `raw/` |\n| Đen | Điều hướng | `index.md`, `log.md`, `SCHEMA.md`, file này |\n\nCấu hình đặt sẵn:\n- Dùng link markdown tương đối, không dùng `[[wikilink]]`, khớp SCHEMA §4.3.\n- Trang mới tạo vào `pages/`; ảnh dán vào lưu ở `raw/assets/`.\n- Graph ẩn thư mục `tools/`, ẩn file đính kèm và link chưa có đích.\n- `workspace.json` (bố cục cửa sổ cá nhân) bị git bỏ qua. Các file cấu hình còn lại được commit, để cả nhóm thấy cùng một graph.\n\n## Quy tắc khi sửa trong Obsidian\n\n- Wiki do LLM sở hữu. Bạn ghi chú được, nhưng nên nhờ LLM ingest để `index.md`, `log.md` và các liên kết được cập nhật đồng bộ (SCHEMA §6).\n- **Không sửa `raw/`.**\n- Sau khi sửa tay, chạy lint: `python3 -I tools/lint_wiki.py .`\n\n## Liên quan\n\n- [Danh mục wiki](index.md)\n- [SCHEMA](SCHEMA.md)\n"}, {"path": "SCHEMA.md", "title": "SCHEMA — LLM Wiki của dự án School Operating Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 0, "body": "# SCHEMA — LLM Wiki của dự án School Operating Portal\n\n> Đây là bản thể hiện của mẫu \"LLM Wiki\" (Karpathy, gist `karpathy/442a6bf555914893e9891c11519de94f`) cho repo này. Wiki được dựng bằng skill `llm-wiki`, chế độ **new**.\n> File này là **cấu hình**: nó cho mọi agent LLM biết wiki có cấu trúc ra sao, quy ước viết trang và quy trình Ingest / Query / Lint. Bản máy đọc nằm ở `wiki.json`; `tools/lint_wiki.py` đọc file đó.\n> Người và LLM cùng chỉnh file này theo thời gian. Ngày khởi tạo: 2026-11-05.\n\n## 1. Mục đích\n\n- `llm-wiki/pages/` là **đặc tả (spec) và tài liệu sống** của những gì School Operating Portal PHẢI làm. Wiki tổng hợp từ nguồn nghiệp vụ (tài liệu BA, PRD, spec sheet, quyết định của chủ sở hữu).\n- Tính năng mới được đặc tả ở đây trước, rồi mới vào backlog của harness. Harness trỏ `sources.spec.root` vào `llm-wiki/pages/`.\n\n- Dự án **mới**: chưa có code, hoặc code mới bắt đầu. Phần thân trang mô tả hành vi **mong muốn** đã được chủ sở hữu duyệt, ghi rõ nguồn quyết định.\n- Bảng `## Khác biệt spec ↔ code` đóng vai trò **bảng theo dõi triển khai**. Ban đầu mọi mã là `MISSING`; khi code xong và verify xanh thì chuyển sang `OK`, kèm bằng chứng `repo:path:line`.\n\n- Ngôn ngữ: **tiếng Việt**. Giữ nguyên tên định danh: page id, tên file code, tên trường, enum, tên package.\n\n## 2. Ba lớp\n\n| Lớp | Đường dẫn | Ai sở hữu | Quy tắc |\n|---|---|---|---|\n| Nguồn thô (raw) | `llm-wiki/raw/` | Người dùng | **Bất biến.** LLM chỉ đọc, không sửa. Thêm nguồn mới thì thêm file mới. |\n| Wiki | `llm-wiki/pages/` | LLM | LLM tạo và sửa toàn bộ. Người đọc và góp ý. |\n| Schema | `llm-wiki/SCHEMA.md` + `wiki.json` | Người + LLM | Chỉ sửa khi đã thống nhất quy ước mới, và ghi lại thay đổi trong `log.md`. |\n\nTệp điều hướng: `llm-wiki/index.md` là danh mục theo nội dung; `llm-wiki/log.md` là nhật ký theo thời gian, chỉ ghi thêm.\n\n**Vault độc lập:** `llm-wiki/` là một Obsidian vault riêng, chỉ chứa tri thức của School Operating Portal. Không liên kết, không copy trang, không dùng chung `.obsidian/` với wiki của dự án khác. Chỉ được mượn **khuôn** (schema, tools), không mượn **nội dung**. Mọi link phải trỏ vào bên trong `llm-wiki/`, hoặc dùng tiền tố `repo:` cho file của repo này.\n\n## 3. Cấu trúc thư mục\n\n```\nllm-wiki/\n├── SCHEMA.md     ← file này\n├── wiki.json     ← cấu hình máy đọc: chế độ, tiền tố mã spec, mục bắt buộc\n├── OBSIDIAN.md   ← cách mở vault và xem graph\n├── index.md      ← danh mục mọi trang (LLM cập nhật mỗi lần ingest)\n├── log.md        ← nhật ký append-only (ingest | query | lint | decide)\n├── tools/        ← lint_wiki.py, obsidian_graph.py\n├── raw/          ← nguồn bất biến KHÔNG nằm sẵn trong repo\n│   ├── specs/    ← spreadsheet / tài liệu yêu cầu (bản gốc + export nguyên văn)\n│   └── assets/   ← ảnh dán vào từ Obsidian\n└── pages/        ← wiki do LLM sở hữu (= spec root của harness)\n    ├── overview/ ← type: overview — bức tranh tổng, hub từng phân hệ, phân quyền\n    ├── sources/  ← type: source   — tóm tắt từng nguồn đã ingest, trang quyết định\n    ├── entities/ ← type: entity   — đối tượng nghiệp vụ\n    ├── concepts/ ← type: concept  — quy tắc hoặc khái niệm xuyên phân hệ\n    ├── flows/    ← type: flow     — luồng nghiệp vụ nhiều bước\n    └── screens/  ← type: screen   — màn hình / route; ánh xạ spec → route trong code\n```\n\nKhi code bắt đầu có, tham chiếu bằng tiền tố `repo:`, ví dụ `repo:src/orders/service.ts:42`. Không copy code vào `raw/`.\n\n## 4. Quy ước trang\n\n### 4.1 Frontmatter YAML (bắt buộc)\n\n```yaml\n---\ntitle: Đơn hàng                 # tên hiển thị\ntype: entity                    # overview | source | entity | concept | flow | screen\nsources:                        # nguồn căn cứ: đường dẫn tương đối từ llm-wiki/ hoặc repo:<path>\n  - raw/specs/01-yeu-cau.md\nupdated: 2026-11-05               # ngày LLM sửa gần nhất (YYYY-MM-DD)\n---\n```\n\nTrường tuỳ chọn:\n- `spec_ids`: danh sách mã yêu cầu, xem §5.\n- `apps`: các app liên quan.\n- `route_ids`: chỉ cho `screen`.\n- `status` (`implemented | partial | missing | extra`): chỉ cho `screen`.\n- `aliases`.\n\n### 4.2 Đặt tên file\n\n- Tên file: **tiếng Anh**, `kebab-case`, ngắn và gợi tả, ví dụ `sales-order.md`, `outlet-debt.md`, `order-list.md`. Tiêu đề (`title:`) viết bằng ngôn ngữ của wiki.\n- File dẫn hướng có tên cố định: `pages/overview/project-overview.md` (tổng quan), `pages/overview/module-<tên>.md` (hub từng phân hệ), `pages/sources/<module>-decisions-YYYY-MM-DD.md` (quyết định).\n- Một khái niệm là một trang. Trước khi tạo trang mới, tìm trong `index.md` xem đã có chưa.\n- Đặt tên screen theo nghiệp vụ, không theo tên component.\n- Mỗi trang tối đa 600 dòng; dài hơn thì tách thành trang con.\n\n### 4.3 Liên kết\n\n- Dùng **link markdown tương đối**, ví dụ `[Đơn hàng](../entities/sales-order.md)`. Không dùng wikilink `[[...]]`, để file hiển thị đúng trên GitHub/GitLab và để harness đọc được.\n  - Ngoại lệ duy nhất: block `<!-- ai-po:<FID> begin … end -->` do harness (AI PO) chèn vào trang spec dùng `[[proposals/ai-po-<FID>.md]]`, đường dẫn tính từ `pages/`. Đó là vùng của harness: không sửa tay bên trong; muốn lật quyết định thì xoá cả block. Lint chấp nhận block này nhưng vẫn kiểm bản ghi có tồn tại.\n- Mỗi trang phải có ít nhất **một liên kết đến** từ trang khác. Trang tổng quan `overview/project-overview.md` được miễn quy tắc này.\n- Trang `source` kết thúc bằng mục `## Trang chịu ảnh hưởng`; mọi loại trang còn lại kết thúc bằng `## Liên quan`.\n\n### 4.4 Mục bắt buộc theo loại\n\n| type | Mục bắt buộc (theo thứ tự) |\n|---|---|\n| `overview` | Tóm tắt · Bản đồ · Liên quan |\n| `source` | Thông tin nguồn · Nội dung chính · Mã yêu cầu được định nghĩa (nếu là spec) · Điểm đáng chú ý / mâu thuẫn · Trang chịu ảnh hưởng |\n| `entity` | Định nghĩa · Thuộc tính / quy tắc nghiệp vụ (kèm mã spec) · Quan hệ · Khác biệt spec ↔ code · Liên quan |\n| `concept` | Định nghĩa · Quy tắc · Áp dụng ở đâu · Khác biệt spec ↔ code · Liên quan |\n| `flow` | Mục tiêu · Các bước (có vai trò và app) · Quy tắc chặn / validation · Khác biệt spec ↔ code · Liên quan |\n| `screen` | Mục đích · App / route / file code · Yêu cầu spec · Khác biệt spec ↔ code · Câu hỏi mở (nếu có) · Liên quan |\n\nMẫu từng loại trang: `references/page-templates.vi.md` của skill `llm-wiki`.\n\n### 4.5 Mục `## Khác biệt spec ↔ code`\n\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n\nCột `Mức` nhận một trong các giá trị:\n- `MISSING`: chưa có.\n- `PARTIAL`: có một phần.\n- `CONTRADICTS`: làm khác spec.\n- `BUG`: định làm đúng nhưng lỗi.\n- `EXTRA`: code có, spec không yêu cầu.\n- `OK`: khớp spec.\n\nCột `Bằng chứng` ghi `repo:path:line` theo snapshot của ngày trong `updated`. Số dòng có thể trôi, nên lint kiểm lại. Với mức `MISSING` khi chưa có code, bằng chứng ghi `—`.\n\n### 4.7 Đánh dấu chưa rõ\n\n- Chỗ spec mơ hồ hoặc tự mâu thuẫn: ghi `**[CẦN_LÀM_RÕ]**` kèm mô tả, và liệt kê trong mục `## Câu hỏi mở`.\n- Không tự bịa quy tắc nghiệp vụ.\n\n## 5. Mã yêu cầu (spec IDs) và thứ tự ưu tiên nguồn\n\nMỗi phân hệ có một tiền tố; mã có dạng `PREFIX-NN`, tăng dần và không tái dùng số. Một mã là một quy tắc nghiệp vụ kiểm được.\n- Mã được định nghĩa trong trang source chính của phân hệ, ở mục \"Mã yêu cầu được định nghĩa\".\n- Trang nào dùng mã thì ghi mã đó vào frontmatter `spec_ids`.\n\nDanh sách tiền tố cũng nằm trong `wiki.json → prefixes`; khi thêm tiền tố thì sửa cả hai chỗ.\n\n| Tiền tố | Phân hệ | Hub |\n|---|---|---|\n| `TQ` | Tổng quan | [Tổng quan](pages/overview/module-overview.md) |\n| `VH` | Vận hành | [Vận hành](pages/overview/module-operations.md) |\n| `HT` | Học tập | [Học tập](pages/overview/module-academics.md) |\n| `TC` | Tài chính | [Tài chính](pages/overview/module-finance.md) |\n| `NT` | Nhà trường | [Nhà trường](pages/overview/module-school-admin.md) |\n| `CH` | Cấu hình | [Cấu hình](pages/overview/module-settings.md) |\n| `DN` | Đăng nhập & Xác thực | [Đăng nhập & Xác thực](pages/overview/module-auth.md) |\n\n**Quyết định của chủ sở hữu:**\n- Ghi vào trang source riêng `sources/<module>-decisions-YYYY-MM-DD.md`, rồi cập nhật các mã liên quan.\n- Trang mới hơn thắng.\n- Câu được chốt theo phương án AI đề xuất thì đánh dấu \"chốt theo đề xuất\", để chủ sở hữu duyệt lại sau.\n\n**Thứ tự ưu tiên khi nguồn mâu thuẫn:**\n\n1. Quyết định của chủ sở hữu (trang `*-decisions-*` mới nhất).\n2. docs/prd/PRD_School_Operating_Portal_VI.md > docs/tech-specs/system-architecture-blueprint.md\n3. Tài liệu phái sinh, ví dụ PRD do AI viết.\n\nCode (khi đã có) chỉ là bằng chứng triển khai, không phải spec. Code khác spec thì ghi vào `Khác biệt spec ↔ code`.\n\nMâu thuẫn phải được ghi ở cả hai trang liên quan và trong kết quả lint.\n\n## 6. Quy trình\n\n### 6.1 Ingest (nạp nguồn mới)\n\n1. Người dùng thả nguồn vào `raw/`, hoặc chỉ định file trong repo. Với spreadsheet: lưu bản gốc, cùng export từng tab ra `.csv` và `.md` nguyên văn, không sửa nội dung.\n\n2. LLM đọc toàn bộ nguồn, tách thành các quy tắc kiểm được và đặt mã spec. Chỗ nào chưa rõ thì ghi `[CẦN_LÀM_RÕ]`, không tự quyết.\n\n3. Tạo hoặc cập nhật **một trang source cho mỗi nguồn** trong `pages/sources/` (không gộp nhiều tài liệu vào một trang), định nghĩa mã spec mới nếu có.\n4. Cập nhật mọi trang entity, concept, flow, screen bị ảnh hưởng. Khi thông tin mới mâu thuẫn với trang cũ: không xoá, mà ghi rõ mâu thuẫn và nguồn nào thắng theo §5.\n5. Cập nhật bảng `Khác biệt spec ↔ code` của các trang liên quan.\n6. Cập nhật `index.md`: thêm trang mới, sửa mô tả một dòng. Cập nhật `updated:` của mọi trang đã sửa.\n7. Ghi thêm entry vào `log.md` theo dạng `## [YYYY-MM-DD] ingest | <Tên nguồn>`, kèm danh sách trang đã tạo hoặc sửa.\n8. Chạy lint (§6.3) và sửa cho sạch trước khi báo xong. Khi `wiki.json` có khối `coverage`, \"sạch\" gồm cả độ phủ: **0 lỗi cấu trúc ≠ đã phủ**.\n\n### 6.2 Query (hỏi đáp)\n\n1. Đọc `index.md` trước, chọn trang liên quan rồi đọc sâu. Chỉ quay về `raw/`, tài liệu repo hoặc code khi wiki thiếu.\n2. Trả lời kèm link trang wiki và mã spec.\n3. Câu trả lời có giá trị lâu dài (so sánh, phân tích, bảng tra) thì lưu thành trang mới, thường là `concept` hoặc `overview`, và cập nhật `index.md`.\n4. Ghi `## [YYYY-MM-DD] query | <Câu hỏi ngắn>` vào `log.md`.\n\n### 6.3 Lint (kiểm tra sức khoẻ)\n\n```bash\npython3 -I tools/lint_wiki.py .          # chạy từ trong llm-wiki/; thoát 1 nếu có lỗi\npython3 -I tools/lint_wiki.py . --json   # số liệu máy đọc: khoảng trống, câu hỏi mở, độ phủ mã\npython3 -I tools/obsidian_graph.py .     # graph như Obsidian thấy\n```\n\nScript kiểm frontmatter, link hỏng, anchor, trang mồ côi, trang thiếu trong index, mục bắt buộc, wikilink, độ dài trang, định dạng log, mã spec lạ, bằng chứng `repo:` trỏ tới file không tồn tại, và chuỗi giống secret.\n\n**Độ phủ code ↔ wiki** (khi `wiki.json` có khối `coverage`; lint tự gọi `tools/coverage_wiki.py`):\n\n```bash\npython3 -I tools/coverage_wiki.py . --unclaimed --owner <PREFIX>   # fact chưa mô tả — đầu vào brief ingest\npython3 -I tools/coverage_wiki.py . --accept                       # người duyệt: khoá dấu vân tay claim đã kiểm\npython3 -I tools/coverage_wiki.py . --baseline                     # lần đầu: chụp nợ cũ; về sau: chỉ co lại\n```\n\n- **Fact** = một symbol có tên tạo/đổi/xoá một subject (bảng…), id `verb:kind:name@path#symbol`, kèm dấu vân tay\n  (cột + literal được ghi). Kho fact tính lại mỗi lần từ code, không commit.\n- **Lỗi:** fact bắt buộc chưa claim · claim trỏ fact không còn · bằng chứng ngoài thân symbol / là dòng import / dải\n  quá dài · mã spec không thuộc chủ · claim đặt ở trang không thuộc chủ · dấu vân tay đổi so với lần `--accept`\n  · lần nhắc bảng chưa phân loại · subject chưa khai báo chủ · dòng gap `OK`/`PARTIAL`/`CONTRADICTS` không trỏ fact\n  sống nào · baseline có id mới so với merge-base/HEAD hoặc quá hạn · exclusion thiếu chữ ký người.\n- **File quyết định** `wiki.json`, `coverage/{exclusions,baseline,renames,claims.lock}.json` do người duyệt đổi\n  (hook chặn agent); mọi thay đổi so với git HEAD được in trong báo cáo.\n- **Chưa phủ theo thiết kế** (chỉ đếm, không phải lỗi): SQL chỉ đọc, cron/queue, cache/Redis, HTTP ra ngoài.\n\nLLM kiểm thêm phần script không làm được:\n- mâu thuẫn giữa các nguồn và giữa các trang;\n- số dòng trong bằng chứng đã trôi;\n- tài liệu ghi \"Done\" mà code chưa có;\n- khái niệm được nhắc nhiều mà chưa có trang.\n\nGhi kết quả vào `log.md` theo dạng `## [YYYY-MM-DD] lint | <Phạm vi>`, gồm các mục Orphans / Mâu thuẫn / Khoảng trống / Việc cần làm.\n\n### 6.4 Decide (ghi quyết định)\n\n1. Chủ sở hữu trả lời câu hỏi mở.\n2. LLM ghi câu trả lời vào `sources/<module>-decisions-YYYY-MM-DD.md`: câu hỏi, phương án được chọn, các phương án bị loại, người quyết định, các trang và feature bị ảnh hưởng.\n3. Cập nhật các trang liên quan; bỏ `[CẦN_LÀM_RÕ]` ở chỗ đã chốt.\n4. Ghi `## [YYYY-MM-DD] decide | <Phạm vi>` vào `log.md`.\n\n## 7. Quy tắc `index.md` và `log.md`\n\n- `index.md` nhóm trang theo loại (Overview, Sources, Entities, Concepts, Flows, Screens).\n  - Mỗi dòng có dạng `- [Tiêu đề](pages/...md) — mô tả một dòng`.\n  - Trang screen thêm ` · status` ở cuối dòng.\n- `log.md` là **append-only**, mới nhất ở cuối.\n  - Mỗi entry bắt đầu đúng dạng `## [YYYY-MM-DD] ingest|query|lint|decide | Tiêu đề`, để `grep` được.\n  - Không sửa entry cũ. Ghi sai thì ghi entry mới để đính chính.\n\n## 8. Ràng buộc với phần còn lại của repo\n\n- Khi làm việc với wiki, không sửa code app, thư mục harness, skill, tệp chỉ dẫn agent gốc (`AGENTS.md`, `GEMINI.md`, `CLAUDE.md`…), trừ khi người dùng yêu cầu riêng.\n- Wiki mô tả yêu cầu. Sửa code cho khớp spec là nhiệm vụ riêng: lấy bảng `Khác biệt spec ↔ code` làm nguồn backlog cho harness (AGY-Harness Kit: `agy-harness-ingest`).\n- Không ghi secret (mật khẩu, token, khoá) vào wiki. Chỉ ghi `file:line` và loại secret.\n"}, {"path": "index.md", "title": "Mục Lục Toàn Bộ Tài Liệu LLM Wiki (Index)", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 0, "body": "# Mục Lục Toàn Bộ Tài Liệu LLM Wiki (Index)\n\n> **Dự án:** School Operating Portal (Finviet / SOHA)  \n> **Chế độ:** `new` (Đặc tả mong muốn cho quá trình phát triển mới)  \n> **Cập nhật:** 2026-11-05  \n> **Hợp đồng:** Xem [SCHEMA.md](SCHEMA.md) · Nhật ký: Xem [log.md](log.md)\n\n---\n\n## 1. Tổng Quan & Các Phân Hệ (Overview)\n\n- [Tổng quan dự án](pages/overview/project-overview.md) — Kiến trúc tổng thể và bản đồ phân hệ\n- [Phân hệ Tổng quan (TQ)](pages/overview/module-overview.md) — Dashboard điều hành số liệu trường\n- [Phân hệ Vận hành (VH)](pages/overview/module-operations.md) — Điểm danh, y tế, ảnh AI, trò chuyện\n- [Phân hệ Học tập (HT)](pages/overview/module-academics.md) — Thời khóa biểu, bài tập, sổ điểm\n- [Phân hệ Tài chính (TC)](pages/overview/module-finance.md) — Hóa đơn VietQR, hoàn tiền ăn, miễn giảm, CSDL Sở\n- [Phân hệ Nhà trường (NT)](pages/overview/module-school-admin.md) — Học sinh 360°, giáo viên, lớp học, niên khóa\n- [Phân hệ Cấu hình (CH)](pages/overview/module-settings.md) — Hồ sơ trường, tài khoản, tham số, AI, tính năng\n- [Phân hệ Đăng nhập & Xác thực (DN)](pages/overview/module-auth.md) — Xác thực đa trường `{schoolCode}` và RBAC\n\n---\n\n## 2. Tài Liệu Nguồn Cốt Lõi (Sources)\n\n- [PRD Cổng Vận Hành Trường Học](pages/sources/src-prd-school-operating-portal.md) — Đặc tả nghiệp vụ chuẩn tổng thể\n- [Khung Kiến Trúc Kỹ Thuật Nền Tảng](pages/sources/src-tech-architecture-blueprint.md) — Blueprint kỹ thuật hệ thống\n- [Bảng Câu Hỏi Mở & Quyết Định](pages/sources/src-open-questions-resolutions.md) — Quyết định dứt điểm OQ-01..23 (gồm 15 kịch bản đối kháng Red-Team và nghiệp vụ thực tế)\n- [Đặc Tả Đăng Nhập & Xác Thực](pages/sources/src-prd-dang-nhap-xac-thuc.md) — Đặc tả cơ chế xác thực đa trường, SSO và JWT\n- [Đặc Tả Cơ Chế Hoàn Tiền Khi Nghỉ Học](pages/sources/src-prd-co-che-hoan-tien.md) — Cơ chế khấu trừ tiền ăn tự động tháng M+1\n- [Đặc Tả Cơ Chế Miễn Giảm Học Phí](pages/sources/src-prd-mien-giam-hoc-phi.md) — Chính sách ưu đãi, xử lý xung đột Best-rate\n- [Đặc Tả Bộ Hồ Sơ Kỹ Thuật 35 Epics & Prototype](pages/sources/src-development-epics-manifest.md) — Bản vẽ 35 Epics E-001..E-035\n- [Đặc Tả Khảo Sát Hệ Thống Cũ (Legacy Portal QLTH)](pages/sources/src-legacy-operating-portal-guide.md) — Báo cáo khảo sát 30 modules và M7-SM1\n- [Đặc Tả 33 Quyết Định Kiến Trúc (ADR)](pages/sources/src-adr-architectural-decisions.md) — 33 quyết định ADR-001..ADR-033\n- [Đặc Tả Kho Tri Thức Kỹ Thuật & Danh Mục Anti-Pattern](pages/sources/src-knowledge-base-standards.md) — Tiêu chuẩn đa tầng và Never Do List\n- [Đặc Tả Bảng Đối Soát Mâu Thuẫn Nghiệp Vụ (K001–K057)](pages/sources/src-planning-contradictions-matrix.md) — 57 điểm mâu thuẫn K001..K057\n- [Đặc Tả Bộ Hồ Sơ Thiết Kế Kế Hoạch (Screens, Flows, Diagrams)](pages/sources/src-planning-blueprints-flows-screens.md) — Hồ sơ màn hình và sơ đồ tuần tự\n- [Đặc Tả Hệ Thống Thiết Kế Giao Diện (ECO Design System)](pages/sources/src-portal-design-system.md) — Nền tảng token semantic v2.6.0\n- [Đặc Tả Bộ Hồ Sơ Kế Hoạch SEPO (VOI, AP, ISP)](pages/sources/src-sepo-architecture-implementation-plan.md) — Kế hoạch kiến trúc và thi công kỹ thuật\n\n---\n\n## 3. Khái Niệm Kiến Trúc Then Chốt (Concepts)\n\n- [Cơ chế cô lập đa trường học (Multi-Tenancy)](pages/concepts/multi-tenancy-isolation.md) — RLS & routing\n- [Cơ chế hoàn tiền ăn tự động](pages/concepts/meal-refund-engine.md) — Liên thông điểm danh sang hóa đơn M+1\n- [Thuật toán giải quyết xung đột miễn giảm](pages/concepts/discount-deduplication.md) — Cảnh báo trùng lặp & Best-rate\n- [Đường ống nhận diện khuôn mặt AI](pages/concepts/ai-face-recognition.md) — BullMQ Worker bất đồng bộ\n- [Chốt chặn an toàn khi xóa lớp](pages/concepts/class-deleti s/lint_wiki.py wiki --strict --viewer` bảo đảm 0 lỗi, 0 cảnh báo, 0 thẻ \"cần làm rõ\".\n\n## [2026-11-05] decide | Thực hiện đối kháng toàn diện 5 kịch bản rủi ro cao (Red-Team Review)\n\n- Thực hiện rà soát đối kháng (Red-Team Adversarial Review) toàn diện 5 kịch bản rủi ro cao trên toàn bộ 130 trang Wiki:\n  1. **Kịch bản 1 (Tài chính & Hoàn tiền):** Thiết lập cơ chế `credit_balance` (Số dư tín dụng) giải quyết triệt để trường hợp học sinh nghỉ trọn tháng dẫn đến tiền hoàn lớn hơn học phí tháng M+1, cấn trừ lũy kế tháng M+2 hoặc xuất phiếu chi hoàn tiền khi thôi học/tốt nghiệp; áp dụng snapshot đơn giá suất ăn theo từng lớp cũ/mới khi học sinh chuyển lớp giữa tháng; kiểm soát xung đột đồng thời (Race condition) giữa thanh toán VietQR và hủy/sửa hóa đơn qua khóa bi quan `SELECT ... FOR UPDATE`, vô hiệu hóa QR payload tức thì và gom tiền giao dịch trên hóa đơn đã hủy vào Quỹ treo chờ xử lý (`UNMATCHED_SUSPENSE_POOL`) với nút xử lý 1-chạm.\n  2. **Kịch bản 2 (Vận hành & Điểm danh):** Thiết lập chốt chặn an toàn đón trẻ: Cấm tuyệt đối giao trẻ cho người không trong danh bạ ủy quyền nếu chưa có xác thực trực tiếp của phụ huynh (OTP/video call); quy trình bảo vệ pháp lý lưu giữ trẻ ngoài giờ khẩn cấp sau 17:30 gồm 4 cấp (phòng lưu giữ có camera + 2 nhân sự, liên lạc khẩn cấp 3 số gia đình, biên bản lưu trẻ 3 bên ký GV + BGH + Bảo vệ, báo cáo Công an Phường & Tổng đài 111 sau 19:30); quy tắc hoàn 50% tiền ăn bán trú ngày đón về trước 10:30 do sốt cao $\\ge 38.5^\\circ\\text{C}$ hoặc có chỉ định y tế học đường (`half_day_leave`).\n  3. **Kịch bản 3 (Học vụ & Đánh giá):** Thiết lập cơ chế bảo toàn điểm số khi chuyển trường giữa học kỳ: trích xuất bảng điểm ký số BGH, map mã môn học tương đương tại trường đích, kế thừa 100% các cột điểm TX, GK vào công thức TBHK MoET Thông tư 22/27 mà không bắt học sinh làm bài thi lại; cơ chế mở khóa sổ điểm đã khóa đặc biệt: Phiếu đề nghị đính kèm ảnh bài thi gốc + BGH phê duyệt $\\rightarrow$ Mở khóa cục bộ có phạm vi (Scoped Temporary cide | Giải quyết dứt điểm 5 kịch bản nghiệp vụ thực tế Giáo viên & Kế toán (OQ-19..OQ-23)\n\n- Bổ sung 5 quyết định giải quyết dứt điểm OQ-19 đến OQ-23 vào `docs/init/open-questions.md` và `wiki/raw/specs/open-questions-resolutions.md`:\n  1. **OQ-19 (Sổ Dặn Thuốc Y Tế & Xác Nhận Cho Uống Thuốc Trưa):** Phụ huynh gửi đơn dặn thuốc trực tuyến qua app (tên thuốc, liều lượng, giờ uống, ảnh đơn thuốc). Màn hình điểm danh hiển thị Huy hiệu Viên thuốc; giáo viên bấm xác nhận 1-chạm \"Đã cho uống thuốc lúc HH:mm\" và hệ thống bắn Push Notification an tâm tức thời tới phụ huynh; lưu vết bất biến trong `student_medical_logs`.\n  2. **OQ-20 (Đến Muộn, Đón Sớm Giữa Buổi & Quy Tắc Không Hoàn Tiền Ăn Khi Đón Sớm):** Ghi nhận Đến muộn (Late Arrival, kèm toggle báo bổ sung suất ăn với bếp nếu đến trước 09:00) và Đón sớm giữa buổi (Early Departure, ghi nhận giờ đón, người đón, lý do). Quy tắc dứt điểm: Phụ huynh chủ động đón sớm sau khi học sinh đã đến trường KHÔNG HOÀN TIỀN GÌ CẢ (hoàn 0%). Suất ăn chỉ hoàn khi rơi vào ngày lễ, nhà trường cho nghỉ, phụ huynh có đơn xin nghỉ học cả ngày hợp lệ được duyệt trước 08:30, hoặc y tế đón về trước 10:30 do sốt cao $\\ge 38.5^\\circ\\text{C}$ (OQ-10).\n  3. **OQ-21 (Cơ Chế Tự Động Khóa Sổ Điểm Danh Cuối Tháng - Monthly Attendance Auto-Freeze):** Bỏ nút nộp sổ thủ công. Vào 23:59:59 ngày cuối tháng, trước khi engine tính phí cho tháng tiếp theo (M+1) khởi chạy, hệ thống TỰ ĐỘNG KHÓA (Freeze / Read-Only), không cho cập nhật bất kỳ thông tin điểm danh nào trong tháng đó nữa; bảo đảm tính toàn vẹn 100% cho việc khấu trừ học phí.\n  4. **OQ-22 (Học Sinh Nhập Học Giữa Tháng Prorated & Hóa Đơn Riêng Lẻ Độc Lập):** Học sinh nhập học giữa tháng tính tiền ăn theo số ngày ăn thực tế còn lại từ ngày bắt đầu học đến ngày cuối tháng và học phí chia theo tỷ lệ ngày làm việc còn lại; hệ thống chỉ tạo hóa đơn riêng lẻ cho từng học sinh, mỗi học sinh sở hữu mã hóa đơn riêng, mã VietQR động độc lập, gạch nợ riêng biệt (tuyệt đối không gộp gia đình).\n  5. **OQ-23 (Chính Sách Miễn Giảm Anh/Chị/Em Ruột - Sibling Discount):** Bổ sung chính sách Sibling Discount vào sub-module \"Miễn giảm\"; tự động nhận diện và liên kết các anh chị em ruột qua số điện thoại chính của phụ huynh (`primary_phone`); tự động áp dụng mức giảm trừ cho con thứ 2/thứ 3 khi anh/chị đang có trạng thái học tập `ACTIVE`; tự động điều chỉnh hoặc ngừng áp dụng khi con lớn tốt nghiệp/chuyển trường.\n- Cập nhật 7 trang đặc tả: `attendance-daily.md`, `meal-refund-engine.md`, `discount-policy.md`, `tuition-invoice.md`, `m2-sm1-diem-danh.md`, `m4-sm1-hoc-phi.md`, `m4-sm8-mien-giam.md`.\n- Cập nhật trang nguồn `src-open-questions-resolutions.md` và `wiki/index.md`.\n- Kiểm tra nghiêm ngặt bằng linter: 0 lỗi, 0 cảnh báo (`--strict`), 0 thẻ \"cần làm rõ\".\n\n## [2026-11-05] decide | Đóng kín toàn diện các khoảng trống luồng và xử lý ca biên OQ-19..OQ-23\n\n- Rà soát đối kháng độc lập phát hiện và khắc phục triệt để các khoảng trống nghiệp vụ và ca biên (edge cases) chưa được triển khai đồng bộ ở các trang Flows, Entities, Concepts và Screens:\n  1. `fl-diem-danh-don-tra.md`: Bổ sung bước kiểm tra Sổ dặn thuốc y tế & xác nhận uống thuốc trưa `student_medical_logs` (OQ-19), ghi nhận Đến muộn (Late Arrival, toggle báo ăn với bếp trước 09:00) và Đón sớm giữa buổi (Early Departure, OQ-20); bổ sung quy tắc cốt lõi: Phụ huynh chủ động đón sớm KHÔNG hoàn tiền ăn (hoàn 0%); và cơ chế tự động khóa sổ cuối tháng (Monthly Auto-Freeze - OQ-21).\n  2. `fl-bao-vang-hoan-tien.md`: Bổ sung quy tắc đón sớm chủ động hoàn 0% tiền ăn (OQ-20); chốt tự động khóa sổ điểm danh trước khi engine quét hoàn tiền (OQ-21).\n  3. `fl-lap-phat-hanh-hoa-don.md`: Bổ sung luồng tính học phí và tiền ăn lẻ ngày Prorated cho học sinh nhập học giữa tháng kèm xử lý ca biên ngày bắt đầu rơi vào cuối tuần/nghỉ lễ; quy định dứt điểm chỉ tạo hóa đơn riêng lẻ cho từng học sinh, mã VietQR riêng biệt, gạch nợ độc lập (không gộp gia đình - OQ-22); truy xuất số liệu hoàn tiền ăn sau khi đóng băng điểm danh cu n SSOT `llm-wiki/pages` vào `.harness-state/feature_list.json`.\n- Quét qua toàn bộ 131 tệp Markdown, bóc tách chính xác 76 tính năng tương ứng 1:1 với 76 mã đặc tả quy tắc (spec IDs):\n  - `CH`: 12 tính năng (Cấu hình hệ thống, AI, SInvoice, Feature Flags)\n  - `DN`: 6 tính năng (Đăng nhập, RBAC, SSO, Session, Thu hồi phiên từ xa)\n  - `HT`: 6 tính năng (Thời khóa biểu, Bài tập, Sổ điểm, Quy tắc cấm xóa bài nộp)\n  - `NT`: 17 tính năng (Học sinh 360, Lớp học, Giáo viên, Thực đơn, Chuyển lớp, Lưu trữ)\n  - `TC`: 22 tính năng (Học phí, VietQR động, Hoàn tiền ăn M+1, Miễn giảm, Đối soát Sepay, Bất biến lịch sử)\n  - `TQ`: 3 tính năng (Dashboard KPI, Chuyên cần thời gian thực, Doanh thu)\n  - `VH`: 10 tính năng (Điểm danh đón/trả, Thân nhiệt, Dặn thuốc OQ-19, Đón sớm 0% OQ-20, Khóa sổ 23:59:59 OQ-21, Cập nhật lạc quan)\n- 100% backlog (76/76) được thiết lập ở trạng thái `pending`, sẵn sàng làm căn cứ phân rã WBS cho Kế hoạch Kiến trúc AP và Kế hoạch Thi công ISP.\n- Xác thực lint wiki đạt 0 lỗi, 0 cảnh báo.\n\n\n\n\n"}, {"path": "pages/concepts/ai-face-recognition.md", "title": "Đường Ống Nhận Diện Khuôn Mặt AI (AI Face Recognition Pipeline)", "type": "concept", "group": "concepts", "fm": {"title": "Đường Ống Nhận Diện Khuôn Mặt AI (AI Face Recognition Pipeline)", "type": "concept", "sources": ["pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-06", "CH-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Đường Ống Nhận Diện Khuôn Mặt AI (AI Face Recognition Pipeline)\n\n## Định nghĩa\nĐường ống nhận diện khuôn mặt AI là hệ thống xử lý thị giác máy tính bất đồng bộ, tự động phát hiện và nhận diện khuôn mặt học sinh trong các album ảnh hoạt động lớp học, tự động gắn thẻ (tag) học sinh và phân bổ ảnh vào portfolio cá nhân, đồng thời tuân thủ quyền riêng tư sinh trắc học và hỗ trợ chốt chặn an toàn giám hộ trẻ em.\n\n## Quy tắc\n1. **Xử lý bất đồng bộ (Asynchronous Queue - OQ-04):**\n   - Khi giáo viên tải lên nhiều ảnh (lên đến 100 ảnh/lần), ảnh được lưu trực tiếp vào Object Storage (Google Cloud Storage / MinIO).\n   - Backend sinh job bất đồng bộ vào hàng đợi BullMQ và trả phản hồi `202 Accepted` ngay lập tức để không chặn giao diện người dùng.\n2. **Bộ nhận diện AI Worker:**\n   - Worker chạy ngầm trích xuất embedding khuôn mặt (Face Embeddings) từ ảnh và so sánh cosine similarity với vector khuôn mặt chuẩn của học sinh trong trường.\n   - Ngưỡng tin cậy (Confidence Threshold) được cấu hình tại Cấu hình nhận diện (mặc định $\\ge 0.85$).\n3. **Cập nhật trạng thái thời gian thực:**\n   - Khi nhận diện hoàn tất, worker lưu các thẻ `face_tag` vào PostgreSQL và phát sự kiện qua WebSocket để giao diện tự động cập nhật avatar học sinh được gắn thẻ mà không cần reload trang.\n4. **Quyền riêng tư sinh trắc học khuôn mặt (AI Biometric Privacy Opt-Out - OQ-16):**\n   - Tuân thủ Nghị định 13/2023/NĐ-CP về bảo vệ dữ liệu cá nhân, hệ thống cung cấp cờ cấu hình `opt_out_face_ai` trong hồ sơ học sinh.\n   - Khi phụ huynh bật `opt_out_face_ai = true`:\n     - Worker AI tự động bỏ qua trích xuất vector khuôn mặt và tuyệt đối không gắn thẻ tên học sinh lên ảnh lớp.\n     - Vô hiệu hóa và xóa dữ liệu vector khuôn mặt của học sinh trong bảng `face_biometric_registrations`.\n     - Tự động áp dụng bộ lọc làm mờ khuôn mặt (`AUTO_BLUR_FACE`) hoặc loại trừ khỏi album công khai bên ngoài lớp (`EXCLUDE_FROM_PUBLIC_ALBUM`) theo yêu cầu phụ huynh.\n5. **Chốt chặn an toàn tranh chấp quyền giám hộ (Restricted Custody Protection - OQ-16):**\n   - Với các trường hợp tranh chấp quyền nuôi con hoặc có phán quyết của Tòa án cấm tiếp cận (`restricted_guardians`), hệ thống đồng bộ danh sách cảnh báo này sang phân hệ Vận hành.\n   - Tại màn hình Điểm danh đón/trả (`m2-sm1-diem-danh`), học sinh được gắn Huy hiệu Khiên Đỏ (Custody Alert). Khi quét thẻ hoặc chọn người đón nằm trong danh sách hạn chế, hệ thống lập tức kích hoạt Cảnh báo đỏ toàn màn hình (Red Modal Alert) kèm chuông báo động, khóa nút giao trẻ và kích hoạt quy trình an ninh bảo vệ học sinh.\n\n## Áp dụng ở đâu\n- [Thư viện media](../entities/media-album.md)\n- [Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Điểm danh hằng ngày](../entities/attendance-daily.md)\n- [Hồ sơ sinh trắc khuôn mặt](../entities/face-biometric-registration.md)\n- [Màn hình thư viện](../screens/m2-sm3-thu-vien.md)\n- [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md)\n- [Màn hình nhận diện](../screens/m6-sm4-nhan-dien.md)\n- [Luồng nhận diện album ảnh](../flows/fl-nhan-dien-album-anh.md)\n- [Luồng điểm danh đón trả](../flows/fl-diem-danh-don-tra.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-06 | Thư viện media tự động gắn thẻ khuôn mặt học sinh trong ảnh lớp bằng AI | Prototype frontend hiển thị ảnh tĩnh, chưa kết nối BullMQ worker | MISSING | repo:app/src/features/media/ |\n| CH-04 | Cấu hình mô hình AI nhận diện khuôn mặt và ngưỡng nhạy độ tin cậy nhận diện | Màn hình cài đặt AI mới có mockup giao diện | MISSING | repo:app/src/features/settings/ |\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Thư viện media](../entities/media-album.md)\n- [Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Điểm danh hằng ngày](../entities/attendance-daily.md)\n- [Hồ sơ sinh trắc khuôn mặt](../entities/face-biometric-registration.md)\n- [Luồng nhận diện album ảnh](../flows/fl-nhan-dien-album-anh.md)\n- [Luồng điểm danh đón trả](../flows/fl-diem-danh-don-tra.md)\n- [Màn hình thư viện](../screens/m2-sm3-thu-vien.md)\n- [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md)\n- [Màn hình nhận diện](../screens/m6-sm4-nhan-dien.md)\n"}, {"path": "pages/concepts/class-deletion-guard.md", "title": "Chốt Chặn An Toàn Khi Xóa Lớp (Class Deletion Guard)", "type": "concept", "group": "concepts", "fm": {"title": "Chốt Chặn An Toàn Khi Xóa Lớp (Class Deletion Guard)", "type": "concept", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["NT-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Chốt Chặn An Toàn Khi Xóa Lớp (Class Deletion Guard)\n\n## Định nghĩa\nChốt chặn an toàn khi xóa lớp là cơ chế kiểm tra tính toàn vẹn dữ liệu nghiêm ngặt trước khi cho phép quản trị viên thực hiện thao tác xóa một lớp học, nhằm ngăn ngừa triệt để nguy cơ tạo ra dữ liệu mồ côi (orphan records) trong học vụ và tài chính.\n\n## Quy tắc\n1. **Chặn xóa khi có học sinh:** Nếu lớp học đang có ít nhất 1 học sinh theo học (`student_count > 0`), nút Xóa lớp bị vô hiệu hóa hoàn toàn; giao diện hiển thị cảnh báo: *\"Lớp học đang có học sinh. Vui lòng chuyển toàn bộ học sinh sang lớp khác trước khi xóa lớp.\"*\n2. **Chặn xóa khi đã phát sinh tài chính & Chốt chặn bảo toàn công nợ (OQ-12):**\n   - Nếu lớp học đã có hóa đơn học phí, giao dịch thanh toán hoặc khoản chi liên kết, hệ thống tuyệt đối cấm xóa vật lý (Hard Delete). Chỉ cho phép chuyển trạng thái lớp sang \"Lưu trữ / Ngừng hoạt động\" (`Archived`).\n   - Nếu trong lớp còn bất kỳ học sinh nào có công nợ học phí chưa tất toán (`balance_due > 0` hoặc hóa đơn ở trạng thái `issued`, `partial_paid`, `overdue`), hệ thống khóa cứng không cho phép xóa vĩnh viễn.\n   - Khi đóng/lưu trữ lớp cũ lúc kết thúc niên khóa: Toàn bộ công nợ được bảo toàn tuyệt đối, gắn với `student_id` và tự động mang sang niên khóa mới (Carried-over Debt) dưới dạng \"Nợ kỳ trước\" trên hóa đơn lớp mới. Kế toán vẫn có thể thu tiền và gạch nợ cho hóa đơn của lớp đã lưu trữ.\n3. **Điều kiện xóa hợp lệ:** Chỉ các lớp rỗng hoàn toàn (0 học sinh, 0 hóa đơn, 0 công nợ, 0 thời khóa biểu đang hoạt động) mới được phép xóa vĩnh viễn khỏi cơ sở dữ liệu.\n4. **Phân loại lớp rõ ràng:** Phân tách rạch ròi giữa Lớp chính khóa (bật trọn bộ tính năng: điểm danh, thời khóa biểu, sổ điểm, học phí) và Lớp ngoại khóa (chỉ bật tính năng điểm danh và bài tập riêng).\n\n## Áp dụng ở đâu\n- [Lớp học](../entities/classroom.md)\n- [Màn hình lớp học](../screens/m5-sm3-lop-hoc.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-04 | Phân loại lớp chính khóa và ngoại khóa kèm chốt chặn an toàn khi xóa lớp | Prototype frontend chưa tích hợp dialog kiểm tra ràng buộc tài chính và học sinh | MISSING | repo:app/src/features/classes/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-05).\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Lớp học](../entities/classroom.md)\n- [Luồng chuyển lớp và chuyển năm học](../flows/fl-chuyen-lop-va-chuyen-nam-hoc.md)\n"}, {"path": "pages/concepts/csdl-so-integration.md", "title": "Kiến Trúc Tích Hợp Cơ Sở Dữ Liệu Bộ/Sở GD&ĐT (CSDL Sở)", "type": "concept", "group": "concepts", "fm": {"title": "Kiến Trúc Tích Hợp Cơ Sở Dữ Liệu Bộ/Sở GD&ĐT (CSDL Sở)", "type": "concept", "sources": ["pages/sources/src-development-epics-manifest.md", "pages/sources/src-open-questions-resolutions.md", "repo:docs/guides/development/E-010-finance-fee-catalog/epic.md"], "spec_ids": ["TC-19", "TC-20"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Kiến Trúc Tích Hợp Cơ Sở Dữ Liệu Bộ/Sở GD&ĐT (CSDL Sở)\n\n## Định nghĩa\nKiến trúc liên thông và chuẩn hóa dữ liệu giữa School Operating Portal với hệ thống quản trị trung tâm Managing Portal và Cơ sở dữ liệu của Bộ/Sở Giáo Dục & Đào Tạo, bảo đảm toàn bộ danh mục tài chính và thông tin định danh học sinh tuân thủ nghiêm ngặt quy định quản lý nhà nước.\n\n## Quy tắc\n1. **Chuẩn hóa danh mục nguồn thu:**\n   - Các khoản thu học phí, tiền ăn, bảo hiểm y tế bắt buộc phải được ánh xạ với mã danh mục chuẩn của CSDL Sở (`RevenueCategory`).\n   - Trường học không được tự ý sửa mã hoặc định dạng báo cáo khi khoản thu đã được gán nhãn bắt buộc theo luật định.\n2. **Cơ chế đồng bộ dữ liệu (Data Sync Engine):**\n   - Khi Ban Giám Hiệu nhấn \"Đồng bộ từ CSDL Sở\", hệ thống gọi API sang Managing Portal để cập nhật phiên bản mới nhất của danh mục thu.\n   - Các khoản thu đã ngừng áp dụng trên CSDL Sở (`ARCHIVED`) sẽ tự động bị vô hiệu hóa tạo mới trên đợt thu học phí tiếp theo của trường.\n3. **Báo cáo định kỳ:**\n   - Dữ liệu thu học phí và tỷ lệ hoàn thành được kết xuất tự động theo biểu mẫu chuẩn để nộp báo cáo cho Phòng/Sở GD&ĐT mà không cần kế toán nhập tay lại.\n4. **Cơ chế đóng băng dữ liệu kỳ thi (Sync Locked / Exam Freeze - OQ-15):**\n   - Khi Sở GD&ĐT ban hành mốc chốt dữ liệu phục vụ kỳ thi học kỳ hoặc xét chuyển cấp, Quản trị viên kích hoạt trạng thái `is_sync_locked = true` cho khối lớp/kỳ thi tương ứng.\n   - Khi cờ này kích hoạt, toàn bộ thông tin định danh học sinh (`full_name`, `dob`, `gender`, `national_id_number`, `moet_student_code`, `class_id`) bị khóa cứng ở trạng thái chỉ đọc (Read-Only).\n   - Mọi đề nghị điều chỉnh bắt buộc phải lập phiếu yêu cầu có chữ ký số của Ban Giám Hiệu và ghi vết bất biến vào `SyncLockAuditTrail`.\n5. **Hòa giải sai lệch dữ liệu hai chiều (Bidirectional Data Drift Reconciliation - OQ-15):**\n   - Hệ thống chạy quét định kỳ đối soát giữa CSDL Portal và CSDL ngành của Sở. CSDL ngành được coi là căn cứ pháp lý số danh bộ (Legal Ground Truth).\n   - Khi phát hiện sai lệch (Data Drift), hệ thống hiển thị bảng đối chiếu 2 cột (`Giá trị CSDL Sở` vs `Giá trị Portal`) tại màn hình quản lý, cho phép Ban Giám Hiệu chọn: (a) *Cập nhật theo Sở* (Pull to Portal) hoặc (b) *Lập biên bản giải trình sai lệch*.\n6. **Cô lập lỗi ngắt quãng từng học sinh (Per-Student Partial Failure Isolation & DLQ - OQ-15):**\n   - Tiến trình đồng bộ dữ liệu theo lô (Batch Sync) xử lý mỗi học sinh như một giao dịch con (Sub-transaction) độc lập.\n   - Nếu học sinh bị lỗi (sai định dạng, trùng mã số định danh), hệ thống chỉ đánh dấu học sinh đó là `SYNC_FAILED`, đẩy vào Hàng đợi thử lại (Retry Queue với Exponential Backoff 3 lần) hoặc Dead Letter Queue (DLQ).\n   - Toàn bộ các học sinh hợp lệ khác trong lô vẫn được đồng bộ thành công (`SYNC_SUCCESS`), không bao giờ rollback toàn bộ lô.\n\n## Áp dụng ở đâu\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Thực thể Danh mục thu CSDL Sở](../entities/revenue-category.md)\n- [Thực thể Danh mục khoản phí](../entities/fee-catalog-item.md)\n- [Thực thể Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Màn hình danh mục thu](../screens/m4-sm7-danh-muc-thu.md)\n- [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md)\n- [Luồng đồng bộ danh mục thu](../flows/fl-dong-bo-danh-muc-thu.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-19 | Quản lý danh mục thu chuẩn hóa kết nối cơ sở dữ liệu Bộ/Sở GD&ĐT (CSDL Sở) | Giao diện bảng danh mục thu và nút kích hoạt đồng bộ | MISSING | repo:app/src/pages/[schoolCode]/school/revenue-categories/index.tsx:1 |\n| TC-20 | Ánh xạ mã tiểu mục tài chính và đồng bộ trạng thái danh mục thu với hệ thống Managing Portal | Slice xử lý trạng thái syncing và cập nhật danh sách | MISSING | repo:app/src/store/slices/revenueCategorySlice.ts:1 |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Thực thể Danh mục thu CSDL Sở](../entities/revenue-category.md)\n- [Thực thể Danh mục khoản phí](../entities/fee-catalog-item.md)\n- [Thực thể Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Màn hình danh mục thu](../screens/m4-sm7-danh-muc-thu.md)\n- [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md)\n- [Luồng đồng bộ danh mục thu](../flows/fl-dong-bo-danh-muc-thu.md)\n"}, {"path": "pages/concepts/curriculum-assessment-standard.md", "title": "Khái Niệm Chuẩn Đánh Giá & Xếp Loại Học Sinh (MoET Assessment Standard)", "type": "concept", "group": "concepts", "fm": {"title": "Khái Niệm Chuẩn Đánh Giá & Xếp Loại Học Sinh (MoET Assessment Standard)", "type": "concept", "sources": ["repo:docs/guides/knowledge.md", "repo:docs/guides/decisions.md"], "updated": "2026-11-05", "spec_ids": ["HT-04", "HT-05", "HT-03"]}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Khái Niệm Chuẩn Đánh Giá & Xếp Loại Học Sinh (MoET Assessment Standard)\n\n## Định nghĩa\nChuẩn đánh giá và xếp loại học sinh là tập hợp các nguyên tắc, công thức toán học và biểu mẫu đánh giá tuân thủ nghiêm ngặt các quy định hiện hành của Bộ Giáo Dục và Đào Tạo Việt Nam:\n- Thông tư 27/2020/TT-BGDĐT: Đánh giá học sinh tiểu học (kết hợp nhận xét tiến bộ và điểm kiểm tra định kỳ).\n- Thông tư 22/2021/TT-BGDĐT: Đánh giá học sinh trung học cơ sở và trung học phổ thông (tính điểm trung bình môn học kỳ có trọng số).\n- Thông tư 51/2020/TT-BGDĐT: Đánh giá sự phát triển của trẻ em mầm non theo thang chuẩn năng lực - phẩm chất 3 mức.\n\n## Quy tắc\n1. **Công thức điểm trung bình môn học kỳ (HT-04):**\n   - Áp dụng cho các môn đánh giá bằng điểm số:\n     $$\\text{TBHK} = \\frac{\\sum_{i=1}^{k} \\text{ĐĐG}_{TX, i} + 2 \\times \\text{ĐĐG}_{GK} + 3 \\times \\text{ĐĐG}_{CK}}{k + 5}$$\n   - Trong đó:\n     - $\\text{ĐĐG}_{TX}$: Điểm đánh giá thường xuyên (hệ số 1).\n     - $\\text{ĐĐG}_{GK}$: Điểm đánh giá giữa kỳ (hệ số 2).\n     - $\\text{ĐĐG}_{CK}$: Điểm đánh giá cuối kỳ (hệ số 3).\n     - $k$: Số lượng đầu điểm đánh giá thường xuyên được nhập.\n   - **Chốt chặn bảo vệ (Defensive Guard):** Nếu học sinh thiếu điểm giữa kỳ ($\\text{ĐĐG}_{GK}$) hoặc cuối kỳ ($\\text{ĐĐG}_{CK}$), hệ thống cấm tính điểm $\\text{TBHK}$ sơ bộ (trả về dấu `\"—\"`), tránh việc báo cáo sai lệch kết quả học tập khi kỳ thi chưa kết thúc.\n   - Điểm $\\text{TBHK}$ làm tròn đến đúng 1 chữ số thập phân.\n2. **Đánh giá mầm non theo Rubric năng lực (HT-05):**\n   - Đánh giá theo 3 thang mức chuẩn: \"Tốt\", \"Đạt\", \"Cần cố gắng\".\n   - Phân loại theo 3 năng lực chung, 7 năng lực đặc thù và 5 phẩm chất chủ yếu.\n   - **Chốt chặn đếm tiêu chí (Domain Clamping):** Hệ thống kiểm soát số tiêu chí đạt không vượt quá tổng số tiêu chí quy định của từng lĩnh vực (ví dụ: cấm lỗi vượt ngưỡng 6/5).\n3. **Quy tắc phân công giáo viên chấm điểm:**\n   - Chỉ giáo viên được phân công bộ môn tại lớp học mới có quyền nhập điểm và lời nhận xét.\n   - Mọi thay đổi điểm số sau khi sổ điểm đã khóa kỳ đánh giá phải tuân thủ cơ chế mở khóa đặc biệt có phê duyệt.\n4. **Bảo toàn điểm số khi chuyển trường giữa học kỳ (OQ-11):**\n   - *Chuyển trường cùng hệ thống ECO:* Hệ thống trích xuất toàn bộ các đầu điểm kiểm tra thường xuyên ($\\text{ĐĐG}_{TX}$) và điểm giữa kỳ ($\\text{ĐĐG}_{GK}$) đã tích lũy tại trường cũ thành bản ghi học bạ điện tử có chữ ký số của Ban Giám Hiệu. Trường tiếp nhận sử dụng tính năng \"Đối chiếu mã môn học tương đương\", tự động kế thừa toàn bộ đầu điểm thành phần vào sổ điểm lớp mới để tính $\\text{TBHK}$ theo Thông tư 22/27 Bộ GD&ĐT mà không bắt học sinh phải làm bài kiểm tra bù.\n   - *Chuyển trường ngoài hệ thống:* Kết xuất Bảng điểm điện tử xác thực bằng mã QR truy xuất nguồn gốc và đóng băng hồ sơ học sinh ở trạng thái `TRANSFERRED_OUT`.\n5. **Cơ chế mở khóa sổ điểm đặc biệt & Audit Trail bất biến (OQ-11):**\n   - Sổ điểm đã ở trạng thái Khóa (`LOCKED`) thì ở chế độ chỉ đọc (Read-only) đối với toàn bộ giáo viên.\n   - Khi phát hiện vào nhầm điểm (ví dụ chấm phúc khảo hoặc cộng nhầm điểm bài thi): Giáo viên lập \"Phiếu đề nghị điều chỉnh điểm số\" (`GradeCorrectionRequest`), đính kèm ảnh chụp bài thi làm bằng chứng và giải trình rõ lý do.\n   - Ban Giám Hiệu (Hiệu trưởng / Hiệu phó chuyên môn) thẩm định hồ sơ và phê duyệt trực tiếp trên portal.\n   - Ngay khi phê duyệt, hệ thống kích hoạt **Mở khóa cục bộ có phạm vi (Scoped Temporary Unlock):** CHỈ mở quyền ghi cho đúng ô điểm được phê duyệt của học sinh đó với thời hạn tự động khóa lại tối đa 60 phút (TTL: 3600s). Mọi ô điểm khác của lớp vẫn bị khóa chặt.\n   - Hệ thống tự động ghi nhận bản ghi bất biến vào `GradeAuditTrail` (chứa `timestamp`, `teacher_id`, `approver_id`, `old_score`, `new_score`, `reason`, `evidence_url`, `ip_address`). Bản ghi này chỉ ghi thêm (Append-Only), không thể xóa sửa kể cả bởi DB Admin. Hệ thống lập tức tính lại $\\text{TBHK}$ và gửi thông báo giải trình minh bạch tới phụ huynh.\n\n## Áp dụng ở đâu\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Màn hình điểm đánh giá](../screens/m3-sm3-diem-danh-gia.md)\n- [Màn hình môn học](../screens/m5-sm4-mon-hoc.md)\n- [Thực thể bản ghi sổ điểm](../entities/gradebook-record.md)\n- [Luồng nhập sổ điểm](../flows/fl-nhap-so-diem.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-04 | Công thức tính TBHK có trọng số $\\frac{\\sum TX + 2GK + 3CK}{k+5}$ | Logic tính toán trong `src/modules/academics/gradebook/` | MISSING | — |\n| HT-05 | Khung rubric đánh giá mầm non và chốt chặn không vượt tổng tiêu chí | Giao diện rubric mầm non đã dựng sẵn tab và modal | MISSING | — |\n| HT-03 | Quản lý sổ điểm theo quy định Bộ GD&ĐT | Giao diện bảng điểm phân kỳ và tổng kết học kỳ | MISSING | — |\n\n## Liên quan\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Thực thể bản ghi sổ điểm](../entities/gradebook-record.md)\n- [Thực thể môn học](../entities/school-subject.md)\n- [Luồng nhập sổ điểm](../flows/fl-nhap-so-diem.md)\n"}, {"path": "pages/concepts/design-system-tokens-principles.md", "title": "Khái Niệm Kiến Trúc Giao Diện & Hệ Thống Token (Design System Principles)", "type": "concept", "group": "concepts", "fm": {"title": "Khái Niệm Kiến Trúc Giao Diện & Hệ Thống Token (Design System Principles)", "type": "concept", "sources": ["repo:docs/guides/knowledge.md", "repo:docs/guides/decisions.md", "repo:docs/design/portal-ds/README.md"], "updated": "2026-11-05", "spec_ids": ["TQ-01", "CH-09"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Khái Niệm Kiến Trúc Giao Diện & Hệ Thống Token (Design System Principles)\n\n## Định nghĩa\nKiến trúc giao diện của School Operating Portal được xây dựng theo chuẩn **ECO Design System 1.0 (v2.6.0)**, áp dụng mô hình phân tách trách nhiệm lai (Hybrid Styling Architecture) giữa Tailwind CSS và Styled Components. Toàn bộ các giá trị màu sắc, khoảng cách, kích thước và font chữ được quy chuẩn thành hệ thống Token Semantic dạng biến CSS (`var(--<token>)`).\n\n## Quy tắc\n1. **Phân định trách nhiệm Hybrid Styling (ADR-002):**\n   - **Tailwind CSS:** Được dùng độc quyền cho hình học bên ngoài (outer geometry), bố cục khung responsive flexbox và CSS Grid, căn lề và các khoảng đệm căn bản (`p-*`, `m-*`, `flex`, `grid`, `gap-*`).\n   - **Styled Components:** Được dùng độc quyền cho việc đóng gói các thành phần nguyên tử (atomic widgets), trạng thái tương tác phức tạp (hover, active, disabled, focus), hiệu ứng động và việc tiêu thụ các biến CSS token.\n   - **Quy tắc cấm kỵ (Knowledge §4):** Tuyệt đối cấm viết mã màu hex hoặc chuỗi CSS inline tùy ý trong component; cấm dùng các class màu Tailwind mặc định như `blue-500`, `red-500` mà phải tham chiếu qua biến semantic token.\n2. **Nguyên tắc xác nhận trước thay đổi logic & thông báo phản hồi (ADR-008):**\n   - **Modal xác nhận (Pop-up Modal):** Mọi hành động của người dùng làm thay đổi logic tính toán, thay đổi trạng thái danh mục (ví dụ: bật/tắt xuất hóa đơn điện tử, đóng góp ý, chuyển trạng thái chấm công, phân công giáo viên) bắt buộc phải hiển thị hộp thoại xác nhận giải thích tác động trước khi thực thi.\n   - **Thông báo thành công (Global Toast):** Sau khi hoàn thành thao tác, kết quả phải được thông báo qua hệ thống toast toàn cục (`addToast`) ở góc trên cùng bên phải màn hình, không dùng hộp thoại `alert()` của trình duyệt.\n3. **Chuẩn hóa menu hành động ba chấm (ADR-007):**\n   - Cột \"Thao tác\" trên mọi bảng dữ liệu được chuẩn hóa thành một nút bấm ba chấm (`•••` - `IconButton`) mở dropdown menu ngữ cảnh.\n   - Menu tự động tính toán vị trí để lật ngược lên trên khi nằm sát mép dưới của bảng, ngăn chặn hiện tượng bị cắt khuất giao diện.\n4. **Độc lập dirty state và bảo vệ thay đổi chưa lưu (CH-09):**\n   - Các màn hình cấu hình nhiều khối độc lập (như Cấu hình học phí, Hồ sơ trường) quản lý cờ `dirtyFlags` riêng cho từng khối.\n   - Khi người dùng rời trang mà còn thay đổi chưa lưu, hệ thống kích hoạt modal cảnh báo điều hướng.\n\n## Áp dụng ở đâu\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Màn hình tổng quan](../screens/m1-sm1-tong-quan.md)\n- [Màn hình học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình cấu hình học phí](../screens/m6-sm3-hoc-phi.md)\n- [Màn hình lịch sử thanh toán Sepay](../screens/m6-sm7-lich-su-thanh-toan.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TQ-01 | Giao diện điều hành tổng quan chuẩn Design System v2.6.0 | Toàn bộ mã frontend trong `app/src/components/ds/` | MISSING | — |\n| CH-09 | Độc lập dirty state từng khối và bảo vệ điều hướng chưa lưu | Đã hiện thực `UnsavedChangesModal` và slice Redux | MISSING | — |\n\n## Liên quan\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Đặc tả Hệ thống thiết kế](../sources/src-portal-design-system.md)\n- [Màn hình tổng quan](../screens/m1-sm1-tong-quan.md)\n"}, {"path": "pages/concepts/discount-deduplication.md", "title": "Thuật Toán Giải Quyết Xung Đột Miễn Giảm (Discount Deduplication)", "type": "concept", "group": "concepts", "fm": {"title": "Thuật Toán Giải Quyết Xung Đột Miễn Giảm (Discount Deduplication)", "type": "concept", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-09", "TC-10"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Thuật Toán Giải Quyết Xung Đột Miễn Giảm (Discount Deduplication)\n\n## Định nghĩa\nThuật toán giải quyết xung đột chính sách miễn giảm là quy trình kiểm tra và xử lý khi một học sinh đồng thời thuộc diện thụ hưởng từ hai chính sách miễn giảm trở lên cho cùng một khoản thu (ví dụ: vừa thuộc lớp được giảm 10%, vừa có chính sách riêng cho con thương binh giảm 30%).\n\n## Quy tắc\n1. **Cảnh báo khi thiết lập chính sách (Design-time Check):**\n   - Khi kế toán tạo hoặc cập nhật một chính sách miễn giảm trong modal `CreateDiscountPolicyModal`, hệ thống kiểm tra danh sách học sinh thuộc phạm vi áp dụng.\n   - Nếu phát hiện học sinh đã có chính sách có hiệu lực cho cùng khoản thu, hiển thị cảnh báo chi tiết: Tên học sinh, lớp, khoản phí, tên chính sách cũ, mức giảm cũ, tên chính sách mới, mức giảm mới.\n   - Bắt buộc người dùng tích vào checkbox xác nhận: `[ ] Tôi xác nhận thay thế chính sách cũ bằng chính sách mới này cho các học sinh bị trùng lặp nêu trên`. Nút lưu sẽ bị khóa nếu chưa tích xác nhận.\n   - Khi lưu, hệ thống tự động loại trừ học sinh khỏi chính sách cũ.\n2. **Quy tắc bảo đảm quyền lợi tối đa khi lập hóa đơn (Runtime Best-Rate Rule):**\n   - Khi xuất hóa đơn học phí, nếu vì bất kỳ lý do dữ liệu nào học sinh vẫn có nhiều hơn một chính sách hợp lệ, hệ thống tự động so sánh số tiền giảm thực tế và **chỉ áp dụng duy nhất chính sách có mức giảm cao nhất** cho học sinh.\n3. **Chuyển đổi linh hoạt đơn vị giảm trừ:**\n   - Hỗ trợ giảm theo tỷ lệ `%` hoặc số tiền mặt cố định `đ`. Cho phép chuyển đổi đơn vị linh hoạt ngay trên dòng khoản thu của hóa đơn.\n4. **Quy tắc tương tác với chính sách ưu đãi anh/chị/em ruột Sibling Discount (OQ-23):**\n   - Chính sách `SIBLING_DISCOUNT` được hệ thống tự động áp dụng dựa trên số điện thoại chính phụ huynh (`primary_phone`) và trạng thái `ACTIVE` của anh/chị.\n   - Khi học sinh đồng thời thụ hưởng chính sách Sibling Discount và một chính sách miễn giảm khác (ví dụ học bổng, con giáo viên), hệ thống áp dụng nguyên tắc Best-Rate (chọn mức giảm cao nhất có lợi nhất cho học sinh) trừ khi trường cấu hình chính sách cộng dồn đặc thù với trần không quá 100% học phí.\n   - Xử lý chuyển trường/tốt nghiệp trong gia đình nhiều con: Khi con lớn ra trường, hệ thống tự động tính lại số lượng con `ACTIVE` trong gia đình và tự động điều chỉnh mức giảm của các con nhỏ hơn ở kỳ hóa đơn tiếp theo (M+1), không hồi tố kỳ cũ đã quyết toán.\n\n## Áp dụng ở đâu\n- [Chính sách miễn giảm](../entities/discount-policy.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Màn hình miễn giảm](../screens/m4-sm8-mien-giam.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-09 | Cảnh báo và yêu cầu xác nhận khi tạo chính sách miễn giảm trùng lặp đối tượng | Modal frontend chưa tích hợp logic kiểm tra trùng lặp và checkbox xác nhận | MISSING | repo:app/src/features/finance/ |\n| TC-10 | Hỗ trợ giảm trừ linh hoạt theo `%` hoặc tiền mặt `đ` kèm dấu chấm phân cách hàng nghìn | Prototype mới hiển thị đơn giản, chưa có toggle chuyển đổi đơn vị và định dạng số | MISSING | repo:app/src/features/finance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-03, OQ-07, OQ-23).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Chính sách miễn giảm](../entities/discount-policy.md)\n- [Luồng thiết lập miễn giảm](../flows/fl-thiet-lap-mien-giam.md)\n"}, {"path": "pages/concepts/extracurricular-billing-scheduling.md", "title": "Điều Phối Lịch Học, Biểu Phí & Phân Rã Hóa Đơn Lớp Ngoại Khóa", "type": "concept", "group": "concepts", "fm": {"title": "Điều Phối Lịch Học, Biểu Phí & Phân Rã Hóa Đơn Lớp Ngoại Khóa", "type": "concept", "sources": ["pages/sources/src-open-questions-resolutions.md", "pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["NT-04", "TC-01"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Điều Phối Lịch Học, Biểu Phí & Phân Rã Hóa Đơn Lớp Ngoại Khóa\n\n## Định nghĩa\nCơ chế quản trị lớp học ngoại khóa (câu lạc bộ năng khiếu, tiếng Anh nâng cao, thể thao, nghệ thuật), giải quyết trọn vẹn xung đột thời khóa biểu 4 chiều, hỗ trợ mô hình thu phí linh hoạt theo kỳ hoặc theo buổi học thực tế, và cho phép phân rã hóa đơn (Sub-Invoice) khi phụ huynh từ chối hoặc trả chậm khoản thu ngoại khóa.\n\n## Quy tắc\n1. **Bộ điều phối lịch học & Phát hiện xung đột 4 chiều (4-Way Conflict Scheduler - OQ-14):**\n   - Khi xếp lịch học hoặc ghi danh học sinh vào lớp ngoại khóa, hệ thống tự động kiểm tra xung đột thời gian thực trên 4 chiều:\n     - *(a) Học sinh (Student):* Không được trùng khung giờ với tiết học chính khóa hoặc lớp ngoại khóa khác đã ghi danh.\n     - *(b) Giáo viên (Teacher):* Không bị phân công dạy 2 lớp khác nhau trong cùng một khung giờ.\n     - *(c) Phòng học / Cơ sở vật chất (Facility):* Kiểm tra trùng lặp phòng chức năng, sân bóng, nhà đa năng hoặc phòng thí nghiệm.\n     - *(d) Sĩ số tối đa (Capacity):* Chặn ghi danh vượt quá sĩ số tối đa (`capacity`) đã được phê duyệt của lớp ngoại khóa.\n   - Khi phát hiện xung đột, hệ thống chặn lưu (Hard Block) và hiển thị modal cảnh báo vị trí trùng lịch chi tiết để quản trị viên điều chỉnh.\n2. **Mô hình tính phí linh hoạt (Flexible Fee Billing Engine):**\n   - Lớp ngoại khóa hỗ trợ 2 phương thức tính phí:\n     - `TERM_FIXED`: Thu trọn gói cố định theo tháng hoặc theo học kỳ/khóa học.\n     - `PER_SESSION`: Thu theo số buổi học thực tế. Hệ thống tự động tổng hợp số buổi có mặt từ bảng điểm danh lớp ngoại khóa trong tháng để nhân đơn giá buổi học: $\\text{Fee} = \\sum (\\text{attended\\_sessions} \\times \\text{session\\_rate})$.\n3. **Phân rã hóa đơn (Sub-Invoice Decomposition) & Partial Payment:**\n   - Khoản phí ngoại khóa được cấu trúc dưới dạng Sub-Invoice độc lập (`is_separable = true`) lồng trong hóa đơn tổng của học sinh.\n   - Nếu phụ huynh chỉ muốn đóng học phí chính khóa và từ chối/khiếu nại khoản ngoại khóa:\n     - Hệ thống cho phép thanh toán một phần (`PARTIAL_PAID`), gạch nợ hoàn tất khoản chính khóa.\n     - Cung cấp nút \"Tách hóa đơn ngoại khóa\" (Decompose Sub-Invoice): Tách khoản ngoại khóa thành hóa đơn con độc lập (`INV-EXT-...`), chuyển hóa đơn chính khóa về trạng thái `PAID` hợp lệ.\n     - Nếu phụ huynh chính thức nộp đơn xin rút khỏi lớp ngoại khóa, kế toán được quyền hủy riêng hóa đơn con (`CANCELLED`) kèm lý do mà không ảnh hưởng tới hóa đơn chính khóa và công nợ trường.\n\n## Áp dụng ở đâu\n- [Lớp học](../entities/classroom.md)\n- [Thời khóa biểu tuần](../entities/timetable-weekly.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Luồng lập thời khóa biểu](../flows/fl-lap-thoi-khoa-bieu.md)\n- [Luồng lập và phát hành hóa đơn](../flows/fl-lap-phat-hanh-hoa-don.md)\n- [Màn hình thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình quản lý lớp học](../screens/m5-sm3-lop-hoc.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-04 | Phân loại lớp chính khóa và ngoại khóa kèm chốt chặn an toàn khi xóa lớp | Đã có trường loại lớp nhưng chưa tích hợp kiểm tra trùng lịch 4 chiều | MISSING | repo:app/src/types/class.ts:1 |\n| TC-01 | Lập hóa đơn học phí tháng cho học sinh tích hợp mã VietQR động | Hóa đơn đơn khối, chưa hỗ trợ phân rã sub-invoice độc lập | MISSING | repo:app/src/types/invoice.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Lớp học](../entities/classroom.md)\n- [Thời khóa biểu tuần](../entities/timetable-weekly.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Luồng lập thời khóa biểu](../flows/fl-lap-thoi-khoa-bieu.md)\n- [Luồng lập và phát hành hóa đơn](../flows/fl-lap-phat-hanh-hoa-don.md)\n- [Màn hình thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình quản lý lớp học](../screens/m5-sm3-lop-hoc.md)\n"}, {"path": "pages/concepts/meal-refund-engine.md", "title": "Cơ Chế Hoàn Tiền Ăn Tự Động (Meal Refund Engine)", "type": "concept", "group": "concepts", "fm": {"title": "Cơ Chế Hoàn Tiền Ăn Tự Động (Meal Refund Engine)", "type": "concept", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-02", "TC-08", "VH-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Cơ Chế Hoàn Tiền Ăn Tự Động (Meal Refund Engine)\n\n## Định nghĩa\nCơ chế hoàn tiền ăn tự động là giải pháp liên thông dữ liệu giữa phân hệ Điểm danh (M2) và phân hệ Tài chính (M4), tự động tính toán số tiền hoàn trả cho học sinh nghỉ học có phép và khấu trừ trực tiếp vào hóa đơn học phí của kỳ thu tiếp theo (M+1).\n\n## Quy tắc\n1. **Rà soát ngày nghỉ hợp lệ & Điều kiện hoàn tiền ăn (OQ-02, OQ-20):**\n   - Hệ thống quét dữ liệu điểm danh tháng M của học sinh khi tạo hóa đơn tháng M+1.\n   - **Quy tắc hoàn tiền ăn CHỈ áp dụng trong các trường hợp sau:**\n     - *(a) Rơi vào các ngày nghỉ lễ, Tết* theo quy định của nhà nước hoặc Sở GD&ĐT.\n     - *(b) Nhà trường chủ động cho nghỉ:* Toàn trường hoặc từng lớp nghỉ do thiên tai bão lũ, dịch bệnh, sửa chữa cơ sở vật chất hoặc sự cố bất khả kháng.\n     - *(c) Phụ huynh có đơn xin nghỉ học cả ngày hợp lệ:* Đơn được gửi trên hệ thống và được nhà trường duyệt trước giờ chốt báo vắng hằng ngày (08:30 sáng).\n     - *(d) Đón về nửa ngày do Y TẾ (OQ-10):* Học sinh đến trường nhưng sốt cao $\\ge 38.5^\\circ\\text{C}$ hoặc có sự cố y tế đột xuất được Y tế trường xác nhận và phụ huynh đón về trước 10:30 sáng $\\rightarrow$ Hoàn **50% đơn giá tiền ăn ngày đó** (khấu trừ bữa xế/chiều chưa chế biến và chưa phân phối). Đón về sau 11:30 sáng (đã ăn trưa xong) $\\rightarrow$ Hoàn 0%.\n   - **ĐẶC BIỆT LƯU Ý — ĐÓN SỚM CHỦ ĐỘNG (OQ-20):** Đối với các trường hợp Phụ huynh **chủ động đón sớm sau khi học sinh đã đến trường** (Early Departure vì việc gia đình, về quê, khám bệnh tư...) thì **TUYỆT ĐỐI KHÔNG HOÀN TIỀN GÌ CẢ (hoàn 0%)**, do nhà bếp đã tính toán và hoàn tất việc sơ chế nguyên liệu cho toàn bộ suất ăn trong ngày.\n2. **Công thức tính hoàn tiền & Snapshot đơn giá chuyển lớp:**\n   - *Học sinh ổn định một lớp:* \n     $$\\text{Số tiền hoàn} = \\text{Số ngày vắng có phép} \\times \\text{Đơn giá suất ăn/ngày} \\times \\text{Tỷ lệ hoàn tiền (\\%)}.$$\n   - *Học sinh chuyển lớp giữa tháng (Snapshot lịch sử):* Đơn giá suất ăn hoàn trả tính chính xác theo lớp học mà học sinh đang theo học tại thời điểm của từng ngày vắng có phép, không áp đơn giá cào bằng của lớp mới:\n     $$\\text{Số tiền hoàn} = \\sum_{c \\in \\text{Classes}} \\left( \\text{Số ngày vắng có phép tại lớp } c \\times \\text{Đơn giá tiền ăn lớp } c \\times \\text{Tỷ lệ hoàn} \\right).$$\n3. **Tiền ăn cho học sinh nhập học giữa tháng (Prorated - OQ-22):**\n   - Khi học sinh mới nhập học vào giữa tháng, tiền ăn tháng đầu tiên được tính tự động theo **số ngày ăn thực tế còn lại** từ ngày bắt đầu học chính thức (`enrollment_date`) đến ngày làm việc cuối cùng của tháng:\n     $$\\text{Tiền ăn tháng đầu} = \\text{Số ngày ăn thực tế còn lại} \\times \\text{Đơn giá suất ăn/ngày}.$$\n   - *Xử lý biên ngày nghỉ/lễ:* Nếu ngày bắt đầu học (`enrollment_date`) rơi vào ngày thứ Bảy, Chủ nhật hoặc ngày nghỉ lễ theo quy định nhà trường, ngày tính tiền ăn bắt đầu từ ngày làm việc và ăn bán trú thực tế đầu tiên. \"Số ngày ăn thực tế còn lại\" chỉ đếm các ngày bếp hoạt động thực tế đến hết tháng (loại trừ cuối tuần và ngày lễ).\n4. **Cơ chế đóng băng dữ liệu điểm danh tự động cuối tháng (Monthly Auto-Freeze - OQ-21):**\n   - Không cần nút nộp thủ công. Vào 23:59:59 ngày cuối tháng, trước khi engine hoàn tiền ăn khởi chạy để tính phí cho tháng tiếp theo (M+1), hệ thống **TỰ ĐỘNG KHÓA (Freeze / Read-Only)** toàn bộ dữ liệu điểm danh tháng cũ, ngăn chặn mọi sửa đổi trái phép làm sai lệch số liệu khấu trừ.\n5. **Cơ chế Credit Balance chống hoàn tiền âm (OQ-09):**\n   - Hóa đơn tuyệt đối không xuất số tiền phải trả âm trên cổng thanh toán (`amount_due = \\max(0, \\text{gross} - \\text{discounts} - \\text{refund})`).\n   - Nếu học sinh nghỉ có phép cả tháng dẫn đến số tiền hoàn lớn hơn tổng học phí tháng M+1: Phần hoàn tiền thặng dư $(\\text{refund} + \\text{discounts} - \\text{gross} > 0)$ được tự động kết chuyển thành **Số dư tín dụng học sinh (`credit_balance`)**.\n   - Số dư tín dụng này tự động mang sang các kỳ tiếp theo (M+2, M+3...) để cấn trừ vào hóa đơn tương lai. Khi học sinh thôi học, chuyển trường hoặc tốt nghiệp, nhà trường xuất Phiếu chi hoàn trả trực tiếp vào tài khoản ngân hàng của phụ huynh theo đúng quy định tài chính.\n6. **Hiển thị minh bạch trên hóa đơn:** Dòng hoàn tiền hiển thị huy hiệu xanh `\"Hoàn tiền: -X đ\"` chi tiết theo từng lớp (nếu có chuyển lớp) và số dư tín dụng còn dư (nếu có).\n\n## Áp dụng ở đâu\n- [Điểm danh hằng ngày](../entities/attendance-daily.md)\n- [Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Màn hình học phí](../screens/m4-sm1-hoc-phi.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-02 | Tự động rà soát ngày nghỉ có phép tháng M và khấu trừ tiền ăn vào hóa đơn tháng M+1 | Chưa có service tính toán tự động khấu trừ M+1 | MISSING | repo:app/src/features/finance/ |\n| TC-08 | Tính toán số tiền hoàn tiền ăn theo tỷ lệ cấu hình tham số tại Cấu hình học phí | Chưa có formula engine hoàn tiền ăn | MISSING | repo:app/src/features/finance/ |\n| VH-04 | Báo vắng học sinh hàng loạt và phân loại vắng có phép hoặc không phép | Giao diện prototype điểm danh chưa lưu trạng thái hoàn tiền | MISSING | repo:app/src/features/attendance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-02, OQ-09, OQ-10, OQ-20, OQ-21, OQ-22).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Luồng báo vắng và hoàn tiền](../flows/fl-bao-vang-hoan-tien.md)\n"}, {"path": "pages/concepts/multi-tenancy-isolation.md", "title": "Cơ Chế Cô Lập Đa Trường Học (Multi-Tenancy Isolation)", "type": "concept", "group": "concepts", "fm": {"title": "Cơ Chế Cô Lập Đa Trường Học (Multi-Tenancy Isolation)", "type": "concept", "sources": ["pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["DN-01"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Cơ Chế Cô Lập Đa Trường Học (Multi-Tenancy Isolation)\n\n## Định nghĩa\nCơ chế cô lập đa trường học (Multi-Tenancy) là kiến trúc bảo đảm an toàn dữ liệu tuyệt đối giữa các cơ sở giáo dục trên cùng một hạ tầng phần mềm. Hệ thống áp dụng mô hình **Shared Database, Isolated Rows**: CSDL dùng chung duy nhất, nhưng mỗi dòng dữ liệu của mọi bảng đều gắn với định danh trường học (`school_code` / `tenant_id`).\n\n## Quy tắc\n1. **Định tuyến URL:** Mọi yêu cầu truy cập nghiệp vụ bắt buộc có tiền tố `/{schoolCode}/...` trên URL (ví dụ: `/TH-ECO01/attendance`).\n2. **PostgreSQL Row Level Security (RLS):** Mọi bảng dữ liệu người thuê đều kích hoạt RLS. Khi kết nối CSDL, backend bắt buộc thiết lập biến phiên `SET LOCAL app.current_tenant_id = 'TH-ECO01'`. Mọi câu lệnh SQL dù vô tình thiếu điều kiện WHERE cũng không bao giờ truy vấn được dữ liệu của trường khác.\n3. **Chuyển trường & Dọn dẹp Redux State (`RESET_TENANT_STATE` - OQ-13):**\n   - Khi người dùng chuyển đổi ngữ cảnh trường học trên cùng một tab (URL chuyển từ `/[schoolCode1]/` sang `/[schoolCode2]/`): Next.js Router hook / Redux middleware lập tức dispatch action `RESET_TENANT_STATE`.\n   - Action này lập tức dọn sạch (purge) toàn bộ state trong Redux Store của các slice dữ liệu nhạy cảm (học sinh, lớp học, điểm danh, hóa đơn, thông báo, sổ điểm) về initial state rỗng, ngăn ngừa tuyệt đối việc hiển thị dữ liệu \"bóng ma\" (stale/ghost data) của trường cũ sang trường mới trước khi dữ liệu mới được tải về.\n4. **Cô lập phiên đa tab & Phân vùng LocalStorage (Tab Isolation - OQ-13):**\n   - Khi giáo viên kiêm nhiệm mở đồng thời 2 tab trình duyệt cho 2 trường khác nhau (ví dụ: Tab 1 mở `TH-ECO01` và Tab 2 mở `TH-ECO02`): Token xác thực và trạng thái session được phân vùng độc lập theo tiền tố mã trường (`eco_token_{schoolCode}` và `eco_session_{schoolCode}`).\n   - Mỗi tab hoạt động hoàn toàn độc lập dựa trên route `/{schoolCode}/...` của URL tab đó, gửi request API với đúng access token của trường đó, loại bỏ hoàn toàn hiện tượng race condition ghi đè token giữa các tab.\n5. **Cô lập kênh WebSocket theo Tenant (WebSocket Isolation - OQ-13):**\n   - Kết nối WebSocket bắt buộc gắn tiền tố trường: `wss://socket.eco-portal.vn/{schoolCode}/ws?token=...`.\n   - Topic subscription trên message broker (Redis Pub/Sub) tuân thủ định dạng phân tầng: `{schoolCode}:user:{userId}:{channel}` (ví dụ: `TH-ECO01:user:123:attendance`).\n   - WebSocket Gateway kiểm tra nghiêm ngặt quyền của `userId` đối với `schoolCode` trong handshake token trước khi cho phép subscribe. Ngăn chặn tuyệt đối việc tab mở trường A nhận sự kiện, thông báo điểm danh hoặc tin nhắn của trường B.\n6. **Đối chiếu chéo Tenant Context và Token Claim (Cross-Tenant Defense Guard - OQ-13):**\n   - Mọi request API bắt buộc gửi kèm Header `X-School-Code: {schoolCode}` và Bearer Token `eco_token_{schoolCode}`.\n   - Backend Gateway đối chiếu nghiêm ngặt 3 nhân tố: `URL param {schoolCode}` $\\equiv$ `Header X-School-Code` $\\equiv$ `JWT payload tenant_id`. Bất kỳ sự sai lệch nào lập tức bị từ chối với HTTP `403 Forbidden` (`INVALID_TENANT_CONTEXT`), ngăn ngừa triệt để lỗi vô tình dùng nhầm token trường này thao tác trên trường khác.\n\n## Áp dụng ở đâu\n- Áp dụng trên toàn bộ 7 phân hệ: Tổng quan (M1), Vận hành (M2), Học tập (M3), Tài chính (M4), Nhà trường (M5), Cấu hình (M6), Đăng nhập (M7).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| DN-01 | Đăng nhập hệ thống theo tiền tố mã trường `{schoolCode}` và cấp cặp JWT Access/Refresh Token | Prototype frontend điều hướng mock, chưa có PostgreSQL RLS backend | MISSING | repo:app/src/pages/[schoolCode]/index.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-01).\n\n## Liên quan\n- [Phân hệ Đăng nhập](../overview/module-auth.md)\n- [Phiên đăng nhập](../entities/auth-session.md)\n- [Luồng đăng nhập đa trường](../flows/fl-dang-nhap-da-truong.md)\n"}, {"path": "pages/concepts/rbac-two-tier-moderation.md", "title": "Cơ Chế Kiểm Duyệt Bài Viết 2 Cấp & Phân Quyền RBAC", "type": "concept", "group": "concepts", "fm": {"title": "Cơ Chế Kiểm Duyệt Bài Viết 2 Cấp & Phân Quyền RBAC", "type": "concept", "sources": ["pages/sources/src-open-questions-resolutions.md", "pages/sources/src-prd-school-operating-portal.md", "repo:docs/guides/development/E-016-school-teachers/epic.md"], "spec_ids": ["NT-03", "VH-05"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Cơ Chế Kiểm Duyệt Bài Viết 2 Cấp & Phân Quyền RBAC\n\n## Định nghĩa\nLà cơ chế kiểm soát chất lượng nội dung truyền thông của nhà trường trước khi công bố ra công chúng hoặc gửi đến phụ huynh, áp dụng nguyên tắc kiểm duyệt 2 cấp: Cấp 1 (Giáo viên khởi tạo bài đăng) và Cấp 2 (Ban Giám Hiệu hoặc Tổ trưởng phê duyệt phát hành).\n\n## Quy tắc\n1. **Phân quyền vai trò:**\n   - **Giáo viên bộ môn / Giáo viên trợ giảng:** Được phép soạn bài viết, tải ảnh/video và gửi yêu cầu kiểm duyệt (`DRAFT` -> `SUBMITTED`).\n   - **Giáo viên chủ nhiệm (được cấp cờ `can_moderate = true`):** Được duyệt bài đăng nội bộ của lớp mình mà không cần qua Ban Giám Hiệu.\n   - **Ban Giám Hiệu (School Admin):** Có quyền tối cao kiểm duyệt, chỉnh sửa hoặc từ chối mọi bài đăng của toàn trường kèm lý do.\n2. **Luồng xuất bản nội dung:**\n   - Bài đăng chỉ hiển thị trên bảng tin phụ huynh khi chuyển sang trạng thái `APPROVED` hoặc `PUBLISHED`.\n   - Nếu bị từ chối (`REJECTED`), hệ thống gửi thông báo phản hồi cho người soạn kèm lý do chỉnh sửa.\n\n## Áp dụng ở đâu\n- Áp dụng tại phân hệ Vận hành (Hoạt động lớp học) và phân hệ Nhà trường (Bảng thông tin, Bảng tin điện tử).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-03 | Quản lý danh bạ giáo viên và cơ chế kiểm duyệt nội dung bài đăng 2 cấp | Cờ `can_moderate` trên type Teacher và modal phê duyệt | MISSING | repo:app/src/types/teacher.ts:1 |\n| VH-05 | Đăng bài hoạt động lớp hỗ trợ gắn hashtag chủ đề và nhắc tên học sinh | Giao diện composer đăng bài và danh sách bài chờ duyệt | MISSING | repo:app/src/types/activity.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Thực thể Giáo viên & Nhân viên](../entities/teacher-staff.md)\n- [Thực thể Bảng tin hoạt động lớp](../entities/class-activity.md)\n- [Luồng phân công giáo viên kiểm duyệt](../flows/fl-phan-cong-giao-vien-kiem-duyet.md)\n- [Luồng đăng bài kiểm duyệt](../flows/fl-dang-bai-kiem-duyet.md)\n"}, {"path": "pages/concepts/student-lifecycle-transitions.md", "title": "Khái Niệm Vòng Đời Chuyển Tiếp Học Sinh (Student Lifecycle Transitions)", "type": "concept", "group": "concepts", "fm": {"title": "Khái Niệm Vòng Đời Chuyển Tiếp Học Sinh (Student Lifecycle Transitions)", "type": "concept", "sources": ["repo:docs/guides/knowledge.md", "repo:docs/guides/decisions.md", "pages/sources/src-open-questions-resolutions.md"], "updated": "2026-11-05", "spec_ids": ["NT-16", "NT-17", "NT-01"]}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Khái Niệm Vòng Đời Chuyển Tiếp Học Sinh (Student Lifecycle Transitions)\n\n## Định nghĩa\nVòng đời chuyển tiếp học sinh là chu trình quản trị xuyên suốt trạng thái của học sinh từ khi nhập học (Enrolled), chuyển lớp trong năm học (Class Transfer), kết chuyển lên lớp khi sang năm học mới (Academic Year Promotion), rút hồ sơ/thôi học giữa kỳ (Withdrawn), chuyển vào kho lưu trữ lạnh (Archived), đến khi phục hồi trở lại (Restored) hoặc xóa vĩnh viễn (Purged).\n\n## Quy tắc\n1. **Bảo toàn dữ liệu 3 luồng khi chuyển lớp và chuyển năm học (NT-16):**\n   - Khi chuyển một học sinh hoặc chuyển hàng loạt học sinh từ lớp nguồn sang lớp đích:\n     - *Luồng tài chính (Fee Schedules):* Hủy gán định mức học phí của lớp cũ, tự động liên kết học sinh với định mức học phí đã cấu hình của lớp đích cho các kỳ hóa đơn chưa phát hành. Các hóa đơn đã phát hành giữ nguyên dữ liệu lịch sử.\n     - *Luồng trao đổi (Chat & Communication):* Rút tài khoản phụ huynh khỏi nhóm chat của lớp cũ, tự động thêm phụ huynh vào nhóm chat lớp mới để cập nhật bảng tin hoạt động.\n     - *Luồng học tập (Academic Records):* Bảo lưu toàn bộ điểm số, đánh giá thường xuyên và hồ sơ sức khỏe trong quá khứ gắn với niên khóa tương ứng; khởi tạo trang đánh giá mới tại lớp đích.\n2. **Quy tắc cách ly và bảo vệ kho lưu trữ lạnh (NT-17, OQ-12):**\n   - Học sinh khi chuyển sang trạng thái \"Lưu trữ\" sẽ được chuyển vào kho lạnh (`student-archive-record`).\n   - Học sinh trong kho lưu trữ bị loại trừ 100% khỏi danh sách điểm danh, thực đơn ăn bán trú và danh sách sinh hóa đơn học phí hàng tháng.\n   - **Chốt chặn khôi phục học sinh (OQ-12):**\n     - Nếu lớp học cũ của học sinh vẫn tồn tại và đang hoạt động trong niên khóa hiện hành: cho phép phục hồi trực tiếp về lớp đó (kiểm tra sĩ số an toàn).\n     - Nếu lớp học cũ đã kết thúc, giải tán hoặc đã bị xóa: Hệ thống CHẶN không cho phép phục hồi về trạng thái mồ côi; BẮT BUỘC quản trị viên phải chọn một **Lớp học đích đang hoạt động** thuộc niên khóa hiện hành, kiểm tra sĩ số lớp đích trước khi kích hoạt hoàn tất.\n3. **Bảo toàn điểm số khi chuyển trường giữa kỳ (OQ-11):**\n   - Học sinh chuyển trường giữa học kỳ trong hệ thống ECO được bảo toàn 100% các cột điểm kiểm tra thành phần (TX, GK) thông qua trích xuất bảng điểm ký số và map môn tương đương tại trường mới, đảm bảo đủ điều kiện tính điểm TBHK theo Thông tư 22/27 Bộ GD&ĐT.\n4. **Quy trình xóa vĩnh viễn & Bảo toàn công nợ (LT-02, OQ-12):**\n   - Chặn tuyệt đối xóa vĩnh viễn học sinh nếu còn bất kỳ khoản nợ học phí nào chưa thanh toán (`balance_due > 0`).\n   - Chỉ cho phép xóa vĩnh viễn học sinh nằm trong kho lưu trữ đã tất toán hết công nợ sau khi đã qua bước xác nhận cảnh báo nguy hiểm màu đỏ (`LT-02`). Khi đã xóa, toàn bộ hồ sơ cá nhân bị dọn dẹp và không thể phục hồi.\n5. **Quy tắc quyết toán hoàn tiền Pro-rata khi rút hồ sơ / thôi học giữa kỳ (OQ-17):**\n   - Khi học sinh rút hồ sơ chuyển trường hoặc thôi học giữa kỳ, hệ thống áp dụng chính sách quyết toán minh bạch:\n     - *(a) Khoản không hoàn lại (Non-refundable):* Phí ghi danh / nhập học đầu năm, Quỹ phát triển nhà trường / cơ sở vật chất đã phân bổ, đồng phục / sách vở đã bàn giao phụ huynh.\n     - *(b) Khoản hoàn lại theo tỷ lệ thời gian học thực tế (Pro-rata Refund):*\n       - Học phí chính khóa: $\\text{Refund} = \\text{Tuition} \\times \\frac{\\text{Số tuần học còn lại}}{\\text{Tổng số tuần học của kỳ}}$.\n       - Tiền ăn bán trú: Hoàn 100% các ngày chưa học kể từ ngày quyết định thôi học có hiệu lực.\n       - Tiền xe đưa đón & Câu lạc bộ ngoại khóa: Hoàn 100% các buổi/tháng chưa sử dụng.\n     - *Công thức quyết toán ròng (Net Settlement):* $\\text{Net} = \\text{Tiền hoàn hợp lệ} + \\text{Credit Balance hiện có} - \\text{Nợ cũ chưa trả}$. Nếu $\\text{Net} > 0$, nhà trường chi trả cho phụ huynh; nếu $\\text{Net} < 0$, phụ huynh thanh toán nốt trước khi rút hồ sơ.\n   - *Lập Phiếu chi hoàn tiền & Hủy hóa đơn tương lai:* Kế toán lập Biên bản thanh lý học phí, hệ thống tự động sinh Phiếu chi hoàn tiền (`TuitionRefundVoucher`) loại `STUDENT_WITHDRAWAL_REFUND` (duyệt 2 cấp Kế toán trưởng và Hiệu trưởng). Đồng thời, hệ thống tự động quét và **Hủy vĩnh viễn (Void/Cancel)** tất cả các hóa đơn dự kiến chưa phát hành trong tương lai.\n   - *Thu hồi quyền truy cập Mobile App có kiểm soát:* Ngay khi chuyển trạng thái sang `WITHDRAWN`, hệ thống ngắt ngay lập tức quyền tương tác trực tiếp (chat, điểm danh, tin tức lớp), chuyển tài khoản phụ huynh sang chế độ **\"Lưu trữ chỉ đọc\" (`READ_ONLY_ARCHIVE`)** để phụ huynh tra cứu lịch sử điểm số và chứng từ tài chính cũ.\n\n## Áp dụng ở đâu\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Hồ sơ lưu trữ học sinh](../entities/student-archive-record.md)\n- [Phiếu chi nội bộ](../entities/expense-voucher.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md)\n- [Màn hình lớp học](../screens/m5-sm3-lop-hoc.md)\n- [Màn hình kho lưu trữ](../screens/m5-sm14-luu-tru.md)\n- [Màn hình niên khóa](../screens/m5-sm13-nam-hoc.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình khoản chi](../screens/m4-sm5-khoan-chi.md)\n- [Luồng chuyển lớp và chuyển năm học](../flows/fl-chuyen-lop-va-chuyen-nam-hoc.md)\n- [Luồng kho lưu trữ học sinh](../flows/fl-kho-luu-tru-hoc-sinh.md)\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-16 | Bảo toàn 3 luồng khi chuyển lớp và chuyển năm học | Đã có modal chuyển lớp và chuyển năm học trong prototype | MISSING | repo:app/src/types/class.ts:1 |\n| NT-17 | Cách ly kho lạnh, kiểm tra lớp khi phục hồi và bảo vệ xóa 2 bước | Đã có màn hình `/school/archive` với modal xác nhận | MISSING | repo:app/src/pages/[schoolCode]/school/archive/index.tsx:1 |\n| NT-01 | Quản lý hồ sơ học sinh 360 độ và thông tin phụ huynh | Đã có danh sách học sinh và trang chi tiết học sinh | MISSING | repo:app/src/types/student.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thực th
