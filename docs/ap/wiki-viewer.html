<script>
const LIVE=false;let DATA={"meta": {"name": "School Operating Portal", "mode": "new", "pages": 46, "notes": 50, "links": 271, "gaps": {"gap": {"MISSING": 32, "OK": 81}}, "open": 3, "generated": "2026-11-05 11:18", "bodies": true}, "nodes": [{"path": "OBSIDIAN.md", "title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "group": "root", "fm": {"title": "Mở wiki bằng Obsidian để xem graph", "type": "overview", "sources": ["SCHEMA.md"], "updated": "2026-11-04"}, "gap": {}, "open": 0, "body": "# Mở wiki bằng Obsidian để xem graph\n\nThư mục `llm-wiki/` là một **Obsidian vault** đã cấu hình sẵn trong `.obsidian/`. Trong mẫu LLM Wiki, vai trò được chia như sau: Obsidian là IDE, LLM là lập trình viên, còn wiki là codebase.\n\n## Tóm tắt\n\n1. Cài Obsidian: `brew install --cask obsidian` (macOS), hoặc tải từ obsidian.md.\n2. Mở vault: Obsidian → **Open folder as vault** → chọn `harness-loop-kit/llm-wiki`.\n3. Xem graph: `Cmd+G`. Mở một trang rồi chạy **Open local graph** để xem các trang quanh nó.\n\n## Bản đồ\n\n| Màu node | Nhóm | Thư mục |\n|---|---|---|\n| Đỏ cam | Tổng quan | `pages/overview/` |\n| Cam | Luồng nghiệp vụ | `pages/flows/` |\n| Xanh dương | Màn hình | `pages/screens/` |\n| Xanh lá | Thực thể | `pages/entities/` |\n| Tím | Khái niệm | `pages/concepts/` |\n| Xám | Nguồn đã ingest | `pages/sources/` |\n| Xám nhạt | Nguồn thô | `raw/` |\n| Đen | Điều hướng | `index.md`, `log.md`, `SCHEMA.md`, file này |\n\nCấu hình đặt sẵn:\n- Dùng link markdown tương đối, không dùng `[[wikilink]]`, khớp SCHEMA §4.3.\n- Trang mới tạo vào `pages/`; ảnh dán vào lưu ở `raw/assets/`.\n- Graph ẩn thư mục `tools/`, ẩn file đính kèm và link chưa có đích.\n- `workspace.json` (bố cục cửa sổ cá nhân) bị git bỏ qua. Các file cấu hình còn lại được commit, để cả nhóm thấy cùng một graph.\n\n## Quy tắc khi sửa trong Obsidian\n\n- Wiki do LLM sở hữu. Bạn ghi chú được, nhưng nên nhờ LLM ingest để `index.md`, `log.md` và các liên kết được cập nhật đồng bộ (SCHEMA §6).\n- **Không sửa `raw/`.**\n- Sau khi sửa tay, chạy lint: `python3 -I tools/lint_wiki.py .`\n\n## Liên quan\n\n- [Danh mục wiki](index.md)\n- [SCHEMA](SCHEMA.md)\n"}, {"path": "SCHEMA.md", "title": "SCHEMA — LLM Wiki của dự án School Operating Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 3, "body": "# SCHEMA — LLM Wiki của dự án School Operating Portal\n\n> Đây là bản thể hiện của mẫu \"LLM Wiki\" (Karpathy, gist `karpathy/442a6bf555914893e9891c11519de94f`) cho repo này. Wiki được dựng bằng skill `llm-wiki`, chế độ **new**.\n> File này là **cấu hình**: nó cho mọi agent LLM biết wiki có cấu trúc ra sao, quy ước viết trang và quy trình Ingest / Query / Lint. Bản máy đọc nằm ở `wiki.json`; `tools/lint_wiki.py` đọc file đó.\n> Người và LLM cùng chỉnh file này theo thời gian. Ngày khởi tạo: 2026-11-04.\n\n## 1. Mục đích\n\n- `llm-wiki/pages/` là **đặc tả (spec) và tài liệu sống** của những gì School Operating Portal PHẢI làm. Wiki tổng hợp từ nguồn nghiệp vụ (tài liệu BA, PRD, spec sheet, quyết định của chủ sở hữu).\n- Tính năng mới được đặc tả ở đây trước, rồi mới vào backlog của harness. Harness trỏ `sources.spec.root` vào `llm-wiki/pages/`.\n\n- Dự án **mới**: chưa có code, hoặc code mới bắt đầu. Phần thân trang mô tả hành vi **mong muốn** đã được chủ sở hữu duyệt, ghi rõ nguồn quyết định.\n- Bảng `## Khác biệt spec ↔ code` đóng vai trò **bảng theo dõi triển khai**. Ban đầu mọi mã là `MISSING`; khi code xong và verify xanh thì chuyển sang `OK`, kèm bằng chứng `repo:path:line`.\n\n- Ngôn ngữ: **tiếng Việt**. Giữ nguyên tên định danh: page id, tên file code, tên trường, enum, tên package.\n\n## 2. Ba lớp\n\n| Lớp | Đường dẫn | Ai sở hữu | Quy tắc |\n|---|---|---|---|\n| Nguồn thô (raw) | `llm-wiki/raw/` | Người dùng | **Bất biến.** LLM chỉ đọc, không sửa. Thêm nguồn mới thì thêm file mới. |\n| Wiki | `llm-wiki/pages/` | LLM | LLM tạo và sửa toàn bộ. Người đọc và góp ý. |\n| Schema | `llm-wiki/SCHEMA.md` + `wiki.json` | Người + LLM | Chỉ sửa khi đã thống nhất quy ước mới, và ghi lại thay đổi trong `log.md`. |\n\nTệp điều hướng: `llm-wiki/index.md` là danh mục theo nội dung; `llm-wiki/log.md` là nhật ký theo thời gian, chỉ ghi thêm.\n\n**Vault độc lập:** `llm-wiki/` là một Obsidian vault riêng, chỉ chứa tri thức của School Operating Portal. Không liên kết, không copy trang, không dùng chung `.obsidian/` với wiki của dự án khác. Chỉ được mượn **khuôn** (schema, tools), không mượn **nội dung**. Mọi link phải trỏ vào bên trong `llm-wiki/`, hoặc dùng tiền tố `repo:` cho file của repo này.\n\n## 3. Cấu trúc thư mục\n\n```\nllm-wiki/\n├── SCHEMA.md     ← file này\n├── wiki.json     ← cấu hình máy đọc: chế độ, tiền tố mã spec, mục bắt buộc\n├── OBSIDIAN.md   ← cách mở vault và xem graph\n├── index.md      ← danh mục mọi trang (LLM cập nhật mỗi lần ingest)\n├── log.md        ← nhật ký append-only (ingest | query | lint | decide)\n├── tools/        ← lint_wiki.py, obsidian_graph.py\n├── raw/          ← nguồn bất biến KHÔNG nằm sẵn trong repo\n│   ├── specs/    ← spreadsheet / tài liệu yêu cầu (bản gốc + export nguyên văn)\n│   └── assets/   ← ảnh dán vào từ Obsidian\n└── pages/        ← wiki do LLM sở hữu (= spec root của harness)\n    ├── overview/ ← type: overview — bức tranh tổng, hub từng phân hệ, phân quyền\n    ├── sources/  ← type: source   — tóm tắt từng nguồn đã ingest, trang quyết định\n    ├── entities/ ← type: entity   — đối tượng nghiệp vụ\n    ├── concepts/ ← type: concept  — quy tắc hoặc khái niệm xuyên phân hệ\n    ├── flows/    ← type: flow     — luồng nghiệp vụ nhiều bước\n    └── screens/  ← type: screen   — màn hình / route; ánh xạ spec → route trong code\n```\n\nKhi code bắt đầu có, tham chiếu bằng tiền tố `repo:`, ví dụ `repo:src/orders/service.ts:42`. Không copy code vào `raw/`.\n\n## 4. Quy ước trang\n\n### 4.1 Frontmatter YAML (bắt buộc)\n\n```yaml\n---\ntitle: Đơn hàng                 # tên hiển thị\ntype: entity                    # overview | source | entity | concept | flow | screen\nsources:                        # nguồn căn cứ: đường dẫn tương đối từ llm-wiki/ hoặc repo:<path>\n  - raw/specs/01-yeu-cau.md\nupdated: 2026-11-04               # ngày LLM sửa gần nhất (YYYY-MM-DD)\n---\n```\n\nTrường tuỳ chọn:\n- `spec_ids`: danh sách mã yêu cầu, xem §5.\n- `apps`: các app liên quan.\n- `route_ids`: chỉ cho `screen`.\n- `status` (`implemented | partial | missing | extra`): chỉ cho `screen`.\n- `aliases`.\n\n### 4.2 Đặt tên file\n\n- Tên file: **tiếng Anh**, `kebab-case`, ngắn và gợi tả, ví dụ `sales-order.md`, `outlet-debt.md`, `order-list.md`. Tiêu đề (`title:`) viết bằng ngôn ngữ của wiki.\n- File dẫn hướng có tên cố định: `pages/overview/project-overview.md` (tổng quan), `pages/overview/module-<tên>.md` (hub từng phân hệ), `pages/sources/<module>-decisions-YYYY-MM-DD.md` (quyết định).\n- Một khái niệm là một trang. Trước khi tạo trang mới, tìm trong `index.md` xem đã có chưa.\n- Đặt tên screen theo nghiệp vụ, không theo tên component.\n- Mỗi trang tối đa 600 dòng; dài hơn thì tách thành trang con.\n\n### 4.3 Liên kết\n\n- Dùng **link markdown tương đối**, ví dụ `[Đơn hàng](../entities/sales-order.md)`. Không dùng wikilink `[[...]]`, để file hiển thị đúng trên GitHub/GitLab và để harness đọc được.\n  - Ngoại lệ duy nhất: block `<!-- ai-po:<FID> begin … end -->` do harness (AI PO) chèn vào trang spec dùng `[[proposals/ai-po-<FID>.md]]`, đường dẫn tính từ `pages/`. Đó là vùng của harness: không sửa tay bên trong; muốn lật quyết định thì xoá cả block. Lint chấp nhận block này nhưng vẫn kiểm bản ghi có tồn tại.\n- Mỗi trang phải có ít nhất **một liên kết đến** từ trang khác. Trang tổng quan `overview/project-overview.md` được miễn quy tắc này.\n- Trang `source` kết thúc bằng mục `## Trang chịu ảnh hưởng`; mọi loại trang còn lại kết thúc bằng `## Liên quan`.\n\n### 4.4 Mục bắt buộc theo loại\n\n| type | Mục bắt buộc (theo thứ tự) |\n|---|---|\n| `overview` | Tóm tắt · Bản đồ · Liên quan |\n| `source` | Thông tin nguồn · Nội dung chính · Mã yêu cầu được định nghĩa (nếu là spec) · Điểm đáng chú ý / mâu thuẫn · Trang chịu ảnh hưởng |\n| `entity` | Định nghĩa · Thuộc tính / quy tắc nghiệp vụ (kèm mã spec) · Quan hệ · Khác biệt spec ↔ code · Liên quan |\n| `concept` | Định nghĩa · Quy tắc · Áp dụng ở đâu · Khác biệt spec ↔ code · Liên quan |\n| `flow` | Mục tiêu · Các bước (có vai trò và app) · Quy tắc chặn / validation · Khác biệt spec ↔ code · Liên quan |\n| `screen` | Mục đích · App / route / file code · Yêu cầu spec · Khác biệt spec ↔ code · Câu hỏi mở (nếu có) · Liên quan |\n\nMẫu từng loại trang: `references/page-templates.vi.md` của skill `llm-wiki`.\n\n### 4.5 Mục `## Khác biệt spec ↔ code`\n\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n\nCột `Mức` nhận một trong các giá trị:\n- `MISSING`: chưa có.\n- `PARTIAL`: có một phần.\n- `CONTRADICTS`: làm khác spec.\n- `BUG`: định làm đúng nhưng lỗi.\n- `EXTRA`: code có, spec không yêu cầu.\n- `OK`: khớp spec.\n\nCột `Bằng chứng` ghi `repo:path:line` theo snapshot của ngày trong `updated`. Số dòng có thể trôi, nên lint kiểm lại. Với mức `MISSING` khi chưa có code, bằng chứng ghi `—`.\n\n### 4.7 Đánh dấu chưa rõ\n\n- Chỗ spec mơ hồ hoặc tự mâu thuẫn: ghi `**[CẦN LÀM RÕ]**` kèm mô tả, và liệt kê trong mục `## Câu hỏi mở`.\n- Không tự bịa quy tắc nghiệp vụ.\n\n## 5. Mã yêu cầu (spec IDs) và thứ tự ưu tiên nguồn\n\nMỗi phân hệ có một tiền tố; mã có dạng `PREFIX-NN`, tăng dần và không tái dùng số. Một mã là một quy tắc nghiệp vụ kiểm được.\n- Mã được định nghĩa trong trang source chính của phân hệ, ở mục \"Mã yêu cầu được định nghĩa\".\n- Trang nào dùng mã thì ghi mã đó vào frontmatter `spec_ids`.\n\nDanh sách tiền tố cũng nằm trong `wiki.json → prefixes`; khi thêm tiền tố thì sửa cả hai chỗ.\n\n| Tiền tố | Phân hệ | Hub |\n|---|---|---|\n| `XX` | (chưa có — thêm bằng init_wiki.py --force --prefix hoặc sửa tay) | — |\n\n**Quyết định của chủ sở hữu:**\n- Ghi vào trang source riêng `sources/<module>-decisions-YYYY-MM-DD.md`, rồi cập nhật các mã liên quan.\n- Trang mới hơn thắng.\n- Câu được chốt theo phương án AI đề xuất thì đánh dấu \"chốt theo đề xuất\", để chủ sở hữu duyệt lại sau.\n\n**Thứ tự ưu tiên khi nguồn mâu thuẫn:**\n\n1. Quyết định của chủ sở hữu (trang `*-decisions-*` mới nhất).\n2. tài liệu yêu cầu trong raw/specs/ (bản mới hơn thắng)\n3. Tài liệu phái sinh, ví dụ PRD do AI viết.\n\nCode (khi đã có) chỉ là bằng chứng triển khai, không phải spec. Code khác spec thì ghi vào `Khác biệt spec ↔ code`.\n\nMâu thuẫn phải được ghi ở cả hai trang liên quan và trong kết quả lint.\n\n## 6. Quy trình\n\n### 6.1 Ingest (nạp nguồn mới)\n\n1. Người dùng thả nguồn vào `raw/`, hoặc chỉ định file trong repo. Với spreadsheet: lưu bản gốc, cùng export từng tab ra `.csv` và `.md` nguyên văn, không sửa nội dung.\n\n2. LLM đọc toàn bộ nguồn, tách thành các quy tắc kiểm được và đặt mã spec. Chỗ nào chưa rõ thì ghi `[CẦN LÀM RÕ]`, không tự quyết.\n\n3. Tạo hoặc cập nhật **một trang source cho mỗi nguồn** trong `pages/sources/` (không gộp nhiều tài liệu vào một trang), định nghĩa mã spec mới nếu có.\n4. Cập nhật mọi trang entity, concept, flow, screen bị ảnh hưởng. Khi thông tin mới mâu thuẫn với trang cũ: không xoá, mà ghi rõ mâu thuẫn và nguồn nào thắng theo §5.\n5. Cập nhật bảng `Khác biệt spec ↔ code` của các trang liên quan.\n6. Cập nhật `index.md`: thêm trang mới, sửa mô tả một dòng. Cập nhật `updated:` của mọi trang đã sửa.\n7. Ghi thêm entry vào `log.md` theo dạng `## [YYYY-MM-DD] ingest | <Tên nguồn>`, kèm danh sách trang đã tạo hoặc sửa.\n8. Chạy lint (§6.3) và sửa cho sạch trước khi báo xong. Khi `wiki.json` có khối `coverage`, \"sạch\" gồm cả độ phủ: **0 lỗi cấu trúc ≠ đã phủ**.\n\n### 6.2 Query (hỏi đáp)\n\n1. Đọc `index.md` trước, chọn trang liên quan rồi đọc sâu. Chỉ quay về `raw/`, tài liệu repo hoặc code khi wiki thiếu.\n2. Trả lời kèm link trang wiki và mã spec.\n3. Câu trả lời có giá trị lâu dài (so sánh, phân tích, bảng tra) thì lưu thành trang mới, thường là `concept` hoặc `overview`, và cập nhật `index.md`.\n4. Ghi `## [YYYY-MM-DD] query | <Câu hỏi ngắn>` vào `log.md`.\n\n### 6.3 Lint (kiểm tra sức khoẻ)\n\n```bash\npython3 -I tools/lint_wiki.py .          # chạy từ trong llm-wiki/; thoát 1 nếu có lỗi\npython3 -I tools/lint_wiki.py . --json   # số liệu máy đọc: khoảng trống, câu hỏi mở, độ phủ mã\npython3 -I tools/obsidian_graph.py .     # graph như Obsidian thấy\n```\n\nScript kiểm frontmatter, link hỏng, anchor, trang mồ côi, trang thiếu trong index, mục bắt buộc, wikilink, độ dài trang, định dạng log, mã spec lạ, bằng chứng `repo:` trỏ tới file không tồn tại, và chuỗi giống secret.\n\n**Độ phủ code ↔ wiki** (khi `wiki.json` có khối `coverage`; lint tự gọi `tools/coverage_wiki.py`):\n\n```bash\npython3 -I tools/coverage_wiki.py . --unclaimed --owner <PREFIX>   # fact chưa mô tả — đầu vào brief ingest\npython3 -I tools/coverage_wiki.py . --accept                       # người duyệt: khoá dấu vân tay claim đã kiểm\npython3 -I tools/coverage_wiki.py . --baseline                     # lần đầu: chụp nợ cũ; về sau: chỉ co lại\n```\n\n- **Fact** = một symbol có tên tạo/đổi/xoá một subject (bảng…), id `verb:kind:name@path#symbol`, kèm dấu vân tay\n  (cột + literal được ghi). Kho fact tính lại mỗi lần từ code, không commit.\n- **Lỗi:** fact bắt buộc chưa claim · claim trỏ fact không còn · bằng chứng ngoài thân symbol / là dòng import / dải\n  quá dài · mã spec không thuộc chủ · claim đặt ở trang không thuộc chủ · dấu vân tay đổi so với lần `--accept`\n  · lần nhắc bảng chưa phân loại · subject chưa khai báo chủ · dòng gap `OK`/`PARTIAL`/`CONTRADICTS` không trỏ fact\n  sống nào · baseline có id mới so với merge-base/HEAD hoặc quá hạn · exclusion thiếu chữ ký người.\n- **File quyết định** `wiki.json`, `coverage/{exclusions,baseline,renames,claims.lock}.json` do người duyệt đổi\n  (hook chặn agent); mọi thay đổi so với git HEAD được in trong báo cáo.\n- **Chưa phủ theo thiết kế** (chỉ đếm, không phải lỗi): SQL chỉ đọc, cron/queue, cache/Redis, HTTP ra ngoài.\n\nLLM kiểm thêm phần script không làm được:\n- mâu thuẫn giữa các nguồn và giữa các trang;\n- số dòng trong bằng chứng đã trôi;\n- tài liệu ghi \"Done\" mà code chưa có;\n- khái niệm được nhắc nhiều mà chưa có trang.\n\nGhi kết quả vào `log.md` theo dạng `## [YYYY-MM-DD] lint | <Phạm vi>`, gồm các mục Orphans / Mâu thuẫn / Khoảng trống / Việc cần làm.\n\n### 6.4 Decide (ghi quyết định)\n\n1. Chủ sở hữu trả lời câu hỏi mở.\n2. LLM ghi câu trả lời vào `sources/<module>-decisions-YYYY-MM-DD.md`: câu hỏi, phương án được chọn, các phương án bị loại, người quyết định, các trang và feature bị ảnh hưởng.\n3. Cập nhật các trang liên quan; bỏ `[CẦN LÀM RÕ]` ở chỗ đã chốt.\n4. Ghi `## [YYYY-MM-DD] decide | <Phạm vi>` vào `log.md`.\n\n## 7. Quy tắc `index.md` và `log.md`\n\n- `index.md` nhóm trang theo loại (Overview, Sources, Entities, Concepts, Flows, Screens).\n  - Mỗi dòng có dạng `- [Tiêu đề](pages/...md) — mô tả một dòng`.\n  - Trang screen thêm ` · status` ở cuối dòng.\n- `log.md` là **append-only**, mới nhất ở cuối.\n  - Mỗi entry bắt đầu đúng dạng `## [YYYY-MM-DD] ingest|query|lint|decide | Tiêu đề`, để `grep` được.\n  - Không sửa entry cũ. Ghi sai thì ghi entry mới để đính chính.\n\n## 8. Ràng buộc với phần còn lại của repo\n\n- Khi làm việc với wiki, không sửa code app, thư mục harness, skill, tệp chỉ dẫn agent gốc (`AGENTS.md`, `GEMINI.md`, `CLAUDE.md`…), trừ khi người dùng yêu cầu riêng.\n- Wiki mô tả yêu cầu. Sửa code cho khớp spec là nhiệm vụ riêng: lấy bảng `Khác biệt spec ↔ code` làm nguồn backlog cho harness (AGY-Harness Kit: `agy-harness-ingest`).\n- Không ghi secret (mật khẩu, token, khoá) vào wiki. Chỉ ghi `file:line` và loại secret.\n"}, {"path": "index.md", "title": "Danh mục — LLM Wiki School Operating Portal", "type": "", "group": "root", "fm": {}, "gap": {}, "open": 0, "body": "# Danh mục — LLM Wiki School Operating Portal\n\n> Mỗi dòng: `- [Tiêu đề](pages/...md) — mô tả một dòng`. Cập nhật tự động theo chuẩn SCHEMA.\n\n## Điều hướng\n\n- [SCHEMA](SCHEMA.md) — quy ước của wiki\n- [Mở bằng Obsidian](OBSIDIAN.md) — xem graph\n- [Nhật ký](log.md) — ingest/query/lint/decide\n\n## Overview\n\n- [Tổng quan School Operating Portal](pages/overview/project-overview.md) — Bức tranh tổng 7 phân hệ và 38 sub-modules\n- [Phân hệ M7: Cổng Xác Thực & Đăng Nhập](pages/overview/module-m7-dang-nhap.md) — Cổng vào hệ thống duy nhất, hỗ trợ 2 phương thức xác thực độc lập: SSO Sở GD&ĐT và Tài khoản quản trị Finviet.\n- [Phân hệ M1: Tổng Quan Điều Hành](pages/overview/module-m1-tong-quan.md) — Bảng điều khiển trung tâm hiển thị các chỉ số KPI vận hành, tỷ lệ hoàn thành học phí và tình trạng điểm danh toàn trường.\n- [Phân hệ M2: Vận Hành Lớp Học](pages/overview/module-m2-van-hanh.md) — Tập trung các nghiệp vụ hàng ngày của giáo viên và học sinh: điểm danh đón/trả, bảng tin hoạt động, thư viện ảnh AI, trao đổi phụ huynh và báo cáo vận hành.\n- [Phân hệ M3: Quản Lý Học Tập](pages/overview/module-m3-hoc-tap.md) — Tiêu chuẩn hóa thời khóa biểu tuần, giao và chấm bài tập về nhà, cùng sổ điểm đánh giá định kỳ theo quy chuẩn của Bộ GD&ĐT.\n- [Phân hệ M4: Quản Trị Tài Chính & Học Phí](pages/overview/module-m4-tai-chinh.md) — Quản lý toàn diện hóa đơn học phí VietQR động, 24 khoản phí Master, biểu phí lớp, phiếu chi nội bộ, đối soát ngân hàng, báo cáo thu và chính sách miễn giảm linh hoạt.\n- [Phân hệ M5: Quản Trị Nhà Trường](pages/overview/module-m5-nha-truong.md) — Quản trị dữ liệu gốc trường học (học sinh 360°, giáo viên, lớp, môn, khối), vận hành tri thức (bảng thông tin, bình chọn, thực đơn GTIN, điểm danh NV, sổ tay) và ý kiến, lịch, niên khóa, lưu trữ.\n- [Phân hệ M6: Cấu Hình Hệ Thống](pages/overview/module-m6-cau-hinh.md) — Thiết lập cấu hình vận hành cơ sở trường học: hồ sơ trường, tài khoản người dùng, cấu hình học phí & hoàn tiền nghỉ học M+1, nhận diện khuôn mặt mẫu, feature flags và quy tắc thông báo.\n\n## Screens\n\n- [F001 - Cổng Đăng nhập (SSO Sở GD&ĐT & Tài khoản Finviet)](pages/screens/m7-sm2-dang-nhap.md) — M7/SM2: Cổng xác thực đăng nhập ../index.md)\n- [Quy chuẩn SCHEMA](../../SCHEMA.md)\n"}, {"path": "pages/overview/module-m4-tai-chinh.md", "title": "Phân hệ M4: Quản Trị Tài Chính & Học Phí", "type": "overview", "group": "overview", "fm": {"title": "\"Phân hệ M4: Quản Trị Tài Chính & Học Phí\"", "type": "overview", "sources": ["docs/PRD_School_Operating_Portal_VI.md"], "updated": "2026-11-04"}, "gap": {}, "open": 0, "body": "# Phân hệ M4: Quản Trị Tài Chính & Học Phí\n\n## Tóm tắt\n\nQuản lý toàn diện hóa đơn học phí VietQR động, 24 khoản phí Master, biểu phí lớp, phiếu chi nội bộ, đối soát ngân hàng, báo cáo thu và chính sách miễn giảm linh hoạt.\n\nPhân hệ bao gồm **7 sub-modules** được quản lý chặt chẽ theo kỷ luật Harness Loop.\n\n## Bản đồ\n\n| Mã FID | Mã Phân hệ | Tên Màn hình / Sub-module | Độ ưu tiên | Route |\n|---|---|---|---|---|\n| `F011` | `M4/SM3` | [Danh mục Khoản phí Master (24 khoản thu)](../screens/m4-sm3-khoan-phi.md) | `P1` | `/school/school-fees` |\n| `F012` | `M4/SM4` | [Quản lý Biểu phí theo Lớp học (Tuition Management)](../screens/m4-sm4-quan-ly-hoc-phi.md) | `P1` | `/school/tuition-management` |\n| `F014` | `M4/SM8` | [Chính sách Miễn giảm & Động cơ Tự động Áp dụng Mức cao nhất](../screens/m4-sm8-mien-giam.md) | `P1` | `/school/discount` |\n| `F015` | `M4/SM1` | [Lập Hóa đơn Học phí & Thu phí VietQR Động](../screens/m4-sm1-hoc-phi.md) | `P1` | `/school/fee` |\n| `F016` | `M4/SM5` | [Quản lý Phiếu chi Nội bộ (Expenses)](../screens/m4-sm5-khoan-chi.md) | `P1` | `/school/expenses` |\n| `F017` | `M4/SM2` | [Đối soát Giao dịch Ngân hàng & Cổng Thanh toán](../screens/m4-sm2-doi-soat.md) | `P1` | `/school/reconciliation` |\n| `F018` | `M4/SM6` | [Báo cáo Thu Học phí & Tỷ lệ Hoàn thành](../screens/m4-sm6-bao-cao-hoc-phi.md) | `P1` | `/reports/fee/overview` |\n\n## Liên quan\n\n- [Tổng quan School Operating Portal](project-overview.md)\n- [Mục lục LLM Wiki](../../index.md)\n- [Quy chuẩn SCHEMA](../../SCHEMA.md)\n"}, {"path": "pages/overview/module-m5-nha-truong.md", "title": "Phân hệ M5: Quản Trị Nhà Trường", "type": "overview", "group": "overview", "fm": {"title": "\"Phân hệ M5: Quản Trị Nhà Trường\"", "type": "overview", "sources": ["docs/PRD_School_Operating_Portal_VI.md"], "updated": "2026-11-04"}, "gap": {}, "open": 0, "body": "# Phân hệ M5: Quản Trị Nhà Trường\n\n## Tóm tắt\n\nQuản trị dữ liệu gốc trường học (học sinh 360°, giáo viên, lớp, môn, khối), vận hành tri thức (bảng thông tin, bình chọn, thực đơn GTIN, điểm danh NV, sổ tay) và ý kiến, lịch, niên khóa, lưu trữ.\n\nPhân hệ bao gồm **14 sub-modules** được quản lý chặt chẽ theo kỷ luật Harness Loop.\n\n## Bản đồ\n\n| Mã FID | Mã Phân hệ | Tên Màn hình / Sub-module | Độ ưu tiên | Route |\n|---|---|---|---|---|\n| `F004` | `M5/SM13` | [Cấu hình Niên khóa & Học kỳ](../screens/m5-sm13-nam-hoc.md) | `P0` | `/setting/season` |\n| `F005` | `M5/SM5` | [Quản lý Cây Khối Lớp](../screens/m5-sm5-khoi-lop.md) | `P0` | `/school/grades` |\n| `F006` | `M5/SM3` | [Quản lý Lớp học (Chính khóa & Ngoại khóa)](../screens/m5-sm3-lop-hoc.md) | `P0` | `/school/class` |\n| `F007` | `M5/SM1` | [Hồ sơ Học sinh 360° & Chuyển lớp](../screens/m5-sm1-hoc-sinh.md) | `P0` | `/school/kid` |\n| `F008` | `M5/SM2` | [Danh bạ Giáo viên & Phân quyền Kiểm duyệt](../screens/m5-sm2-giao-vien.md) | `P0` | `/school/teacher` |\n| `F024` | `M5/SM4` | [Danh mục Môn học & Phân công Giảng dạy](../screens/m5-sm4-mon-hoc.md) | `P1` | `/school/subject` |\n| `F025` | `M5/SM8` | [Kế hoạch Thực đơn Tuần & Nguồn gốc Thực phẩm GTIN](../screens/m5-sm8-thuc-don.md) | `P1` | `/school/menu` |\n| `F026` | `M5/SM9` | [Điểm danh Nhân viên 1 chạm & Phê duyệt Nghỉ phép](../screens/m5-sm9-diem-danh-nv.md) | `P1` | `/school/staff-attendance` |\n| `F030` | `M5/SM6` | [Bảng thông tin & Lên lịch Gửi Thông báo](../screens/m5-sm6-bang-thong-tin.md) | `P2` | `/announcement` |\n| `F031` | `M5/SM7` | [Bình chọn & Khảo sát Ý kiến Phụ huynh (Polls)](../screens/m5-sm7-binh-chon.md) | `P2` | `/school/poll` |\n| `F032` | `M5/SM10` | [Sổ tay Phụ huynh Cây Tri thức 2 cấp (Handbook)](../screens/m5-sm10-so-tay-ph.md) | `P2` | `/school/handbook` |\n| `F033` | `M5/SM11` | [Hòm thư Góp ý Phụ huynh & Thảo luận 2 chiều](../screens/m5-sm11-gop-y.md) | `P2` | `/school/feedback` |\n| `F034` | `M5/SM12` | [Lịch Sự kiện & Ngày nghỉ Trường học (Calendar)](../screens/m5-sm12-lich-su-kien.md) | `P2` | `/setting/holidays` |\n| `F035` | `M5/SM14` | [Kho Lưu trữ Học sinh Thôi học / Rút hồ sơ (Archive)](../screens/m5-sm14-luu-tru.md) | `P2` | `/setting/kid/archived` |\n\n## Liên quan\n\n- [Tổng quan School Operating Portal](project-overview.md)\n- [Mục lục LLM Wiki](../../index.md)\n- [Quy chuẩn SCHEMA](../../SCHEMA.md)\n"}, {"path": "pages/overview/module-m6-cau-hinh.md", "title": "Phân hệ M6: Cấu Hình Hệ Thống", "type": "overview", "group": "overview", "fm": {"title": "\"Phân hệ M6: Cấu Hình Hệ Thống\"", "type": "overview", "sources": ["docs/PRD_School_Operating_Portal_VI.md"], "updated": "2026-11-04"}, "gap": {}, "open": 0, "body": "# Phân hệ M6: Cấu Hình Hệ Thống\n\n## Tóm tắt\n\nThiết lập cấu hình vận hành cơ sở trường học: hồ sơ trường, tài khoản người dùng, cấu hình học phí & hoàn tiền nghỉ học M+1, nhận diện khuôn mặt mẫu, feature flags và quy tắc thông báo.\n\nPhân hệ bao gồm **6 sub-modules** được quản lý chặt chẽ theo kỷ luật Harness Loop.\n\n## Bản đồ\n\n| Mã FID | Mã Phân hệ | Tên Màn hình / Sub-module | Độ ưu tiên | Route |\n|---|---|---|---|---|\n| `F002` | `M6/SM1` | [Hồ sơ Trường học & Thiết lập Vận hành](../screens/m6-sm1-truong.md) | `P0` | `/school/info` |\n| `F003` | `M6/SM2` | [Quản lý Tài khoản & Phân quyền Quản trị](../screens/m6-sm2-tai-khoan.md) | `P0` | `/setting/users` |\n| `F013` | `M6/SM3` | [Cấu hình Hoàn tiền Nghỉ học & Cổng Thanh toán](../screens/m6-sm3-hoc-phi.md) | `P1` | `/setting/fee` |\n| `F036` | `M6/SM4` | [Quản lý Dữ liệu Khuôn mặt Học sinh (Face ID)](../screens/m6-sm4-nhan-dien.md) | `P2` | `/setting/face-recognition` |\n| `F037` | `M6/SM5` | [Quản lý Bật/Tắt Tính năng Trường học (Feature Flags)](../screens/m6-sm5-tinh-nang.md) | `P2` | `/setting/activity` |\n| `F038` | `M6/SM6` | [Cấu hình Lịch & Quy tắc Thông báo Toàn trường](../screens/m6-sm6-thong-bao.md) | `P2` | `/setting/notification` |\n\n## Liên quan\n\n- [Tổng quan School Operating Portal](project-overview.md)\n- [Mục lục LLM Wiki](../../index.md)\n- [Quy chuẩn SCHEMA](../../SCHEMA.md)\n"}, {"path": "pages/overview/module-m7-dang-nhap.md", "title": "Phân hệ M7: Cổng Xác Thực & Đăng Nhập", "type": "overview", "group": "overview", "fm": {"title": "\"Phân hệ M7: Cổng Xác Thực & Đăng Nhập\"", "type": "overview", "sources": ["docs/PRD_School_Operating_Portal_VI.md"], "updated": "2026-11-04"}, "gap": {}, "open": 0, "body": "# Phân hệ M7: Cổng Xác Thực & Đăng Nhập\n\n## Tóm tắt\n\nCổng vào hệ thống duy nhất, hỗ trợ 2 phương thức xác thực độc lập: SSO Sở GD&ĐT và Tài khoản quản trị Finviet.\n\nPhân hệ bao gồm **1 sub-modules** được quản lý chặt chẽ theo kỷ luật Harness Loop.\n\n## Bản đồ\n\n| Mã FID | Mã Phân hệ | Tên Màn hình / Sub-module | Độ ưu tiên | Route |\n|---|---|---|---|---|\n| `F001` | `M7/SM2` | [Cổng Đăng nhập (SSO Sở GD&ĐT & Tài khoản Finviet)](../screens/m7-sm2-dang-nhap.md) | `P0` | `/signin, /sso/login` |\n\n## Liên quan\n\n- [Tổng quan School Operating Portal](project-overview.md)\n- [Mục lục LLM Wiki](../../index.md)\n- [Quy chuẩn SCHEMA](../../SCHEMA.md)\n"}, {"path": "pages/overview/project-overview.md", "title": "Tổng quan School Operating Portal", "type": "overview", "group": "overview", "fm": {"title": "\"Tổng quan School Operating Portal\"", "type": "overview", "sources": ["docs/PRD_School_Operating_Portal_VI.md", "docs/PRD_Dang_Nhap_VI.md"], "updated": "2026-11-04"}, "gap": {}, "open": 0, "body": "# Tổng quan School Operating Portal\n\n## Tóm tắt\n\n**School Operating Portal** là nền tảng quản trị và vận hành giáo dục đa trường (multi-tenant) cấp doanh nghiệp, được thiết kế chuyên biệt cho các cơ sở giáo dục Mầm non và Phổ thông liên cấp (K-12) tại Việt Nam.\n\nHệ thống bao gồm đầy đủ **7 phân hệ lớn** và **38 sub-modules nghiệp vụ**, được quản lý và thi công theo chuẩn **Antigravity Harness Loop Kit v0.5.0** với kỷ luật bất biến **WIP = 1**, Nguồn sự thật duy nhất (**LLM Wiki SSOT**), và Cổng kiểm chứng nhị phân toàn phổ (**Verify Gate**).\n\n## Bản đồ\n\n### 1. Danh sách 7 Phân hệ Lớn\n\n| Mã | Phân hệ | Quy mô | Mô tả trọng tâm |\n|---|---|---|---|\n| `M7` | [Phân hệ M7: Cổng Xác Thực & Đăng Nhập](module-m7-dang-nhap.md) | 1 sub-modules | Cổng vào hệ thống duy nhất, hỗ trợ 2 phương thức xác thực độc lập: SSO... |\n| `M1` | [Phân hệ M1: Tổng Quan Điều Hành](module-m1-tong-quan.md) | 1 sub-modules | Bảng điều khiển trung tâm hiển thị các chỉ số KPI vận hành, tỷ lệ hoàn... |\n| `M2` | [Phân hệ M2: Vận Hành Lớp Học](module-m2-van-hanh.md) | 6 sub-modules | Tập trung các nghiệp vụ hàng ngày của giáo viên và học sinh: điểm danh... |\n| `M3` | [Phân hệ M3: Quản Lý Học Tập](module-m3-hoc-tap.md) | 3 sub-modules | Tiêu chuẩn hóa thời khóa biểu tuần, giao và chấm bài tập về nhà, cùng ... |\n| `M4` | [Phân hệ M4: Quản Trị Tài Chính & Học Phí](module-m4-tai-chinh.md) | 7 sub-modules | Quản lý toàn diện hóa đơn học phí VietQR động, 24 khoản phí Master, bi... |\n| `M5` | [Phân hệ M5: Quản Trị Nhà Trường](module-m5-nha-truong.md) | 14 sub-modules | Quản trị dữ liệu gốc trường học (học sinh 360°, giáo viên, lớp, môn, k... |\n| `M6` | [Phân hệ M6: Cấu Hình Hệ Thống](module-m6-cau-hinh.md) | 6 sub-modules | Thiết lập cấu hình vận hành cơ sở trường học: hồ sơ trường, tài khoản ... |\n\n### 2. Danh mục Toàn bộ 38 Sub-modules Nghiệp vụ\n\n| Mã FID | Mã Cũ | Tên Sub-module | Mức ưu tiên | Phân loại | Route |\n|---|---|---|---|---|---|\n| `F001` | `M7/SM2` | [Cổng Đăng nhập (SSO Sở GD&ĐT & Tài khoản Finviet)](../screens/m7-sm2-dang-nhap.md) | `P0` | `Authentication` | `/signin, /sso/login` |\n| `F002` | `M6/SM1` | [Hồ sơ Trường học & Thiết lập Vận hành](../screens/m6-sm1-truong.md) | `P0` | `Settings` | `/school/info` |\n| `F003` | `M6/SM2` | [Quản lý Tài khoản &  "sources": ["docs/PRD_School_Operating_Portal_VI.md", "docs/PRD_Dang_Nhap_VI.md"], "updated": "2026-11-04"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Thời khóa biểu Tuần & Lịch sử Phiên bản (`M3/SM1`)\n\n## Mục đích\n\nLập lịch thời khóa biểu tuần theo tiết học, môn học, phòng học và giáo viên phụ trách; lưu vết lịch sử phiên bản gửi thông báo đến phụ huynh.\n\nThuộc phân hệ **[Học tập](../overview/module-m3-hoc-tap.md)**. Mã định danh tính năng Harness Loop: **`F019`** (Mức ưu tiên: `P1`).\n\n## App / route / file code\n\n- **Route ứng dụng**: `/school/schedule`\n- **Tài liệu đặc tả nguồn**: `docs/PRD_School_Operating_Portal_VI.md` (hoặc `docs/PRD_Dang_Nhap_VI.md`)\n- **Tệp mã nguồn liên quan**:\n  - `docs/src/types/schedule.ts`\n  - `docs/src/utils/scheduleValidation.ts`\n  - `docs/tests/unit/schedule.test.mjs`\n\n## Yêu cầu spec\n\n- **SPEC-F019-01**: Ma trận thời khóa biểu linh hoạt: khởi tạo 1 tiết, bấm [+] thêm tiết, các cột Thứ 2 - Thứ 7 để trống chờ nhập.\n- **SPEC-F019-02**: Menu ba chấm (•••) z-index cao: Xem chi tiết, Chỉnh sửa, Gửi phụ huynh (kèm modal xác nhận), Tải xuống, Xóa.\n- **SPEC-F019-03**: Lưu vết lịch sử các phiên bản công bố thời khóa biểu.\n\n## Khác biệt spec ↔ code\n\n| Mã yêu cầu | Mô tả tóm tắt | Hiện trạng | Bằng chứng mã nguồn | Ghi chú theo dõi |\n|---|---|---|---|---|\n| `SPEC-F019-01` | Ma trận thời khóa biểu linh hoạt: khởi tạo 1 tiết, bấm [+] t... | `MISSING` | repo:app/src/types/schedule.ts:1 | Cần triển khai và verify |\n| `SPEC-F019-02` | Menu ba chấm (•••) z-index cao: Xem chi tiết, Chỉnh sửa, Gửi... | `MISSING` | repo:app/src/types/schedule.ts:1 | Cần triển khai và verify |\n| `SPEC-F019-03` | Lưu vết lịch sử các phiên bản công bố thời khóa biểu.... | `MISSING` | repo:app/src/types/schedule.ts:1 | Cần triển khai và verify |\n\n## Liên quan\n\n- Phân hệ cha: [Học tập](../overview/module-m3-hoc-tap.md)\n- Tổng quan hệ thống: [Tổng quan School Operating Portal](../overview/project-overview.md)\n- [Mục lục LLM Wiki] 3-diem-danh-gia.md", "title": "Sổ điểm & Đánh giá Học tập Định kỳ", "type": "screen", "group": "screens", "fm": {"title": "\"Sổ điểm & Đánh giá Học tập Định kỳ\"", "type": "screen", "sources": ["docs/PRD_School_Operating_Portal_VI.md", "docs/PRD_Dang_Nhap_VI.md"], "updated": "2026-11-04"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Sổ điểm & Đánh giá Học tập Định kỳ (`M3/SM3`)\n\n## Mục đích\n\nSổ điểm điện tử chuẩn Bộ Giáo dục & Đào tạo ghi nhận điểm số (miệng, 15 phút, 1 tiết, giữa kỳ, cuối kỳ) và rubric đánh giá định kỳ cho học sinh mầm non.\n\nThuộc phân hệ **[Học tập](../overview/module-m3-hoc-tap.md)**. Mã định danh tính năng Harness Loop: **`F021`** (Mức ưu tiên: `P1`).\n\n## App / route / file code\n\n- **Route ứng dụng**: `/school/scoreboard`\n- **Tài liệu đặc tả nguồn**: `docs/PRD_School_Operating_Portal_VI.md` (hoặc `docs/PRD_Dang_Nhap_VI.md`)\n- **Tệp mã nguồn liên quan**:\n  - `docs/src/types/gradebook.ts`\n  - `docs/src/utils/gradebookValidation.ts`\n  - `docs/tests/unit/gradebook.test.mjs`\n\n## Yêu cầu spec\n\n- **SPEC-F021-01**: Ma trận nhập điểm số linh hoạt theo môn học, lớp và học kỳ.\n- **SPEC-F021-02**: Rubric đánh giá định kỳ cho các cấp học mầm non và tiểu học.\n- **SPEC-F021-03**: Tính điểm trung bình môn tự động theo trọng số quy chuẩn.\n\n## Khác biệt spec ↔ code\n\n| Mã yêu cầu | Mô tả tóm tắt | Hiện trạng | Bằng chứng mã nguồn | Ghi chú theo dõi |\n|---|---|---|---|---|\n| `SPEC-F021-01` | Ma trận nhập điểm số linh hoạt theo môn học, lớp và học kỳ.... | `MISSING` | repo:app/src/types/gradebook.ts:1 | Cần triển khai và verify |\n| `SPEC-F021-02` | Rubric đánh giá định kỳ cho các cấp học mầm non và tiểu học.... | `MISSING` | repo:app/src/types/gradebook.ts:1 | Cần triển khai và verify |\n| `SPEC-F021-03` | Tính điểm trung bình môn tự động theo trọng số quy chuẩn.... | `MISSING` | repo:app/src/types/gradebook.ts:1 | Cần triển khai và verify |\n\n## Liên quan\n\n- Phân hệ cha: [Học tập](../overview/module-m3-hoc-tap.md)\n- Tổng quan hệ thống: [Tổng quan School Operating Portal](../overview/project-overview.md)\n- [Mục lục LLM Wiki](../../index.md)\n"}, {"path": "pages/screens/m4-sm1-hoc-phi.md", "title": "Lập Hóa đơn Học phí & Thu phí VietQR Động", "type": "screen", "group": "screens", "fm": {"title": "\"Lập Hóa đơn Học phí & Thu phí VietQR Động\"", "type": "screen", "sources": ["docs/PRD_School_Operating_Portal_VI.md", "docs/PRD_Dang_Nhap_VI.md"], "updated": "2026-11-04"}, "gap": {"gap": {"OK": 4}}, "open": 0, "body": "# Lập Hóa đơn Học phí & Thu phí VietQR Động (`M4/SM1`)\n\n## Mục đích\n\nPhát hành hóa đơn thu phí học sinh (toàn trường, khối, lớp, cá nhân), tự động khấu trừ ngày ăn tháng trước (M+1), tự động áp dụng chính sách miễn giảm, hỗ trợ giảm tiền mặt cố định và tích hợp mã VietQR động.\n\nThuộc phân hệ **[Tài chính](../overview/module-m4-tai-chinh.md)**. Mã định danh tính năng Harness Loop: **`F015`** (Mức ưu tiên: `P1`).\n\n## App / route / file code\n\n- **Route ứng dụng**: `/school/fee`\n- **Tài liệu đặc tả nguồn**: `docs/PRD_School_Operating_Portal_VI.md` (hoặc `docs/PRD_Dang_Nhap_VI.md`)\n- **Tệp mã nguồn liên quan**:\n  - `docs/src/types/invoice.ts`\n  - `docs/src/utils/invoiceValidation.ts`\n  - `docs/tests/unit/invoices.test.mjs`\n\n## Yêu cầu spec\n\n- **SPEC-F015-01**: Tự động nhận diện số ngày nghỉ có phép tháng trước từ phân hệ Điểm danh để tính khấu trừ tiền ăn trên dòng hóa đơn.\n- **SPEC-F015-02**: Bảng chi tiết dòng khoản thu chuẩn hóa: cột 'Giảm trừ', định dạng đơn giá dấu chấm, chuyển đổi linh hoạt giữa [%] và [đ].\n- **SPEC-F015-03**: Tự động áp dụng chính sách miễn giảm cao nhất và sinh mã VietQR động chuẩn ngân hàng theo số tiền thực thu.\n- **SPEC-F015-04**: Quản lý vòng đời hóa đơn: Đã tạo, Đã gửi, Nộp một phần, Đã hoàn thành, Quá hạn, Đã hủy.\n\n## Khác biệt spec ↔ code\n\n| Mã yêu cầu | Mô tả tóm tắt | Hiện trạng | Bằng chứng mã nguồn | Ghi chú theo dõi |\n|---|---|---|---|---|\n| `SPEC-F015-01` | Tự động nhận diện số ngày nghỉ có phép tháng trước từ phân 003`** (Mức ưu tiên: `P0`).\n\n## App / route / file code\n\n- **Route ứng dụng**: `/setting/users`\n- **Tài liệu đặc tả nguồn**: `docs/PRD_School_Operating_Portal_VI.md` (hoặc `docs/PRD_Dang_Nhap_VI.md`)\n- **Tệp mã nguồn liên quan**:\n  - `docs/src/types/account.ts`\n  - `docs/src/utils/accountValidation.ts`\n  - `docs/tests/unit/account.test.mjs`\n\n## Yêu cầu spec\n\n- **SPEC-F003-01**: Danh sách người dùng hệ thống phân loại theo vai trò (Admin, Teacher, Accountant, Staff).\n- **SPEC-F003-02**: Tạo mới, kích hoạt, khóa tài khoản và thiết lập lại mật khẩu an toàn.\n- **SPEC-F003-03**: Bộ lọc chuyên biệt đối chiếu tài khoản liên kết CSDL Sở GD&ĐT.\n\n## Khác biệt spec ↔ code\n\n| Mã yêu cầu | Mô tả tóm tắt | Hiện trạng | Bằng chứng mã nguồn | Ghi chú theo dõi |\n|---|---|---|---|---|\n| `SPEC-F003-01` | Danh sách người dùng hệ thống phân loại vai trò | `OK` | repo:app/tests/unit/account.test.mjs:51 | Verify Gate 22/22 tests PASS |\n| `SPEC-F003-02` | Tạo mới, kích hoạt, khóa và đổi mật khẩu | `OK` | repo:app/tests/unit/account.test.mjs:101 | Verify Gate 22/22 tests PASS |\n| `SPEC-F003-03` | Bộ lọc đối chiếu tài khoản liên kết CSDL Sở GD&ĐT | `OK` | repo:app/tests/unit/account.test.mjs:85 | Verify Gate 22/22 tests PASS |\n\n## Liên quan\n\n- Phân hệ cha: [Cấu hình](../overview/module-m6-cau-hinh.md)\n- Tổng quan hệ thống: [Tổng quan School Operating Portal](../overview/project-overview.md)\n- [Mục lục LLM Wiki](../../index.md)\n"}, {"path": "pages/screens/m6-sm3-hoc-phi.md", "title": "Cấu hình Hoàn tiền Nghỉ học & Cổng Thanh toán", "type": "screen", "group": "screens", "fm": {"title": "\"Cấu hình Hoàn tiền Nghỉ học & Cổng Thanh toán\"", "type": "screen", "sources": ["docs/PRD_School_Operating_Portal_VI.md", "docs/PRD_Dang_Nhap_VI.md"], "updated": "2026-11-04"}, "gap": {"gap": {"OK": 4}}, "open": 0, "body": "# Cấu hình Hoàn tiền Nghỉ học & Cổng Thanh toán (`M6/SM3`)\n\n## Mục đích\n\nThiết lập cơ chế hoàn tiền khi học sinh nghỉ học (tỷ lệ hoàn tiền ăn/xe theo ngày  N.forEach(n=>{if(!visible(n))return;const near=focus>=0&&(n.i===focus||adj[focus].has(n.i));if(view.k>1.8||near||(focus<0&&n.deg>=HUBMIN))ctx.fillText(n.title.slice(0,40),n.x+n.r+2/view.k,n.y+4/view.k)})}
function toWorld(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-W/2-view.x)/view.k,y:(ev.clientY-r.top-H/2-view.y)/view.k}}
function hit(ev){const p=toWorld(ev);let best=-1,bd=1e9;N.forEach(n=>{if(!visible(n))return;const d=(n.x-p.x)**2+(n.y-p.y)**2;if(d<(n.r+4/view.k)**2&&d<bd){bd=d;best=n.i}});return best}
function resize(){dirty=true;dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
function fit(){const vis=N.filter(visible);if(!vis.length)return;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;vis.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)});
 const k=Math.min(W/(x1-x0+80),H/(y1-y0+80),3);view.k=isFinite(k)&&k>0.02?k:0.5;dirty=true;view.x=-(x0+x1)/2*view.k;view.y=-(y0+y1)/2*view.k}
function select(i){sel=i;const d=document.getElementById('detail');if(i<0){d.innerHTML='<div class="muted">Chọn một node.</div>';return}
 const n=N[i],fm=n.fm||{},rows=Object.keys(fm).filter(k=>k!=='title').map(k=>'<tr><td>'+esc(k)+'</td><td>'+esc(Array.isArray(fm[k])?fm[k].join(', '):fm[k])+'</td></tr>').join('');
 const gl=Object.assign({},(n.gap||{}).gap||{},(n.gap||{}).doc||{}),chips=Object.keys(gl).map(k=>'<span class="tag L-'+k+'">'+k+' '+gl[k]+'</span>').join('')+(n.open?'<span class="tag oq">câu hỏi mở '+n.open+'</span>':'');
 dirty=true;const out=OUT[i],inn=IN[i];
 const lst=a=>a.map(j=>'<a href="#'+encodeURIComponent(N[j].path)+'"><span class="dot" style="display:inline-block;width:8px;height:8px;background:'+color(N[j])+'"></span> '+esc(N[j].title)+'</a>').join('')||'<span class="muted">—</span>';
 d.innerHTML='<div class="chips"><span class="tag" style="background:'+color(n)+';color:#fff">'+esc(NAMES[n.group]||n.group)+'</span>'+(n.type?'<span class="tag">type: '+esc(n.type)+'</span>':'')+'</div><h1>'+esc(n.title)+'</h1><div class="path">'+esc(n.path)+'</div>'+
  (chips?'<div class="chips" style="margin-top:8px">'+chips+'</div>':'')+(rows?'<table class="fm">'+rows+'</table>':'')+
  '<div class="links" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0"><div><div class="muted">Link ra ('+out.length+')</div>'+lst(out)+'</div><div><div class="muted">Link vào ('+inn.length+')</div>'+lst(inn)+'</div></div>'+
  '<div class="md" id="mdbody">'+(n.body!==undefined?md(n.body,n.path):(LIVE?'<div class="muted">Đang tải nội dung…</div>':'<div class="muted">Bản lite: không kèm nội dung trang. Dùng <code>wiki_viewer.py --serve</code> hoặc build không có <code>--lite</code>.</div>'))+'</div>';d.scrollTop=0;
 if(n.body===undefined&&LIVE)fetch('body?p='+encodeURIComponent(n.path),{cache:'no-store'}).then(r=>r.json()).then(j=>{n.body=j.body;if(sel===i){const el=document.getElementById('mdbody');if(el)el.innerHTML=md(n.body,n.path)}}).catch(()=>{})}
function route(){const p=decodeURIComponent(location.hash.slice(1));if(byPath[p]!==undefined){select(byPath[p]);const n=N[byPath[p]];if(drag===null&&n){view.x=-n.x*view.k;view.y=-n.y*view.k}}else if(sel>=N.length)select(-1)}
window.addEventListener('hashchange',route);window.addEventListener('resize',resize);
cv.addEventListener('wheel',ev=>{ev.preventDefault();dirty=true;const f=Math.exp(-ev.deltaY*.0015),r=cv.getBoundingClientRect(),mx=ev.clientX-r.left-W/2,my=ev.clientY-r.top-H/2;view.x=mx-(mx-view.x)*f;view.y=my-(my-view.y)*f;view.k*=f},{passive:false});
cv.addEventListener('mousedown',ev=>{const i=hit(ev);drag={n:i>=0?N[i]:null,x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,moved:false}});
window.addEventListener('mousemove',ev=>{if(!drag){const h=hit(ev);if(h!==hov){hov=h;dirty=true;cv.style.cursor=h>=0?'pointer':'grab'}return}
 if(Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y)>3)drag.moved=true;if(drag.n){const p=toWorld(ev);drag.n.x=p.x;drag.n.y=p.y;alpha=Math.max(alpha,.3)}else{view.x=drag.vx+ev.clientX-drag.x;view.y=drag.vy+ev.clientY-drag.y}dirty=true});
window.addEventListener('mouseup',ev=>{if(drag&&!drag.moved&&drag.n){const p=drag.n.path;drag=null;location.hash=encodeURIComponent(p);return}drag=null});
document.getElementById('groups').addEventListener('click',ev=>{const g=ev.target.closest('.grp');if(!g)return;const k=g.dataset.g;hidden.has(k)?hidden.delete(k):hidden.add(k);g.classList.toggle('off');alpha=.6;dirty=true});
document.getElementById('local').addEventListener('change',()=>{alpha=.6;setTimeout(fit,400)});
document.getElementById('fit').addEventListener('click',fit);
const q=document.getElementById('q'),res=document.getElementById('results');
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(!s){res.innerHTML='';return}
 res.innerHTML=N.filter(n=>(n.title+' '+n.path).toLowerCase().includes(s)).slice(0,30).map(n=>'<div data-p="'+esc(n.path)+'"><span class="dot" style="display:inline-block;width:8px;height:8px;background:'+color(n)+'"></span> '+esc(n.title)+'</div>').join('')||'<div class="muted">Không thấy</div>'});
q.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=res.querySelector('[data-p]');if(f)location.hash=encodeURIComponent(f.dataset.p)}});
res.addEventListener('click',ev=>{const d=ev.target.closest('[data-p]');if(d)location.hash=encodeURIComponent(d.dataset.p)});
async function load(){const r=await fetch('data.json',{cache:'no-store'});setup(await r.json())}
if(LIVE){const b=document.getElementById('reload');b.hidden=false;b.addEventListener('click',load);window.addEventListener('focus',load)}
resize();if(DATA)setup(DATA);else load();requestAnimationFrame(draw);
</script></body></html>
