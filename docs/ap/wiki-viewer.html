 tập lưu vết học bạ liên trường |\n| NT-01 | **Khóa đồng bộ kỳ thi Sở GD&ĐT (`is_sync_locked` - OQ-15):** Khi Sở chốt kỳ thi, thông tin định danh (`full_name`, `dob`, `gender`, `national_id_number`, `moet_student_code`) bị khóa cứng chỉ đọc; mở khóa cần phê duyệt BGH và ghi log `SyncLockAuditTrail` | Xem [Kiến trúc tích hợp CSDL Sở](../concepts/csdl-so-integration.md) |\n| NT-01 | **Quyền riêng tư AI & Tranh chấp giám hộ (OQ-16):** Cờ `opt_out_face_ai` yêu cầu bỏ qua nhận diện AI và làm mờ ảnh; danh sách `restricted_guardians` lưu phán quyết Tòa án hạn chế tiếp cận trẻ, kích hoạt cảnh báo đỏ khi đón/trả | Xem [Đường ống AI](../concepts/ai-face-recognition.md) |\n| NT-02 | **Thôi học giữa kỳ & Thu hồi Mobile App (OQ-17):** Chuyển trạng thái `WITHDRAWN`, lập Biên bản thanh lý Pro-rata, thu hồi quyền chat/điểm danh, chuyển Mobile App sang `READ_ONLY_ARCHIVE` | Xem [Vòng đời học sinh](../concepts/student-lifecycle-transitions.md) |\n| NT-01 | **Sổ dặn thuốc y tế & Lịch sử uống thuốc (OQ-19):** Tab Điểm danh/Y tế tiếp nhận đơn dặn thuốc từ phụ huynh, hiển thị đơn thuốc/liều lượng/ảnh toa, và lưu vết nhật ký uống thuốc `student_medical_logs` | Phục vụ kiểm toán y tế học đường |\n| NT-01 | **Ngày bắt đầu học chính thức (`enrollment_date` - OQ-22):** Ghi nhận ngày nhập học chính thức để kích hoạt công thức tính học phí và tiền ăn lẻ ngày Prorated cho học sinh nhập học giữa tháng | Xem [Hóa đơn học phí](tuition-invoice.md) |\n| NT-01 | **Nhóm gia đình Sibling Discount (`primary_phone` - OQ-23):** Tự động liên kết các anh chị em ruột qua số điện thoại chính và CCCD phụ huynh, sắp xếp theo `dob` để tự động áp dụng giảm trừ cho con thứ 2/thứ 3 | Xem [Chính sách miễn giảm](discount-policy.md) |\n\n## Quan hệ\n- Thuộc về [Lớp học](classroom.md).\n- Có nhiều bản ghi [Điểm danh hằng ngày](attendance-daily.md).\n- Có nhiều [Hóa đơn học phí](tuition-invoice.md).\n- Có hồ sơ đóng băng tại [Hồ sơ lưu trữ học sinh](student-archive-record.md) khi chuyển trường/thôi học.\n- Thụ hưởng [Chính sách miễn giảm](discount-policy.md) và [Khấu trừ hoàn tiền ăn](meal-refund-credit.md).\n- Xuất hiện trong các ảnh tại [Thư viện media](media-album.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-01 | Quản lý danh bạ và hồ sơ học sinh 360° với 5 tab ngữ cảnh chuyên sâu | Prototype giao diện tab hồ sơ học sinh chưa kết nối CSDL PostgreSQL | MISSING | repo:app/src/features/students/ |\n| NT-02 | Chuyển lớp học sinh và chuyển năm học hàng loạt với bảo toàn kết quả học tập | Logic chuyển lớp hàng loạt chưa cài đặt backend API | MISSING | repo:app/src/features/students/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-15, OQ-16, OQ-17, OQ-19, OQ-22, OQ-23).\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Kiến trúc tích hợp CSDL Sở](../concepts/csdl-so-integration.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Vòng đời chuyển tiếp học sinh](../concepts/student-lifecycle-transitions.md)\n- [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md)\n- [Luồng quản lý hồ sơ học sinh 360](../flows/fl-quan-ly-ho-so-hoc-sinh-360.md)\n"}, {"path": "pages/entities/teacher-staff.md", "title": "Giáo Viên & Nhân Viên (Teacher & Staff)", "type": "entity", "group": "entities", "fm": {"title": "Giáo Viên & Nhân Viên (Teacher & Staff)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["NT-03", "NT-10"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Giáo Viên & Nhân Viên (Teacher & Staff)\n\n## Định nghĩa\nThực thể lưu trữ danh bạ nhân sự, thông tin hợp đồng, trình độ chuyên môn, vai trò phân công công việc (Chủ nhiệm, Bộ môn, Cán bộ bán trú, Kế toán) và quyền hạn kiểm duyệt nội dung của cán bộ giáo viên, nhân viên nhà trường.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| NT-03 | Phân quyền kiểm duyệt nội dung 2 cấp: Giáo viên chính được đăng bài hoạt động trực tiếp; Giáo viên hỗ trợ chuyển bài sang trạng thái Chờ duyệt | Trường `approval_role` (`direct_publish` hoặc `require_approval`) |\n| NT-03 | Quản lý phân công lớp chủ nhiệm và môn học giảng dạy theo từng học kỳ | Một giáo viên có thể dạy nhiều môn tại nhiều lớp |\n| NT-10 | Điểm danh theo ca làm việc (ca sáng, ca chiều) và tổng hợp bảng chấm công tháng | Hỗ trợ chấm công định vị hoặc vân tay/khuôn mặt |\n\n## Quan hệ\n- Chủ nhiệm hoặc giảng dạy tại [Lớp học](classroom.md).\n- Thực hiện [Điểm danh hằng ngày](attendance-daily.md) cho học sinh.\n- Đăng tải bài viết tại [Bảng tin hoạt động lớp](class-activity.md).\n- Tạo và phát hành [Thời khóa biểu tuần](timetable-weekly.md) và [Bài tập về nhà](homework-assignment.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-03 | Quản lý danh bạ giáo viên và cơ chế kiểm duyệt nội dung bài đăng 2 cấp | Frontend prototype chưa tích hợp trạng thái phân quyền duyệt bài | MISSING | repo:app/src/features/teachers/ |\n| NT-10 | Điểm danh ca làm việc và tổng hợp bảng chấm công nhân viên nhà trường | Màn hình chấm công nhân viên đang dùng dữ liệu mock | MISSING | repo:app/src/features/staff-attendance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-06).\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình giáo viên](../screens/m5-sm2-giao-vien.md)\n- [Luồng phân công giáo viên và kiểm duyệt](../flows/fl-phan-cong-giao-vien-kiem-duyet.md)\n"}, {"path": "pages/entities/timetable-weekly.md", "title": "Thời Khóa Biểu Tuần (Weekly Timetable)", "type": "entity", "group": "entities", "fm": {"title": "Thời Khóa Biểu Tuần (Weekly Timetable)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["HT-01"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thời Khóa Biểu Tuần (Weekly Timetable)\n\n## Định nghĩa\nThực thể Thời khóa biểu tuần lưu trữ lịch học chi tiết từ thứ Hai đến thứ Bảy theo các tiết học (tiết 1 đến tiết 10), phòng học, môn học và giáo viên phụ trách của từng lớp học trong trường, đồng thời tích hợp bộ điều phối xung đột lịch giữa lớp chính khóa và ngoại khóa.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| HT-01 | Phân bổ lịch học theo ngày trong tuần, thứ tự tiết học, môn học, giáo viên bộ môn và phòng học | Trực quan hóa dạng lưới ma trận |\n| HT-01 | Kiểm tra xung đột lịch cơ bản: Cảnh báo khi một giáo viên hoặc một phòng học bị xếp trùng giờ tại hai lớp khác nhau | Ngăn chặn xung đột lịch giảng dạy |\n| HT-01 | Điều phối xung đột 4 chiều chính khóa & ngoại khóa (OQ-14): Kiểm tra thời gian thực trên 4 chiều: Học sinh, Giáo viên, Phòng học/sân bãi, Sĩ số tối đa; chặn lưu cứng khi có xung đột | Chi tiết tại [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md) |\n| HT-01 | Quản lý trạng thái: Bản nháp (`draft`) và Đã công bố (`published`); lưu lịch sử các phiên bản điều chỉnh | Phụ huynh xem được bản đã công bố |\n\n## Quan hệ\n- Thuộc về một [Lớp học](classroom.md).\n- Gắn với [Giáo viên & Nhân viên](teacher-staff.md) giảng dạy.\n- Hiển thị trên [Màn hình thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-01 | Thiết lập và công bố thời khóa biểu tuần theo tiết học, môn học, phòng học và giáo viên | Prototype thời khóa biểu frontend dùng dữ liệu tĩnh, chưa có API lưu vết | MISSING | repo:app/src/features/academics/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-14).\n\n## Liên quan\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Màn hình thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md)\n- [Luồng lập thời khóa biểu](../flows/fl-lap-thoi-khoa-bieu.md)\n"}, {"path": "pages/entities/tuition-invoice.md", "title": "Hóa Đơn Học Phí (Tuition Invoice)", "type": "entity", "group": "entities", "fm": {"title": "Hóa Đơn Học Phí (Tuition Invoice)", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-01", "TC-02"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Hóa Đơn Học Phí (Tuition Invoice)\n\n## Định nghĩa\nThực thể Hóa đơn học phí thể hiện nghĩa vụ tài chính định kỳ (theo tháng hoặc học kỳ) của học sinh đối với nhà trường, bao gồm học phí chính khóa, tiền ăn, tiền dịch vụ, các khoản miễn giảm, hoàn tiền ăn khấu trừ, và hỗ trợ cấu trúc Sub-invoice phân rã ngoại khóa.\n\n## Thuộc tính / quy tắc nghiệp vụ\n| Mã | Quy tắc | Ghi chú |\n|---|---|---|\n| TC-01 | Tích hợp mã VietQR động chứa số tài khoản trường, số tiền chính xác và mã hóa đơn duy nhất | Phụ huynh quét mã thanh toán tự động khớp lệnh |\n| TC-01 | Trạng thái hóa đơn: `draft` (Nháp), `issued` (Đã phát hành), `partial_paid` (Nộp một phần), `paid` (Đã thanh toán đủ), `overdue` (Quá hạn), `cancelled` (Đã hủy), `frozen_under_review` (Đóng băng chờ tra soát) | Quản lý bằng Finite State Machine (FSM) |\n| TC-01 | Phân rã Sub-Invoice lớp ngoại khóa (OQ-14): Dòng phí ngoại khóa định danh `is_separable = true`, cho phép thanh toán riêng hoặc tách thành hóa đơn con độc lập (`INV-EXT-...`) khi phụ huynh từ chối đóng | Chi tiết tại [Điều phối ngoại khóa](../concepts/extracurricular-billing-scheduling.md) |\n| TC-02 | Tự động tính và hiển thị dòng khấu trừ hoàn tiền ăn ngày nghỉ có phép tháng M vào hóa đơn tháng M+1 | Huy hiệu xanh `\"Hoàn tiền: -X đ\"` |\n| TC-02 | Áp dụng số dư tín dụng `credit_balance` từ kỳ trước; nếu hoàn thừa tiếp tục sinh `credit_balance` mới | Hóa đơn không bao giờ âm trên cổng thanh toán |\n| TC-01 | Xử lý Race condition: Khóa `SELECT ... FOR UPDATE`; nếu hóa đơn đã `cancelled` mà nhận tiền VietQR, giao dịch chuyển vào `UNMATCHED_SUSPENSE_POOL` | Kế toán 1-chạm kết chuyển Credit Balance hoặc chi hoàn |\n| TC-01 | Bảo toàn công nợ: Hóa đơn chưa thanh toán gắn chặt với `student_id`, độc lập với trạng thái đóng/lưu trữ của lớp học | Mang công nợ sang niên khóa mới (Carried-over Debt) |\n| TC-01 | Hủy hóa đơn tương lai khi thôi học giữa kỳ (OQ-17): Khi học sinh rút hồ sơ, hệ thống tự động quét và hủy vĩnh viễn các hóa đơn dự kiến chưa đến hạn | Tránh phát sinh công nợ ảo |\n| TC-01 | Giao dịch VietQR bất thường thừa/thiếu & Đóng băng tra soát (OQ-18): Chuyển thừa kết chuyển Credit Balance; chuyển thiếu vào `partial_paid` và sinh lại mã VietQR nợ; tra soát ngân hàng chuyển sang `frozen_under_review` chặn xuất hóa đơn điện tử VAT | Xem [Kiến trúc VietQR động](../concepts/vietqr-dynamic-reconciliation.md) |\n| TC-01 | Học sinh nhập học giữa tháng Prorated (OQ-22): Tự động tính học phí theo tỷ lệ ngày học còn lại trong tháng và tiền ăn theo số ngày ăn thực tế còn lại từ ngày nhập học đến cuối tháng | Phí trọn gói ban đầu tính nguyên giá |\n| TC-01 | Hóa đơn riêng lẻ độc lập cho từng học sinh (OQ-22): Hệ thống chỉ tạo hóa đơn riêng lẻ cho từng học sinh, tuyệt đối không gộp chung hóa đơn gia đình; mỗi học sinh sở hữu mã hóa đơn riêng, mã VietQR động độc lập và gạch nợ riêng biệt | Chuẩn hóa VAT và hạch toán kế toán |\n| TC-02 | Chốt dữ liệu điểm danh tự động cuối tháng (OQ-21): Đợt hóa đơn tháng M+1 tự động truy xuất dữ liệu hoàn tiền ăn từ tháng M sau khi hệ thống tự động đóng băng sổ điểm danh vào 23:59:59 ngày cuối tháng | Tránh xung đột sửa điểm danh |\n| TC-01 | Toàn bộ giao dịch cập nhật trạng thái hóa đơn bắt buộc sử dụng Pessimistic Row Lock (`SELECT ... FOR UPDATE`) trong CSDL | Tuân thủ kiến trúc kiểm soát đồng thời |\n\n## Quan hệ\n- Thuộc về một [Hồ sơ học sinh 360](student-profile.md).\n- Chứa các dòng khoản thu từ [Danh mục khoản phí](fee-catalog-item.md).\n- Áp dụng các dòng [Chính sách miễn giảm](discount-policy.md) và [Khấu trừ hoàn tiền ăn](meal-refund-credit.md).\n- Khớp lệnh giao dịch trong [Màn hình đối soát](../screens/m4-sm2-doi-soat.md).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-01 | Lập hóa đơn học phí tháng cho học sinh tích hợp mã VietQR động chuyển khoản chính xác | Frontend prototype hiển thị VietQR tĩnh, chưa có API sinh mã động | MISSING | repo:app/src/features/finance/ |\n| TC-02 | Tự động rà soát ngày nghỉ có phép tháng M và khấu trừ tiền ăn vào hóa đơn tháng M+1 | Chưa có batch job tự động tạo dòng hoàn tiền ăn vào hóa đơn | MISSING | repo:app/src/features/finance/ |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-02, OQ-09, OQ-14, OQ-17, OQ-18, OQ-21, OQ-22).\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Kiến trúc thanh toán VietQR động](../concepts/vietqr-dynamic-reconciliation.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Màn hình học phí](../screens/m4-sm1-hoc-phi.md)\n- [Luồng lập và phát hành hóa đơn](../flows/fl-lap-phat-hanh-hoa-don.md)\n"}, {"path": "pages/entities/weekly-menu.md", "title": "Thực Thể Thực Đơn Dinh Dưỡng Tuần", "type": "entity", "group": "entities", "fm": {"title": "Thực Thể Thực Đơn Dinh Dưỡng Tuần", "type": "entity", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-018-school-menu/epic.md"], "spec_ids": ["NT-09"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Thực Thể Thực Đơn Dinh Dưỡng Tuần\n\n## Định nghĩa\nĐại diện cho khẩu phần ăn bán trú của học sinh theo từng ngày trong tuần (từ Thứ Hai đến Thứ Sáu/Thứ Bảy), phân theo từng bữa ăn (bữa sáng, bữa trưa, bữa phụ xế chiều) và theo từng khối tuổi/lớp học.\n\n## Thuộc tính & Quy tắc nghiệp vụ\n- Khung thời gian: Theo tuần học, cho phép lập trước tối đa 8 tuần tiếp theo (`max_future_weeks = 8`).\n- Chi tiết bữa ăn: Tên món ăn, thành phần dinh dưỡng, cảnh báo dị ứng thực phẩm (nếu có).\n- Hỗ trợ tải lên thực đơn qua file Excel mẫu hoặc nhập trực tiếp trên lưới giao diện.\n- Trạng thái công bố: Bản nháp -> Đã duyệt -> Đã công bố tới phụ huynh. Khi công bố, gửi thông báo tới phụ huynh các lớp liên quan.\n\n## Quan hệ\n- Áp dụng cho một hoặc nhiều [Lớp học](classroom.md) hoặc [Khối lớp](grade-level.md).\n- Kết nối logic với [Khấu trừ hoàn tiền ăn](meal-refund-credit.md) khi học sinh có suất ăn trong thực đơn nhưng nghỉ học có phép.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-09 | Lập và công bố thực đơn dinh dưỡng theo tuần bảo đảm an toàn vệ sinh thực phẩm | Type `Menu`, giao diện tạo thực đơn và Redux slice | MISSING | repo:app/src/types/menu.ts:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Màn hình thực đơn](../screens/m5-sm8-thuc-don.md)\n- [Luồng lập thực đơn dinh dưỡng](../flows/fl-lap-thuc-don-dinh-duong.md)\n"}, {"path": "pages/flows/fl-bao-vang-hoan-tien.md", "title": "Luồng Báo Vắng Học Sinh & Tự Động Khấu Trừ Hoàn Tiền Ăn", "type": "flow", "group": "flows", "fm": {"title": "Luồng Báo Vắng Học Sinh & Tự Động Khấu Trừ Hoàn Tiền Ăn", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-04", "TC-02", "TC-08"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Luồng Báo Vắng Học Sinh & Tự Động Khấu Trừ Hoàn Tiền Ăn\n\n## Mục tiêu\nGhi nhận tình trạng nghỉ học của học sinh (đơn xin phép từ phụ huynh, giáo viên ghi nhận hoặc đón về nửa ngày do y tế), tự động tổng hợp số ngày vắng có phép trong tháng M theo snapshot đơn giá lớp học tại thời điểm vắng, và khấu trừ tiền ăn bán trú vào hóa đơn học phí tháng M+1 (kết chuyển Credit Balance nếu hoàn thừa) mà không cần kế toán tính thủ công.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Phụ huynh / GV | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Gửi đơn báo vắng trước 08:30 sáng hoặc đánh dấu Vắng có phép trên lưới điểm danh | Ghi nhận bản ghi điểm danh trạng thái vắng có phép hợp lệ (`excused_absence`) | VH-04 |\n| 1b | GV / Y tế trường | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Học sinh sốt cao $\\ge 38.5^\\circ\\text{C}$ đón về trước 10:30 sáng: chọn \"Đón về nửa ngày do y tế\" | Ghi nhận trạng thái `half_day_leave`, kích hoạt hoàn 50% tiền ăn ngày đó | VH-02 |\n| 2 | Hệ thống | Background Service | Quét điểm danh định kỳ sau khi hệ thống tự động đóng băng sổ điểm danh tháng cũ lúc 23:59:59 ngày cuối tháng (OQ-21), tổng hợp số ngày vắng có phép tháng M theo snapshot đơn giá lớp tại thời điểm vắng | Lưu tổng tiền hoàn theo từng lớp: $\\sum (\\text{ngày vắng} \\times \\text{đơn giá lớp} \\times \\text{tỷ lệ hoàn})$ | TC-08 |\n| 3 | Kế toán | [Màn hình học phí](../screens/m4-sm1-hoc-phi.md) | Thực hiện tạo đợt hóa đơn học phí cho tháng tiếp theo (M+1) | Hóa đơn tự động sinh dòng giảm trừ tiền ăn `\"Hoàn tiền: -X đ\"` | TC-02 |\n| 4 | Hệ thống | Billing Engine | Kiểm tra nếu tiền hoàn thặng dư $(\\text{refund} + \\text{discounts} > \\text{gross})$ | Hóa đơn gán `amount_due = 0`, phần hoàn thừa kết chuyển thành `credit_balance` lưu vào hồ sơ học sinh | TC-02 |\n\n## Quy tắc chặn / validation\n- Chỉ những ngày nghỉ được báo vắng TRƯỚC giờ chốt báo vắng hằng ngày (cấu hình tại Cấu hình học phí, mặc định 08:30 sáng) mới được tính vào diện hoàn tiền ăn (TC-08).\n- Ngày vắng không phép tuyệt đối không được hưởng chính sách hoàn tiền ăn (TC-02).\n- **Quy tắc hoàn tiền nửa ngày do y tế (OQ-10):** Học sinh check-in sáng nhưng sốt cao $\\ge 38.5^\\circ\\text{C}$ đón về trước 10:30 sáng được hoàn 50% tiền ăn; đón về sau 11:30 đã dùng bữa trưa thì hoàn 0% (TC-02, VH-02).\n- **Quy tắc không hoàn tiền khi phụ huynh chủ động đón sớm (OQ-20):** Phụ huynh chủ động đón sớm giữa buổi sau khi học sinh đã đến trường thì TUYỆT ĐỐI KHÔNG HOÀN TIỀN GÌ CẢ (hoàn 0%). Tiền ăn chỉ hoàn khi: ngày nghỉ lễ, nhà trường cho nghỉ, có đơn xin nghỉ học cả ngày hợp lệ được duyệt trước 08:30 sáng, hoặc đón về nửa ngày trước 10:30 do sốt cao y tế (OQ-10).\n- **Tự động đóng băng điểm danh trước khi quét hoàn tiền (OQ-21):** Không cần giáo viên nộp sổ thủ công. Dữ liệu điểm danh tháng cũ được tự động đóng băng (Read-Only) vào 23:59:59 ngày cuối tháng trước khi billing engine chạy, bảo đảm số liệu khấu trừ không bị biến động.\n- **Snapshot đơn giá khi chuyển lớp giữa tháng (OQ-09):** Đơn giá tiền ăn hoàn trả gắn chặt với lớp học tại thời điểm ngày vắng phát sinh, không áp dụng đơn giá cào bằng của lớp mới (TC-08).\n- **Chốt chặn Credit Balance chống hóa đơn âm (OQ-09):** Hóa đơn tuyệt đối không bao giờ xuất số âm trên cổng thanh toán. Toàn bộ tiền hoàn thừa được tự động lưu vào `credit_balance` của học sinh để cấn trừ vào các kỳ hóa đơn sau (TC-02).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-04 | Báo vắng học sinh hàng loạt và phân loại vắng có phép hoặc không phép | Prototype điểm danh chưa phân loại chặt chẽ vắng có phép và không phép | MISSING | repo:app/src/features/attendance/ |\n| TC-02 | Tự động rà soát ngày nghỉ có phép tháng M và khấu trừ tiền ăn vào hóa đơn tháng M+1 | Chưa có service tự động quét điểm danh đưa vào hóa đơn M+1 | MISSING | repo:app/src/features/finance/ |\n| TC-08 | Tính toán số tiền hoàn tiền ăn theo tỷ lệ cấu hình tham số tại Cấu hình học phí | Chưa có tham số cấu hình tỷ lệ hoàn tiền và hạn chốt báo vắng | MISSING | repo:app/src/features/finance/ |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Điểm danh hằng ngày](../entities/attendance-daily.md)\n"}, {"path": "pages/flows/fl-chuyen-lop-va-chuyen-nam-hoc.md", "title": "Luồng Chuyển Lớp & Chuyển Giao Niên Khóa", "type": "flow", "group": "flows", "fm": {"title": "Luồng Chuyển Lớp & Chuyển Giao Niên Khóa", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["NT-02", "NT-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Chuyển Lớp & Chuyển Giao Niên Khóa\n\n## Mục tiêu\nThực hiện điều chuyển học sinh giữa các lớp trong năm học hoặc chuyển giao toàn bộ học sinh lên lớp mới khi bắt đầu niên khóa mới; chụp snapshot đơn giá tiền ăn phục vụ hoàn tiền khi chuyển lớp giữa tháng; bảo toàn điểm số học vụ khi chuyển trường; và thực thi chốt chặn bảo toàn công nợ độc lập với vòng đời lớp học cũ.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Quản trị viên | [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md) | Chọn một hoặc nhiều học sinh, chọn chức năng \"Chuyển lớp\", chọn lớp đích mới | Học sinh được điều chuyển sang lớp đích | NT-02 |\n| 2 | Hệ thống | Academic Service | Thu hồi quyền truy cập kênh chat lớp cũ, cấp quyền lớp mới, cập nhật biểu phí học phí theo lớp mới | Hồ sơ 360 bảo toàn kết quả cũ và nạp biểu phí mới | NT-02 |\n| 2b | Hệ thống | Meal Refund Engine | Chuyển lớp giữa tháng: chụp snapshot lớp học và đơn giá suất ăn tại từng ngày điểm danh | Đơn giá hoàn tiền ăn tháng trước tính theo lớp cũ lúc vắng | TC-08 |\n| 3 | Quản trị viên | [Màn hình lớp học](../screens/m5-sm3-lop-hoc.md) | Kết thúc niên khóa: đóng lớp cũ, chuyển trạng thái sang \"Lưu trữ\" (`Archived`) | Toàn bộ công nợ tự động mang sang niên khóa mới (`Carried-over Debt`) | NT-04 |\n| 4 | BGH / GV vụ | [Màn hình học sinh](../screens/m5-sm1-hoc-sinh.md) | Học sinh chuyển trường giữa kỳ: trích xuất bảng điểm ký số BGH, map môn tương đương | Kế thừa 100% cột điểm TX, GK vào sổ điểm mới theo MoET | HT-03 |\n\n## Quy tắc chặn / validation\n- Chỉ được chuyển học sinh sang lớp học thuộc cùng niên khóa hoặc niên khóa kế tiếp đang kích hoạt (NT-02).\n- **Snapshot tiền ăn khi chuyển lớp giữa tháng (OQ-09):** Học sinh chuyển lớp giữa tháng thì ngày nghỉ có phép tại lớp cũ tính hoàn theo đơn giá lớp cũ, ngày nghỉ tại lớp mới tính theo đơn giá lớp mới; không cào bằng đơn giá (TC-08).\n- **Bảo toàn điểm số khi chuyển trường (OQ-11):** Học sinh chuyển trường giữa học kỳ được bảo lưu toàn bộ điểm số đánh giá thường xuyên ($TX$) và giữa kỳ ($GK$), hệ thống tự động map môn tương đương và kế thừa vào sổ điểm trường mới tính TBHK mà không phải thi lại.\n- **Chốt chặn bảo toàn công nợ (Debt Preservation Guard - OQ-12):** Tuyệt đối cấm xóa vật lý (Hard Delete) bất kỳ lớp học nào còn học sinh nợ học phí (`balance_due > 0`). Khi hết niên khóa, lớp học chuyển sang `Archived`; công nợ gắn chặt với `student_id` và tự động mang sang niên khóa mới (`Carried-over Debt`) trên hóa đơn của lớp mới. Kế toán vẫn truy thu được công nợ của lớp đã lưu trữ.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-02 | Chuyển lớp học sinh và chuyển năm học hàng loạt với bảo toàn kết quả học tập | Frontend chưa có chức năng chuyển lớp hàng loạt và đổi biểu phí | MISSING | repo:app/src/features/students/ |\n| NT-04 | Phân loại lớp chính khóa và ngoại khóa kèm chốt chặn an toàn khi xóa lớp | Chốt chặn an toàn khi xóa lớp chưa có backend validation | MISSING | repo:app/src/features/classes/ |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Chốt chặn an toàn khi xóa lớp](../concepts/class-deletion-guard.md)\n- [Vòng đời chuyển tiếp học sinh](../concepts/student-lifecycle-transitions.md)\n- [Chuẩn đánh giá học sinh MoET](../concepts/curriculum-assessment-standard.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Lớp học](../entities/classroom.md)\n- [Màn hình lớp học](../screens/m5-sm3-lop-hoc.md)\n"}, {"path": "pages/flows/fl-dang-bai-kiem-duyet.md", "title": "Luồng Đăng Bài Hoạt Động Lớp & Kiểm Duyệt 2 Cấp", "type": "flow", "group": "flows", "fm": {"title": "Luồng Đăng Bài Hoạt Động Lớp & Kiểm Duyệt 2 Cấp", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-05", "NT-03"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Đăng Bài Hoạt Động Lớp & Kiểm Duyệt 2 Cấp\n\n## Mục tiêu\nCho phép giáo viên ghi nhận và truyền thông hoạt động học tập hằng ngày của lớp học tới phụ huynh, đồng thời thực thi cơ chế kiểm duyệt nội dung 2 cấp bảo đảm tính chuẩn mực sư phạm.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Giáo viên | [Màn hình hoạt động](../screens/m2-sm2-hoat-dong.md) | Soạn bài viết, tải hình ảnh, gắn hashtag `#` chủ đề và nhắc tên học sinh `@` | Bài viết sẵn sàng xuất bản hoặc kiểm duyệt | VH-05 |\n| 2 | Hệ thống | Background Logic | Kiểm tra vai trò của giáo viên: Giáo viên chính (Chủ nhiệm) hay Giáo viên hỗ trợ | Nếu là GV chính: Đăng trực tiếp; Nếu là GV hỗ trợ: Chuyển sang Chờ duyệt | NT-03 |\n| 3 | GV chính / Admin | [Màn hình hoạt động](../screens/m2-sm2-hoat-dong.md) | Mở tab \"Chờ duyệt\", xem nội dung và bấm \"Phê duyệt\" hoặc \"Yêu cầu chỉnh sửa\" | Bài viết được phát hành tới toàn bộ phụ huynh học sinh | NT-03 |\n\n## Quy tắc chặn / validation\n- Bài viết ở trạng thái Chờ duyệt (`pending_review`) tuyệt đối không hiển thị trên ứng dụng của phụ huynh (NT-03).\n- Giáo viên hỗ trợ không được tự phê duyệt bài viết do chính mình khởi tạo (NT-03).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-05 | Đăng bài hoạt động lớp hỗ trợ gắn hashtag `#` chủ đề và nhắc tên học sinh `@` | Giao diện đăng bài chưa hỗ trợ nhắc tên học sinh động | MISSING | repo:app/src/features/activity/ |\n| NT-03 | Quản lý danh bạ giáo viên và cơ chế kiểm duyệt nội dung bài đăng 2 cấp | Chưa có tab Chờ duyệt bài viết và quyền duyệt 2 cấp | MISSING | repo:app/src/features/activity/ |\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Bảng tin hoạt động lớp](../entities/class-activity.md)\n- [Giáo viên & Nhân viên](../entities/teacher-staff.md)\n- [Màn hình hoạt động](../screens/m2-sm2-hoat-dong.md)\n"}, {"path": "pages/flows/fl-dang-ky-sinh-trac-khuon-mat.md", "title": "Luồng Đăng Ký Sinh Trắc Học Khuôn Mặt Học Sinh (Face Biometric Enrollment Flow)", "type": "flow", "group": "flows", "fm": {"title": "Luồng Đăng Ký Sinh Trắc Học Khuôn Mặt Học Sinh (Face Biometric Enrollment Flow)", "type": "flow", "sources": ["repo:docs/guides/planning/flows.md", "repo:docs/guides/decisions.md", "pages/sources/src-open-questions-resolutions.md"], "updated": "2026-11-05", "spec_ids": ["CH-12", "CH-04"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Đăng Ký Sinh Trắc Học Khuôn Mặt Học Sinh (Face Biometric Enrollment Flow)\n\n## Mục tiêu\nĐặc tả luồng chụp ảnh trực tiếp qua webcam hoặc tải tệp ảnh chân dung lên hệ thống để đăng ký nhận diện khuôn mặt sinh trắc học cho học sinh, cơ chế bất biến thông tin nhân khẩu học (`CH-12`) và pipeline trích xuất vector đặc trưng bất đồng bộ (`CH-04`), đồng thời tôn trọng quyền từ chối sinh trắc học `opt_out_face_ai` theo Nghị định 13/2023/NĐ-CP (OQ-16).\n\n## Các bước\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Staff as Nhân Viên Quản Trị / Giáo Viên\n    participant Client as Next.js Web Portal\n    participant API as Backend API\n    participant Worker as Cloud Run AI Worker\n    participant Storage as Google Cloud Storage\n\n    Staff->>Client: Mở Cấu hình > Nhận diện khuôn mặt (/[schoolCode]/setting/face-recognition)\n    Client->>Client: Hiển thị danh sách học sinh theo khối, lớp và trạng thái nhận diện\n    Staff->>Client: Chọn học sinh chưa đăng ký > Bấm \"Đăng ký khuôn mặt\"\n    alt Học sinh bật cờ opt_out_face_ai = true (OQ-16)\n        Client->>Staff: Khóa nút Đăng ký, hiển thị trạng thái \"Từ chối sinh trắc (Opted-Out)\"\n    else Học sinh hợp lệ\n        Client->>Staff: Mở modal Đăng ký: Khóa cố định Tên, Mã HS, Ngày sinh (CH-12)\n        alt Chụp ảnh trực tiếp từ webcam\n            Staff->>Client: Bật camera > Căn chỉnh gương mặt vào khung oval > Bấm chụp\n        else Tải tệp ảnh từ máy tính\n            Staff->>Client: Tải lên từ 1 đến 5 ảnh chân dung góc chụp thẳng\n        end\n        Staff->>Client: Bấm \"Lưu và Phân tích khuôn mặt\"\n        Client->>Storage: Tải ảnh trực tiếp lên Google Cloud Storage (pre-signed URL)\n        Client->>API: POST /{schoolCode}/api/1.0/face-recognition/enroll (kèm image URLs)\n        API->>API: Cập nhật trạng thái tạm thời: \"Đang xử lý nhận diện...\"\n        API->>Worker: Đẩy tác vụ bất đồng bộ vào hàng đợi (CH-04)\n        API-->>Client: Phản hồi thành công kèm trạng thái đang phân tích\n        Worker->>Storage: Tải ảnh > Căn chỉnh gương mặt > Trích xuất 512-d vector\n        alt Chất lượng đạt chuẩn\n            Worker->>API: Lưu vector đặc trưng, cập nhật trạng thái \"Đã đăng ký\"\n        else Ảnh không đạt chuẩn (mờ, góc nghiêng > 30 độ)\n            Worker->>API: Cập nhật trạng thái \"Thất bại\" kèm lý do chi tiết\n        end\n    end\n```\n\n1. **Chọn học sinh đăng ký:**\n   - Nhân viên truy cập phân hệ Cấu hình > Nhận diện khuôn mặt (`/setting/face-recognition`).\n   - Lọc danh sách học sinh theo trạng thái: \"Chưa đăng ký\", \"Đã đăng ký\", \"Thất bại\", \"Từ chối sinh trắc (Opted-Out)\".\n   - Nếu học sinh có cờ `opt_out_face_ai = true`: nút đăng ký bị khóa, hiển thị biểu tượng bảo vệ quyền riêng tư (OQ-16).\n   - Với học sinh bình thường, chọn học sinh và bấm \"Đăng ký\".\n2. **Khóa thông tin nhân khẩu học (CH-12):**\n   - Modal hiển thị đầy đủ Họ tên, Mã học sinh, Lớp học và Ngày sinh của học sinh ở chế độ chỉ đọc (Read-only / Disabled).\n   - Tuyệt đối không cho phép chỉnh sửa các trường này tại màn hình quét ảnh để tránh làm sai lệch hồ sơ pháp lý.\n3. **Thu thập ảnh chân dung:**\n   - Hỗ trợ 2 phương thức: Mở luồng camera trực tiếp với khung oval định vị khuôn mặt, hoặc chọn tệp ảnh JPEG/PNG có sẵn.\n   - Kiểm tra sơ bộ phía client: ảnh phải có dung lượng từ 50KB đến 5MB, độ phân giải tối thiểu 300x300 pixel.\n4. **Tải lên & Xử lý bất đồng bộ (CH-04):**\n   - Ảnh được tải lên Google Cloud Storage.\n   - Hệ thống tạo tác vụ nền Cloud Run worker để trích xuất vector đặc trưng. Giao diện hiển thị badge màu vàng \"Đang xử lý nhận diện...\".\n   - Khi hoàn tất, trạng thái chuyển sang màu xanh \"Đã đăng ký\" kèm ngày giờ đăng ký.\n\n## Quy tắc chặn / validation\n- **Quy tắc bảo vệ nhân khẩu học (CH-12):** Tuyệt đối cấm sửa đổi họ tên hoặc mã học sinh trong form đăng ký nhận diện ảnh.\n- **Quy tắc quyền riêng tư sinh trắc học (OQ-16):** Học sinh có cờ `opt_out_face_ai = true` tuyệt đối không được thu thập hoặc trích xuất vector khuôn mặt. Mọi vector đã lưu trước đó phải bị xóa hoàn toàn khỏi cơ sở dữ liệu.\n- **Quy tắc chất lượng ảnh:** Hệ thống tự động từ chối ảnh chụp quá tối, ảnh chụp nghiêng quá 30 độ hoặc ảnh có nhiều hơn 1 khuôn mặt trong cùng một khung hình.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-12 | Khóa thông tin nhân khẩu học trong modal đăng ký ảnh | Modal component đã có form read-only cho info học sinh | MISSING | — |\n| CH-04 | Đăng ký khuôn mặt AI và pipeline trích xuất vector bất đồng bộ | Giao diện đã có modal webcam và upload ảnh | MISSING | — |\n\n## Liên quan\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Thực thể hồ sơ nhận diện khuôn mặt](../entities/face-biometric-registration.md)\n- [Khái niệm nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Màn hình cấu hình nhận diện](../screens/m6-sm4-nhan-dien.md)\n"}, {"path": "pages/flows/fl-dang-nhap-da-truong.md", "title": "Luồng Đăng Nhập Đa Trường & Phân Quyền RBAC", "type": "flow", "group": "flows", "fm": {"title": "Luồng Đăng Nhập Đa Trường & Phân Quyền RBAC", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["DN-01", "DN-02"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Đăng Nhập Đa Trường & Phân Quyền RBAC\n\n## Mục tiêu\nXác thực danh tính người dùng theo trường học cụ thể dựa trên tiền tố `{schoolCode}`, kiểm tra vai trò người dùng và cấp phiên làm việc an toàn với quyền hạn tương ứng.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Người dùng | [Màn hình đăng nhập](../screens/m7-sm2-dang-nhap.md) | Nhập mã trường `{schoolCode}`, tên đăng nhập/email và mật khẩu | Gửi request xác thực kèm context trường học | DN-01 |\n| 2 | Backend Gateway | Auth Service | Kiểm tra thông tin, xác thực mật khẩu qua Argon2id/Bcrypt và kiểm tra trạng thái tài khoản | Cấp cặp JWT Access/Refresh Token kèm thông tin vai trò RBAC | DN-01 |\n| 3 | Frontend Portal | Dashboard Router | Đọc vai trò người dùng (Admin, Giáo viên, Kế toán), chuyển hướng tới phân hệ tương ứng | Giao diện hiển thị đúng menu và tính năng được phân quyền | DN-02 |\n| 4 | Người dùng kiêm nhiệm | Thanh điều hướng Header | Chọn chuyển trường hoặc mở 2 tab 2 trường khác nhau | Kích hoạt `RESET_TENANT_STATE` dọn sạch Redux store; cô lập token và kênh WebSocket theo `schoolCode` | DN-01 |\n\n## Quy tắc chặn / validation\n- Nếu tài khoản ở trạng thái Khóa (`locked` hoặc `inactive`), hệ thống từ chối đăng nhập và trả thông báo rõ ràng (DN-01).\n- Nếu mã trường `{schoolCode}` không tồn tại trong hệ thống, chuyển hướng về trang báo lỗi trường học không hợp lệ (DN-01).\n- **Chốt chặn an toàn chuyển trường (OQ-13):** Khi chuyển đổi trường trên cùng một tab, bắt buộc dispatch action `RESET_TENANT_STATE` để xóa sạch toàn bộ cache Redux của trường cũ trước khi nạp dữ liệu trường mới (DN-01).\n- **Cô lập WebSocket và Storage đa tab (OQ-13):** Khi mở đồng thời nhiều tab cho các trường khác nhau, mỗi tab bắt buộc kết nối WebSocket phân kênh `{schoolCode}:user:{userId}:{channel}` và đọc token phân vùng `eco_token_{schoolCode}`, tuyệt đối cấm rò rỉ thông báo và dữ liệu chéo trường (DN-01).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| DN-01 | Đăng nhập hệ thống theo tiền tố mã trường `{schoolCode}` và cấp cặp JWT Access/Refresh Token | Prototype dùng mock auth, chưa có JWT và RLS backend | MISSING | repo:app/src/pages/sso/login.tsx |\n| DN-02 | Phân quyền kiểm soát truy cập theo mô hình Role-Based Access Control (RBAC) 3 cấp | Chưa có backend authorization guard theo scope RBAC | MISSING | repo:app/src/utils/authSession.ts |\n\n## Liên quan\n- [Phân hệ Đăng nhập](../overview/module-auth.md)\n- [Cơ chế cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n- [Phiên đăng nhập](../entities/auth-session.md)\n- [Màn hình đăng nhập](../screens/m7-sm2-dang-nhap.md)\n"}, {"path": "pages/flows/fl-diem-danh-cham-cong-nv.md", "title": "Luồng Chấm Công Ca & Tổng Hợp Điểm Danh Nhân Sự", "type": "flow", "group": "flows", "fm": {"title": "Luồng Chấm Công Ca & Tổng Hợp Điểm Danh Nhân Sự", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-026-school-staff-attendance/epic.md"], "spec_ids": ["NT-10"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Chấm Công Ca & Tổng Hợp Điểm Danh Nhân Sự\n\n## Mục tiêu\nTự động hóa việc ghi nhận công làm việc của đội ngũ giáo viên, bảo mẫu và nhân viên trường học, làm cơ sở tính lương, thưởng và đánh giá kỷ luật lao động chính xác.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\n| 1 | Giáo viên / Nhân viên | Máy chấm công / Web / App | Check-in khi đến trường và Check-out khi hết giờ làm | Ghi nhận thời gian thực tế |\n| 2 | Hệ thống | Server Backend | Đối chiếu giờ vào/ra với khung ca làm việc quy định | Đánh dấu: Đúng giờ, Đi muộn, Về sớm |\n| 3 | Giáo viên | Web Admin / App | Nộp đơn giải trình hoặc đơn xin nghỉ phép nếu có sự cố bất khả kháng | Đơn gửi tới quản lý nhân sự |\n| 4 | Cán bộ nhân sự | Web Admin | Vào màn hình Điểm danh NV, kiểm tra đơn xin phép và bấm \"Duyệt phép\" | Cập nhật thành Vắng có phép |\n| 5 | Cán bộ nhân sự | Web Admin | Cuối tháng nhấn \"Tổng hợp bảng công\" và xuất file Excel | Kết xuất bảng tổng hợp công chuẩn |\n\n## Quy tắc chặn / validation\n- Nhân viên quên check-out cuối ngày sẽ bị đánh dấu trạng thái cảnh báo `MISSING_CHECKOUT` và phải làm thủ tục giải trình bổ sung trước khi chốt công tháng.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-10 | Điểm danh ca làm việc và tổng hợp bảng chấm công nhân viên nhà trường | Giao diện bảng chấm công nhân viên và Redux slice | MISSING | repo:app/src/pages/[schoolCode]/school/staff-attendance/index.tsx:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Thực thể Điểm danh nhân sự](../entities/staff-attendance.md)\n- [Thực thể Giáo viên & Nhân viên](../entities/teacher-staff.md)\n- [Màn hình điểm danh nhân viên](../screens/m5-sm9-diem-danh-nv.md)\n"}, {"path": "pages/flows/fl-diem-danh-don-tra.md", "title": "Luồng Điểm Danh Đón Trả & Theo Dõi Sức Khỏe", "type": "flow", "group": "flows", "fm": {"title": "Luồng Điểm Danh Đón Trả & Theo Dõi Sức Khỏe", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["VH-01", "VH-02", "VH-03"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Luồng Điểm Danh Đón Trả & Theo Dõi Sức Khỏe\n\n## Mục tiêu\nThực hiện quy trình đón học sinh buổi sáng, kiểm tra thân nhiệt dấu hiệu y tế, và trả học sinh buổi chiều xác thực người đón hộ chỉ với 1-chạm, bảo đảm an toàn giám hộ và kích hoạt cảnh báo đỏ khẩn cấp khi có tranh chấp.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Giáo viên | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Chọn lớp học và bấm nút Đón buổi sáng 1-chạm; nếu đến sau 08:30 ghi nhận Đến muộn (Late Arrival, kèm toggle báo bổ sung suất ăn với bếp nếu đến trước 09:00 - OQ-20) | Trạng thái học sinh chuyển sang Đã đến lớp kèm giờ đến thực tế | VH-01 |\n| 2 | Giáo viên | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Nhập số đo nhiệt độ và chọn dấu hiệu sức khỏe nếu có bất thường | Lưu chỉ số thân nhiệt; nếu sốt $\\ge 38.0^\\circ\\text{C}$ phát cảnh báo y tế | VH-02 |\n| 2c | Giáo viên | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Sổ dặn thuốc y tế & Xác nhận uống thuốc trưa (OQ-19): Tiếp nhận đơn dặn thuốc từ phụ huynh, đối chiếu Huy hiệu Viên thuốc, cho học sinh uống thuốc đúng liều lượng và bấm xác nhận \"Đã cho uống thuốc lúc HH:mm\" | Hệ thống tự động gửi Push Notification an tâm tức thời tới phụ huynh; lưu vết bất biến trong `student_medical_logs` | VH-02 |\n| 2b | Giáo viên / Y tế | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Học sinh sốt cao ($\\ge 38.5^\\circ\\text{C}$), phụ huynh đón về trước 10:30 sáng: chọn \"Đón về nửa ngày do y tế\" | Ghi nhận `half_day_leave`, hoàn 50% tiền ăn bán trú ngày đó | VH-02 |\n| 3 | Giáo viên | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Bấm nút Trả buổi chiều (hoặc ghi nhận Đón sớm giữa buổi Early Departure nếu phụ huynh chủ động đón trước giờ quy định - OQ-20) và chọn người đón hợp lệ | Xác nhận hoàn thành trả trẻ, gửi thông báo đẩy tới phụ huynh; đón sớm chủ động ghi nhận lý do và hoàn 0% tiền ăn | VH-03 |\n| 3b | Hệ thống / GV | [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md) | Chốt chặn an toàn tranh chấp quyền giám hộ (OQ-16): Phát hiện người đón thuộc danh sách hạn chế `restricted_guardians` | Bật Cảnh báo đỏ toàn màn hình (Red Modal Alert), hú chuông, khóa nút trả trẻ, gửi SOS tới BGH và Bảo vệ | VH-03 |\n| 4 | GV & BGH | Phòng lưu giữ trẻ | Sau 17:00/17:30 người đón lạ không trong danh bạ và không liên lạc được phụ huynh: kích hoạt quy trình giữ trẻ khẩn cấp | Đưa vào phòng lưu trẻ (2 nhân sự + camera), lập biên bản 3 bên; sau 19:30 báo Công an | VH-03 |\n\n## Quy tắc chặn / validation\n- Không cho phép xác nhận Trả trẻ nếu chưa thực hiện thao tác Đón trẻ trong cùng ngày (VH-01).\n- **Chốt chặn an toàn tranh chấp quyền giám hộ (OQ-16):** Tuyệt đối cấm giao trẻ cho người nằm trong danh sách bị Tòa án hạn chế tiếp cận (`restricted_guardians`). Hệ thống khóa cứng nút trả trẻ trên giao diện, chỉ Ban Giám Hiệu và lực lượng chức năng mới có thẩm quyền giải quyết theo biên bản pháp lý.\n- **Chốt chặn người lạ ngoài giờ (OQ-10):** Cấm giao trẻ cho người không có tên/ảnh trong danh bạ nếu chưa có xác thực trực tiếp từ phụ huynh qua OTP hoặc video call.\n- **Quy trình bảo vệ pháp lý giữ trẻ ngoài giờ (OQ-10):** Sau 17:30, phòng trực có 2 nhân sự + camera an ninh; sau 19:30 báo Công an Phường và Tổng đài Bảo vệ Trẻ em 111.\n- **Hoàn tiền nửa ngày do y tế (OQ-10):** Đón về trước 10:30 sáng do sốt cao $\\ge 38.5^\\circ\\text{C}$ hoặc có chỉ định y tế học đường hoàn 50% suất ăn ngày đó; đón về sau 11:30 sáng (đã ăn trưa) hoàn 0%.\n- **Quy tắc không hoàn tiền khi đón sớm chủ động (OQ-20):** Phụ huynh chủ động đón con sớm sau khi học sinh đã đến trường (Early Departure vì việc gia đình, về quê...) thì TUYỆT ĐỐI KHÔNG HOÀN TIỀN GÌ CẢ (hoàn 0%). Quy tắc hoàn tiền ăn chỉ áp dụng khi: rơi vào ngày lễ, nhà trường cho nghỉ, phụ huynh có đơn xin nghỉ học cả ngày hợp lệ duyệt trước 08:30 sáng, hoặc y tế cho về trước 10:30 (OQ-10).\n- **Cơ chế tự động đóng băng sổ điểm danh cuối tháng (OQ-21):** Vào 23:59:59 ngày cuối tháng trước khi tiến trình batch job tính phí cho tháng tiếp theo khởi chạy, hệ thống TỰ ĐỘNG KHÓA (Monthly Attendance Auto-Freeze / Read-Only), không cần nút nộp thủ công. Cấm mọi thao tác thêm/sửa/xóa điểm danh tháng cũ, mở khóa khẩn cấp cần BGH duyệt và ghi Audit Trail.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-01 | Điểm danh đón và trả học sinh 1-chạm theo lớp học hằng ngày | Giao diện prototype điểm danh chưa kết nối cơ sở dữ liệu thật | MISSING | repo:app/src/features/attendance/ |\n| VH-02 | Ghi nhận thân nhiệt và cảnh báo các dấu hiệu sức khỏe y tế bất thường của học sinh | Modal y tế và thân nhiệt chưa lưu trữ lịch sử sức khỏe | MISSING | repo:app/src/features/attendance/ |\n| VH-03 | Xác thực người đón hộ học sinh từ danh sách người đưa đón hợp lệ đã đăng ký | Chưa có API đối chiếu danh bạ người đón hợp lệ | MISSING | repo:app/src/features/attendance/ |\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Điểm danh hằng ngày](../entities/attendance-daily.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md)\n"}, {"path": "pages/flows/fl-doi-soat-giao-dich.md", "title": "Luồng Đối Soát Giao Dịch & Khớp Lệnh Ngân Hàng", "type": "flow", "group": "flows", "fm": {"title": "Luồng Đối Soát Giao Dịch & Khớp Lệnh Ngân Hàng", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "pages/sources/src-open-questions-resolutions.md", "repo:docs/guides/development/E-013-finance-reconciliation/epic.md"], "spec_ids": ["TC-06"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Đối Soát Giao Dịch & Khớp Lệnh Ngân Hàng\n\n## Mục tiêu\nĐảm bảo tính chính xác 100% giữa số tiền học phí thực tế phụ huynh đã chuyển khoản qua ngân hàng với trạng thái công nợ của học sinh trên hệ thống, tự động phát hiện và cảnh báo sai lệch tài chính, xử lý các trường hợp chuyển thừa, thiếu và đóng băng tra soát ngân hàng.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\n| 1 | Kế toán trường | Web Admin | Truy cập màn hình Đối soát và nhấn \"Tạo phiên đối soát mới\" | Khởi tạo phiên với mã định danh duy nhất |\n| 2 | Kế toán trường | Web Admin | Tải tệp sao kê ngân hàng (Excel/CSV) hoặc chọn kỳ đối soát tự động qua webhook | Hệ thống nạp danh sách giao dịch đầu vào |\n| 3 | Hệ thống | Server Backend | Quét nội dung chuyển khoản theo cú pháp `ECO {schoolCode} {invoiceId}` và so sánh số tiền | Phân loại giao dịch: Khớp 100%, Thừa tiền (`OVERPAID`), Thiếu tiền (`PARTIAL_PAID`), Không tìm thấy hóa đơn, hoặc Giao dịch trên hóa đơn đã hủy (`SUSPENSE`) |\n| 4 | Kế toán trường | Web Admin | Xử lý giao dịch bất thường (OQ-18): (a) Thừa tiền: Kết chuyển sang Credit Balance hoặc Lập phiếu chi hoàn tiền thừa; (b) Thiếu tiền: Kích hoạt sinh lại mã VietQR nợ; (c) Tra soát ngân hàng: Kích hoạt cờ `FROZEN_UNDER_REVIEW` | 100% giao dịch được xử lý minh bạch |\n| 5 | Kế toán trường | Web Admin | Rà soát giao dịch nghi vấn và xử lý Quỹ treo (`UNMATCHED_SUSPENSE_POOL`): chọn Kết chuyển sang Credit Balance học sinh hoặc Lập phiếu chi hoàn tiền phụ huynh | Không thất thoát tiền |\n| 6 | Kế toán trưởng | Web Admin | Nhấn \"Xác nhận & Khóa sổ đối soát\" | Đóng phiên đối soát, cập nhật hóa đơn sang `PAID` và khóa dữ liệu |\n\n## Quy tắc chặn / validation\n- Không được khóa phiên đối soát nếu vẫn còn giao dịch trạng thái `DISCREPANCY` (sai lệch), `FROZEN_UNDER_REVIEW` (đang tra soát), hoặc `SUSPENSE` (quỹ treo do hóa đơn đã hủy) chưa được xử lý (TC-06, OQ-18).\n- **Chuyển tiền thừa (OQ-18):** Tự động gạch nợ `PAID` hóa đơn, số tiền dôi dư đưa vào `credit_balance` hoặc xuất phiếu chi hoàn tiền.\n- **Chuyển tiền thiếu (OQ-18):** Chuyển sang `PARTIAL_PAID`, tự động sinh lại mã VietQR động mới với payload đúng bằng số tiền còn nợ để phụ huynh quét trả nốt.\n- **Đóng băng tra soát ngân hàng (OQ-18):** Khi kích hoạt `FROZEN_UNDER_REVIEW`, khóa cứng cấm tuyệt đối xuất Hóa đơn điện tử VAT, cấm kết chuyển doanh thu và cấm rút Credit Balance liên quan cho đến khi ngân hàng có kết luận phân xử.\n- Giao dịch thanh toán VietQR trên hóa đơn đã hủy tuyệt đối không được tự ý xóa hoặc bỏ qua mà bắt buộc phải giải tỏa qua ghi nhận Credit Balance hoặc chi hoàn (TC-06).\n- Giao dịch đã nằm trong một phiên đã khóa sổ không được phép đưa vào phiên đối soát khác (TC-06).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-06 | Đối soát giao dịch thanh toán tự động và thủ công với sổ phụ ngân hàng | Giao diện bảng đối soát và chi tiết phiên mockup | MISSING | repo:app/src/pages/[schoolCode]/school/reconciliation/index.tsx:1 |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thực thể Phiên đối soát giao dịch](../entities/reconciliation-session.md)\n- [Thực thể Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Thực thể Phiếu chi nội bộ](../entities/expense-voucher.md)\n- [Khái niệm Kiến trúc VietQR và đối soát](../concepts/vietqr-dynamic-reconciliation.md)\n- [Màn hình đối soát](../screens/m4-sm2-doi-soat.md)\n"}, {"path": "pages/flows/fl-don-xin-nghi-hoc.md", "title": "Luồng Tiếp Nhận & Phê Duyệt Đơn Xin Nghỉ Học (Student Leave Request Flow)", "type": "flow", "group": "flows", "fm": {"title": "Luồng Tiếp Nhận & Phê Duyệt Đơn Xin Nghỉ Học (Student Leave Request Flow)", "type": "flow", "sources": ["repo:docs/guides/planning/flows.md", "repo:docs/guides/decisions.md"], "updated": "2026-11-05", "spec_ids": ["VH-09", "TC-11"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Tiếp Nhận & Phê Duyệt Đơn Xin Nghỉ Học (Student Leave Request Flow)\n\n## Mục tiêu\nĐặc tả luồng tương tác khép kín từ khi phụ huynh gửi đơn xin nghỉ học trên ứng dụng di động đến khi giáo viên chủ nhiệm tiếp nhận, xét duyệt trên giao diện School Operating Portal, tự động đánh dấu trạng thái \"Vắng có phép\" trong sổ điểm danh và kích hoạt tính toán hoàn trừ tiền ăn cho kỳ hóa đơn tháng kế tiếp ($M+1$).\n\n## Các bước\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Parent as Phụ Huynh (Mobile App)\n    actor Teacher as Giáo Viên Chủ Nhiệm (Portal)\n    participant Client as Next.js Web Portal\n    participant API as Backend API\n    participant Engine as Meal Refund Engine\n\n    Parent->>API: Gửi đơn xin nghỉ học (ngày nghỉ, buổi nghỉ, lý do)\n    API-->>Teacher: Thông báo đẩy đơn xin nghỉ mới\n    Teacher->>Client: Mở mục Trao Đổi > Tab Báo Vắng\n    Client->>API: GET /{schoolCode}/api/1.0/absence-requests\n    API-->>Client: Trả danh sách đơn báo vắng chờ duyệt\n    Teacher->>Client: Kiểm tra thời gian gửi đơn và bấm \"Phê duyệt\"\n    Client->>API: POST /{schoolCode}/api/1.0/absence-requests/{id}/approve\n    API->>API: Cập nhật sổ điểm danh ngày tương ứng thành \"Vắng có phép\" (CP)\n    alt Đơn gửi trước giờ quy định (VH-09)\n        API->>Engine: Tạo tín chỉ hoàn tiền ăn (meal-refund-credit)\n        Engine-->>API: Ghi nhận giảm trừ tiền ăn kỳ M+1 (TC-11)\n    else Đơn gửi sau giờ quy định\n        API-->>Client: Duyệt nghỉ phép nhưng không đủ điều kiện hoàn tiền ăn\n    end\n    API-->>Client: Phản hồi duyệt thành công kèm Toast thông báo\n    Client-->>Teacher: Cập nhật trạng thái đơn thành \"Đã duyệt\"\n```\n\n1. **Khởi tạo đơn (Phụ huynh):** Phụ huynh chọn học sinh, khoảng thời gian nghỉ, buổi nghỉ (Cả ngày, Sáng, Chiều), lý do và đính kèm đơn thuốc/giấy phép nếu có.\n2. **Tiếp nhận đơn (Giáo viên):** Giáo viên chủ nhiệm truy cập phân hệ Trao Đổi (`/conversations`) hoặc Điểm Danh (`/class/[classId]/attendance`), mở danh sách đơn báo vắng chờ duyệt.\n3. **Phê duyệt đơn:**\n   - Giáo viên nhấn nút \"Duyệt\" trên hàng đơn. Hệ thống mở modal xác nhận thông tin học sinh và ngày nghỉ.\n   - Khi xác nhận duyệt, hệ thống gọi API cập nhật trạng thái đơn thành `approved`.\n4. **Đồng bộ sổ điểm danh & Hoàn tiền ăn:**\n   - Ngày nghỉ trong đơn tự động chuyển thành trạng thái \"Vắng có phép\" (CP) trên bảng điểm danh của lớp.\n   - Nếu đơn được gửi trước giờ chốt suất ăn (cấu hình tại Cấu hình học phí), hệ thống tự động sinh bản ghi tín chỉ hoàn tiền ăn (`meal-refund-credit`), sẵn sàng khấu trừ vào hóa đơn tháng tiếp theo.\n\n## Quy tắc chặn / validation\n- **Quy tắc thời gian (VH-09, TC-08):** Đơn báo vắng chỉ được kích hoạt chế độ hoàn tiền ăn khi được gửi trước giờ quy định của nhà trường (cấu hình tại Cấu hình học phí, mặc định 08:30 sáng). Đơn nộp muộn sau 08:30 sáng vẫn được tính là nghỉ phép nhưng không được xét hoàn tiền suất ăn bán trú ngày hôm đó.\n- **Đón về sớm khẩn cấp do y tế (OQ-10):** Nếu học sinh đã đến lớp nhưng sốt cao $\\ge 38.5^\\circ\\text{C}$ hoặc có sự cố y tế đột xuất và được phụ huynh đón về trước 10:30 sáng, giáo viên hoặc nhân viên y tế kích hoạt đơn đón về sớm y tế (`emergency_medical_half_day`), hệ thống ghi nhận trạng thái `half_day_leave` và hoàn trả 50% tiền ăn ngày đó.\n- **Quy tắc ngày quá khứ:** Phụ huynh không được nộp đơn báo vắng cho các ngày đã qua trong quá khứ; các trường hợp đột xuất phải liên hệ trực tiếp giáo viên chủ nhiệm xử lý thủ công.\n- **Bảo toàn thặng dư (OQ-09):** Nếu tổng tiền hoàn ăn lớn hơn học phí tháng M+1, phần tiền thừa tự động kết chuyển thành số dư tín dụng `credit_balance` lưu vào hồ sơ học sinh.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| VH-09 | Tự động đồng bộ đơn báo vắng sang điểm danh và hoàn tiền ăn | Prototype đã có tab Trao đổi và điểm danh | MISSING | — |\n| TC-11 | Tính toán hoàn tiền ăn chu kỳ M+1 từ đơn báo vắng | Đã có mock model meal-refund-credit | MISSING | — |\n\n## Liên quan\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Thực thể đơn xin nghỉ học](../entities/student-absence-request.md)\n- [Thực thể tín chỉ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Luồng điểm danh đón trả](fl-diem-danh-don-tra.md)\n- [Màn hình trao đổi](../screens/m2-sm4-trao-doi.md)\n- [Màn hình điểm danh](../screens/m2-sm1-diem-danh.md)\n"}, {"path": "pages/flows/fl-dong-bo-danh-muc-thu.md", "title": "Luồng Đồng Bộ & Áp Dụng Danh Mục Thu CSDL Sở", "type": "flow", "group": "flows", "fm": {"title": "Luồng Đồng Bộ & Áp Dụng Danh Mục Thu CSDL Sở", "type": "flow", "sources": ["pages/sources/src-development-epics-manifest.md", "pages/sources/src-open-questions-resolutions.md", "repo:docs/guides/development/E-010-finance-fee-catalog/epic.md"], "spec_ids": ["TC-19", "TC-20"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Đồng Bộ & Áp Dụng Danh Mục Thu CSDL Sở\n\n## Mục tiêu\nĐảm bảo các khoản phí thu từ học sinh trong toàn trường và thông tin định danh luôn tuân thủ đúng khung pháp lý và mã danh mục thu do Sở Giáo Dục & Đào Tạo ban hành, giải quyết sai lệch dữ liệu (Data Drift) và cô lập lỗi đồng bộ ngắt quãng từng học sinh.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\n| 1 | Ban Giám Hiệu / Kế toán | Web Admin | Vào màn hình Danh mục thu (`/school/revenue-categories`) | Hiển thị danh mục thu hiện hành |\n| 2 | Kế toán trường | Web Admin | Nhấn nút \"Đồng bộ từ CSDL Sở\" | Hệ thống kích hoạt API kéo danh mục mới và quét Data Drift |\n| 3 | Hệ thống | Server Backend | Kiểm tra và cập nhật danh mục, đánh dấu `ARCHIVED` cho các mục hết hiệu lực; phát hiện sai lệch dữ liệu với CSDL ngành | Cập nhật bảng danh mục; cảnh báo các điểm Data Drift nếu có |\n| 4 | Kế toán trường | Web Admin | Xử lý hòa giải sai lệch dữ liệu (Data Drift Reconciliation - OQ-15): Chọn Cập nhật theo Sở hoặc lập Biên bản giải trình | Đồng bộ nhất quán dữ liệu pháp lý |\n| 5 | Quản trị viên | Web Admin | Kích hoạt khóa đồng bộ kỳ thi `is_sync_locked = true` khi Sở chốt dữ liệu thi | Khóa cứng dữ liệu định danh học sinh, ngăn chặn chỉnh sửa trái phép |\n| 6 | Kế toán trường | Web Admin | Chọn các khoản thu phù hợp với đặc thù trường và bật trạng thái áp dụng (`usable = true`) | Kích hoạt khoản thu cho trường |\n\n## Quy tắc chặn / validation\n- Không cho phép gán khoản phí học sinh vào một mục thu CSDL Sở đang có trạng thái `ARCHIVED` hoặc `active = false`.\n- **Cơ chế Khóa dữ liệu kỳ thi (`is_sync_locked` - OQ-15):** Khi Sở GD&ĐT chốt kỳ thi, cờ khóa cứng thông tin định danh học sinh. Muốn mở khóa phải có phiếu phê duyệt của BGH và lưu vết vào `SyncLockAuditTrail`.\n- **Cô lập lỗi ngắt quãng từng học sinh (OQ-15):** Khi đồng bộ hàng loạt, học sinh bị lỗi schema/dữ liệu được đưa vào Retry Queue (3 lần Exponential Backoff) hoặc Dead Letter Queue (DLQ). Toàn bộ các học sinh còn lại vẫn đồng bộ thành công, không rollback cả lô.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-19 | Quản lý danh mục thu chuẩn hóa kết nối cơ sở dữ liệu Bộ/Sở GD&ĐT (CSDL Sở) | Nút đồng bộ và bảng hiển thị danh mục thu | MISSING | repo:app/src/pages/[schoolCode]/school/revenue-categories/index.tsx:1 |\n| TC-20 | Ánh xạ mã tiểu mục tài chính và đồng bộ trạng thái danh mục thu với hệ thống Managing Portal | Xử lý state `syncing`, cập nhật dữ liệu vào Redux store | MISSING | repo:app/src/store/slices/revenueCategorySlice.ts:1 |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thực thể Danh mục thu CSDL Sở](../entities/revenue-category.md)\n- [Thực thể Danh mục khoản phí](../entities/fee-catalog-item.md)\n- [Khái niệm Tích hợp CSDL Sở](../concepts/csdl-so-integration.md)\n- [Màn hình danh mục thu](../screens/m4-sm7-danh-muc-thu.md)\n- [Màn hình khoản phí](../screens/m4-sm3-khoan-phi.md)\n"}, {"path": "pages/flows/fl-giao-bai-tap-ve-nha.md", "title": "Luồng Giao Bài Tập, Theo Dõi Nộp Bài & Đánh Giá", "type": "flow", "group": "flows", "fm": {"title": "Luồng Giao Bài Tập, Theo Dõi Nộp Bài & Đánh Giá", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-007-academics-assignment/epic.md"], "spec_ids": ["HT-02"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Giao Bài Tập, Theo Dõi Nộp Bài & Đánh Giá\n\n## Mục tiêu\nChuẩn hóa quy trình giao nhiệm vụ học tập về nhà của giáo viên bộ môn, thông báo tức thì đến phụ huynh học sinh và hỗ trợ theo dõi tiến độ nộp bài, chấm chữa nhận xét.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\n| 1 | Giáo viên bộ môn | Web Admin | Vào màn hình Bài tập, chọn Lớp và Môn học, nhấn \"Tạo bài tập mới\" | Mở form giao bài tập |\n| 2 | Giáo viên | Web Admin | Nhập tiêu đề, hướng dẫn làm bài, hạn nộp (`due_date`), đính kèm tệp đề bài | Dữ liệu nhiệm vụ hoàn thiện |\n| 3 | Giáo viên | Web Admin | Nhấn \"Giao bài\" | Hệ thống gửi thông báo Push tới phụ huynh các học sinh trong lớp |\n| 4 | Phụ huynh / Học sinh | App Mobile | Nhận thông báo, xem hướng dẫn và tải tệp bài làm lên ứng dụng | Trạng thái nộp chuyển sang `SUBMITTED` |\n| 5 | Giáo viên | Web Admin | Mở danh sách bài nộp, chấm điểm/nhận xét và trả kết quả | Học sinh và phụ huynh xem được lời phê của giáo viên |\n\n## Quy tắc chặn / validation\n- Hạn nộp bài (`due_date`) phải lớn hơn thời điểm giao bài hiện tại.\n- Học sinh nộp sau thời hạn bị đánh dấu trạng thái `LATE_SUBMISSION` (nộp muộn).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-02 | Tạo bài tập về nhà kèm hạn nộp và theo dõi trạng thái nộp bài của học sinh | Giao diện danh mục bài tập, form tạo mới và Redux slice | MISSING | repo:app/src/pages/[schoolCode]/school/assignment/index.tsx:1 |\n\n## Liên quan\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Thực thể Bài tập về nhà](../entities/homework-assignment.md)\n- [Thực thể Môn học](../entities/school-subject.md)\n- [Màn hình bài tập về nhà](../screens/m3-sm2-bai-tap.md)\n"}, {"path": "pages/flows/fl-khao-sat-binh-chon.md", "title": "Luồng Khởi Tạo & Lấy Ý Kiến Khảo Sát Bình Chọn", "type": "flow", "group": "flows", "fm": {"title": "Luồng Khởi Tạo & Lấy Ý Kiến Khảo Sát Bình Chọn", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-025-school-polls/epic.md"], "spec_ids": ["NT-08"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Khởi Tạo & Lấy Ý Kiến Khảo Sát Bình Chọn\n\n## Mục tiêu\nCho phép Ban Giám Hiệu và giáo viên tạo các cuộc khảo sát, lấy ý kiến tập thể phụ huynh học sinh một cách minh bạch, tiện lợi, tự động tổng hợp tỷ lệ phần trăm biểu quyết.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\n| 1 | Người quản trị | Web Admin | Vào màn hình Bình chọn, nhấn \"Tạo cuộc bình chọn mới\" | Mở giao diện thiết lập khảo sát |\n| 2 | Người tạo | Web Admin | Điền câu hỏi, danh sách tùy chọn trả lời, đối tượng tham gia (toàn trường / theo lớp), hạn kết thúc | Thiết lập hoàn tất |\n| 3 | Người tạo | Web Admin | Nhấn \"Phát hành khảo sát\" | Gửi thông báo khảo sát tới ứng dụng phụ huynh |\n| 4 | Phụ huynh | App Mobile | Mở thông báo, chọn phương án biểu quyết và bấm \"Xác nhận gửi\" | Ghi nhận 01 phiếu biểu quyết |\n| 5 | Người quản trị | Web Admin | Theo dõi biểu đồ tròn kết quả theo thời gian thực và kết xuất file báo cáo | Xuất báo cáo tỷ lệ đồng thuận |\n\n## Quy tắc chặn / validation\n- Bắt buộc phải có ít nhất 2 phương án lựa chọn trong một câu hỏi bình chọn.\n- Khi thời gian khảo sát kết thúc (`now > end_time`), hệ thống tự động khóa tính năng bỏ phiếu, không phụ huynh nào có thể gửi thêm đáp án.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-08 | Khởi tạo bình chọn và khảo sát ý kiến trực tuyến của phụ huynh và giáo viên | Giao diện tạo bình chọn, danh sách và Redux slice | MISSING | repo:app/src/pages/[schoolCode]/school/poll/create.tsx:1 |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Thực thể Khảo sát & Bình chọn](../entities/school-poll.md)\n- [Màn hình bình chọn](../screens/m5-sm7-binh-chon.md)\n"}, {"path": "pages/flows/fl-kho-luu-tru-hoc-sinh.md", "title": "Luồng Lưu Trữ & Phục Hồi Học Sinh Kho Lạnh (Student Archive & Restoration Flow)", "type": "flow", "group": "flows", "fm": {"title": "Luồng Lưu Trữ & Phục Hồi Học Sinh Kho Lạnh (Student Archive & Restoration Flow)", "type": "flow", "sources": ["repo:docs/guides/planning/flows.md", "repo:docs/guides/decisions.md", "pages/sources/src-open-questions-resolutions.md"], "updated": "2026-11-05", "spec_ids": ["NT-17", "NT-10"]}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Luồng Lưu Trữ & Phục Hồi Học Sinh Kho Lạnh (Student Archive & Restoration Flow)\n\n## Mục tiêu\nĐặc tả quy trình chuyển hồ sơ học sinh vào kho lưu trữ lạnh khi thôi học, chuyển trường hoặc tốt nghiệp; cơ chế quyết toán học phí Pro-rata và hạ cấp tài khoản Mobile App khi rút hồ sơ giữa kỳ; cơ chế kiểm tra tính sẵn sàng của lớp học cũ khi phục hồi học sinh (`LT-01`); và quy trình xóa vĩnh viễn bảo vệ 2 bước với cảnh báo nguy hiểm màu đỏ (`LT-02`).\n\n## Các bước\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Admin as Quản Trị Viên Trường\n    participant Client as Next.js Web Portal\n    participant API as Backend API\n    participant DB as School Database\n\n    Note over Admin,DB: 1. Luồng đưa học sinh vào kho lưu trữ & Quyết toán Pro-rata\n    Admin->>Client: Mở danh sách Học sinh > Chọn \"Chuyển lưu trữ / Rút hồ sơ\"\n    Client->>Admin: Hiển thị modal chọn lý do (thôi học, chuyển trường, tốt nghiệp)\n    alt Rút hồ sơ / Thôi học giữa kỳ (OQ-17)\n        Client->>API: GET /{schoolCode}/api/1.0/students/{id}/pro-rata-settlement\n        API-->>Client: Bảng quyết toán Pro-rata (học phí theo tuần còn lại, tiền ăn 100% ngày chưa học)\n        Admin->>Client: Xác nhận thanh lý, sinh Phiếu chi hoàn tiền & Hủy hóa đơn tương lai\n        API->>DB: Hủy hóa đơn tương lai, thu hồi Mobile App sang READ_ONLY_ARCHIVE\n    end\n    Admin->>Client: Xác nhận chuyển lưu trữ\n    Client->>API: POST /{schoolCode}/api/1.0/students/{id}/archive\n    API->>DB: Đóng băng hồ sơ, tạo bản ghi student-archive-record\n    API-->>Client: Phản hồi thành công, học sinh biến mất khỏi danh sách hoạt động\n\n    Note over Admin,DB: 2. Luồng phục hồi học sinh (NT-17)\n    Admin->>Client: Mở Kho lưu trữ (/[schoolCode]/school/archive)\n    Admin->>Client: Bấm icon \"Phục hồi\" trên hàng học sinh\n    Client->>API: POST /{schoolCode}/api/1.0/archive/{id}/restore\n    API->>DB: Kiểm tra lớp học cũ (formerClassId) trong niên khóa hiện tại\n    alt Lớp cũ còn đang hoạt động\n        API->>DB: Gán học sinh trở lại lớp cũ\n        API-->>Client: Phục hồi thành công về lớp {tên lớp}\n    else Lớp cũ đã giải tán / đóng / xóa (OQ-12)\n        API-->>Client: Yêu cầu bắt buộc: Chọn Lớp học đích đang hoạt động\n        Admin->>Client: Chọn lớp đích mới trong niên khóa hiện tại\n        Client->>API: POST /{schoolCode}/api/1.0/archive/{id}/restore {targetClassId}\n        API->>DB: Kiểm tra sĩ số, gán vào lớp mới, liên kết biểu phí lớp mới\n        API-->>Client: Phục hồi thành công về lớp đích mới\n    end\n\n    Note over Admin,DB: 3. Luồng xóa vĩnh viễn bảo vệ 2 bước & Chốt chặn công nợ\n    Admin->>Client: Bấm icon thùng rác \"Xóa vĩnh viễn\"\n    Client->>API: GET /{schoolCode}/api/1.0/archive/{id}/debt-check\n    alt Còn công nợ học phí chưa thanh toán (OQ-12)\n        API-->>Client: Từ chối xóa: Học sinh còn nợ học phí chưa tất toán!\n        Client->>Admin: Cảnh báo đỏ: Không thể xóa khi còn công nợ\n    else Đã tất toán toàn bộ công nợ\n        Client->>Admin: Modal cảnh báo màu đỏ cấp 1 (LT-02)\n        Admin->>Client: Nhập xác nhận tên học sinh hoặc mã học sinh (Cấp 2)\n        Client->>API: DELETE /{schoolCode}/api/1.0/archive/{id}/purge\n        API->>DB: Xóa hoàn toàn bản ghi khỏi CSDL\n        API-->>Client: Thông báo xóa vĩnh viễn thành công\n    end\n```\n\n1. **Đưa học sinh vào kho lưu trữ & Thanh lý học phí rút hồ sơ (OQ-17):**\n   - Admin truy cập danh sách Học sinh (`/school/kid`), bấm menu `•••` chọn \"Lưu trữ / Rút hồ sơ\".\n   - Nếu là Thôi học / Rút hồ sơ giữa kỳ (`withdrawn`), hệ thống tự động lập Bảng quyết toán Pro-rata: Phân chia khoản không hoàn (phí CSVC, nhập học) và khoản hoàn lại (học phí theo tuần còn lại, tiền ăn 100% ngày chưa học).\n   - Tự động sinh Phiếu chi hoàn tiền (`TuitionRefundVoucher`) loại `STUDENT_WITHDRAWAL_REFUND` (duyệt chi 2 cấp), quét và Hủy vĩnh viễn tất cả hóa đơn dự kiến chưa phát hành trong tương lai.\n   - Thu hồi tức thời quyền tương tác trên Mobile App (chat, điểm danh), chuyển tài khoản phụ huynh sang chế độ `READ_ONLY_ARCHIVE` chỉ đọc lịch sử.\n2. **Tra cứu trong kho lưu trữ:**\n   - Admin truy cập Kho lưu trữ (`/school/archive`), sử dụng thanh công cụ lọc theo tháng lưu trữ, tìm kiếm tên, mã học sinh hoặc lớp học cũ.\n3. **Phục hồi học sinh (LT-01, NT-17, OQ-12):**\n   - Admin bấm nút \"Phục hồi\" trên dòng học sinh.\n   - Hệ thống kiểm tra: Nếu lớp cũ còn hoạt động, cho phép phục hồi về lớp cũ (kiểm tra sĩ số). Nếu lớp cũ đã đóng/xóa: BẮT BUỘC Admin phải chọn một **Lớp học đích đang hoạt động** trong niên khóa hiện hành.\n4. **Xóa vĩnh viễn bảo vệ 2 bước & Chốt chặn công nợ (LT-02, OQ-12):**\n   - Hệ thống kiểm tra công nợ học phí: Tuyệt đối cấm xóa nếu còn nợ chưa thanh toán (`balance_due > 0`).\n\n## Quy tắc chặn / validation\n- **Quy tắc cách ly tuyệt đối (NT-17):** Học sinh trong kho lưu trữ không bao giờ xuất hiện trong bảng tính học phí, danh sách điểm danh hay danh sách phân chia suất ăn.\n- **Quyết toán Pro-rata khi rút hồ sơ (OQ-17):** Phân chia rõ ràng khoản không hoàn lại và khoản hoàn theo tuần/ngày; bắt buộc lập phiếu chi và hủy toàn bộ hóa đơn tương lai.\n- **Bắt buộc chọn lớp đích khi phục hồi (OQ-12):** Cấm phục hồi học sinh về trạng thái mồ côi \"Chưa xếp lớp\" nếu lớp cũ đã giải tán; bắt buộc phải gán vào một lớp đích đang hoạt động.\n- **Chốt chặn bảo toàn công nợ (OQ-12):** Tuyệt đối cấm xóa vĩnh viễn hồ sơ học sinh khi còn dư nợ học phí (`balance_due > 0`).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-17 | Cách ly kho lạnh, kiểm tra lớp khi phục hồi và bảo vệ xóa 2 bước | Đã có route `app/src/pages/[schoolCode]/school/archive/index.tsx` | MISSING | — |\n| NT-10 | Quản lý kho lưu trữ học sinh thôi học, chuyển trường | Giao diện kho lưu trữ đã hoàn thiện đầy đủ component | MISSING | — |\n\n## Liên quan\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Khái niệm vòng đời học sinh](../concepts/student-lifecycle-transitions.md)\n- [Thực thể hồ sơ lưu trữ học sinh](../entities/student-archive-record.md)\n- [Thực thể hồ sơ học sinh](../entities/student-profile.md)\n- [Thực thể Phiếu chi nội bộ](../entities/expense-voucher.md)\n- [Màn hình kho lưu trữ](../screens/m5-sm14-luu-tru.md)\n"}, {"path": "pages/flows/fl-lap-duyet-phieu-chi.md", "title": "Luồng Lập, Đính Kèm Chứng Từ & Phê Duyệt Phiếu Chi", "type": "flow", "group": "flows", "fm": {"title": "Luồng Lập, Đính Kèm Chứng Từ & Phê Duyệt Phiếu Chi", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "pages/sources/src-open-questions-resolutions.md", "repo:docs/guides/development/E-012-finance-expenses/epic.md"], "spec_ids": ["TC-05"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Lập, Đính Kèm Chứng Từ & Phê Duyệt Phiếu Chi\n\n## Mục tiêu\nQuản lý chặt chẽ các khoản chi tiêu vận hành nhà trường (mua sắm văn phòng phẩm, hoàn tiền thừa học phí, sửa chữa cơ sở vật chất, hoạt động dã ngoại), đồng thời quản lý giải ngân Phiếu chi hoàn tiền rút hồ sơ (`STUDENT_WITHDRAWAL_REFUND` - OQ-17) và Phiếu chi hoàn tiền thừa VietQR (`VIETQR_EXCESS_REFUND` - OQ-18), đảm bảo có hóa đơn chứng từ hợp lệ và được Ban Giám Hiệu phê duyệt trước khi xuất quỹ.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\n| 1 | Nhân viên / Kế toán | Web Admin | Truy cập màn hình Khoản chi và nhấn \"Tạo phiếu chi mới\" (hoặc sinh tự động từ Quyết toán rút hồ sơ / Đối soát chuyển thừa) | Mở form nhập chứng từ chi |\n| 2 | Người tạo | Web Admin | Điền người nhận tiền, phân loại mục chi (chi vận hành, `STUDENT_WITHDRAWAL_REFUND`, `VIETQR_EXCESS_REFUND`), số tiền, ngày chi và tải ảnh/PDF hóa đơn chứng từ | Form được xác thực hợp lệ |\n| 3 | Người tạo | Web Admin | Nhấn \"Trình duyệt phiếu chi\" | Trạng thái chuyển thành `PENDING_APPROVAL` |\n| 4 | Hiệu trưởng / Kế toán trưởng | Web Admin | Kiểm tra nội dung chứng từ, quy tắc Pro-rata hoặc giao dịch Overpaid, chọn \"Phê duyệt\" hoặc \"Từ chối\" kèm lý do | Cập nhật trạng thái phiếu chi |\n| 5 | Thủ quỹ / Kế toán | Web Admin | Thực hiện xuất quỹ tiền mặt hoặc ủy nhiệm chi, nhấn \"Hoàn thành chi\" | Phiếu chi chuyển sang `COMPLETED`, trừ quỹ tương ứng |\n\n## Quy tắc chặn / validation\n- Bắt buộc phải tải lên ít nhất một chứng từ đính kèm (ảnh hóa đơn, biên nhận) đối với các khoản chi có giá trị từ 500.000 đ trở lên.\n- Không thể hủy hoặc xóa phiếu chi đã ở trạng thái `COMPLETED` (chỉ được tạo phiếu thu hoàn ứng để điều chỉnh sổ sách kế toán).\n- **Phiếu chi hoàn tiền rút hồ sơ (`STUDENT_WITHDRAWAL_REFUND` - OQ-17):** Bắt buộc liên kết với Biên bản thanh lý Pro-rata và hồ sơ lưu trữ học sinh, duyệt chi 2 cấp trước khi giải ngân.\n- **Phiếu chi hoàn tiền thừa VietQR (`VIETQR_EXCESS_REFUND` - OQ-18):** Bắt buộc đối chiếu với giao dịch `OVERPAID` trên phiên đối soát ngân hàng.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-05 | Lập, trình duyệt và theo dõi vòng đời phiếu chi nội bộ kèm chứng từ đính kèm | Giao diện tạo phiếu chi, tải ảnh chứng từ và Redux slice | MISSING | repo:app/src/pages/[schoolCode]/school/expenses/create/index.tsx:1 |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Thực thể Phiếu chi nội bộ](../entities/expense-voucher.md)\n- [Khái niệm Vòng đời học sinh](../concepts/student-lifecycle-transitions.md)\n- [Khái niệm Kiến trúc VietQR và đối soát](../concepts/vietqr-dynamic-reconciliation.md)\n- [Thực thể Hồ sơ lưu trữ học sinh](../entities/student-archive-record.md)\n- [Màn hình khoản chi](../screens/m4-sm5-khoan-chi.md)\n"}, {"path": "pages/flows/fl-lap-phat-hanh-hoa-don.md", "title": "Luồng Lập & Phát Hành Hóa Đơn Học Phí VietQR", "type": "flow", "group": "flows", "fm": {"title": "Luồng Lập & Phát Hành Hóa Đơn Học Phí VietQR", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-tech-architecture-blueprint.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["TC-01", "TC-03", "TC-04"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 3}}, "open": 0, "body": "# Luồng Lập & Phát Hành Hóa Đơn Học Phí VietQR\n\n## Mục tiêu\nCho phép kế toán viên tạo đợt thu học phí định kỳ theo lớp học hoặc toàn trường, tự động nạp danh mục khoản phí của từng lớp (bao gồm lớp chính khóa và ngoại khóa), áp dụng các chính sách miễn giảm và hoàn tiền ăn, hỗ trợ phân rã Sub-invoice và sinh mã VietQR động để phụ huynh thanh toán nhanh chóng.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Kế toán | [Màn hình học phí](../screens/m4-sm1-hoc-phi.md) | Chọn phạm vi thu (Khối, một hoặc nhiều lớp học), chọn kỳ thu và hạn nộp | Hệ thống nạp danh sách học sinh và biểu phí tương ứng | TC-04 |\n| 2 | Kế toán | [Màn hình học phí](../screens/m4-sm1-hoc-phi.md) | Kiểm tra bảng dòng khoản thu (học phí chính khóa, tiền ăn theo snapshot lớp nếu chuyển lớp hoặc tính Prorated theo ngày ăn thực tế còn lại nếu nhập học giữa tháng OQ-22, phí ngoại khóa, khấu trừ hoàn tiền ăn căn cứ sổ điểm danh đã đóng băng cuối tháng OQ-21, số dư Credit Balance, miễn giảm anh chị em ruột OQ-23), bấm \"Phát hành hóa đơn\" | Hóa đơn chuyển trạng thái `issued`, tự động sinh mã VietQR động độc lập cho từng học sinh (không gộp gia đình - OQ-22); phần hoàn thừa kết chuyển thành Credit Balance kỳ sau | TC-01 |\n| 3 | Phụ huynh | Mobile App / Portal | Mở chi tiết hóa đơn học phí của con và quét mã VietQR bằng ứng dụng ngân hàng | Chuyển khoản thành công, hệ thống tự động ghi nhận thanh toán `paid` | TC-01 |\n| 4 | Kế toán / Phụ huynh | [Màn hình học phí](../screens/m4-sm1-hoc-phi.md) | Xử lý ngoại lệ: Phân rã khoản ngoại khóa hoặc xử lý thanh toán thiếu | Tách Sub-invoice ngoại khóa hoặc sinh lại VietQR nợ | TC-01 |\n\n## Quy tắc chặn / validation\n- Chỉ được phát hành hóa đơn khi tổng số tiền thanh toán $\\ge 0$; nếu tiền hoàn lớn hơn học phí, đặt `amount_due = 0` và lưu phần chênh lệch vào `credit_balance` (TC-01, TC-02).\n- **Quy định hóa đơn riêng lẻ độc lập cho từng học sinh (OQ-22):** Hệ thống CHỈ tạo hóa đơn riêng lẻ cho từng học sinh (`INV-{studentCode}-{YYYYMM}`), tuyệt đối không gộp chung nghĩa vụ tài chính của nhiều học sinh vào một hóa đơn gia đình. Mỗi học sinh sở hữu mã VietQR riêng biệt và quy trình gạch nợ độc lập.\n- **Tính học phí và tiền ăn lẻ ngày nhập học giữa tháng (Prorated - OQ-22):** Chọn ngày bắt đầu học `enrollment_date`, tiền ăn tính theo số ngày ăn thực tế còn lại đến cuối tháng; học phí tính theo tỷ lệ ngày học còn lại so với ngày làm việc chuẩn. Nếu ngày bắt đầu rơi vào cuối tuần hoặc ngày lễ, bắt đầu tính từ ngày học/ăn bán trú thực tế đầu tiên; số ngày ăn chỉ đếm ngày bếp hoạt động thực tế.\n- **Căn cứ dữ liệu hoàn tiền ăn đóng băng cuối tháng (OQ-21):** Số liệu ngày nghỉ có phép hoàn tiền ăn được truy xuất tự động từ sổ điểm danh tháng M sau khi hệ thống tự động kích hoạt đóng băng (Monthly Auto-Freeze) vào 23:59:59 ngày cuối tháng.\n- **Phân rã Sub-Invoice lớp ngoại khóa (OQ-14):** Khoản phí ngoại khóa được cấu trúc là Sub-Invoice (`is_separable = true`). Nếu phụ huynh từ chối đóng ngoại khóa, hệ thống cho phép thanh toán một phần hoặc tách thành hóa đơn con độc lập (`INV-EXT-...`), chuyển hóa đơn chính khóa sang `PAID` mà không bị gián đoạn.\n- **Xử lý chuyển thiếu & Sinh lại mã VietQR (OQ-18):** Nếu phụ huynh chuyển thiếu tiền, hóa đơn chuyển sang `PARTIAL_PAID`. Hệ thống tự động sinh lại mã VietQR động mới với payload bằng đúng số tiền còn nợ (`remaining_amount`) để phụ huynh quét mã thanh toán nốt.\n- Chốt chặn Race condition: Khi kế toán bắt đầu thao tác Hủy hoặc Chỉnh sửa hóa đơn đã phát hành, hệ thống khóa dòng `FOR UPDATE` và lập tức vô hiệu hóa mã VietQR cũ. Giao dịch webhook thanh toán đến sau khi hóa đơn đã hủy được đưa vào `UNMATCHED_SUSPENSE_POOL` (TC-01).\n- Trong quá trình ghi nhận thanh toán, bắt buộc sử dụng Pessimistic Row Lock (`FOR UPDATE`) để ngăn ngừa giao dịch kép hoặc sai lệch số dư (TC-01).\n- Chốt chặn bảo toàn công nợ: Không xóa hoặc ẩn hóa đơn nợ của học sinh ngay cả khi lớp học cũ bị đóng/lưu trữ (TC-01).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-01 | Lập hóa đơn học phí tháng cho học sinh tích hợp mã VietQR động chuyển khoản chính xác | Chưa có API sinh mã VietQR động theo chuẩn NAPAS | MISSING | repo:app/src/features/finance/ |\n| TC-03 | Quản lý danh mục 24 khoản thu toàn trường gồm 3 khoản hệ thống và 21 khoản tùy chỉnh | Danh mục khoản thu mới ở dạng mock tĩnh | MISSING | repo:app/src/features/finance/ |\n| TC-04 | Cấu hình gói biểu phí và đơn giá áp dụng riêng biệt cho từng lớp học hoặc khối lớp | Chưa có logic gán biểu phí liên thông theo từng lớp | MISSING | repo:app/src/features/finance/ |\n\n## Liên quan\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Kiến trúc thanh toán VietQR động](../concepts/vietqr-dynamic-reconciliation.md)\n- [Màn hình học phí](../screens/m4-sm1-hoc-phi.md)\n"}, {"path": "pages/flows/fl-lap-thoi-khoa-bieu.md", "title": "Luồng Lập & Công Bố Thời Khóa Biểu Tuần", "type": "flow", "group": "flows", "fm": {"title": "Luồng Lập & Công Bố Thời Khóa Biểu Tuần", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["HT-01"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Lập & Công Bố Thời Khóa Biểu Tuần\n\n## Mục tiêu\nThiết lập lịch giảng dạy tuần cho từng lớp học (chính khóa và ngoại khóa), tự động kiểm tra xung đột 4 chiều (học sinh, giáo viên, phòng học, sĩ số), công bố bản chính thức tới giáo viên và phụ huynh.\n\n## Các bước\n| # | Vai trò | App / màn | Hành động | Kết quả | Mã |\n|---|---|---|---|---|---|\n| 1 | Quản lý học vụ | [Màn hình thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md) | Chọn lớp học (chính khóa hoặc ngoại khóa), kéo thả hoặc chọn môn học và giáo viên vào từng tiết học trong tuần | Bản thảo thời khóa biểu được tạo lập | HT-01 |\n| 2 | Hệ thống | 4-Way Conflict Scheduler | Kiểm tra tự động 4 chiều (OQ-14): Xung đột lịch học sinh (trùng ca chính khóa/ngoại khóa), giáo viên, phòng học/sân bãi, và kiểm tra vượt sĩ số | Báo lỗi và chặn lưu cứng nếu phát hiện trùng tiết hoặc vượt sĩ số | HT-01 |\n| 3 | Quản lý học vụ | [Màn hình thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md) | Điều chỉnh các tiết trùng (nếu có), bấm \"Công bố thời khóa biểu\" | Thời khóa biểu chuyển sang trạng thái `published` và gửi thông báo | HT-01 |\n\n## Quy tắc chặn / validation\n- Không cho phép công bố thời khóa biểu nếu vẫn còn cảnh báo trùng tiết của giáo viên, phòng học, hoặc trùng ca của học sinh (HT-01, OQ-14).\n- Bộ điều phối 4 chiều tự động phân tích ma trận lịch của lớp chính khóa và tất cả các lớp ngoại khóa học sinh đăng ký để ngăn ngừa trùng giờ hoàn toàn (OQ-14).\n- Mỗi lần chỉnh sửa bản đã công bố phải tạo một phiên bản lịch sử mới để phục vụ tra cứu (HT-01).\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| HT-01 | Thiết lập và công bố thời khóa biểu tuần theo tiết học, môn học, phòng học và giáo viên | Giao diện thời khóa biểu mới hiển thị bảng tĩnh, chưa có logic kiểm tra xung đột | MISSING | repo:app/src/features/academics/ |\n\n## Liên quan\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Thời khóa biểu tuần](../entities/timetable-weekly.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Màn hình thời khóa biểu](../screens/m3-sm1-thoi-khoa-bieu.md)\n"}, {"path": "pages/flows/fl-lap-thuc-don-dinh-duong.md", "title": "Luồng Lập, Duyệt & Công Bố Thực Đơn Dinh Dưỡng Tuần", "type": "flow", "group": "flows", "fm": {"title": "Luồng Lập, Duyệt & Công Bố Thực Đơn Dinh Dưỡng Tuần", "type": "flow", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/development/E-018-school-menu/epic.md"], "spec_ids": ["NT-09"], "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Luồng Lập, Duyệt & Công Bố Thực Đơn Dinh Dưỡng Tuần\n\n## Mục tiêu\nĐảm bảo quy trình lập khẩu phần dinh dưỡng bán trú cho học sinh được chuẩn bị trước chu đáo, có sự phê duyệt của ban chuyên môn y tế học đường và công bố minh bạch cho phụ huynh theo dõi.\n\n## Các bước\n| Bước | Vai trò | Ứng dụng | Hành động | Kết quả mong đợi |\n|---|---|---|---|---|\
