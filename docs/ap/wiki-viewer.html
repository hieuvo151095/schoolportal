oute | File |\n|---|---|---|\n| web | `/{schoolCode}/school/staff-attendance` | repo:app/src/pages/[schoolCode]/school/staff-attendance.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| NT-10 | Điểm danh ca làm việc và tổng hợp bảng chấm công nhân viên nhà trường | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| NT-10 | Điểm danh ca làm việc và tổng hợp bảng chấm công nhân viên nhà trường | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/school/staff-attendance.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-school-admin.md)\n- [Thực thể liên quan](../entities/teacher-staff.md)\n"}, {"path": "pages/screens/m6-sm1-truong.md", "title": "Màn Hình Cấu Hình Trường Học", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Cấu Hình Trường Học", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["CH-01"], "apps": ["web"], "route_ids": ["/{schoolCode}/settings/school-profile"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Cấu Hình Trường Học\n\n## Mục đích\nCập nhật thông tin pháp lý nhà trường, địa chỉ, hotline, logo thương hiệu và niên khóa mặc định.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/settings/school-profile` | repo:app/src/pages/[schoolCode]/settings/school-profile.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CH-01 | Cấu hình thông tin pháp lý nhà trường, biểu tượng thương hiệu và niên khóa mặc định | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-01 | Cấu hình thông tin pháp lý nhà trường, biểu tượng thương hiệu và niên khóa mặc định | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/settings/school-profile.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-settings.md)\n- [Khái niệm liên quan](../concepts/multi-tenancy-isolation.md)\n"}, {"path": "pages/screens/m6-sm2-tai-khoan.md", "title": "Màn Hình Quản Trị Tài Khoản", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Quản Trị Tài Khoản", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["CH-02"], "apps": ["web"], "route_ids": ["/{schoolCode}/settings/accounts"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Quản Trị Tài Khoản\n\n## Mục đích\nCấp phát tài khoản người dùng, phân quyền nhóm quản trị và khóa/mở khóa tài khoản.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/settings/accounts` | repo:app/src/pages/[schoolCode]/settings/accounts.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CH-02 | Quản trị tài khoản người dùng, cấp quyền quản trị và quản lý trạng thái tài khoản | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-02 | Quản trị tài khoản người dùng, cấp quyền quản trị và quản lý trạng thái tài khoản | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/settings/accounts.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-settings.md)\n- [Thực thể liên quan](../entities/auth-session.md)\n"}, {"path": "pages/screens/m6-sm3-hoc-phi.md", "title": "Màn Hình Cấu Hình Tham Số Học Phí", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Cấu Hình Tham Số Học Phí", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["CH-03", "CH-10"], "apps": ["web"], "route_ids": ["/{schoolCode}/settings/fee-configuration"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Màn Hình Cấu Hình Tham Số Học Phí\n\n## Mục đích\nThiết lập các tham số tính học phí, tỷ lệ hoàn tiền ăn bán trú và hạn chốt báo vắng hằng ngày.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/settings/fee-configuration` | repo:app/src/pages/[schoolCode]/settings/fee-configuration.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CH-03 | Thiết lập tham số tính học phí, tỷ lệ hoàn tiền ăn và hạn chốt báo vắng hằng ngày | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-03 | Thiết lập tham số tính học phí, tỷ lệ hoàn tiền ăn và hạn chốt báo vắng hằng ngày | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/settings/fee-configuration.tsx |\n| CH-10 | Quy chuẩn bảo mật hóa đơn điện tử SInvoice: mật khẩu bắt buộc ẩn vĩnh viễn không có toggle hiển thị | Cấu hình UI tĩnh, chưa có API cấu hình bảo mật backend | MISSING | repo:app/src/pages/[schoolCode]/settings/fee-configuration.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-settings.md)\n- [Khái niệm liên quan](../concepts/meal-refund-engine.md)\n- [Thực thể liên quan](../entities/tuition-invoice.md)\n"}, {"path": "pages/screens/m6-sm4-nhan-dien.md", "title": "Màn Hình Cấu Hình Nhận Diện AI", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Cấu Hình Nhận Diện AI", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-open-questions-resolutions.md"], "spec_ids": ["CH-04"], "apps": ["web"], "route_ids": ["/{schoolCode}/settings/face-recognition"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Cấu Hình Nhận Diện AI\n\n## Mục đích\nCấu hình tham số mô hình AI nhận diện khuôn mặt, độ nhạy ngưỡng tin cậy (mặc định $\\ge 0.85$), huấn luyện vector mẫu, và thiết lập chế độ bảo vệ quyền riêng tư sinh trắc học Opt-Out (`AUTO_BLUR_FACE` / `EXCLUDE_FROM_PUBLIC_ALBUM` theo Nghị định 13/2023/NĐ-CP - OQ-16).\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/settings/face-recognition` | repo:app/src/pages/[schoolCode]/settings/face-recognition.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CH-04 | Cấu hình mô hình AI nhận diện khuôn mặt, ngưỡng nhạy độ tin cậy và chế độ bảo vệ quyền riêng tư Opt-Out OQ-16 | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-04 | Cấu hình mô hình AI nhận diện khuôn mặt và ngưỡng nhạy độ tin cậy nhận diện | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/settings/face-recognition.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-04, OQ-16).\n\n## Liên quan\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Hồ sơ sinh trắc khuôn mặt](../entities/face-biometric-registration.md)\n- [Thư viện media](../entities/media-album.md)\n- [Luồng đăng ký sinh trắc khuôn mặt](../flows/fl-dang-ky-sinh-trac-khuon-mat.md)\n"}, {"path": "pages/screens/m6-sm5-tinh-nang.md", "title": "Màn Hình Bật Tắt Tính Năng", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Bật Tắt Tính Năng", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["CH-05"], "apps": ["web"], "route_ids": ["/{schoolCode}/settings/features"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Bật Tắt Tính Năng\n\n## Mục đích\nQuản lý bật/tắt các phân hệ và tính năng (Feature Flags) linh hoạt theo từng trường học và gói bản quyền.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/settings/features` | repo:app/src/pages/[schoolCode]/settings/features.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CH-05 | Quản lý bật/tắt các phân hệ và tính năng (Feature Flags) theo gói bản quyền phần mềm | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-05 | Quản lý bật/tắt các phân hệ và tính năng (Feature Flags) theo gói bản quyền phần mềm | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/settings/features.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-settings.md)\n- [Khái niệm liên quan](../concepts/multi-tenancy-isolation.md)\n"}, {"path": "pages/screens/m6-sm6-thong-bao.md", "title": "Màn Hình Cấu Hình Thông Báo", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Cấu Hình Thông Báo", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md"], "spec_ids": ["CH-06"], "apps": ["web"], "route_ids": ["/{schoolCode}/settings/notifications"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 1}}, "open": 0, "body": "# Màn Hình Cấu Hình Thông Báo\n\n## Mục đích\nThiết lập ma trận quy tắc gửi thông báo push và email cho phụ huynh, giáo viên và quản trị viên.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/settings/notifications` | repo:app/src/pages/[schoolCode]/settings/notifications.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CH-06 | Cấu hình ma trận quy tắc gửi thông báo push và email đa kênh theo sự kiện | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-06 | Cấu hình ma trận quy tắc gửi thông báo push và email đa kênh theo sự kiện | Prototype frontend mockup, chưa có API backend | MISSING | repo:app/src/pages/[schoolCode]/settings/notifications.tsx |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ tương ứng](../overview/module-settings.md)\n- [Thực thể liên quan](../entities/teacher-staff.md)\n"}, {"path": "pages/screens/m6-sm7-lich-su-thanh-toan.md", "title": "Màn Hình Lịch Sử Giao Dịch Sepay (M6-SM7)", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Lịch Sử Giao Dịch Sepay (M6-SM7)", "type": "screen", "sources": ["repo:docs/guides/planning/screens.md", "repo:docs/guides/decisions.md", "pages/sources/src-open-questions-resolutions.md", "repo:app/src/pages/[schoolCode]/setting/fee/payment-history/index.tsx"], "updated": "2026-11-05", "spec_ids": ["TC-21", "CH-09"], "route_ids": ["/[schoolCode]/setting/fee/payment-history"], "status": "implemented"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Màn Hình Lịch Sử Giao Dịch Sepay (M6-SM7)\n\n## Mục đích\nMàn hình cung cấp giao diện tra cứu, kiểm toán và giám sát toàn bộ các luồng giao dịch thanh toán học phí tự động phát sinh qua cổng thanh toán Sepay và webhook ngân hàng. Hỗ trợ kế toán trường học đối chiếu các khoản thu theo từng tháng, lọc trạng thái xử lý, xuất dữ liệu giao dịch, và hiển thị rõ ràng các giao dịch bất thường chuyển thừa (`OVERPAID`), chuyển thiếu (`PARTIAL_PAID`), và đóng băng chờ tra soát ngân hàng (`FROZEN_UNDER_REVIEW` - OQ-18).\n\n## Route và components\n- **Route:** `/[schoolCode]/setting/fee/payment-history`\n- **File code:** `repo:app/src/pages/[schoolCode]/setting/fee/payment-history/index.tsx`\n- **Thành phần giao diện:**\n  - Nút quay lại cấu hình học phí (`faArrowLeft` -> `/[schoolCode]/setting/fee`).\n  - Thanh công cụ lọc đa chiều:\n    - Ô tìm kiếm linh hoạt theo Tên học sinh, Lớp học, Số hóa đơn, Mã giao dịch Sepay.\n    - Bộ chọn tháng đối soát (`selectedMonth`, ví dụ: `2026-09`).\n    - Bộ lọc trạng thái giao dịch (`all`, `success`, `pending`, `failed`, `overpaid`, `partial_paid`, `frozen_under_review`).\n  - Bảng danh sách giao dịch 8 cột:\n    - STT, Mã giao dịch (`transactionCode`), Số hóa đơn (`invoiceNumber`), Tên học sinh, Lớp, Số tiền thanh toán (`formatCurrencyVND`), Ngày giao dịch (`paymentDate`), Trạng thái (`StatusTag`: Thành công / Chờ xử lý / Thất bại / Chuyển thừa / Chuyển thiếu / Đóng băng tra soát).\n  - Khối rỗng (Empty state) với biểu tượng `faReceipt` và thông báo rõ ràng khi không tìm thấy giao dịch nào trong tháng đã chọn.\n\n## Yêu cầu spec\n- **TC-21:** Toàn bộ lịch sử giao dịch cổng thanh toán Sepay phải được hiển thị dưới dạng bản ghi bất biến (append-only), lưu vết mã giao dịch duy nhất, thời gian thanh toán chính xác, số hóa đơn học phí liên kết, trạng thái xử lý webhook và cờ bất thường OQ-18.\n- **CH-09:** Điều hướng trơn tru giữa trang cấu hình thông số học phí và trang lịch sử thanh toán mà không làm mất dirty state của các khối cấu hình đang nhập dở dang.\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| TC-21 | Tra cứu lịch sử thanh toán Sepay theo tháng và trạng thái | Đã dựng giao diện đầy đủ với bộ lọc Redux và selector | MISSING | — |\n| CH-09 | Điều hướng an toàn từ cấu hình học phí | Có nút back về `/[schoolCode]/setting/fee` | MISSING | — |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md) mục OQ-18).\n\n## Liên quan\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Màn hình cấu hình học phí](m6-sm3-hoc-phi.md)\n- [Màn hình học phí](m4-sm1-hoc-phi.md)\n- [Thực thể hóa đơn học phí](../entities/tuition-invoice.md)\n- [Kiến trúc thanh toán VietQR động](../concepts/vietqr-dynamic-reconciliation.md)\n"}, {"path": "pages/screens/m7-sm1-khac.md", "title": "Màn Hình Quản Trị Tài Khoản Cá Nhân & Thông Báo", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Quản Trị Tài Khoản Cá Nhân & Thông Báo", "type": "screen", "sources": ["pages/sources/src-legacy-operating-portal-guide.md", "pages/sources/src-development-epics-manifest.md", "repo:docs/guides/legacy/operating-portal/M7-khac/SM1-khac.md"], "spec_ids": ["CH-07", "CH-08"], "apps": ["web"], "route_ids": ["/{schoolCode}/user/profile", "/{schoolCode}/user/edit-profile", "/{schoolCode}/user/notification", "/system/announcement"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"MISSING": 2}}, "open": 0, "body": "# Màn Hình Quản Trị Tài Khoản Cá Nhân & Thông Báo\n\n## Mục đích\nCung cấp menu tác vụ cá nhân từ avatar góc trên-phải cho quản trị viên trường học: xem và chỉnh sửa thông tin hồ sơ cá nhân, đổi mật khẩu, xem thông báo cá nhân theo 4 luồng sự kiện, chuyển đổi ngôn ngữ giao diện (Tiếng Việt / English), đăng xuất an toàn và tiếp nhận thông báo hệ thống từ nhà cung cấp.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/user/profile` | repo:app/src/components/layout/PortalLayout.tsx |\n| web | `/{schoolCode}/user/edit-profile` | repo:app/src/components/layout/PortalLayout.tsx |\n| web | `/{schoolCode}/user/notification` | repo:app/src/components/layout/PortalLayout.tsx |\n| web | `/system/announcement` | repo:app/src/components/layout/PortalLayout.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| CH-07 | Quản lý hồ sơ cá nhân của người dùng, đổi mật khẩu và lưu cấu hình ngôn ngữ giao diện theo tài khoản | MISSING |\n| CH-08 | Trung tâm tiếp nhận và phân loại thông báo cá nhân theo 4 luồng sự kiện chuyên biệt | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| CH-07 | Quản lý hồ sơ cá nhân của người dùng, đổi mật khẩu và lưu cấu hình ngôn ngữ giao diện theo tài khoản | PortalLayout mockup header avatar dropdown, chưa kết nối API cập nhật thông tin cá nhân | MISSING | repo:app/src/components/layout/PortalLayout.tsx:1 |\n| CH-08 | Trung tâm tiếp nhận và phân loại thông báo cá nhân theo 4 luồng sự kiện chuyên biệt | Header có icon chuông thông báo nhưng trang chi tiết thông báo cá nhân chưa hoàn thiện | MISSING | repo:app/src/components/layout/PortalLayout.tsx:1 |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Phân hệ Đăng nhập & Xác thực](../overview/module-auth.md)\n- [Màn hình đăng nhập](../screens/m7-sm2-dang-nhap.md)\n- [Thực thể Giáo viên & Nhân viên](../entities/teacher-staff.md)\n- [Thực thể Phiên đăng nhập](../entities/auth-session.md)\n"}, {"path": "pages/screens/m7-sm2-dang-nhap.md", "title": "Màn Hình Đăng Nhập Hệ Thống", "type": "screen", "group": "screens", "fm": {"title": "Màn Hình Đăng Nhập Hệ Thống", "type": "screen", "sources": ["pages/sources/src-prd-school-operating-portal.md", "pages/sources/src-prd-dang-nhap-xac-thuc.md"], "spec_ids": ["DN-01", "DN-02", "DN-03", "DN-04", "DN-05", "DN-06"], "apps": ["web"], "route_ids": ["/{schoolCode}/login", "/signin", "/sso/login"], "status": "missing", "updated": "2026-11-05"}, "gap": {"gap": {"OK": 2, "MISSING": 4}}, "open": 0, "body": "# Màn Hình Đăng Nhập Hệ Thống\n\n## Mục đích\nCổng xác thực danh tính người dùng theo trường học cụ thể (`{schoolCode}`), hỗ trợ đăng nhập mật khẩu truyền thống và đăng nhập một lần (SSO - Single Sign-On), cấp phiên làm việc JWT và phân quyền giao diện; thực thi cô lập phiên đa tab (`eco_token_{schoolCode}`), phân kênh WebSocket theo tenant và dọn dẹp Redux Store qua `RESET_TENANT_STATE` khi chuyển trường.\n\n## App / route / file code\n| App | Route | File |\n|---|---|---|\n| web | `/{schoolCode}/login` | repo:app/src/pages/signin.tsx |\n| web | `/signin` | repo:app/src/pages/signin.tsx |\n| web | `/sso/login` | repo:app/src/pages/sso/login.tsx |\n\n## Yêu cầu spec\n| Mã | Yêu cầu | Trạng thái |\n|---|---|---|\n| DN-01 | Đăng nhập hệ thống theo tiền tố mã trường `{schoolCode}` và cấp cặp JWT Access/Refresh Token | OK |\n| DN-02 | Phân quyền kiểm soát truy cập theo mô hình Role-Based Access Control (RBAC) 3 cấp | OK |\n| DN-03 | Xác thực đăng nhập một lần SSO (Single Sign-On) tích hợp với hệ thống Managing Portal | MISSING |\n| DN-04 | Cơ chế khóa tạm thời tài khoản chống tấn công dò mật khẩu sau 5 lần thử thất bại | MISSING |\n| DN-05 | Kiểm soát vòng đời phiên làm việc và tự động làm mới JWT Access/Refresh Token | MISSING |\n\n## Khác biệt spec ↔ code\n| Mã spec | Spec yêu cầu | Code hiện tại | Mức | Bằng chứng |\n|---|---|---|---|---|\n| DN-01 | Đăng nhập hệ thống theo tiền tố mã trường `{schoolCode}` và cấp cặp JWT Access/Refresh Token | Phân vùng session đa tab theo namespace `eco_session_{schoolCode}` và `eco_token_{schoolCode}` | OK | repo:app/src/utils/authSession.ts:16 |\n| DN-02 | Phân quyền kiểm soát truy cập theo mô hình Role-Based Access Control (RBAC) 3 cấp | Mô hình RBAC 3 cấp (Module -> Resource:Action -> Data Scope) và bộ lọc checkAccessScope | OK | repo:app/src/utils/rbac.ts:1 |\n| DN-03 | Xác thực đăng nhập một lần SSO (Single Sign-On) tích hợp với hệ thống Managing Portal | Trang mock SSO tiếp nhận token qua URL query nhưng chưa liên thông auth backend | MISSING | repo:app/src/pages/sso/login.tsx:1 |\n| DN-04 | Cơ chế khóa tạm thời tài khoản chống tấn công dò mật khẩu sau 5 lần thử thất bại | Xử lý client validation cơ bản, chưa có rate-limiting backend | MISSING | repo:app/src/utils/authValidation.ts:1 |\n| DN-05 | Kiểm soát vòng đời phiên làm việc và tự động làm mới JWT Access/Refresh Token | Mock session helper, chưa có middleware silent refresh | MISSING | repo:app/src/utils/authSession.ts:1 |\n| DN-06 | Thu hồi phiên làm việc từ xa và đăng xuất an toàn trên toàn bộ thiết bị đang hoạt động | Mock session helper, chưa có API thu hồi token từ xa | MISSING | repo:app/src/utils/authSession.ts:1 |\n\n## Câu hỏi mở\nKhông có câu hỏi mở tồn đọng (đã giải quyết dứt điểm tại [Bảng câu hỏi mở](../sources/src-open-questions-resolutions.md)).\n\n## Liên quan\n- [Phân hệ Đăng nhập & Xác thực](../overview/module-auth.md)\n- [Thực thể Phiên đăng nhập](../entities/auth-session.md)\n- [Khái niệm Cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n- [Luồng đăng nhập đa trường](../flows/fl-dang-nhap-da-truong.md)\n- [Màn hình quản trị tài khoản cá nhân](../screens/m7-sm1-khac.md)\n"}, {"path": "pages/sources/src-adr-architectural-decisions.md", "title": "Đặc Tả 33 Quyết Định Kiến Trúc (Architecture Decision Records)", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả 33 Quyết Định Kiến Trúc (Architecture Decision Records)", "type": "source", "sources": ["repo:docs/guides/decisions.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả 33 Quyết Định Kiến Trúc (Architecture Decision Records)\n\n## Thông tin nguồn\n- **Tên tài liệu:** Architecture Decision Records (ADR) — School Operating Portal\n- **Đường dẫn gốc:** `repo:docs/guides/decisions.md`\n- **Tiêu chuẩn quản trị:** Marcus Fleet Architecture Decision Matrix (ADR-001 đến ADR-033)\n- **Phạm vi:** 33 quyết định kiến trúc cốt lõi chi phối toàn bộ hệ thống từ định tuyến multi-tenant, thiết kế giao diện, luồng phê duyệt, công thức tài chính, sổ điểm Bộ GD&ĐT đến bảo mật dữ liệu.\n\n## Nội dung chính\nTài liệu định nghĩa các quyết định kiến trúc bất biến đã được phê duyệt chính thức bởi Ban Giám đốc và Kiến trúc sư trưởng:\n1. **Kiến trúc hạ tầng & giao diện nền tảng (ADR-001 -> ADR-008):**\n   - Áp dụng Next.js Pages Router với tiền tố `/[schoolCode]/...` kết hợp Redux Toolkit và NextAuth.js (ADR-001).\n   - Kiến trúc Hybrid Tailwind CSS (hình học, responsive grid) và styled-components (atomic UI widgets, token màu sắc) (ADR-002).\n   - Pipeline nhận diện khuôn mặt bất đồng bộ qua Google Cloud Run worker (ADR-003).\n   - Đóng gói cổng OpenResty (Nginx + Lua) điều phối multi-tenant edge routing (ADR-005).\n   - Chuẩn hóa modal trung tâm cho bộ lọc nâng cao (ADR-006) và menu hành động `•••` bật ngược chống tràn mép bảng (ADR-007).\n   - Nguyên tắc xác nhận pop-up bắt buộc trước mọi thay đổi logic nghiệp vụ, và thông báo kết quả qua global toast (ADR-008).\n2. **Quy tắc Nhà trường & Vận hành (ADR-009 -> ADR-011, ADR-021 -> ADR-030):**\n   - Phân cấp lớp học kép: Chính khóa (đầy đủ học phí, sổ điểm) vs Ngoại khóa (chỉ điểm danh, hoạt động, ảnh) (ADR-009, ADR-021).\n   - Chốt chặn an toàn xóa lớp học: Chỉ cho phép xóa khi sĩ số học sinh bằng 0 (ADR-009, ADR-021).\n   - Cơ chế kiểm duyệt bài viết 2 cấp (Giáo viên chính vs Giáo viên hỗ trợ) (ADR-009).\n   - Chuẩn môn học Bộ GD&ĐT bất biến và ma trận đánh giá 4 kỳ (ADR-022).\n   - Danh mục khối lớp bất biến (Khối 1-12) với chỉ số thống kê rollup phản ứng nhanh (ADR-023).\n   - Tính bất biến của bảng thông tin đã phát hành: chỉ cho phép sửa bản nháp (ADR-024).\n   - Tách rời luồng tạo bình chọn và luồng gán đối tượng gửi (ADR-025).\n   - Khóa cứng sổ chấm công nhân viên 45 ngày về trước (ADR-026).\n   - Cây phân cấp sổ tay phụ huynh tối đa 2 cấp (ADR-027).\n   - Máy trạng thái luân phiên tiếp nhận & xử lý góp ý phụ huynh với chốt chặn đóng phiếu `GY-01` (ADR-028).\n   - Cấm xóa niên khóa học trong giao diện để bảo vệ liên kết dữ liệu lịch sử (ADR-029).\n   - Kho lưu trữ lạnh học sinh: cách ly khỏi danh sách hoạt động, kiểm tra lớp khi phục hồi và xóa vĩnh viễn 2 bước (ADR-030).\n3. **Quy tắc Tài chính & Cấu hình (ADR-012 -> ADR-016, ADR-031 -> ADR-033):**\n   - Động cơ giải quyết xung đột chính sách miễn giảm: Ưu tiên phạm vi cá nhân học sinh trước, sau đó chọn tỷ lệ cao nhất (ADR-012).\n   - Độc lập dirty state và lưu riêng từng khối cấu hình học phí (ADR-013).\n   - Kết chuyển khấu trừ tiền ăn vào kỳ hóa đơn tháng kế tiếp $M+1$ (ADR-014).\n   - Phân rã khấu trừ tiền ăn chi tiết (Tiền ăn chính & Tiền ăn sáng) và cam kết hoàn 100% ngày nghỉ lễ của trường (ADR-015).\n   - Đồng bộ ngày nghỉ trên Lịch sự kiện sang công cụ tính hoàn tiền ăn (ADR-016).\n   - Khóa tài khoản Super-Admin và chốt chặn an toàn tài khoản đồng bộ CSDL Sở (ADR-032).\n   - Bảo mật sinh trắc học khuôn mặt học sinh và bất biến thông tin nhân khẩu học (ADR-033).\n\n## Mã yêu cầu được định nghĩa\n| Mã | Tóm tắt quy tắc | Đoạn trong nguồn |\n|---|---|---|\n| HT-04 | Chuẩn tính điểm trung bình học kỳ theo Thông tư 22/27: $\\text{TBHK} = \\frac{\\sum TX + 2GK + 3CK}{k+5}$, bắt buộc đủ GK và CK, làm tròn 1 chữ số thập phân | repo:docs/guides/decisions.md:103 |\n| HT-05 | Tiêu chí đánh giá phát triển mầm non theo Thông tư 51/27: chuẩn 3 mức (Tốt/Đạt/Cần cố gắng), chốt chặn không vượt quá tổng số tiêu chí | repo:docs/guides/decisions.md:101 |\n| HT-06 | Quy tắc bảo toàn tiêu đề bài tập khi chỉnh sửa và cấm xóa bài tập đã có học sinh nộp bài | repo:docs/guides/decisions.md:84 |\n| VH-09 | Đơn xin nghỉ học / báo vắng phụ huynh gửi trước giờ quy định tự động chuyển thành vắng có phép và kích hoạt hoàn tiền ăn | repo:docs/guides/decisions.md:242 |\n| VH-10 | Cơ chế cập nhật lạc quan (optimistic update) khi điểm danh và tự động hoàn tác thông báo lỗi khi mất mạng | repo:docs/guides/decisions.md:165 |\n| TC-21 | Lịch sử giao dịch thanh toán tự động Sepay hiển thị dạng nhật ký append-only và bộ lọc đa chiều | repo:docs/guides/decisions.md:240 |\n| TC-22 | Chốt chặn bảo toàn lịch sử thanh toán hóa đơn: cấm ghi đè lịch sử cũ khi có giao dịch thanh toán mới | repo:docs/guides/decisions.md:92 |\n| NT-16 | Quy tắc chuyển lớp và chuyển năm học học sinh bảo toàn 3 luồng: định mức học phí, nhóm chat trao đổi và hồ sơ học tập | repo:docs/guides/decisions.md:142 |\n| NT-17 | Cơ chế kho lưu trữ lạnh học sinh: cách ly khỏi danh sách hoạt động, kiểm tra lớp khi phục hồi và bảo vệ 2 bước khi xóa vĩnh viễn | repo:docs/guides/decisions.md:186 |\n| CH-09 | Cấu hình học phí độc lập từng khối (dirty state isolation) và cảnh báo rời trang khi có thay đổi chưa lưu | repo:docs/guides/decisions.md:245 |\n| CH-10 | Quy chuẩn bảo mật hóa đơn điện tử SInvoice: mật khẩu bắt buộc ẩn vĩnh viễn không có toggle hiển thị | repo:docs/guides/decisions.md:247 |\n| CH-11 | Bảo vệ đặc quyền Super-Admin: cấm xóa hoặc vô hiệu hóa tài khoản quản trị tối cao và khóa toggle đối với tài khoản đồng bộ CSDL Sở | repo:docs/guides/decisions.md:134 |\n| CH-12 | Quy chuẩn đăng ký sinh trắc học khuôn mặt học sinh: bảo vệ quyền riêng tư, cấm thay đổi thông tin nhân khẩu học tại màn hình quét ảnh | repo:docs/guides/decisions.md:136 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- ADR-008 quy định bất kỳ thay đổi logic nghiệp vụ nào (như bật tắt xuất HĐĐT, đóng góp ý, chuyển trạng thái chấm công) đều bắt buộc phải có pop-up modal xác nhận, tránh việc click nhầm gây sai lệch dữ liệu kế toán và nhân sự.\n- ADR-014 khẳng định rõ nguyên lý kết chuyển tiền ăn vào hóa đơn chu kỳ tiếp theo $M+1$, bác bỏ phương án chỉnh sửa hóa đơn đã xuất trong tháng nhằm bảo vệ tính toàn vẹn của chứng từ tài chính.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Màn hình cấu hình học phí](../screens/m6-sm3-hoc-phi.md)\n- [Màn hình lịch sử thanh toán Sepay](../screens/m6-sm7-lich-su-thanh-toan.md)\n- [Khái niệm chuẩn đánh giá học sinh](../concepts/curriculum-assessment-standard.md)\n- [Khái niệm vòng đời học sinh](../concepts/student-lifecycle-transitions.md)\n- [Khái niệm thiết kế giao diện](../concepts/design-system-tokens-principles.md)\n"}, {"path": "pages/sources/src-development-epics-manifest.md", "title": "Đặc Tả Bộ Hồ Sơ Kỹ Thuật 35 Epics & Prototype", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Bộ Hồ Sơ Kỹ Thuật 35 Epics & Prototype", "type": "source", "sources": ["repo:docs/guides/development/index.md", "repo:docs/guides/development/development_manifest.json", "repo:docs/guides/prd.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Bộ Hồ Sơ Kỹ Thuật 35 Epics & Prototype\n\n## Thông tin nguồn\n- **Tên tài liệu:** Danh mục đăng ký kỹ thuật 35 Epics phát triển & Bản vẽ thực thi Prototype\n- **Đường dẫn gốc:** `repo:docs/guides/development/index.md` / `repo:docs/guides/development/development_manifest.json` / `repo:docs/guides/prd.md`\n- **Phiên bản:** v32.0 (Topology: epic_first)\n- **Phạm vi:** 35 Epics (`E-001` đến `E-035`) bao phủ toàn bộ 7 phân hệ của School Operating Portal\n\n## Nội dung chính\nTài liệu định hình bản đồ kỹ thuật chi tiết nhất của dự án, bao gồm cấu trúc phân rã công việc (WBS) từ Epic -> Feature -> Module -> Page -> Task -> Test:\n1. **Phân hệ Vận hành (`E-001` đến `E-005`):** Điểm danh đón trả (`E-001`), Hoạt động lớp (`E-002`), Thư viện ảnh AI (`E-003`), Trao đổi phụ huynh (`E-004`), Báo cáo điểm danh & Báo cáo mở rộng (`E-005`).\n2. **Phân hệ Học tập (`E-006` đến `E-008`):** Thời khóa biểu tuần (`E-006`), Giao bài tập về nhà (`E-007`), Sổ điểm đánh giá theo quy định Bộ GD&ĐT (`E-008`).\n3. **Phân hệ Tài chính (`E-009` đến `E-014`, `E-017`):** Hóa đơn học phí VietQR (`E-009`), Danh mục 24 khoản phí (`E-010`), Quản lý định mức học phí theo lớp (`E-011`), Phiếu chi nội bộ (`E-012`), Đối soát thanh toán (`E-013`), Báo cáo tiến độ thu phí (`E-014`), Chính sách miễn giảm (`E-017`), và Danh mục thu CSDL Sở (Revenue Categories).\n4. **Phân hệ Nhà trường (`E-015`, `E-016`, `E-018`, `E-020` đến `E-030`):** Hồ sơ học sinh 360° (`E-015`), Danh bạ giáo viên (`E-016`), Thực đơn dinh dưỡng (`E-018`), Lịch sự kiện (`E-020`), Quản lý lớp học & chốt chặn xóa (`E-021`), Môn học (`E-022`), Khối lớp (`E-023`), Bảng thông tin (`E-024`), Bình chọn trực tuyến (`E-025`), Điểm danh nhân viên (`E-026`), Sổ tay phụ huynh (`E-027`), Góp ý khiếu nại (`E-028`), Niên khóa học (`E-029`), Kho lưu trữ (`E-030`).\n5. **Phân hệ Cấu hình (`E-019`, `E-031` đến `E-035`):** Tham số học phí (`E-019`), Hồ sơ trường học (`E-031`), Quản trị tài khoản người dùng (`E-032`), Nhận diện khuôn mặt AI (`E-033`), Bật tắt tính năng (`E-034`), Quản trị thông báo (`E-035`).\n6. **Các tính năng tài khoản cá nhân & CSDL Sở:** Quản trị hồ sơ cá nhân Admin, đổi mật khẩu, trung tâm thông báo cá nhân 4 nhóm, và tích hợp chuẩn hóa Danh mục thu kết nối CSDL Sở Giáo Dục.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Tóm tắt quy tắc | Đoạn trong nguồn |\n|---|---|---|\n| TC-19 | Quản lý danh mục thu chuẩn hóa kết nối cơ sở dữ liệu Bộ/Sở GD&ĐT (CSDL Sở) | repo:docs/guides/development/E-010-finance-fee-catalog/epic.md |\n| TC-20 | Ánh xạ mã tiểu mục tài chính và đồng bộ trạng thái danh mục thu với hệ thống Managing Portal | repo:docs/guides/development/E-010-finance-fee-catalog/features/F-010-001-finance-fee-catalog.md |\n| CH-07 | Quản lý hồ sơ cá nhân của người dùng, đổi mật khẩu và lưu cấu hình ngôn ngữ giao diện theo tài khoản | repo:docs/guides/development/E-032-settings-accounts/epic.md |\n| CH-08 | Trung tâm tiếp nhận và phân loại thông báo cá nhân theo 4 luồng sự kiện chuyên biệt | repo:docs/guides/development/E-035-settings-notifications/epic.md |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Toàn bộ 35 Epics đã được kiểm chứng tương thích 100% với kiến trúc Next.js / Redux Toolkit / TypeScript trong thư mục `app/src/`.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Màn hình danh mục thu](../screens/m4-sm7-danh-muc-thu.md)\n- [Màn hình quản trị tài khoản cá nhân](../screens/m7-sm1-khac.md)\n- [Thực thể Danh mục thu CSDL Sở](../entities/revenue-category.md)\n- [Khái niệm Tích hợp CSDL Sở](../concepts/csdl-so-integration.md)\n- [Luồng đồng bộ danh mục thu](../flows/fl-dong-bo-danh-muc-thu.md)\n"}, {"path": "pages/sources/src-knowledge-base-standards.md", "title": "Đặc Tả Kho Tri Thức Kỹ Thuật & Danh Mục Anti-Pattern", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Kho Tri Thức Kỹ Thuật & Danh Mục Anti-Pattern", "type": "source", "sources": ["repo:docs/guides/knowledge.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Kho Tri Thức Kỹ Thuật & Danh Mục Anti-Pattern\n\n## Thông tin nguồn\n- **Tên tài liệu:** Technical Knowledge Base & Architectural Standards\n- **Đường dẫn gốc:** `repo:docs/guides/knowledge.md`\n- **Tiêu chuẩn quản trị:** Marcus Fleet V34 Enterprise Standard\n- **Phạm vi:** 1026 dòng quy định tiêu chuẩn kỹ thuật đa tầng, nguyên tắc vệ sinh state multi-tenant, danh mục điều cấm kỵ \"Never Do\", công thức tính điểm và học phí chuẩn Bộ GD&ĐT.\n\n## Nội dung chính\nTài liệu định hình các chuẩn mực kỹ thuật bắt buộc:\n1. **Kiến trúc phân tầng và công nghệ chuẩn:**\n   - Frontend: Next.js Pages Router (`pages/[schoolCode]/...`), Redux Toolkit feature slices, kiến trúc Hybrid Tailwind CSS + `styled-components`, NextAuth.js JWE cookies, Typography font `Baloo Chettan 2` (tiêu đề) và `Quicksand` (nội dung).\n   - Backend & API: Laravel 11 headless API, RESTful scoped `/{schoolCode}/api/1.0/...`, bắt buộc header `X-School-Code` bảo đảm cô lập tenant.\n   - Hạ tầng: Stateless Google Cloud Run containers kết hợp OpenResty reverse proxy gateway SSL/rate-limit.\n   - Giám sát: Sentry (~10% trace sampling), Google Analytics 4, Microsoft Clarity.\n2. **Quy tắc vệ sinh state multi-tenant (Multi-Tenant State Hygiene):**\n   - Khi chuyển trường hoặc đăng nhập dưới tenant khác, toàn bộ Redux state phải bị xóa sạch thông qua action `RESET_TENANT_STATE`.\n   - Mọi cache key trong RTK Query hoặc TanStack Query phải có tiền tố `schoolCode`.\n3. **Danh mục điều cấm kỵ (\"Never Do\" List):**\n   - Tuyệt đối không hardcode mã trường, schema CSDL, hoặc logo thương hiệu.\n   - Tuyệt đối không lưu token hoặc bệnh án học sinh dạng unencrypted trong `localStorage`.\n   - Tuyệt đối không cho phép giờ trả học sinh nhỏ hơn hoặc bằng giờ đón học sinh (`MSG01`).\n   - Tuyệt đối không chạy nhận diện khuôn mặt đồng bộ trên web server thread; bắt buộc đẩy sang Cloud Run worker nền.\n   - Tuyệt đối không cho phép xóa thời khóa biểu đã xuất bản, và không cho sao chép thời khóa biểu dạng tệp đính kèm.\n   - Tuyệt đối không cho phép xóa bài tập đã có học sinh nộp bài, và không cho sửa tiêu đề bài tập đã giao.\n   - Tuyệt đối không tính điểm trung bình học kỳ (TBHK) khi thiếu điểm thi giữa kỳ hoặc cuối kỳ.\n   - Tuyệt đối không tạo hóa đơn trùng lặp cho học sinh đã có hóa đơn trong tháng thu phí.\n   - Tuyệt đối không ghi đè lịch sử thanh toán; dữ liệu giao dịch phải append-only và mang tính tích lũy.\n4. **Công thức tính điểm Bộ GD&ĐT & Hoàn tiền ăn:**\n   - Điểm trung bình môn học kỳ: $\\text{TBHK} = \\frac{\\sum TX + 2GK + 3CK}{k+5}$, làm tròn 1 chữ số thập phân.\n   - Tiền khấu trừ bữa ăn: $\\text{deductedAmount} = \\text{excusedAbsenceDays} \\times \\text{dailyMealRate}$.\n   - Cú pháp mã chuyển khoản VietQR chuẩn hóa: `HOCPHI {invoiceNo}`.\n\n## Điểm đáng chú ý / mâu thuẫn\n- Danh mục \"Never Do\" là danh sách các lỗi vi phạm nghiêm trọng từng xuất hiện trong hệ thống cũ, được nâng cấp thành các chốt chặn tự động trên cả frontend và backend.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Khái niệm cô lập đa trường](../concepts/multi-tenancy-isolation.md)\n- [Khái niệm chuẩn đánh giá học sinh](../concepts/curriculum-assessment-standard.md)\n- [Khái niệm hoàn tiền ăn](../concepts/meal-refund-engine.md)\n"}, {"path": "pages/sources/src-legacy-operating-portal-guide.md", "title": "Đặc Tả Khảo Sát Hệ Thống Cũ (Legacy Portal QLTH)", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Khảo Sát Hệ Thống Cũ (Legacy Portal QLTH)", "type": "source", "sources": ["repo:docs/guides/legacy/operating-portal/00-inventory.md", "repo:docs/guides/legacy/operating-portal/M7-khac/SM1-khac.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Khảo Sát Hệ Thống Cũ (Legacy Portal QLTH)\n\n## Thông tin nguồn\n- **Tên tài liệu:** Báo Cáo Khảo Sát Hệ Thống Quản Lý Trường Học Cũ (Portal QLTH)\n- **Đường dẫn gốc:** `repo:docs/guides/legacy/operating-portal/00-inventory.md` / `repo:docs/guides/legacy/operating-portal/M7-khac/SM1-khac.md`\n- **Phiên bản:** Phase 1 Inventory & Deep Dives\n- **Phạm vi:** 30 modules và nhóm tính năng \"Khác\" (M7-SM1) truy cập qua menu avatar người dùng\n\n## Nội dung chính\nTài liệu tổng hợp các chi tiết vận hành thực tế được ghi nhận từ hệ thống đang chạy:\n1. Bản kê khai 30 module chức năng trải dài qua 6 menu sidebar chính và các trang chuyên biệt.\n2. Nhóm chức năng cấp tài khoản cá nhân (M7-SM1 \"Khác\"):\n   - Menu avatar góc trên cùng bên phải màn hình: Tài khoản, Thông báo cá nhân, Ngôn ngữ, Đăng xuất.\n   - Trang xem thông tin cá nhân (`/user/profile`) và trang chỉnh sửa thông tin (`/user/edit-profile`), đổi mật khẩu.\n   - Trung tâm thông báo cá nhân gồm 4 tab: Hoạt Động, Trao Đổi, Học Phí, Khác (kèm badge đếm số lượng chưa đọc).\n   - Bộ chuyển đổi ngôn ngữ giao diện (Tiếng Việt / English) áp dụng ngay lập tức cho các nhãn UI mà không tải lại trang.\n   - Hộp thoại xác nhận trước khi đăng xuất khỏi hệ thống nhằm bảo vệ phiên làm việc.\n   - Kênh thông báo hệ thống cấp nền tảng từ nhà cung cấp (`/system/announcement`).\n\n## Điểm đáng chú ý / mâu thuẫn\n- Module \"Managing Portal\" (`docs/guides/legacy/Portal Vận hành QLTH/`) là công cụ quản trị nội bộ dành cho nhân viên vận hành SaaS của Finviet / SOHA, không thuộc phạm vi người dùng trường học của `eco-school-portal`. Chỉ có các điểm tích hợp như SSO và đồng bộ CSDL Sở là liên thông với School Operating Portal.\n\n## Trang chịu ảnh hưởng\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Phân hệ Đăng nhập & Xác thực](../overview/module-auth.md)\n- [Màn hình quản trị tài khoản cá nhân](../screens/m7-sm1-khac.md)\n- [Màn hình đăng nhập hệ thống](../screens/m7-sm2-dang-nhap.md)\n"}, {"path": "pages/sources/src-open-questions-resolutions.md", "title": "Bảng Câu Hỏi Mở & Quyết Định Dứt Điểm (Open Questions & Resolutions)", "type": "source", "group": "sources", "fm": {"title": "Bảng Câu Hỏi Mở & Quyết Định Dứt Điểm (Open Questions & Resolutions)", "type": "source", "sources": ["raw/specs/open-questions-resolutions.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Bảng Câu Hỏi Mở & Quyết Định Dứt Điểm (Open Questions & Resolutions)\n\n## Thông tin nguồn\n| Trường | Giá trị |\n|---|---|\n| Đường dẫn | `raw/specs/open-questions-resolutions.md` |\n| Người cung cấp | System Architect & Lead BA |\n| Ngày | 2026-11-05 |\n| Loại | Tài liệu quyết định kiến trúc & nghiệp vụ (Architecture & Business Decisions) |\n\n## Nội dung chính\nGiải quyết dứt điểm 23 bài toán và câu hỏi mở then chốt của dự án, loại bỏ hoàn toàn các yếu tố mơ hồ:\n1. **OQ-01 Multi-tenancy:** Tiền tố `{schoolCode}` trên toàn bộ đường dẫn URL kết hợp PostgreSQL RLS.\n2. **OQ-02 Hoàn tiền ăn:** Tự động tổng hợp ngày nghỉ có phép tháng M để khấu trừ vào hóa đơn tháng M+1.\n3. **OQ-03 Xung đột miễn giảm:** Cảnh báo trùng lặp tại modal tạo + Checkbox xác nhận thay thế; Áp dụng mức giảm có lợi nhất khi xuất hóa đơn.\n4. **OQ-04 AI Face Tagging:** Xử lý bất đồng bộ qua Object Storage và hàng đợi BullMQ/Worker.\n5. **OQ-05 Chốt chặn xóa lớp:** Phân loại lớp chính khóa/ngoại khóa; Chặn tuyệt đối xóa lớp khi có học sinh hoặc dữ liệu tài chính.\n6. **OQ-06 Phân quyền đăng bài:** Kiểm duyệt 2 cấp (Giáo viên chính đăng ngay, Giáo viên hỗ trợ chờ duyệt).\n7. **OQ-07 Định dạng tiền tệ:** Dấu chấm phân cách hàng nghìn, hỗ trợ toggle chuyển đổi `%` và tiền mặt `đ`.\n8. **OQ-08 Kiểm soát đồng thời:** Áp dụng Pessimistic Row Lock (`FOR UPDATE`) cho toàn bộ phân hệ tài chính.\n9. **OQ-09 Tài chính & Hoàn tiền:** Sinh Credit Balance lũy kế hoặc hoàn tiền nếu hoàn vượt học phí; hoàn ăn theo snapshot đơn giá lớp cũ; VietQR hóa đơn hủy gom vào quỹ treo đối soát (`UNMATCHED_SUSPENSE_POOL`).\n10. **OQ-10 Vận hành & Điểm danh:** Chặn giao trẻ cho người lạ nếu không xác thực phụ huynh; quy trình giữ trẻ ngoài giờ khẩn cấp 4 cấp phối hợp Công an; đón về nửa ngày do y tế trước 10:30 hoàn 50% tiền ăn.\n11. **OQ-11 Học vụ & Đánh giá:** Kế thừa điểm TX, GK theo môn tương đương khi chuyển trường giữa kỳ tính TBHK MoET; sổ điểm đã khóa chỉ mở cục bộ 60 phút có duyệt BGH và ghi Audit Trail bất biến.\n12. **OQ-12 Vòng đời dữ liệu:** Chặn tuyệt đối xóa vật lý lớp còn công nợ, lưu trữ lớp và mang nợ sang niên khóa mới; phục hồi học sinh từ Archive khi lớp cũ giải thể bắt buộc chọn lớp đích đang hoạt động.\n13. **OQ-13 Bảo mật đa trường:** LocalStorage phân vùng theo mã trường; WebSocket phân kênh `{schoolCode}:user:{userId}:{channel}`; chuyển trường trên cùng tab kích hoạt `RESET_TENANT_STATE`.\n14. **OQ-14 Ngoại khóa & Phân rã:** Conflict scheduler 4 chiều (học sinh, giáo viên, phòng, sĩ số); Biểu phí buổi/tháng; Phân rã Sub-invoice và Partial payment khi phụ huynh từ chối khoản ngoại khóa.\n15. **OQ-15 Đồng bộ CSDL Sở:** Cờ `is_sync_locked` khi Sở chốt thi; Đối soát Data Drift 2 chiều; Retry Queue và Dead Letter Queue cô lập lỗi ngắt quãng từng học sinh.\n16. **OQ-16 Quyền riêng tư AI & Giám hộ:** Cờ `opt_out_face_ai` tự động bỏ qua trích xuất vector khuôn mặt và làm mờ ảnh; Danh sách `restricted_guardians` và cảnh báo đỏ toàn màn hình cấm tuyệt đối giao trẻ.\n17. **OQ-17 Thôi học giữa kỳ:** Quyết toán Pro-rata rạch ròi (khoản hoàn vs không hoàn); Lập phiếu chi hoàn tiền rút hồ sơ; Hủy hóa đơn tương lai; Thu hồi mobile app sang chế độ chỉ đọc lịch sử.\n18. **OQ-18 VietQR bất thường:** Chuyển thừa tự động kết chuyển Credit Balance hoặc lập phiếu chi hoàn tiền; Chuyển thiếu vào trạng thái `PARTIAL_PAID` và sinh lại mã VietQR nợ; Đóng băng `FROZEN_UNDER_REVIEW` chặn xuất VAT khi tra soát chargeback.\n19. **OQ-19 Sổ dặn thuốc y tế:** Phụ huynh gửi đơn dặn thuốc qua app; Giáo viên xác nhận \"Đã cho uống thuốc lúc HH:mm\" và gửi Push Notification an tâm tức thời tới phụ huynh.\n20. **OQ-20 Đến muộn, đón sớm & Tiền ăn:** Ghi nhận Đến muộn (tùy chọn báo suất ăn với bếp), Đón sớm; Phụ huynh chủ động đón sớm KHÔNG hoàn tiền ăn; Suất ăn chỉ hoàn khi ngày lễ, nhà trường cho nghỉ, hoặc có đơn xin nghỉ cả ngày hợp lệ.\n21. **OQ-21 Tự động khóa sổ điểm danh cuối tháng:** Loại bỏ nút nộp thủ công; Hệ thống tự động đóng băng dữ liệu điểm danh tháng cũ (Freeze / Read-Only) vào 23:59:59 ngày cuối tháng trước khi tiến trình tính phí kỳ mới khởi chạy.\n22. **OQ-22 Học sinh nhập học giữa tháng & Hóa đơn riêng lẻ:** Nhập học giữa tháng tính học phí prorated chia theo ngày còn lại và tiền ăn theo số ngày ăn thực tế còn lại; Hệ thống chỉ tạo hóa đơn riêng lẻ cho từng học sinh, mã VietQR riêng biệt, gạch nợ độc lập (không gộp gia đình).\n23. **OQ-23 Miễn giảm anh chị em ruột (Sibling Discount):** Nhận diện quan hệ gia đình qua số điện thoại phụ huynh; Tự động áp dụng mức giảm cho con thứ 2/thứ 3 khi anh/chị đang học `ACTIVE`; Tự động cập nhật hoặc ngừng khi con lớn ra trường.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Quy tắc (kiểm được) | Nguồn (dòng/mục) |\n|---|---|---|\n| TC-02 | Tự động rà soát ngày nghỉ có phép tháng M và khấu trừ tiền ăn vào hóa đơn tháng M+1 | OQ-02 |\n| TC-09 | Cảnh báo và yêu cầu xác nhận khi tạo chính sách miễn giảm trùng lặp đối tượng | OQ-03 |\n| TC-10 | Hỗ trợ giảm trừ linh hoạt theo `%` hoặc tiền mặt `đ` kèm dấu chấm phân cách hàng nghìn | OQ-07 |\n| NT-04 | Phân loại lớp chính khóa và ngoại khóa kèm chốt chặn an toàn khi xóa lớp | OQ-05 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Toàn bộ 23 câu hỏi mở và kịch bản đối kháng đã được giải quyết dứt điểm 100%. Không có bất kỳ câu hỏi chưa rõ nào tồn đọng trong wiki (100% đã được quyết định dứt điểm).\n\n## Trang chịu ảnh hưởng\n- [Cơ chế cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n- [Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md)\n- [Chốt chặn an toàn khi xóa lớp](../concepts/class-deletion-guard.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Kiến trúc thanh toán VietQR động](../concepts/vietqr-dynamic-reconciliation.md)\n- [Chuẩn đánh giá học sinh MoET](../concepts/curriculum-assessment-standard.md)\n- [Vòng đời chuyển tiếp học sinh](../concepts/student-lifecycle-transitions.md)\n- [Kiến trúc tích hợp CSDL Sở](../concepts/csdl-so-integration.md)\n- [Điều phối lịch học, biểu phí & phân rã ngoại khóa](../concepts/extracurricular-billing-scheduling.md)\n- [Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Chính sách miễn giảm](../entities/discount-policy.md)\n- [Lớp học](../entities/classroom.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Điểm danh hằng ngày](../entities/attendance-daily.md)\n- [Đơn xin nghỉ học / Báo vắng](../entities/student-absence-request.md)\n- [Sổ điểm đánh giá](../entities/gradebook-record.md)\n- [Hồ sơ lưu trữ học sinh](../entities/student-archive-record.md)\n- [Phiên đăng nhập](../entities/auth-session.md)\n- [Hồ sơ sinh trắc khuôn mặt](../entities/face-biometric-registration.md)\n- [Thời khóa biểu tuần](../entities/t ": {"title": "Đặc Tả Bộ Hồ Sơ Thiết Kế Kế Hoạch (Screens, Flows & Diagrams)", "type": "source", "sources": ["repo:docs/guides/planning/screens.md", "repo:docs/guides/planning/flows.md", "repo:docs/guides/planning/diagrams.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Bộ Hồ Sơ Thiết Kế Kế Hoạch (Screens, Flows & Diagrams)\n\n## Thông tin nguồn\n- **Tên tài liệu:** Planning Blueprints — Screen Catalog, Operational Flows & Sequence Diagrams\n- **Đường dẫn gốc:** `repo:docs/guides/planning/screens.md` / `repo:docs/guides/planning/flows.md` / `repo:docs/guides/planning/diagrams.md`\n- **Tiêu chuẩn quản trị:** Marcus Fleet Flow & Screen Engineering\n- **Phạm vi:** Danh mục đầy đủ 41 màn hình và hơn 50 luồng nghiệp vụ chi tiết kèm sơ đồ Sequence Diagram chuẩn Mermaid.\n\n## Nội dung chính\nTài liệu định nghĩa các thông số kiến trúc tương tác chuẩn:\n1. **Danh mục màn hình hoàn chỉnh (Screen Inventory):**\n   - Phân hệ Vận hành: `SCR-OPS-01` (Điểm danh), `SCR-OPS-02` (Hoạt động), `SCR-OPS-03` (Media/Album ảnh), `SCR-OPS-04` (Trao đổi), `SCR-OPS-05` (Báo cáo điểm danh), `SCR-OPS-06` (Báo cáo mở rộng).\n   - Phân hệ Học tập: `SCR-ACAD-01` (Thời khóa biểu), `SCR-ACAD-02` (Bài tập), `SCR-ACAD-03` (Bảng điểm).\n   - Phân hệ Tài chính: `SCR-FIN-01` (Học phí), `SCR-FIN-02` (Khoản phí), `SCR-FIN-03` (Quản lý học phí), `SCR-FIN-04` (Khoản chi), `SCR-FIN-05` (Đối soát), `SCR-FIN-06` (Báo cáo học phí), `SCR-FIN-07` (Miễn giảm), và Danh mục thu CSDL Sở.\n   - Phân hệ Cấu hình: `SCR-SET-01` (Cấu hình học phí) và `SCR-SET-02` (Lịch sử giao dịch Sepay tại `/setting/fee/payment-history/`).\n   - Phân hệ Nhà trường: 14 màn hình từ học sinh, giáo viên, lớp học, môn học, khối lớp, bảng tin, bình chọn, thực đơn, chấm công, sổ tay, góp ý, lịch sự kiện, niên khóa đến kho lưu trữ.\n2. **Các luồng vận hành phức hợp (Operational Flows):**\n   - Xử lý mất mạng khi điểm danh (Offline fallback & Optimistic rollbacks).\n   - Luồng duyệt đơn xin nghỉ học của phụ huynh trước giờ quy định.\n   - Luồng lưu trữ kho lạnh và phục hồi an toàn học sinh (bảo vệ sĩ số và tính hợp lệ của lớp).\n   - Luồng đăng ký sinh trắc học khuôn mặt từ luồng camera hoặc tải tệp ảnh trực tiếp.\n   - Luồng khóa tài khoản Super-Admin và đồng bộ trạng thái nhân sự từ CSDL Sở.\n\n## Điểm đáng chú ý / mâu thuẫn\n- Màn hình `SCR-SET-02` (Lịch Sử Giao Dịch Sepay tại `/setting/fee/payment-history/`) là một route độc lập trong prototype (`app/src/pages/[schoolCode]/setting/fee/payment-history/index.tsx`) hỗ trợ lọc theo tháng, tìm kiếm mã giao dịch và kiểm tra trạng thái khớp lệnh tự động.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Màn hình lịch sử thanh toán Sepay](../screens/m6-sm7-lich-su-thanh-toan.md)\n- [Luồng nộp đơn xin nghỉ học](../flows/fl-don-xin-nghi-hoc.md)\n- [Luồng kho lưu trữ học sinh](../flows/fl-kho-luu-tru-hoc-sinh.md)\n- [Luồng đăng ký khuôn mặt](../flows/fl-dang-ky-sinh-trac-khuon-mat.md)\n- [Luồng quản trị tài khoản](../flows/fl-quan-tri-tai-khoan-phan-quyen.md)\n"}, {"path": "pages/sources/src-planning-contradictions-matrix.md", "title": "Đặc Tả Bảng Đối Soát Mâu Thuẫn Nghiệp Vụ & Quyết Định Kỹ Thuật (K001–K057)", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Bảng Đối Soát Mâu Thuẫn Nghiệp Vụ & Quyết Định Kỹ Thuật (K001–K057)", "type": "source", "sources": ["repo:docs/guides/research/contradictions.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Bảng Đối Soát Mâu Thuẫn Nghiệp Vụ & Quyết Định Kỹ Thuật (K001–K057)\n\n## Thông tin nguồn\n- **Tên tài liệu:** Planning Contradictions & Architecture Trade-offs Register\n- **Đường dẫn gốc:** `repo:docs/guides/research/contradictions.md`\n- **Phạm vi:** 57 điểm mâu thuẫn nghiệp vụ và thỏa hiệp kiến trúc (K001 đến K057) được phân tích và giải quyết triệt để giữa các tài liệu PRD, prototype cũ và yêu cầu kỹ thuật hiện đại.\n\n## Nội dung chính\nBảng đối soát giải quyết toàn bộ các bất đồng nghiệp vụ trọng điểm:\n1. **Mâu thuẫn Vận hành & Công nghệ (K001 - K005):**\n   - K001: Nhận diện khuôn mặt xử lý bất đồng bộ qua hàng đợi Cloud Run thay vì chạy blocking trên HTTP server.\n   - K002: Hoàn tiền ăn thực hiện qua dòng khấu trừ hóa đơn tháng tiếp theo $M+1$, phiếu chi tiền mặt chỉ đóng vai trò ghi nhận ngoại lệ.\n   - K003: Phân định ranh giới giữa Tailwind CSS (layout) và styled-components (widgets).\n   - K004: Gộp cấu trúc route `/{schoolCode}/...` cho mọi vai trò, lọc menu và nút bấm bằng NextAuth JWT claims.\n   - K005: Thống nhất dùng NextPages Router với Redux Toolkit.\n2. **Mâu thuẫn Phân hệ Nhà trường (K006 - K015, K025 - K036, K041 - K057):**\n   - K006: Cho phép gán GVCN lớp khác nhưng hiển thị tag cảnh báo màu hổ phách nếu đã chủ nhiệm lớp khác.\n   - K007: Khắc phục lỗi API tìm kiếm khối lớp bằng cách lọc tức thì in-memory trên client qua Redux.\n   - K008: Mã học sinh và CCCD bắt buộc khi tạo mới; dữ liệu cũ bị thiếu hiển thị badge nghiêng thanh lịch `Chưa có mã học sinh`.\n   - K009: Chấm công nhân viên hàng ngày 1-click không qua modal; chỉnh sửa giờ hoặc đổi trạng thái vắng bắt buộc modal xác nhận.\n   - K010: Nút \"Hủy bỏ\" trên form chỉ mở modal cảnh báo khi form đã có chỉnh sửa (dirty).\n   - K011: Thực đơn gắn thông báo qua `linkedAnnouncementId`, xóa bảng tin không ảnh hưởng thực đơn.\n   - K012: Thẻ KPI trạng thái Góp ý giữ nguyên số tổng độc lập khi bấm chọn lọc.\n   - K013: Học sinh lưu trữ khi phục hồi ưu tiên đưa về lớp cũ; nếu lớp đã giải tán thì chuyển sang \"Chưa xếp lớp\".\n   - K014: Sự kiện lịch 1 ngày tự động điền \"Đến ngày\" bằng \"Từ ngày\".\n   - K026: Cấm xóa lớp học khi có học sinh; bắt buộc chuyển hết học sinh trước khi xóa.\n   - K027: Lớp chính khóa chỉ có 1 GVCN; lớp ngoại khóa hỗ trợ danh sách nhiều giáo viên hướng dẫn.\n   - K038: Thông báo đã gửi không cho sửa thông tin nội dung nhằm bảo đảm tính trung thực so với email đã bắn ra.\n   - K046: Khóa cứng chỉnh sửa bảng chấm công nhân viên quá 45 ngày về trước nhằm bảo vệ số liệu tính lương.\n   - K049: Cây sổ tay phụ huynh giới hạn tối đa 2 cấp danh mục.\n   - K054: Góp ý chỉ phát sinh từ phụ huynh qua mobile app; Admin web không được tạo phiếu góp ý giả lập.\n   - K057: Máy trạng thái luân phiên tiếp nhận góp ý tự động đổi trạng thái \"Chờ phản hồi\" theo người gửi phản hồi gần nhất.\n3. **Mâu thuẫn Tài chính & Cấu hình (K016 - K024):**\n   - K016: Áp dụng mức giảm cao nhất (Highest rate priority) thay vì cộng dồn tỷ lệ phần trăm (additive stacking).\n   - K017: Chính sách miễn giảm hết hạn chỉ áp dụng cho các kỳ hóa đơn tương lai; hóa đơn lịch sử bất biến.\n   - K018: Toggle tắt miễn giảm khi tạo hóa đơn chỉ có hiệu lực cho đợt tạo đó, không thay đổi trạng thái master data.\n   - K019: Mật khẩu kết nối hóa đơn điện tử SInvoice ẩn vĩnh viễn không có toggle con mắt.\n   - K021: Kiểm tra tính duy nhất case-insensitive của email nhận báo cáo đối soát và giới hạn tối đa 3 email.\n   - K024: Tách riêng tỷ lệ hoàn tiền ăn chính và tiền ăn sáng; nghỉ lễ nhà trường luôn hoàn 100%.\n\n## Điểm đáng chú ý / mâu thuẫn\n- 57 điểm mâu thuẫn đã được chủ sở hữu sản phẩm (Sophia Butler) và Kiến trúc sư trưởng (Alan, David) thống nhất giải quyết dứt điểm. Mọi trang đặc tả trong wiki phải tuân thủ nghiêm ngặt các kết luận này.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Khái niệm chốt chặn xóa lớp](../concepts/class-deletion-guard.md)\n- [Khái niệm hoàn tiền ăn](../concepts/meal-refund-engine.md)\n- [Khái niệm chính sách miễn giảm](../concepts/discount-deduplication.md)\n- [Khái niệm vòng đời học sinh](../concepts/student-lifecycle-transitions.md)\n"}, {"path": "pages/sources/src-portal-design-system.md", "title": "Đặc Tả Hệ Thống Thiết Kế Giao Diện (ECO Design System)", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Hệ Thống Thiết Kế Giao Diện (ECO Design System)", "type": "source", "sources": ["repo:docs/design/portal-ds/README.md", "repo:docs/design/portal-ds/Quy-uoc-token.md", "repo:docs/design/portal-ds/Quy-uoc-so.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Hệ Thống Thiết Kế Giao Diện (ECO Design System)\n\n## Thông tin nguồn\n- **Tên tài liệu:** ECO Design System (ECO ME Dashboard / Portal DS)\n- **Đường dẫn gốc:** `repo:docs/design/portal-ds/README.md` / `repo:docs/design/portal-ds/Quy-uoc-token.md` / `repo:docs/design/portal-ds/Quy-uoc-so.md`\n- **Phiên bản:** v1.1.0 (chuẩn Design System v2.6.0 trong `app/src/components/ds/`)\n- **Phạm vi:** Nền tảng token semantic, quy ước màu sắc, font chữ Inter / Baloo Chettan 2, icon Font Awesome 6, và quy ước định dạng số/tiền tệ chuẩn Việt Nam.\n\n## Nội dung chính\nTài liệu định nghĩa các quy tắc chuẩn hóa giao diện người dùng:\n1. **Hệ thống Token Semantic:**\n   - Màu sắc: `var(--bg-app)`, `var(--bg-surface)`, `var(--text-heading)`, `var(--text-body)`, `var(--text-muted)`, `var(--border-default)`, `var(--primary-default)`, `var(--color-success)`, `var(--color-danger)`, `var(--color-warning)`.\n   - Typography: Font chữ Inter (SIL Open Font License 1.1) kết hợp Baloo Chettan 2 (tiêu đề, số nổi bật) và Quicksand (nội dung thân thiện). Cấm sử dụng SF Pro do vi phạm điều khoản cấp phép ngoài Apple.\n   - Thang khoảng cách: Bước nhảy 4px chuẩn (`4px`, `8px`, `12px`, `16px`, `20px`, `24px`, `32px`...), kèm các bước tinh chỉnh `2px`, `6px`, `10px`, `14px` cho control bảng biểu.\n2. **Quy ước hiển thị số & tiền tệ:**\n   - Tiền tệ: Luôn định dạng theo chuẩn Việt Nam với dấu chấm phân cách hàng nghìn (ví dụ: `1.500.000 ₫` hoặc `1.500.000 đ`).\n   - Cấm số âm trong hóa đơn và công thức miễn giảm: giá trị phải được clamp trong khoảng $[0, \\text{grossAmount}]$.\n   - Điểm số: Làm tròn đến đúng 1 chữ số thập phân (ví dụ: `8.5`, `9.0`).\n3. **Quy chuẩn Component UI:**\n   - Toàn bộ form và màn hình quản trị phải sử dụng bộ component tái sử dụng từ `app/src/components/ds/` (`Button`, `TextField`, `SelectField`, `DataTable`, `FilterBar`, `PopupModal`, `StatusTag`, `StatCard`, `CountedTabs`, `BulkActionBar`).\n   - Mọi thao tác làm thay đổi logic nghiệp vụ hoặc xóa dữ liệu bắt buộc phải dùng `PopupModal` xác nhận; các hành động thành công phản hồi qua toast `addToast`.\n\n## Điểm đáng chú ý / mâu thuẫn\n- Cấm tuyệt đối viết mã màu hex hoặc CSS pixel trực tiếp trong component; mọi thuộc tính giao diện phải thông qua biến CSS semantic tokens.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Khái niệm thiết kế giao diện](../concepts/design-system-tokens-principles.md)\n- [Màn hình tổng quan](../screens/m1-sm1-tong-quan.md)\n- [Màn hình học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình lịch sử thanh toán](../screens/m6-sm7-lich-su-thanh-toan.md)\n"}, {"path": "pages/sources/src-prd-co-che-hoan-tien.md", "title": "Đặc Tả Cơ Chế Hoàn Tiền Khi Nghỉ Học", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Cơ Chế Hoàn Tiền Khi Nghỉ Học", "type": "source", "sources": ["raw/specs/prd-co-che-hoan-tien.md", "repo:docs/prd/PRD_Co_Che_Hoan_Tien_Khi_Nghi_Hoc_VI.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Cơ Chế Hoàn Tiền Khi Nghỉ Học\n\n## Thông tin nguồn\n- **Tên tài liệu:** PRD Cơ Chế Hoàn Tiền Khi Nghỉ Học & Khấu Trừ Suất Ăn\n- **Đường dẫn gốc:** `raw/specs/prd-co-che-hoan-tien.md` / `repo:docs/prd/PRD_Co_Che_Hoan_Tien_Khi_Nghi_Hoc_VI.md`\n- **Phiên bản:** v1.0.0\n- **Phạm vi:** Nghiệp vụ tính toán hoàn tiền ăn dựa trên dữ liệu điểm danh vắng có phép và kết chuyển sang đợt thu học phí tiếp theo\n\n## Nội dung chính\nTài liệu định nghĩa chu trình khép kín giữa phân hệ Vận hành (Điểm danh hằng ngày) và phân hệ Tài chính (Hóa đơn học phí):\n1. Điều kiện báo vắng hợp lệ: Phụ huynh phải gửi đơn xin nghỉ có phép qua ứng dụng trước giờ hạn chốt (mặc định 08:00 sáng ngày điểm danh) và được giáo viên chủ nhiệm phê duyệt.\n2. Công thức tính tiền ăn hoàn trả:\n   $$\\text{Tiền hoàn} = \\sum (\\text{Số ngày nghỉ có phép hợp lệ} \\times \\text{Đơn giá suất ăn/ngày} \\times \\text{Tỷ lệ hoàn tiền ăn})$$\n   Trong đó tỷ lệ hoàn tiền ăn được cấu hình tại trang Cấu hình học phí (thường là 100% hoặc theo chính sách từng trường).\n3. Chu kỳ chốt số liệu và phê duyệt: Kế toán thực hiện chốt dữ liệu công nợ suất ăn vào ngày cuối cùng của tháng M.\n4. Tự động kết chuyển sang hóa đơn tháng M+1: Hệ thống tự động sinh dòng giảm trừ âm (`-X.000 đ`) gắn mã tham chiếu ngày nghỉ lên hóa đơn học phí của tháng tiếp theo. Trường hợp học sinh thôi học/chuyển trường, sinh phiếu chi hoàn tiền trực tiếp.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Tóm tắt quy tắc | Đoạn trong nguồn |\n|---|---|---|\n| TC-11 | Thiết lập điều kiện học sinh nghỉ học có phép hợp lệ để được khấu trừ hoàn tiền ăn | §2.1 |\n| TC-12 | Công thức tính tiền ăn hoàn trả theo số bữa ăn thực tế và tỷ lệ khấu trừ cấu hình | §2.2 |\n| TC-13 | Chốt dữ liệu nghỉ học tháng M, lập bảng tổng hợp công nợ tiền ăn và phê duyệt | §3.1 |\n| TC-14 | Tự động kết chuyển suất hoàn tiền ăn thành dòng giảm trừ âm trên hóa đơn học phí tháng M+1 | §3.2 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Không có mâu thuẫn. Quy định rõ: vắng không phép hoặc báo vắng sau 08:00 sáng không được tính hoàn tiền ăn do bếp ăn nhà trường đã chuẩn bị khẩu phần thực phẩm trong ngày.\n\n## Trang chịu ảnh hưởng\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Khái niệm Cơ chế hoàn tiền ăn tự động](../concepts/meal-refund-engine.md)\n- [Thực thể Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Thực thể Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Luồng báo vắng và hoàn tiền](../flows/fl-bao-vang-hoan-tien.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n- [Màn hình cấu hình học phí](../screens/m6-sm3-hoc-phi.md)\n"}, {"path": "pages/sources/src-prd-dang-nhap-xac-thuc.md", "title": "Đặc Tả Đăng Nhập & Xác Thực", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Đăng Nhập & Xác Thực", "type": "source", "sources": ["raw/specs/prd-dang-nhap-xac-thuc.md", "repo:docs/prd/PRD_Dang_Nhap_VI.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Đăng Nhập & Xác Thực\n\n## Thông tin nguồn\n- **Tên tài liệu:** PRD Đăng Nhập & Xác Thực Hệ Thống School Operating Portal\n- **Đường dẫn gốc:** `raw/specs/prd-dang-nhap-xac-thuc.md` / `repo:docs/prd/PRD_Dang_Nhap_VI.md`\n- **Phiên bản:** v1.0.0\n- **Phạm vi:** Xác thực người dùng đa trường, cơ chế SSO, bảo mật khóa tài khoản và kiểm soát phiên JWT\n\n## Nội dung chính\nTài liệu quy định chi tiết luồng xác thực an toàn vào hệ thống School Operating Portal:\n1. Đăng nhập truyền thống với định danh mã trường `{schoolCode}`: Kiểm tra hợp lệ tài khoản gắn liền với tenant trường học, phân định vai trò Ban Giám Hiệu, Giáo viên, Kế toán.\n2. Đăng nhập một lần (SSO - Single Sign-On): Cho phép quản trị viên từ hệ thống Managing Portal điều hướng trực tiếp sang trường con với phiên đăng nhập hợp lệ.\n3. Chống dò mật khẩu (Brute-force): Giới hạn tối đa 5 lần thử sai liên tiếp; khóa tạm thời tài khoản trong 15 phút hoặc yêu cầu CAPTCHA.\n4. Quản lý phiên làm việc JWT kép: Access Token có hiệu lực 15 phút; Refresh Token có hiệu lực 7 ngày lưu trữ an toàn trong HttpOnly Cookie; cơ chế Silent Refresh không làm gián đoạn người dùng.\n5. Thu hồi phiên đăng nhập từ xa khi phát hiện rủi ro an ninh hoặc khi người dùng thực hiện đổi mật khẩu tài khoản.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Tóm tắt quy tắc | Đoạn trong nguồn |\n|---|---|---|\n| DN-03 | Xác thực đăng nhập một lần SSO (Single Sign-On) tích hợp với hệ thống Managing Portal | §2.2 |\n| DN-04 | Cơ chế khóa tạm thời tài khoản chống tấn công dò mật khẩu sau 5 lần thử thất bại | §3.1 |\n| DN-05 | Kiểm soát vòng đời phiên làm việc và tự động làm mới JWT Access/Refresh Token | §3.3 |\n| DN-06 | Thu hồi phiên làm việc từ xa và đăng xuất an toàn trên toàn bộ thiết bị đang hoạt động | §3.4 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Không có mâu thuẫn nghiệp vụ. Hệ thống áp dụng nghiêm ngặt cơ chế cô lập tenant đa trường (`{schoolCode}`) để ngăn chặn rò rỉ token chéo giữa các cơ sở giáo dục.\n\n## Trang chịu ảnh hưởng\n- [Phân hệ Đăng nhập & Xác thực](../overview/module-auth.md)\n- [Thực thể Phiên đăng nhập](../entities/auth-session.md)\n- [Khái niệm Cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n- [Luồng đăng nhập đa trường](../flows/fl-dang-nhap-da-truong.md)\n- [Màn hình đăng nhập](../screens/m7-sm2-dang-nhap.md)\n- [Màn hình quản trị tài khoản cá nhân](../screens/m7-sm1-khac.md)\n"}, {"path": "pages/sources/src-prd-mien-giam-hoc-phi.md", "title": "Đặc Tả Cơ Chế Miễn Giảm Học Phí", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Cơ Chế Miễn Giảm Học Phí", "type": "source", "sources": ["raw/specs/prd-mien-giam-hoc-phi.md", "repo:docs/prd/PRD_Mien_Giam_Hoc_Phi_VI.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Cơ Chế Miễn Giảm Học Phí\n\n## Thông tin nguồn\n- **Tên tài liệu:** PRD Chính Sách Miễn Giảm Học Phí & Quản Lý Ưu Đãi\n- **Đường dẫn gốc:** `raw/specs/prd-mien-giam-hoc-phi.md` / `repo:docs/prd/PRD_Mien_Giam_Hoc_Phi_VI.md`\n- **Phiên bản:** v1.0.0\n- **Phạm vi:** Nghiệp vụ thiết lập chính sách ưu đãi, giải quyết trùng lặp chính sách và áp dụng vào đợt phát hành hóa đơn\n\n## Nội dung chính\nTài liệu định nghĩa toàn diện chính sách ưu đãi học phí trong trường học:\n1. Phân loại đối tượng hưởng miễn giảm: Con cán bộ giáo viên - nhân viên trường, đối tượng chính sách xã hội (thương binh, hộ nghèo), gia đình có từ 2 con trở lên cùng theo học (anh chị em ruột), hoặc học sinh đạt học bổng năng khiếu.\n2. Quy tắc xếp chồng chính sách và xử lý trùng lặp:\n   - Mặc định áp dụng nguyên tắc **Best-rate** (chọn chính sách có mức giảm cao nhất cho học sinh).\n   - Cho phép quản trị viên kích hoạt cấu hình cho phép cộng dồn (Stackable) kèm quy định trần giảm tối đa (ví dụ không quá 100% học phí).\n   - Hệ thống chủ động hiển thị cảnh báo đỏ khi tạo mới chính sách có phạm vi đối tượng trùng nhau.\n3. Linh hoạt hình thức khấu trừ: Cho phép cấu hình giảm trừ theo tỷ lệ phần trăm `%` hoặc số tiền mặt cố định `đ`. Khi nhập số tiền mặt, hệ thống tự động định dạng dấu chấm phân cách hàng nghìn.\n4. Quy trình phê duyệt và lưu vết kiểm toán: Mọi trường hợp miễn giảm đặc biệt ngoài chính sách chuẩn phải được Ban Giám Hiệu phê duyệt điện tử và ghi nhận lịch sử thay đổi để phục vụ kiểm toán tài chính.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Tóm tắt quy tắc | Đoạn trong nguồn |\n|---|---|---|\n| TC-15 | Phân loại và cấu hình chính sách miễn giảm theo từng nhóm đối tượng học sinh | §2.1 |\n| TC-16 | Quy tắc giải quyết xung đột chính sách miễn giảm theo phương án hưởng ưu đãi cao nhất | §2.3 |\n| TC-17 | Hỗ trợ phương thức giảm trừ linh hoạt theo tỷ lệ phần trăm hoặc tiền mặt cố định | §2.4 |\n| TC-18 | Quy trình thẩm định, phê duyệt hồ sơ miễn giảm học phí có lưu vết kiểm toán | §3.2 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Không có mâu thuẫn. Đã giải quyết triệt để vấn đề giải quyết xung đột chính sách tại tài liệu quyết định OQ-03.\n\n## Trang chịu ảnh hưởng\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Khái niệm Thuật toán giải quyết xung đột miễn giảm](../concepts/discount-deduplication.md)\n- [Thực thể Chính sách miễn giảm](../entities/discount-policy.md)\n- [Luồng thiết lập miễn giảm](../flows/fl-thiet-lap-mien-giam.md)\n- [Màn hình chính sách miễn giảm](../screens/m4-sm8-mien-giam.md)\n- [Màn hình hóa đơn học phí](../screens/m4-sm1-hoc-phi.md)\n"}, {"path": "pages/sources/src-prd-school-operating-portal.md", "title": "PRD Cổng Vận Hành Trường Học (School Operating Portal)", "type": "source", "group": "sources", "fm": {"title": "PRD Cổng Vận Hành Trường Học (School Operating Portal)", "type": "source", "sources": ["raw/specs/prd-school-operating-portal.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# PRD Cổng Vận Hành Trường Học (School Operating Portal)\n\n## Thông tin nguồn\n| Trường | Giá trị |\n|---|---|\n| Đường dẫn | `raw/specs/prd-school-operating-portal.md` |\n| Người cung cấp | Finviet / SOHA Product Team |\n| Ngày | 2026-11-04 |\n| Loại | PRD Nghiệp vụ cốt lõi (Core Business Requirements) |\n\n## Nội dung chính\nTài liệu đặc tả toàn diện 4 trụ cột nghiệp vụ cho nền tảng quản trị trường học đa trường (Multi-tenant K-12):\n1. **Vận hành (Operations):** Điểm danh đón/trả, thân nhiệt, người đón hộ, báo vắng & hoàn tiền, nhật ký hoạt động, thư viện ảnh AI, trò chuyện phụ huynh, báo cáo điểm danh.\n2. **Học tập (Academics):** Thời khóa biểu tuần, giao & chấm bài tập, sổ điểm & đánh giá Bộ GD&ĐT.\n3. **Tài chính (Finance):** Lập hóa đơn VietQR động, khấu trừ tiền ăn M+1, danh mục 24 khoản thu, cấu hình biểu phí lớp, phiếu chi nội bộ, đối soát ngân hàng, chính sách miễn giảm học phí.\n4. **Nhà trường (School Admin):** Hồ sơ học sinh 360°, giáo viên & kiểm duyệt 2 cấp, lớp học (chính khóa/ngoại khóa) kèm chốt chặn an toàn khi xóa, môn học, khối lớp, bảng tin, bình chọn, thực đơn tuần, điểm danh NV, sổ tay PH, hòm thư góp ý, lịch sự kiện, niên khóa, lưu trữ.\n5. **Cấu hình & Đăng nhập:** Hồ sơ trường, tài khoản, cấu hình học phí & hoàn tiền, nhận diện AI, tính năng, thông báo, đăng nhập đa trường theo tiền tố `{schoolCode}`.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Quy tắc (kiểm được) | Nguồn (dòng/mục) |\n|---|---|---|\n| TQ-01 | Dashboard hiển thị tổng quan số liệu sĩ số học sinh, giáo viên, lớp học theo thời gian thực | §4.1, §5.1 |\n| TQ-02 | Thống kê tỷ lệ điểm danh học sinh trong ngày (có mặt, vắng có phép, vắng không phép) | §4.1, §5.1 |\n| TQ-03 | Biểu đồ thu nộp học phí và tiến độ nộp theo tháng/học kỳ toàn trường | §4.3, §5.1 |\n| VH-01 | Điểm danh đón và trả học sinh 1-chạm theo lớp học hằng ngày | §4.1 US-OPS-01 |\n| VH-02 | Ghi nhận thân nhiệt và cảnh báo các dấu hiệu sức khỏe y tế bất thường của học sinh | §4.1 US-OPS-02 |\n| VH-03 | Xác thực người đón hộ học sinh từ danh sách người đưa đón hợp lệ đã đăng ký | §4.1 US-OPS-03 |\n| VH-04 | Báo vắng học sinh hàng loạt và phân loại vắng có phép hoặc không phép | §4.1 US-OPS-04 |\n| VH-05 | Đăng bài hoạt động lớp hỗ trợ gắn hashtag `#` chủ đề và nhắc tên học sinh `@` | §4.1 US-OPS-05 |\n| VH-06 | Thư viện media tự động gắn thẻ khuôn mặt học sinh trong ảnh lớp bằng AI | §4.1 US-OPS-06 |\n| VH-07 | Kênh trò chuyện tin nhắn đa chiều 1:1 trực tiếp giữa giáo viên và phụ huynh | §4.1 US-OPS-07 |\n| VH-08 | Xuất lưới điểm danh tháng và các mẫu báo cáo đánh giá định kỳ ra Excel | §4.1 US-OPS-08 |\n| HT-01 | Thiết lập và công bố thời khóa biểu tuần theo tiết học, môn học, phòng học và giáo viên | §4.2 US-ACAD-01 |\n| HT-02 | Tạo bài tập về nhà kèm hạn nộp và theo dõi trạng thái nộp bài của học sinh | §4.2 US-ACAD-02 |\n| HT-03 | Nhập sổ điểm và đánh giá định kỳ theo quy chuẩn chuẩn hóa của Bộ GD&ĐT | §4.2 US-ACAD-03 |\n| TC-01 | Lập hóa đơn học phí tháng cho học sinh tích hợp mã VietQR động chuyển khoản chính xác | §4.3 US-FIN-01 |\n| TC-02 | Tự động rà soát ngày nghỉ có phép tháng M và khấu trừ tiền ăn vào hóa đơn tháng M+1 | §4.3 US-FIN-02 |\n| TC-03 | Quản lý danh mục 24 khoản thu toàn trường gồm 3 khoản hệ thống và 21 khoản tùy chỉnh | §4.3 US-FIN-03 |\n| TC-04 | Cấu hình gói biểu phí và đơn giá áp dụng riêng biệt cho từng lớp học hoặc khối lớp | §4.3 US-FIN-04 |\n| TC-05 | Lập, trình duyệt và theo dõi vòng đời phiếu chi nội bộ kèm chứng từ đính kèm | §4.3 US-FIN-05 |\n| TC-06 | Đối soát giao dịch thanh toán tự động và thủ công với sổ phụ ngân hàng | §4.3 US-FIN-06 |\n| TC-07 | Báo cáo trực quan tỷ lệ hoàn thành thu học phí toàn trường và theo từng lớp | §4.3 US-FIN-07 |\n| TC-08 | Tính toán số tiền hoàn tiền ăn theo tỷ lệ cấu hình tham số tại Cấu hình học phí | §4.3 US-FIN-02 |\n| TC-09 | Cảnh báo và yêu cầu xác nhận khi tạo chính sách miễn giảm trùng lặp đối tượng | §4.3 FR-FIN-019 |\n| TC-10 | Hỗ trợ giảm trừ linh hoạt theo `%` hoặc tiền mặt `đ` kèm dấu chấm phân cách hàng nghìn | §4.3 FR-FIN-022 |\n| NT-01 | Quản lý danh bạ và hồ sơ học sinh 360° với 5 tab ngữ cảnh chuyên sâu | §4.4 US-SCH-01 |\n| NT-02 | Chuyển lớp học sinh và chuyển năm học hàng loạt với bảo toàn kết quả học tập | §4.4 US-SCH-02 |\n| NT-03 | Quản lý danh bạ giáo viên và cơ chế kiểm duyệt nội dung bài đăng 2 cấp | §4.4 US-SCH-03 |\n| NT-04 | Phân loại lớp chính khóa và ngoại khóa kèm chốt chặn an toàn khi xóa lớp | §4.4 US-SCH-04 |\n| NT-05 | Quản lý danh mục môn học và phân công giáo viên giảng dạy | §4.4 US-SCH-05 |\n| NT-06 | Quản lý danh mục khối lớp học và định tuyến chương trình liên cấp | §4.4 US-SCH-06 |\n| NT-07 | Bảng thông tin điện tử truyền thông sự kiện và gửi thông báo khẩn cấp | §4.4 US-SCH-07 |\n| NT-08 | Khởi tạo bình chọn và khảo sát ý kiến trực tuyến của phụ huynh và giáo viên | §4.4 US-SCH-08 |\n| NT-09 | Lập và công bố thực đơn dinh dưỡng theo tuần bảo đảm an toàn vệ sinh thực phẩm | §4.4 US-SCH-09 |\n| NT-10 | Điểm danh ca làm việc và tổng hợp bảng chấm công nhân viên nhà trường | §4.4 US-SCH-10 |\n| NT-11 | Sổ tay phụ huynh điện tử công bố quy định và hướng dẫn của nhà trường | §4.4 US-SCH-11 |\n| NT-12 | Hòm thư tiếp nhận và xử lý góp ý, phản hồi khiếu nại của phụ huynh học sinh | §4.4 US-SCH-12 |\n| NT-13 | Lịch sự kiện và hoạt động trải nghiệm ngoại khóa toàn trường | §4.4 US-SCH-13 |\n| NT-14 | Quản lý niên khóa học, các kỳ học và kích hoạt niên khóa hiện hành | §4.4 US-SCH-14 |\n| NT-15 | Kho lưu trữ học sinh chuyển trường, hoàn thành chương trình hoặc tốt nghiệp | §4.4 US-SCH-15 |\n| CH-01 | Cấu hình thông tin pháp lý nhà trường, biểu tượng thương hiệu và niên khóa mặc định | §4.5 US-SET-01 |\n| CH-02 | Quản trị tài khoản người dùng, cấp quyền quản trị và quản lý trạng thái tài khoản | §4.5 US-SET-02 |\n| CH-03 | Thiết lập tham số tính học phí, tỷ lệ hoàn tiền ăn và hạn chốt báo vắng hằng ngày | §4.5 US-SET-03 |\n| CH-04 | Cấu hình mô hình AI nhận diện khuôn mặt và ngưỡng nhạy độ tin cậy nhận diện | §4.5 US-SET-04 |\n| CH-05 | Quản lý bật/tắt các phân hệ và tính năng (Feature Flags) theo gói bản quyền phần mềm | §4.5 US-SET-05 |\n| CH-06 | Cấu hình ma trận quy tắc gửi thông báo push và email đa kênh theo sự kiện | §4.5 US-SET-06 |\n| DN-01 | Đăng nhập hệ thống theo tiền tố mã trường `{schoolCode}` và cấp cặp JWT Access/Refresh Token | §4.6 US-AUTH-01 |\n| DN-02 | Phân quyền kiểm soát truy cập theo mô hình Role-Based Access Control (RBAC) 3 cấp | §4.6 US-AUTH-02 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Tài liệu quy định rõ liên thông giữa Điểm danh (M2) và Hóa đơn học phí (M4): Tiền ăn nghỉ học có phép tháng M tự động giảm trừ vào hóa đơn tháng M+1.\n- Mọi thắc mắc về phân định lớp học, xóa lớp, và xử lý trùng lặp chính sách miễn giảm đã được giải quyết dứt điểm tại `docs/init/open-questions.md`.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Nhà trường](../overview/module-school-admin.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Phân hệ Đăng nhập](../overview/module-auth.md)\n- [Điểm danh hằng ngày](../entities/attendance-daily.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Chính sách miễn giảm](../entities/discount-policy.md)\n- [Khấu trừ hoàn tiền ăn](../entities/meal-refund-credit.md)\n- [Hồ sơ học sinh 360](../entities/student-profile.md)\n- [Lớp học](../entities/classroom.md)\n"}, {"path": "pages/sources/src-sepo-architecture-implementation-plan.md", "title": "Đặc Tả Bộ Hồ Sơ Kế Hoạch Kiến Trúc & Thi Công Kỹ Thuật (VOI, AP, ISP)", "type": "source", "group": "sources", "fm": {"title": "Đặc Tả Bộ Hồ Sơ Kế Hoạch Kiến Trúc & Thi Công Kỹ Thuật (VOI, AP, ISP)", "type": "source", "sources": ["repo:docs/ap/index.html", "repo:docs/ap/VOI_SchoolOperatingPortal.html", "repo:docs/ap/AP_SchoolOperatingPortal_v1.0.0.html", "repo:docs/ap/ISP_SchoolOperatingPortal_v1.0.0.html"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Đặc Tả Bộ Hồ Sơ Kế Hoạch Kiến Trúc & Thi Công Kỹ Thuật (VOI, AP, ISP)\n\n## Thông tin nguồn\n- **Tên tài liệu:** Bộ Hồ Sơ Kế Hoạch SEPO (Architecture Plan - AP, Implementation Strategy Plan - ISP, Value-Outcome-Impact - VOI)\n- **Đường dẫn gốc:** `repo:docs/ap/index.html` / `repo:docs/ap/VOI_SchoolOperatingPortal.html` / `repo:docs/ap/AP_SchoolOperatingPortal_v1.0.0.html` / `repo:docs/ap/ISP_SchoolOperatingPortal_v1.0.0.html`\n- **Phiên bản:** v1.0.0\n- **Phạm vi:** Khung đặc tả kiến trúc độc lập (AP), kế hoạch thi công kỹ thuật và tiêu chí nghiệm thu (ISP), cùng bản đồ định lượng giá trị kinh doanh (VOI) của School Operating Portal.\n\n## Nội dung chính\nTài liệu định nghĩa bộ tiêu chuẩn chuyển giao và nghiệm thu chất lượng:\n1. **Bản đồ giá trị dự án (VOI - Value-Outcome-Impact):**\n   - Xác định 3 trụ cột giá trị cốt lõi: Vận hành không giấy tờ (Zero-paper operations), Tự động hóa kế toán học phí 100%, và Kênh gắn kết nhà trường - phụ huynh theo thời gian thực.\n   - Các chỉ số KPI nghiệm thu: Thời gian điểm danh đầu ngày < 1 giây/lớp, tỷ lệ đối soát tự động VietQR đạt > 98%, tỷ lệ phụ huynh tiếp cận thông báo tức thì đạt 100%.\n2. **Kế hoạch kiến trúc hệ thống (AP - Architecture Plan v1.0.0):**\n   - Thiết kế mô hình dữ liệu tổng thể và phân bổ trách nhiệm giữa 7 phân hệ.\n   - Sơ đồ tương tác API Contracts, định tuyến đa trường `/[schoolCode]/`, và cấu trúc Redux Store.\n   - Ma trận phân quyền kiểm soát truy cập (RBAC) 3 cấp: Ban Giám Hiệu, Giáo Viên, Kế Toán.\n3. **Kế hoạch thi công & Cổng kiểm chứng (ISP - Implementation Strategy Plan v1.0.0):**\n   - Lộ trình chia gói thi công (WBS) thành các Sprint độc lập.\n   - Kết nối cổng kiểm chứng Verify Gate (`verify.sh`) của AGY-Harness loop: bảo đảm 100% kỷ luật kiểm thử nhị phân trước khi chuyển giao.\n   - Toàn bộ 703 unit tests trong `app/tests/` phải chạy qua xanh 100%.\n\n## Điểm đáng chú ý / mâu thuẫn\n- Hồ sơ AP và ISP được ghim phiên bản 1:1 theo chuẩn §A.30 nhằm đảm bảo không có sự sai lệch giữa bản vẽ thiết kế kiến trúc và mã nguồn thi công thực tế.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Phân hệ Vận hành](../overview/module-operations.md)\n- [Phân hệ Học tập](../overview/module-academics.md)\n- [Phân hệ Tài chính](../overview/module-finance.md)\n- [Phân hệ Cấu hình](../overview/module-settings.md)\n- [Khái niệm cô lập đa trường](../concepts/multi-tenancy-isolation.md)\n"}, {"path": "pages/sources/src-tech-architecture-blueprint.md", "title": "Khung Kiến Trúc Kỹ Thuật Nền Tảng (System Architecture Blueprint)", "type": "source", "group": "sources", "fm": {"title": "Khung Kiến Trúc Kỹ Thuật Nền Tảng (System Architecture Blueprint)", "type": "source", "sources": ["raw/specs/system-architecture-blueprint.md"], "updated": "2026-11-05"}, "gap": {}, "open": 0, "body": "# Khung Kiến Trúc Kỹ Thuật Nền Tảng (System Architecture Blueprint)\n\n## Thông tin nguồn\n| Trường | Giá trị |\n|---|---|\n| Đường dẫn | `raw/specs/system-architecture-blueprint.md` |\n| Người cung cấp | Enterprise Architecture Office |\n| Ngày | 2026-11-04 |\n| Loại | Đặc tả kỹ thuật nền tảng (Pure Technical Specs) |\n\n## Nội dung chính\nKhung kiến trúc kỹ thuật tiêu chuẩn doanh nghiệp cho School Operating Portal:\n1. **Mô hình tô-pô 5 tầng:** Client Tier (Next.js/React 19) $\\rightarrow$ Reverse Proxy/Edge Gateway (SSL termination, rate limiting, routing) $\\rightarrow$ Backend Core Tier (Modular Monolith, Ports & Adapters) $\\rightarrow$ Primary Database (PostgreSQL 16 Enterprise với Row Level Security - RLS) $\\rightarrow$ Distributed Cache & Queue (Redis 7 Native Cluster, BullMQ).\n2. **Kiến trúc lục giác (Hexagonal Architecture):** 4 lớp Adapter In $\\rightarrow$ Application Services $\\rightarrow$ Domain Core $\\rightarrow$ Adapter Out. Quy tắc Dependency Inversion một chiều, DTO camelCase 100%, file code $\\le 250$ dòng.\n3. **Kiểm soát đồng thời 3 cấp:** Optimistic Lock cho thực thể ít tranh chấp, Pessimistic Row Lock (`SELECT ... FOR UPDATE`) cho giao dịch tài chính, Redis Redlock cho Job/Cron đa node.\n4. **Bảo mật đa người thuê (Multi-Tenancy):** Shared Database, Isolated Rows qua cột `tenant_id` / `school_code` và PostgreSQL RLS ép buộc session context.\n\n## Mã yêu cầu được định nghĩa\n| Mã | Quy tắc (kiểm được) | Nguồn (dòng/mục) |\n|---|---|---|\n| DN-01 | Đăng nhập hệ thống theo tiền tố mã trường `{schoolCode}` và cấp cặp JWT Access/Refresh Token | §4.2 |\n| DN-02 | Phân quyền kiểm soát truy cập theo mô hình Role-Based Access Control (RBAC) 3 cấp | §4.2 |\n\n## Điểm đáng chú ý / mâu thuẫn\n- Nguyên tắc Zero-Mock Persistence: Không dùng mock data hay in-memory collection ở môi trường chạy thật. Mọi trạng thái phải được lưu vết bền vững vào PostgreSQL 16.\n- Toàn bộ giao dịch tài chính liên quan đến lập hóa đơn, thu tiền, miễn giảm và phiếu chi bắt buộc nằm trong Transaction có Pessimistic Row Lock.\n\n## Trang chịu ảnh hưởng\n- [Tổng quan dự án](../overview/project-overview.md)\n- [Cơ chế cô lập đa trường học](../concepts/multi-tenancy-isolation.md)\n- [Đường ống nhận diện khuôn mặt AI](../concepts/ai-face-recognition.md)\n- [Hóa đơn học phí](../entities/tuition-invoice.md)\n- [Phiên đăng nhập](../entities/auth-session.md)\n- [Phân hệ Đăng nhập](../overview/module-auth.md)\n"}], "edges": [[0, 1], [0, 2], [1, 72], [1, 73], [1, 74], [1, 75], [1, 76], [1, 77], [1, 78], [2, 1], [2, 3], [2, 4], [2, 5], [2, 6], [2, 7], [2, 8], [2, 9], [2, 10], [2, 11], [2, 12], [2, 13], [2, 14], [2, 15], [2, 16], [2, 17], [2, 18], [2, 19], [2, 20], [2, 21], [2, 22], [2, 23], [2, 24], [2, 25], [2, 26], [2, 27], [2, 28], [2, 29], [2, 30], [2, 31], [2, 32], [2, 33], [2, 34], [2, 35], [2, 36], [2, 37], [2, 38], [2, 39], [2, 40], [2, 41], [2, 42], [2
