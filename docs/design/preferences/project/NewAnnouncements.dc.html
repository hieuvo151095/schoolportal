<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bảng thông tin — thiết kế mới</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ecomd/tokens.css">
<link rel="stylesheet" href="ds/ecomd/components/bundle.css">
<script src="ds/ecomd/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html{scrollbar-width:none}
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="ECOMD.AppShell" active-key="announcements" breadcrumb="{{crumbs}}" user="{{user}}" notification="{{yes}}" context="{{ctx}}" term="{{term}}" collapsed="{{navCollapsed}}" on-toggle-collapse="{{toggleNav}}" nav-open="{{navOpen}}" on-nav-open-change="{{setNavOpen}}">
<div class="ecomd-page-header">
  <div>
    <h1 class="ecomd-page-header__title h4">Bảng thông tin</h1>
    <p class="ecomd-page-header__desc body-sm">Phát hành thông báo đa kênh, lên lịch gửi và theo dõi tiếp cận phụ huynh</p>
  </div>
  <div class="ecomd-page-header__actions"><x-import component-from-global-scope="ECOMD.Button" variant="primary" icon="pen-to-square">Soạn thông báo</x-import></div>
</div>
<section class="ecomd-table-card">
<x-import component-from-global-scope="ECOMD.Tabs" items="{{tabs}}" value="{{tab}}" on-change="{{setTab}}" label="Trạng thái"></x-import>
<div class="ecomd-table-card__toolbar"><x-import component-from-global-scope="ECOMD.SearchField" class-name="ecomd-filterbar__search" placeholder="Tìm theo tiêu đề, người gửi" value="{{query}}" on-change="{{setQuery}}"></x-import><x-import component-from-global-scope="ECOMD.SelectField" options="{{catOpts}}" value="{{cat}}" on-change="{{setCat}}" label="Danh mục"></x-import><x-import component-from-global-scope="ECOMD.SelectField" options="{{chOpts}}" value="{{ch}}" on-change="{{setCh}}" label="Kênh gửi"></x-import></div>
<div class="ecomd-table-scroll">
<table class="ecomd-table">
<thead><tr><th class="body-xs-bold is-primary">Thông báo</th><th class="body-xs-bold">Đối tượng</th><th class="body-xs-bold">Kênh gửi</th><th class="body-xs-bold">Thời gian</th><th class="body-xs-bold">Trạng thái</th><th class="body-xs-bold is-right is-actions"><span class="ecomd-sr">Thao tác</span></th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><tr><td class="body-sm is-primary"><div class="ecomd-cell__value"><div style="display: flex; gap: var(--space-10);"><sc-if value="{{r.pin}}" hint-placeholder-val="{{false}}"><span title="Đã ghim" style="color: var(--eco-blue-strong); padding-top: var(--space-2);"><x-import component-from-global-scope="ECOMD.Icon" name="thumbtack" size="{{twelve}}" title="Đã ghim"></x-import></span></sc-if><div style="display: flex; flex-direction: column; gap: var(--space-4); min-width: 0;"><a href="#" class="body-sm-semibold" style="color: var(--text-heading); text-decoration: none;">{{r.title}}</a><span style="display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap;"><x-import component-from-global-scope="ECOMD.Tag">{{r.cat}}</x-import><span class="body-xs" style="color: var(--text-subtle);">{{r.by}}</span></span></div></div></div></td><td class="body-sm"><span class="ecomd-cell__label body-xs-medium" aria-hidden="true">Đối tượng</span><div class="ecomd-cell__value"><span style="white-space: nowrap;">{{r.to}}</span></div></td><td class="body-sm"><span class="ecomd-cell__label body-xs-medium" aria-hidden="true">Kênh gửi</span><div class="ecomd-cell__value"><span style="display: flex; gap: var(--space-8); color: var(--text-subtle);"><sc-for list="{{r.ch}}" as="c" hint-placeholder-count="2"><x-import component-from-global-scope="ECOMD.Icon" name="{{c.icon}}" size="{{fourteen}}" title="{{c.label}}"></x-import></sc-for></span></div></td><td class="body-sm"><span class="ecomd-cell__label body-xs-medium" aria-hidden="true">Thời gian</span><div class="ecomd-cell__value"><span style="white-space: nowrap; font-variant-numeric: tabular-nums;">{{r.at}}</span></div></td><td class="body-sm"><span class="ecomd-cell__label body-xs-medium" aria-hidden="true">Trạng thái</span><div class="ecomd-cell__value"><x-import component-from-global-scope="ECOMD.StatusTag" tone="{{r.tone}}">{{r.status}}</x-import></div></td><td class="body-sm is-right is-actions"><div class="ecomd-cell__value"><x-import component-from-global-scope="ECOMD.DataTable.RowAction" label="{{r.actionLabel}}" items="{{r.menu}}"></x-import></div></td></tr></sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}"><tr><td class="ecomd-table__none" colspan="6"><x-import component-from-global-scope="ECOMD.EmptyState" label="Không có thông báo nào"></x-import></td></tr></sc-if>
</tbody>
</table>
</div>
<x-import component-from-global-scope="ECOMD.Pagination" total="{{total}}" page="{{one}}" page-size="{{twenty}}" unit="thông báo"></x-import>
</section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"collapsed": {"editor": "boolean", "default": false, "section": "Kịch bản"}, "navOpen": {"editor": "boolean", "default": false, "section": "Kịch bản"}, "$preview": {"width": 1440, "height": 900}}'>
var CRUMBS = ["Nhà trường", "Bảng thông tin"];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ nav: !props.collapsed, drawer: !!props.navOpen }, this.seed(props)); }
  seed(props) { var s = { tab: 'all', cat: 'Tất cả danh mục', ch: 'Tất cả kênh gửi', query: '' }; return s; }
  componentDidUpdate(prev) {
    if (prev.collapsed !== this.props.collapsed) this.setState({ nav: !this.props.collapsed });
    if (prev.navOpen !== this.props.navOpen) this.setState({ drawer: !!this.props.navOpen });
    var ch = false; for (var k in this.props) if (k !== "collapsed" && k !== "navOpen" && prev[k] !== this.props[k]) ch = true;
    if (ch) this.setState(this.seed(this.props));
  }

  shell() {
    var self = this;
    return {
      yes: true, no: false,
      crumbs: CRUMBS,
      user: { name: 'Nguyễn Thị Mai', role: 'GVCN Lớp 1A1' },
      ctx: { label: 'Lớp đang xem', value: 'Lớp 1A1', short: '1A1', icon: 'chalkboard', options: ['Lớp 1A1', 'Lớp 1A2', 'Lớp 2A1', 'Toàn trường'] },
      term: { year: '2026 – 2027', term: 'Học kỳ I' },
      navCollapsed: this.state.nav === false, navOpen: !!this.state.drawer,
      setNavOpen: function (v) { self.setState({ drawer: !!v }); },
      toggleNav: function () { self.setState({ nav: self.state.nav === false }); }
    };
  }
  renderVals() {
    var self = this, st = this.state, props = this.props;

    var T = [{"id": 1, "pin": true, "cat": "Khẩn cấp", "title": "Thông báo khẩn: Cho học sinh nghỉ học tránh bão số 4 ngày 08/10/2026", "by": "Ban Giám Hiệu · Hiệu trưởng", "to": "Toàn trường", "ch": ["app", "email", "sms", "push"], "at": "06/10/2026", "st": "sent"}, {"id": 2, "pin": true, "cat": "Học phí và thu chi", "title": "Thông báo về việc thu học phí và các khoản dịch vụ tháng 10/2026", "by": "Phòng Tài chính Kế toán · Kế toán trưởng", "to": "Toàn trường", "ch": ["app", "email", "push"], "at": "01/10/2026", "st": "sent"}, {"id": 3, "pin": false, "cat": "Sự kiện và lễ hội", "title": "Kế hoạch tổ chức Ngày hội Khoa học và STEM Khối 10 năm học 2026 – 2027", "by": "Thầy Nguyễn Văn An · Tổ trưởng chuyên môn", "to": "Theo khối lớp", "ch": ["app", "email", "push"], "at": "10/10/2026", "st": "scheduled"}, {"id": 4, "pin": false, "cat": "Nghỉ lễ và nghỉ hè", "title": "Kế hoạch nghỉ lễ Ngày Nhà giáo Việt Nam 20/11 và thi đua dạy tốt", "by": "Công đoàn trường · Chủ tịch công đoàn", "to": "Cán bộ và giáo viên", "ch": ["app", "email"], "at": "04/10/2026", "st": "draft"}, {"id": 5, "pin": false, "cat": "Thông báo chung", "title": "Họp phụ huynh đầu năm học lớp 10A1 và 10A2", "by": "Cô Lê Thị Mai · Giáo viên chủ nhiệm", "to": "Theo lớp học", "ch": ["app", "email"], "at": "03/10/2026", "st": "sent"}, {"id": 6, "pin": false, "cat": "Học tập và thi cử", "title": "Lịch thi khảo sát chất lượng đầu năm môn Toán và Ngữ văn", "by": "Phòng Đào tạo · Trưởng phòng", "to": "Toàn trường", "ch": ["app", "push"], "at": "02/10/2026", "st": "sent"}];
    var CH = { app: ['bullhorn', 'Ứng dụng ECO'], email: ['envelope', 'Email'], sms: ['comment-dots', 'SMS'], push: ['bell', 'Thông báo đẩy'] };
    var ST = { sent: ['Đã gửi', 'success'], scheduled: ['Đã lên lịch', 'info'], draft: ['Bản nháp', 'neutral'] };
    var q = (st.query || '').trim().toLowerCase();
    var base = T.filter(function (t) { return (!q || (t.title + ' ' + t.by).toLowerCase().indexOf(q) >= 0) && (st.cat === 'Tất cả danh mục' || t.cat === st.cat); });
    var tabs = [['all', 'Tất cả'], ['sent', 'Đã gửi'], ['scheduled', 'Đã lên lịch'], ['draft', 'Bản nháp']].map(function (d) { return { key: d[0], label: d[1], count: base.filter(function (t) { return d[0] === 'all' || t.st === d[0]; }).length }; });
    var rows = base.filter(function (t) { return st.tab === 'all' || t.st === st.tab; }).map(function (t) { return { pin: t.pin, title: t.title, cat: t.cat, by: t.by, to: t.to, at: t.at,
      ch: t.ch.map(function (c) { return { icon: CH[c][0], label: CH[c][1] }; }), status: ST[t.st][0], tone: ST[t.st][1], actionLabel: 'Thao tác với thông báo',
      menu: [{ icon: 'eye', label: 'Xem thông báo' }, { icon: 'thumbtack', label: t.pin ? 'Bỏ ghim' : 'Ghim lên đầu' }].concat(t.st === 'draft' ? [{ icon: 'pen', label: 'Sửa bản nháp' }, { icon: 'paper-plane', label: 'Gửi ngay' }] : [{ icon: 'chart-simple', label: 'Xem tỉ lệ tiếp cận' }]).concat([{ divider: true }, { icon: 'trash-can', label: 'Xóa thông báo…', tone: 'danger' }]) }; });
    return Object.assign(this.shell(), {
      one: 1, twenty: 20,
      tabs: tabs, tab: st.tab, setTab: function (k) { self.setState({ tab: k }); },
      query: st.query, setQuery: function (v) { self.setState({ query: v }); },
      rows: rows, isEmpty: rows.length === 0, total: rows.length,
      twelve: 12, fourteen: 14,
      catOpts: ['Tất cả danh mục', 'Khẩn cấp', 'Học phí và thu chi', 'Sự kiện và lễ hội', 'Nghỉ lễ và nghỉ hè', 'Thông báo chung', 'Học tập và thi cử'], cat: st.cat, setCat: function (v) { self.setState({ cat: v }); },
      chOpts: ['Tất cả kênh gửi', 'Ứng dụng ECO', 'Email', 'SMS', 'Thông báo đẩy'], ch: st.ch, setCh: function (v) { self.setState({ ch: v }); }
    });
  }
}
</script>
</body>
</html>
