<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đồng bộ CSDL — thiết kế mới</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ecomd/tokens.css">
<link rel="stylesheet" href="ds/ecomd/components/bundle.css">
<script src="ds/ecomd/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html{scrollbar-width:none}
body{margin:0}
</style>
</helmet>
<div style="height: 100vh; overflow: hidden;" aria-hidden="true"><dc-import name="NewFeeCategories" hint-size="100%,900px"></dc-import></div>
<x-import component-from-global-scope="ECOMD.PopupModal" open="{{open}}" on-close="{{close}}" title="Đồng bộ danh mục thu" description="Cập nhật mã danh mục theo CSDL của Sở để khớp hóa đơn điện tử và báo cáo" icon="arrows-rotate" width="calc(var(--size-sidebar-w) * 2 + var(--space-48) * 2)" primary-action="{{pri}}" secondary-action="{{sec}}">
<div class="ecomd-form"><dl class="ecomd-dl body-sm"><dt>Nguồn</dt><dd>CSDL ngành của Sở GD&amp;ĐT</dd><dt>Lần đồng bộ trước</dt><dd>08:00, 01/09/2026</dd></dl><div style="display: flex; flex-direction: column; gap: var(--space-8);"><span class="body-sm-semibold" style="color: var(--text-heading);">Thay đổi sẽ áp dụng</span><ul style="display: flex; flex-direction: column; gap: var(--space-6); margin: 0; padding: 0; list-style: none;"><sc-for list="{{changes}}" as="c" hint-placeholder-count="3"><li class="body-sm" style="display: flex; align-items: center; gap: var(--space-10); padding: var(--space-8) var(--space-12); border: 1px solid var(--border-default); border-radius: var(--radius-8);"><x-import component-from-global-scope="ECOMD.StatusTag" tone="{{c.tone}}">{{c.kind}}</x-import><span style="flex: 1; min-width: 0; color: var(--text-heading);">{{c.name}}</span><x-import component-from-global-scope="ECOMD.Tag" variant="code">{{c.code}}</x-import></li></sc-for></ul></div><x-import component-from-global-scope="ECOMD.InlineNotice" tone="warning">Danh mục ngừng dùng vẫn giữ trên hóa đơn đã lập; khoản phí đang liên kết cần chọn danh mục thay thế.</x-import></div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open": {"editor": "boolean", "default": true, "section": "Kịch bản"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ open: props.open !== false }, {}); }
  componentDidUpdate(prev) { if (prev.open !== this.props.open) this.setState({ open: this.props.open !== false }); }
  renderVals() {
    var self = this, st = this.state, props = this.props;

    return {
      yes: true, no: false, twelve: 12, fourteen: 14, sixteen: 16, twenty: 20,
      open: st.open, close: function () { self.setState({ open: false }); },
      changes: [{ kind: 'Thêm mới', tone: 'success', name: 'Phí giữ trẻ ngoài giờ · Giờ', code: 'GT001' }, { kind: 'Đổi tên', tone: 'info', name: 'Nước uống học sinh → Nước uống học đường', code: 'NU001' }, { kind: 'Ngừng dùng', tone: 'neutral', name: 'Xe đưa đón (khác)', code: 'TX001' }],
      pri: { label: 'Đồng bộ 3 thay đổi', icon: 'arrows-rotate' }, sec: { label: 'Hủy', onClick: function () { self.setState({ open: false }); } }
    };
  }
}
</script>
</body>
</html>
