<!-- @dsCard group="Điều hướng" height=640 subtitle="Nhóm · mục thường / hover / đang chọn · chân niên khóa · thu gọn" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SidebarNav</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--bg-canvas); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100vh; }
  .stagewrap { display: flex; align-items: center; justify-content: center; padding: var(--space-24); min-width: 0; overflow: auto; background-image: radial-gradient(var(--border-default) 1px, transparent 1px); background-size: 16px 16px; }
  .stage { max-width: 100%; display: flex; justify-content: center; }
  .stage--fill { width: 100%; }
  .panel { overflow-y: auto; background: var(--bg-canvas); border-left: 1px solid var(--border-default); }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .panel { border-left: none; border-top: 1px solid var(--border-default); } }
  .grp { padding: var(--space-12) var(--space-16) var(--space-8); background: var(--bg-surface); border-bottom: 1px solid var(--border-default); }
  .gt { margin: 0 0 var(--space-4); color: var(--text-heading); }
  .ctl { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); padding: var(--space-6) 0; box-sizing: border-box; color: var(--text-subtle); border-top: 1px solid var(--border-subtle); }
  .gt + .ctl { border-top: none; }
  .ctl--col { flex-direction: column; align-items: stretch; gap: var(--space-8); }
  .ctl select, .ctl input[type=text] { box-sizing: border-box; height: 30px; width: 156px; padding: 0 var(--space-8); border: 1px solid var(--border-default); border-radius: var(--radius-8); background: var(--bg-subtle); color: var(--text-body); font: inherit; outline: none; }
  .ctl select:focus, .ctl input[type=text]:focus { box-shadow: 0 0 0 2px var(--eco-blue-strong); background: var(--bg-surface); }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius-8); background: var(--bg-muted); }
  .ctl--col .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); }
  .seg button { min-height: 26px; padding: 0 var(--space-10); border: 0; border-radius: var(--radius-6); background: transparent; color: var(--text-subtle); font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg-surface); color: var(--text-heading); box-shadow: var(--shadow-xs); }
  .ctl input[type=checkbox] { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 36px; height: 20px; margin: 0; border-radius: var(--radius-full); background: var(--border-strong); cursor: pointer; transition: background .15s; }
  .ctl input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-surface); box-shadow: var(--shadow-sm); transition: transform .15s; }
  .ctl input[type=checkbox]:checked { background: var(--eco-blue-strong); }
  .ctl input[type=checkbox]:checked::after { transform: translateX(16px); }
  .ctl input[type=checkbox]:focus-visible { outline: 2px solid var(--eco-blue-strong); outline-offset: 2px; }
  label.ctl { cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script>

  var h = React.createElement, D = ECOMD;
  function useS(v) { return React.useState(v); }
  function Seg(p) {
    return h('div', { className: (p.options.length > 3 ? 'ctl ctl--col' : 'ctl') + ' body-sm' }, p.label,
      h('div', { className: 'seg', role: 'group', 'aria-label': p.label }, p.options.map(function (o) {
        return h('button', { key: o, type: 'button', className: 'body-xs-medium', 'aria-pressed': p.s[0] === o, onClick: function () { p.s[1](o); } }, o);
      })));
  }
  function Tog(p) { return h('label', { className: 'ctl body-sm' }, p.label, h('input', { type: 'checkbox', checked: p.s[0], onChange: function (e) { p.s[1](e.target.checked); } })); }
  function Txt(p) { return h('label', { className: 'ctl body-sm' }, p.label, h('input', { type: 'text', className: 'body-sm', value: p.s[0], onChange: function (e) { p.s[1](e.target.value); } })); }
  function Pick(p) { return h('label', { className: 'ctl body-sm' }, p.label, h('select', { className: 'body-sm', value: p.s[0], onChange: function (e) { p.s[1](e.target.value); } }, p.options.map(function (o) { return h('option', { key: o, value: o }, o); }))); }
  function Grp(p) { return h('div', { className: 'grp' }, h('p', { className: 'gt body-sm-semibold' }, p.title), p.children); }
  function Shell(stage, panel, fill) {
    return h('div', { className: 'wrap' },
      h('div', { className: 'stagewrap' }, h('div', { className: 'stage' + (fill ? ' stage--fill' : '') }, stage)),
      h('div', { className: 'panel' }, panel));
  }
  var ICONS = D.Icon.names();


  var NAV = [
    { label: 'VẬN HÀNH', items: [{ icon: 'calendar-check', label: 'Điểm danh' }, { icon: 'clipboard-list', label: 'Hoạt động' }, { icon: 'images', label: 'Thư viện ảnh' }, { icon: 'comments', label: 'Trao đổi' }] },
    { label: 'HỌC TẬP', items: [{ icon: 'clock', label: 'Thời khóa biểu' }, { icon: 'book-open', label: 'Bài tập' }, { icon: 'graduation-cap', label: 'Điểm & Đánh giá' }] },
    { label: 'NHÀ TRƯỜNG', items: [{ icon: 'graduation-cap', label: 'Học sinh' }, { icon: 'chalkboard-user', label: 'Giáo viên' }, { icon: 'chalkboard', label: 'Lớp học' }] }
  ];
  var NAV_FOOTER = [{ label: 'Niên khóa:', value: '2026 - 2027' }, { label: 'Học kỳ:', value: 'Học kỳ I', tone: 'success' }];

  var ALL = []; NAV.forEach(function (g) { g.items.forEach(function (i) { ALL.push(i.label); }); });
  function App() {
    var act = useS('Giáo viên'), hov = useS('Hoạt động'), foot = useS(true), col = useS(false);
    return Shell(h('div', { style: { height: 600, minWidth: 40, display: 'flex', border: '1px solid var(--border-default)', background: 'var(--bg-canvas)' } }, h(D.SidebarNav, { groups: NAV, collapsed: col[0], activeKey: act[0], hoverKey: hov[0] === '—' ? undefined : hov[0], footer: foot[0] ? NAV_FOOTER : undefined })), [
      h(Grp, { key: 1, title: 'Trạng thái' }, h(Pick, { label: 'Mục đang chọn', s: act, options: ALL }), h(Pick, { label: 'Mục hover', s: hov, options: ['—'].concat(ALL) })),
      h(Grp, { key: 2, title: 'Tuỳ chọn' }, h(Tog, { label: 'Chân niên khóa / học kỳ', s: foot }), h(Tog, { label: 'Thu gọn (collapsed)', s: col }))
    ]);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
