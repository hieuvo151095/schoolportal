<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SegmentedControl</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../bundle.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--bg-canvas); font-family: var(--font-sans); color: var(--text-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-20); padding: var(--space-24); }
</style>
</head>
<body>
  <div class="ecomd-segmented">
    <button class="ecomd-segmented__item is-active">Đăng nhập SSO</button>
    <button class="ecomd-segmented__item">Đăng nhập bằng tài khoản</button>
  </div>

  <div class="ecomd-segmented ecomd-segmented--sm">
    <button class="ecomd-segmented__item is-active">
      <span>Chính khóa</span>
      <span class="ecomd-segmented__count">12</span>
    </button>
    <button class="ecomd-segmented__item">
      <span>Ngoại khóa</span>
      <span class="ecomd-segmented__count">4</span>
    </button>
  </div>
</body>
</html>
