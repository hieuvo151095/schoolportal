<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bình chọn — thiết kế mới</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ecomd/tokens.css">
<link rel="stylesheet" href="ds/ecomd/components/bundle.css">
<script src="ds/ecomd/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html{scrollbar-width:none}
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="ECOMD.AppShell" active-key="poll" breadcrumb="{{crumbs}}" user="{{user}}" notification="{{yes}}" context="{{ctx}}" term="{{term}}" collapsed="{{navCollapsed}}" on-toggle-collapse="{{toggleNav}}" nav-open="{{navOpen}}" on-nav-open-change="{{setNavOpen}}">
<div class="ecomd-page-header">
  <div>
    <h1 class="ecomd-page-header__title h4">Bình chọn</h1>
    <p class="ecomd-page-header__desc body-sm">Khảo sát ý kiến phụ huynh và học sinh toàn trường hoặc theo khối, lớp</p>
  </div>
  <div class="ecomd-page-header__actions"><x-import component-from-global-scope="ECOMD.Button" variant="primary" icon="plus">Tạo bình chọn</x-import></div>
</div>
<section class="ecomd-table-card">
<x-import component-from-global-scope="ECOMD.Tabs" items="{{tabs}}" value="{{tab}}" on-change="{{setTab}}" label="Trạng thái"></x-import>
<div class="ecomd-table-card__toolbar"><x-import component-from-global-scope="ECOMD.SearchField" class-name="ecomd-filterbar__search" placeholder="Tìm theo chủ đề bình chọn" value="{{query}}" on-change="{{setQuery}}"></x-import><x-import component-from-global-scope="ECOMD.SelectField" options="{{clsOpts}}" value="{{cls}}" on-change="{{setCls}}" label="Lớp học"></x-import></div>
<div class="ecomd-table-scroll">
<table class="ecomd-table">
<thead><tr><th class="body-xs-bold is-primary">Chủ đề</th><th class="body-xs-bold">Gửi tới</th><th class="body-xs-bold">Ngày tạo</th><th class="body-xs-bold">Trạng thái</th><th class="body-xs-bold is-right is-actions"><span class="ecomd-sr">Thao tác</span></th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><tr><td class="body-sm is-primary"><div class="ecomd-cell__value"><div style="display: flex; flex-direction: column; gap: var(--space-4);"><a href="#" class="body-sm-semibold" style="color: var(--text-heading); text-decoration: none;">{{r.title}}</a><span class="body-xs" style="display: inline-flex; align-items: center; gap: var(--space-6); color: var(--text-subtle);"><x-import component-from-global-scope="ECOMD.Icon" name="clock" size="{{twelve}}"></x-import>{{r.endLabel}}</span></div></div></td><td class="body-sm"><span class="ecomd-cell__label body-xs-medium" aria-hidden="true">Gửi tới</span><div class="ecomd-cell__value"><sc-if value="{{r.hasTo}}" hint-placeholder-val="{{true}}"><x-import component-from-global-scope="ECOMD.DataTable.Tags"><sc-for list="{{r.to}}" as="c" hint-placeholder-count="2"><x-import component-from-global-scope="ECOMD.Tag">{{c}}</x-import></sc-for></x-import></sc-if><sc-if value="{{r.noTo}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="ECOMD.EmptyValue" label="Chưa chọn đối tượng"></x-import></sc-if></div></td><td class="body-sm"><span class="ecomd-cell__label body-xs-medium" aria-hidden="true">Ngày tạo</span><div class="ecomd-cell__value"><span style="white-space: nowrap; font-variant-numeric: tabular-nums;">{{r.created}}</span></div></td><td class="body-sm"><span class="ecomd-cell__label body-xs-medium" aria-hidden="true">Trạng thái</span><div class="ecomd-cell__value"><x-import component-from-global-scope="ECOMD.StatusTag" tone="{{r.tone}}">{{r.status}}</x-import></div></td><td class="body-sm is-right is-actions"><div class="ecomd-cell__value"><x-import component-from-global-scope="ECOMD.DataTable.RowAction" label="{{r.actionLabel}}" items="{{r.menu}}"></x-import></div></td></tr></sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}"><tr><td class="ecomd-table__none" colspan="5"><x-import component-from-global-scope="ECOMD.EmptyState" label="Không có bình chọn nào"></x-import></td></tr></sc-if>
</tbody>
</table>
</div>
<x-import component-from-global-scope="ECOMD.Pagination" total="{{total}}" page="{{one}}" page-size="{{twenty}}" unit="bình chọn"></x-import>
</section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"collapsed": {"editor": "boolean", "default": false, "section": "Kịch bản"}, "navOpen": {"editor": "boolean", "default": false, "section": "Kịch bản"}, "$preview": {"width": 1440, "height": 900}}'>
var CRUMBS = ["Nhà trường", "Bình chọn"];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ nav: !props.collapsed, drawer: !!props.navOpen }, this.seed(props)); }
  seed(props) { var s = { tab: 'all', cls: 'Tất cả lớp', query: '' }; return s; }
  componentDidUpdate(prev) {
    if (prev.collapsed !== this.props.collapsed) this.setState({ nav: !this.props.collapsed });
    if (prev.navOpen !== this.props.navOpen) this.setState({ drawer: !!this.props.navOpen });
    var ch = false; for (var k in this.props) if (k !== "collapsed" && k !== "navOpen" && prev[k] !== this.props[k]) ch = true;
    if (ch) this.setState(this.seed(this.props));
  }

  shell() {
    var self = this;
    return {
      yes: true, no: false,
      crumbs: CRUMBS,
      user: { name: 'Nguyễn Thị Mai', role: 'GVCN Lớp 1A1' },
      ctx: { label: 'Lớp đang xem', value: 'Lớp 1A1', short: '1A1', icon: 'chalkboard', options: ['Lớp 1A1', 'Lớp 1A2', 'Lớp 2A1', 'Toàn trường'] },
      term: { year: '2026 – 2027', term: 'Học kỳ I' },
      navCollapsed: this.state.nav === false, navOpen: !!this.state.drawer,
      setNavOpen: function (v) { self.setState({ drawer: !!v }); },
      toggleNav: function () { self.setState({ nav: self.state.nav === false }); }
    };
  }
  renderVals() {
    var self = this, st = this.state, props = this.props;

    var T = [{"title": "Trung thu đoàn viên 2026", "end": "18:00, 25/10/2026", "to": ["Khối Infant", "Khối Lá", "1A"], "created": "12/09/2026", "st": "closed"}, {"title": "Địa điểm dã ngoại trải nghiệm mùa thu", "end": "17:00, 30/10/2026", "to": ["10A1", "10A2", "6A"], "created": "28/09/2026", "st": "open"}, {"title": "Lựa chọn mẫu đồng phục thể dục năm học mới", "end": "23:59, 10/11/2026", "to": ["Toàn trường"], "created": "30/09/2026", "st": "open"}, {"title": "Khảo sát nhu cầu sử dụng dịch vụ xe đưa đón học sinh", "end": "17:00, 15/11/2026", "to": [], "created": "05/10/2026", "st": "draft"}, {"title": "Lấy ý kiến thực đơn bữa phụ xế chiều cho các bé Mầm non", "end": "17:00, 20/11/2026", "to": [], "created": "06/10/2026", "st": "draft"}, {"title": "Bình chọn Giáo viên truyền cảm hứng tháng 09/2026", "end": "23:59, 30/09/2026", "to": ["Toàn trường"], "created": "18/09/2026", "st": "closed"}, {"title": "Ý kiến về thời lượng câu lạc bộ STEM cuối tuần", "end": "12:00, 18/10/2026", "to": ["10A1", "6A"], "created": "03/10/2026", "st": "open"}];
    var ST = { open: ['Đang diễn ra', 'success'], draft: ['Bản nháp', 'neutral'], closed: ['Đã đóng', 'info'] };
    var q = (st.query || '').trim().toLowerCase();
    var base = T.filter(function (t) { return (!q || t.title.toLowerCase().indexOf(q) >= 0) && (st.cls === 'Tất cả lớp' || t.to.indexOf(st.cls) >= 0); });
    var tabs = [['all', 'Tất cả'], ['open', 'Đang diễn ra'], ['draft', 'Bản nháp'], ['closed', 'Đã đóng']].map(function (d) { return { key: d[0], label: d[1], count: base.filter(function (t) { return d[0] === 'all' || t.st === d[0]; }).length }; });
    var rows = base.filter(function (t) { return st.tab === 'all' || t.st === st.tab; }).map(function (t) { return { title: t.title, endLabel: (t.st === 'closed' ? 'Đã kết thúc lúc ' : 'Kết thúc lúc ') + t.end,
      to: t.to, hasTo: t.to.length > 0, noTo: !t.to.length, created: t.created, status: ST[t.st][0], tone: ST[t.st][1], actionLabel: 'Thao tác với bình chọn',
      menu: t.st === 'draft' ? [{ icon: 'pen', label: 'Sửa bản nháp' }, { icon: 'paper-plane', label: 'Phát hành' }, { divider: true }, { icon: 'trash-can', label: 'Xóa bình chọn…', tone: 'danger' }]
        : [{ icon: 'chart-simple', label: 'Xem kết quả' }, { icon: 'file-export', label: 'Xuất kết quả' }].concat(t.st === 'open' ? [{ icon: 'lock', label: 'Đóng bình chọn sớm…' }] : []) }; });
    return Object.assign(this.shell(), {
      one: 1, twenty: 20,
      tabs: tabs, tab: st.tab, setTab: function (k) { self.setState({ tab: k }); },
      query: st.query, setQuery: function (v) { self.setState({ query: v }); },
      rows: rows, isEmpty: rows.length === 0, total: rows.length,
      twelve: 12, clsOpts: ['Tất cả lớp', 'Toàn trường', '10A1', '10A2', '6A', '1A'], cls: st.cls, setCls: function (v) { self.setState({ cls: v }); }
    });
  }
}
</script>
</body>
</html>
