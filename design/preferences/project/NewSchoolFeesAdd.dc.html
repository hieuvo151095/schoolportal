<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm khoản phí — thiết kế mới</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ecomd/tokens.css">
<link rel="stylesheet" href="ds/ecomd/components/bundle.css">
<script src="ds/ecomd/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html{scrollbar-width:none}
body{margin:0}
</style>
</helmet>
<div style="height: 100vh; overflow: hidden;" aria-hidden="true"><dc-import name="NewSchoolFees" hint-size="100%,900px"></dc-import></div>
<x-import component-from-global-scope="ECOMD.PopupModal" open="{{open}}" on-close="{{close}}" title="Thêm khoản phí" description="Khoản phí dùng khi lập hóa đơn cho học sinh" icon="coins" width="calc(var(--size-sidebar-w) * 2 + var(--space-48) * 2)" primary-action="{{pri}}" secondary-action="{{sec}}">
<div class="ecomd-form"><label class="ecomd-field"><span class="ecomd-field__label body-sm-medium">Tên khoản phí <span class="ecomd-field__req" aria-hidden="true">*</span></span><input type="text" class="ecomd-text body-sm" placeholder="VD: Học STEAM, Kỹ năng sống" value="{{name}}" onChange="{{setName}}"></label><label class="ecomd-field"><span class="ecomd-field__label body-sm-medium">Danh mục thu</span><x-import component-from-global-scope="ECOMD.SelectField" options="{{catOpts}}" value="{{cat}}" on-change="{{setCat}}" label="Danh mục thu liên kết"></x-import><span class="ecomd-field__hint body-xs">Liên kết để đồng bộ mã hóa đơn điện tử và báo cáo thu theo quy định của Sở.</span></label><div class="ecomd-grid" style="--ecomd-cols: 2; --ecomd-cols-mobile: 2; gap: var(--space-16);"><label class="ecomd-field"><span class="ecomd-field__label body-sm-medium">Số tiền mặc định <span class="ecomd-field__req" aria-hidden="true">*</span></span><span class="ecomd-affix"><input type="text" class="ecomd-text body-sm is-num" placeholder="500,000" value="{{amount}}" onChange="{{setAmount}}"><span class="ecomd-affix__suffix body-sm">đ</span></span></label><label class="ecomd-field"><span class="ecomd-field__label body-sm-medium">Đơn vị tính <span class="ecomd-field__req" aria-hidden="true">*</span></span><x-import component-from-global-scope="ECOMD.SelectField" options="{{unitOpts}}" value="{{unit}}" on-change="{{setUnit}}" label="Đơn vị tính"></x-import></label></div><div class="ecomd-field"><span class="ecomd-field__label body-sm-medium">Xuất hóa đơn điện tử</span><div class="ecomd-radios"><label class="ecomd-radio body-sm"><input type="radio" name="einv" checked="{{einvOn}}" onChange="{{pickOn}}"><span>Có</span></label><label class="ecomd-radio body-sm"><input type="radio" name="einv" checked="{{einvOff}}" onChange="{{pickOff}}"><span>Không</span></label></div><span class="ecomd-field__hint body-xs">Có thể bật, tắt nhanh sau này ở cột Xuất HĐĐT của danh sách.</span></div><label class="ecomd-field"><span class="ecomd-field__label body-sm-medium">Mô tả</span><textarea class="ecomd-textarea body-sm" rows="2" placeholder="Thông tin chi tiết về khoản phí, hiển thị cho phụ huynh"></textarea><span class="ecomd-field__hint body-xs">Không bắt buộc</span></label></div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open": {"editor": "boolean", "default": true, "section": "Kịch bản"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ open: props.open !== false }, { name: 'Học STEAM', cat: 'Không liên kết', amount: '500,000', unit: 'Tháng', einv: false }); }
  componentDidUpdate(prev) { if (prev.open !== this.props.open) this.setState({ open: this.props.open !== false }); }
  renderVals() {
    var self = this, st = this.state, props = this.props;

    return {
      yes: true, no: false, twelve: 12, fourteen: 14, sixteen: 16, twenty: 20,
      open: st.open, close: function () { self.setState({ open: false }); },
      name: st.name, setName: function (e) { self.setState({ name: e.target.value }); },
      catOpts: ["Không liên kết", "[HP001] Học phí chính khóa · Tháng", "[BT001] Tiền ăn bán trú · Tháng", "[XD001] Xe đưa đón học sinh · Tháng", "[TA001] Tiếng Anh tăng cường · Tháng", "[KN001] Giáo dục kỹ năng sống · Học kỳ", "[TH001] Tin học và kỹ năng số · Học kỳ", "[BH001] Bảo hiểm y tế học sinh · Năm"], cat: st.cat, setCat: function (v) { self.setState({ cat: v }); },
      amount: st.amount, setAmount: function (e) { self.setState({ amount: e.target.value }); },
      unitOpts: ['Tháng', 'Học kỳ', 'Năm', 'Ngày', 'Lần', 'Chuyến', 'Giờ', 'Bộ', 'Khác'], unit: st.unit, setUnit: function (v) { self.setState({ unit: v }); },
      einvOn: st.einv, einvOff: !st.einv, pickOn: function () { self.setState({ einv: true }); }, pickOff: function () { self.setState({ einv: false }); },
      pri: { label: 'Lưu khoản phí', disabled: !(st.name || '').trim() || !(st.amount || '').trim() }, sec: { label: 'Hủy', onClick: function () { self.setState({ open: false }); } }
    };
  }
}
</script>
</body>
</html>
