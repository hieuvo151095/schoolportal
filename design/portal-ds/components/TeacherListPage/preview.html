<!-- @dsCard group="Mẫu trang" height=900 width=1440 subtitle="Trang danh sách: thu gọn sidebar, tìm kiếm, bộ lọc nâng cao, menu thao tác hàng, bảng rỗng" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeacherListPage</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--bg-canvas); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100vh; }
  .stagewrap { display: flex; align-items: center; justify-content: center; padding: var(--space-24); min-width: 0; overflow: auto; background-image: radial-gradient(var(--border-default) 1px, transparent 1px); background-size: 16px 16px; }
  .stage { max-width: 100%; display: flex; justify-content: center; }
  .stage--fill { width: 100%; }
  .panel { overflow-y: auto; background: var(--bg-canvas); border-left: 1px solid var(--border-default); }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .panel { border-left: none; border-top: 1px solid var(--border-default); } }
  .grp { padding: var(--space-12) var(--space-16) var(--space-8); background: var(--bg-surface); border-bottom: 1px solid var(--border-default); }
  .gt { margin: 0 0 var(--space-4); color: var(--text-heading); }
  .ctl { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); padding: var(--space-6) 0; box-sizing: border-box; color: var(--text-subtle); border-top: 1px solid var(--border-subtle); }
  .gt + .ctl { border-top: none; }
  .ctl--col { flex-direction: column; align-items: stretch; gap: var(--space-8); }
  .ctl select, .ctl input[type=text] { box-sizing: border-box; height: 30px; width: 156px; padding: 0 var(--space-8); border: 1px solid var(--border-default); border-radius: var(--radius-8); background: var(--bg-subtle); color: var(--text-body); font: inherit; outline: none; }
  .ctl select:focus, .ctl input[type=text]:focus { box-shadow: 0 0 0 2px var(--eco-blue-strong); background: var(--bg-surface); }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius-8); background: var(--bg-muted); }
  .ctl--col .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); }
  .seg button { min-height: 26px; padding: 0 var(--space-10); border: 0; border-radius: var(--radius-6); background: transparent; color: var(--text-subtle); font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg-surface); color: var(--text-heading); box-shadow: var(--shadow-xs); }
  .ctl input[type=checkbox] { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 36px; height: 20px; margin: 0; border-radius: var(--radius-full); background: var(--border-strong); cursor: pointer; transition: background .15s; }
  .ctl input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-surface); box-shadow: var(--shadow-sm); transition: transform .15s; }
  .ctl input[type=checkbox]:checked { background: var(--eco-blue-strong); }
  .ctl input[type=checkbox]:checked::after { transform: translateX(16px); }
  .ctl input[type=checkbox]:focus-visible { outline: 2px solid var(--eco-blue-strong); outline-offset: 2px; }
  label.ctl { cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script>

  var h = React.createElement, D = ECOMD;
  function useS(v) { return React.useState(v); }
  function Seg(p) {
    return h('div', { className: (p.options.length > 3 ? 'ctl ctl--col' : 'ctl') + ' body-sm' }, p.label,
      h('div', { className: 'seg', role: 'group', 'aria-label': p.label }, p.options.map(function (o) {
        return h('button', { key: o, type: 'button', className: 'body-xs-medium', 'aria-pressed': p.s[0] === o, onClick: function () { p.s[1](o); } }, o);
      })));
  }
  function Tog(p) { return h('label', { className: 'ctl body-sm' }, p.label, h('input', { type: 'checkbox', checked: p.s[0], onChange: function (e) { p.s[1](e.target.checked); } })); }
  function Txt(p) { return h('label', { className: 'ctl body-sm' }, p.label, h('input', { type: 'text', className: 'body-sm', value: p.s[0], onChange: function (e) { p.s[1](e.target.value); } })); }
  function Pick(p) { return h('label', { className: 'ctl body-sm' }, p.label, h('select', { className: 'body-sm', value: p.s[0], onChange: function (e) { p.s[1](e.target.value); } }, p.options.map(function (o) { return h('option', { key: o, value: o }, o); }))); }
  function Grp(p) { return h('div', { className: 'grp' }, h('p', { className: 'gt body-sm-semibold' }, p.title), p.children); }
  function Shell(stage, panel, fill) {
    return h('div', { className: 'wrap' },
      h('div', { className: 'stagewrap' }, h('div', { className: 'stage' + (fill ? ' stage--fill' : '') }, stage)),
      h('div', { className: 'panel' }, panel));
  }
  var ICONS = D.Icon.names();


  var NAV = [
    { label: 'VẬN HÀNH', items: [{ icon: 'calendar-check', label: 'Điểm danh' }, { icon: 'clipboard-list', label: 'Hoạt động' }, { icon: 'images', label: 'Thư viện ảnh' }, { icon: 'comments', label: 'Trao đổi' }] },
    { label: 'HỌC TẬP', items: [{ icon: 'clock', label: 'Thời khóa biểu' }, { icon: 'book-open', label: 'Bài tập' }, { icon: 'graduation-cap', label: 'Điểm & Đánh giá' }] },
    { label: 'NHÀ TRƯỜNG', items: [{ icon: 'graduation-cap', label: 'Học sinh' }, { icon: 'chalkboard-user', label: 'Giáo viên' }, { icon: 'chalkboard', label: 'Lớp học' }] }
  ];
  var NAV_FOOTER = [{ label: 'Niên khóa:', value: '2026 - 2027' }, { label: 'Học kỳ:', value: 'Học kỳ I', tone: 'success' }];

  var STATS = [
    { label: 'Tổng giáo viên', value: 7, icon: 'user-tie', tone: 'neutral' },
    { label: 'Đang làm việc', value: 5, icon: 'user-clock', tone: 'success' },
    { label: 'Giáo viên chính', value: 4, icon: 'user-shield', tone: 'info' },
    { label: 'Giáo viên hỗ trợ', value: 3, icon: 'id-badge', tone: 'warning' },
    { label: 'Đang chủ nhiệm', value: 3, icon: 'chalkboard-user', tone: 'purple' }
  ];

  var TEACHERS = [
    { id: 'gv-001', code: 'GV-2024-001', name: 'Nguyễn Thị Mai', email: 'mai.nguyen@finviet.edu.vn', home: 'Lớp 1A1', classes: ['Lớp 1A1', 'Lớp 1A2'], role: 'Giáo viên chính', status: 'Đang làm việc' },
    { id: 'gv-004', code: 'GV-2025-004', name: 'Phạm Quỳnh Nga', email: 'nga.pham@finviet.edu.vn', home: null, classes: ['Lớp 1A1', 'Lớp 1A2'], role: 'Giáo viên hỗ trợ', status: 'Đang làm việc' },
    { id: 'gv-005', code: 'GV-2023-005', name: 'Hoàng Minh Đức', email: 'duc.hoang@finviet.edu.vn', home: null, classes: ['Lớp Vẽ Sáng Tạo'], role: 'Giáo viên chính', status: 'Tạm nghỉ' },
    { id: 'gv-006', code: 'GV-2022-006', name: 'Vũ Thu Hằng', email: 'hang.vu@finviet.edu.vn', home: null, classes: [], role: 'Giáo viên hỗ trợ', status: 'Đã nghỉ việc' },
    { id: 'gv-007', code: null, name: 'Đặng Hoài An', email: 'an.dang@finviet.edu.vn', home: null, classes: ['Lớp 1A1'], role: 'Giáo viên hỗ trợ', status: 'Đang làm việc' }
  ];
  function rowMenu(r) {
    var main = r.role === 'Giáo viên chính', working = r.status === 'Đang làm việc';
    return [
      { icon: 'eye', label: 'Xem chi tiết hồ sơ', href: '#' },
      { icon: 'chalkboard-user', label: 'Phân công lớp học' },
      { icon: 'envelope', label: 'Đổi email đăng nhập' },
      { icon: 'shield-halved', label: main ? 'Hạ quyền: Giáo viên hỗ trợ' : 'Nâng quyền: Giáo viên chính' },
      { icon: 'user-clock', label: working ? 'Chuyển sang Tạm nghỉ' : 'Kích hoạt Đang làm việc' },
      { divider: true },
      { icon: 'trash-can', label: 'Xóa giáo viên', tone: 'danger' }
    ];
  }
  var ROLE_TONE = { 'Giáo viên chính': 'info', 'Giáo viên hỗ trợ': 'warning' };
  var STATUS_TONE = { 'Đang làm việc': 'success', 'Tạm nghỉ': 'warning', 'Đã nghỉ việc': 'neutral' };
  var COLUMNS = [
    { key: 'code', title: 'Mã nhân viên', render: function (r) { return r.code ? h(D.Tag, { variant: 'code' }, r.code) : h(D.EmptyValue, { italic: true }, 'Chưa có mã nhân viên'); } },
    { key: 'name', title: 'Họ và tên', render: function (r) { return h(D.DataTable.Person, { name: r.name, meta: r.email, href: '#' }); } },
    { key: 'home', title: 'Lớp chủ nhiệm', render: function (r) { return r.home ? h(D.Tag, { variant: 'success' }, r.home) : h(D.EmptyValue, null, 'Chưa chủ nhiệm'); } },
    { key: 'classes', title: 'Lớp phụ trách', render: function (r) { return r.classes.length ? h(D.DataTable.Tags, null, r.classes.map(function (c) { return h(D.Tag, { key: c }, c); })) : h(D.EmptyValue, null, 'Chưa phân công'); } },
    { key: 'role', title: 'Phân quyền', render: function (r) { return h(D.StatusTag, { tone: ROLE_TONE[r.role] }, r.role); } },
    { key: 'status', title: 'Trạng thái', render: function (r) { return h(D.StatusTag, { tone: STATUS_TONE[r.status] }, r.status); } },
    { key: 'act', title: 'Thao tác', align: 'right', render: function (r) { return h(D.DataTable.RowAction, { label: 'Thao tác với giáo viên ' + r.name, items: rowMenu(r) }); } }
  ];

  function App() {
    var sel = useS([]), q = useS(''), col = useS(false), modal = useS(false), synced = useS(false), draft = useS(false);
    var rows = TEACHERS.filter(function (r) { var s = q[0].trim().toLowerCase(); return (!s || (r.name + ' ' + r.email + ' ' + (r.code || '')).toLowerCase().indexOf(s) >= 0) && (!synced[0] || !!r.code); });
    return h('div', { style: { display: 'flex', flexDirection: 'column', minHeight: '100vh', background: 'var(--bg-canvas)' } },
      h(D.AppHeader, { context: 'Lớp 1A1', tagline: 'Hệ thống Quản Trị Vận Hành Giáo Dục Toàn Diện', notification: true, menuActive: col[0], onMenu: function () { col[1](!col[0]); }, user: { name: 'Cô Nguyễn Thị Mai', role: 'GVCN - Lớp 1A1' } }),
      h('div', { style: { display: 'flex', flex: 1 } },
        h(D.SidebarNav, { groups: NAV, activeKey: 'Giáo viên', footer: NAV_FOOTER, collapsed: col[0] }),
        h('main', { style: { flex: 1, minWidth: 0, padding: 'var(--space-32)', display: 'flex', flexDirection: 'column', gap: 'var(--space-24)' } },
          h(D.PageHeader, { title: 'Danh Sách Giáo Viên', description: 'Quản lý đội ngũ giảng dạy, phân công chủ nhiệm, tài khoản đăng nhập và phân quyền kiểm duyệt.' }),
          h(D.StatCard.Group, null, STATS.map(function (s) { return h(D.StatCard, Object.assign({ key: s.label }, s)); })),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--space-16)' } },
            h(D.FilterBar, { search: { placeholder: 'Tìm theo tên, mã NV, email, SĐT, CCCD...', value: q[0], onChange: q[1] }, filters: [{ options: ['Tất cả lớp học'] }, { options: ['Tất cả phân quyền'] }, { options: ['Tất cả trạng thái'] }], advanced: { active: synced[0], onClick: function () { draft[1](synced[0]); modal[1](true); } }, action: { label: 'Thêm giáo viên mới' } }),
            h(D.DataTable, { columns: COLUMNS, rows: rows, rowKey: 'id', selectable: true, selected: sel[0], onSelect: sel[1], rowLabel: function (r) { return 'Chọn giáo viên ' + r.name; }, emptyText: 'Không tìm thấy giáo viên nào phù hợp', emptyIcon: 'user-tie', footer: h('div', null, 'Hiển thị ', h('b', { className: 'body-xs-semibold' }, rows.length), ' giáo viên') })))),
      h(D.PopupModal, { open: modal[0], icon: 'filter', title: 'Bộ lọc nâng cao', description: 'Tùy chọn lọc nâng cao cho danh sách giáo viên', onClose: function () { modal[1](false); },
        extraAction: { label: 'Đặt lại bộ lọc', icon: 'arrow-rotate-right', onClick: function () { draft[1](false); } },
        primaryAction: { label: 'Áp dụng', icon: 'check', onClick: function () { synced[1](draft[0]); modal[1](false); } } },
        h(D.PopupModal.Section, { label: 'Dữ liệu liên ngành' },
          h(D.Checkbox, { checked: draft[0], onChange: draft[1], label: 'Đã đồng bộ CSDL Sở GD&ĐT', description: 'Chỉ lọc các giáo viên đã có mã định danh liên kết với Cơ sở dữ liệu ngành Giáo dục.' }))));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
